bernanza en cuatro pasos (diagnosticar, mapear, evaluar y monitorear) que une la medición de la preparación, la traducción de principios éticos en estándares, la evaluación y la auditoría continua en un solo marco, alineado con NIST AI RMF e ISO 42001.","sm":""},{"id":400,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Honesty Over Harmony: A Student-Centered Framework for High-Impact ID-SME Collaboration","te":"Honestidad antes que armonía: un marco centrado en el estudiante para la colaboración entre diseñadores instruccionales y expertos en contenido","sh":"Instructional Designer–Subject Expert Collaboration","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 1","p":"Yesi Vega","po":"Instructional Designer II, Texas A&M University - Corpus Christi","d":"The classic ID-SME tension, jargon versus “dumbing it down”, can hinder course creation. This interactive session transforms this potential conflict when you put honesty over harmony. Discover how a student-centered framework builds true partnerships, aligns teams on what matters, and creates high-impact learning experiences that foster learner success and access.","de":"La clásica tensión entre diseñadores instruccionales y expertos en contenido (jerga técnica versus \"simplificar demasiado\") puede trabar la creación de cursos. Esta sesión interactiva transforma ese posible conflicto poniendo la honestidad por delante de la armonía, con un marco centrado en el estudiante que construye alianzas reales, alinea a los equipos en lo importante y crea experiencias de alto impacto.","sm":""},{"id":401,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Intercultural Instructional Design: Creating Culturally Responsive Learning Experiences for International Learners","te":"Diseño instruccional intercultural: experiencias de aprendizaje culturalmente pertinentes para estudiantes internacionales","sh":"Intercultural Instructional Design: Culturally Responsive Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 1","p":"Michaela Dengg","po":"Learning Designer, Boston University","d":"Many online learners are international students. Design choices that work for one may confuse another. This session presents Intercultural Instructional Design (IID), blending UDL and intercultural competence to craft equitable, accessible, culturally responsive courses. Explore six actionable design areas and leave with practical strategies to improve online design and teaching.","de":"Muchos estudiantes online son internacionales, y decisiones de diseño que funcionan para uno pueden confundir a otro. La sesión presenta el Diseño Instruccional Intercultural (IID), que combina el Diseño Universal para el Aprendizaje con la competencia intercultural para crear cursos equitativos, accesibles y culturalmente pertinentes. Se exploran seis áreas de diseño con estrategias prácticas para mejorar el diseño y la enseñanza online.","sm":""},{"id":402,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Learning To Partner With GenAI By Critiquing Its Output In The Context Of A Written Assignment","te":"Aprender a trabajar con la IA generativa criticando sus respuestas en una consigna escrita","sh":"Learning to Partner with GenAI by Critiquing Its Output","ty":"Featured session","tye":"Sesión destacada","to":"Featured Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"Jonathan Zaccarini","po":"Digital Learning Support Specialist, Columbia Mailman School of Public Health","d":"This session will explore ChatGPT integration in an online graduate public health course. I will explain the design of one written assignment and how students were instructed to prompt and critique ChatGPT. Participants will leave with a rubric, ChatGPT activity outline, and practical integration strategies.","de":"La sesión explora la integración de ChatGPT en un curso de posgrado online en salud pública: el diseño de una consigna escrita y cómo se orientó a los estudiantes para hacerle prompts a ChatGPT y criticar sus respuestas. Los participantes se llevan una rúbrica, el esquema de la actividad y estrategias prácticas de integración.","sm":""},{"id":403,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"The Deadline Dilemma: Rethinking Late Work Policies in Online Courses","te":"El dilema de las fechas de entrega: repensar las políticas de entregas tardías en cursos online","sh":"Rethinking Late Work Policies","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere E3/E4","p":"Dr. Taylor Hibel","po":"Instructional Consultant, Embry-Riddle Aeronautical University-Worldwide","d":"Late work policies shape more than deadlines; they signal instructor care, equity, and belonging. This session presents a mixed-methods study exploring how different policy structures influence student motivation, engagement, and perceptions of rigor in online courses. Participants will leave with research-informed strategies to design policies that balance accountability with empathy.","de":"Las políticas de entregas tardías moldean más que los plazos: transmiten cuidado docente, equidad y pertenencia. La sesión presenta un estudio de métodos mixtos sobre cómo distintas políticas influyen en la motivación, la participación y la percepción de exigencia de los estudiantes online, con estrategias basadas en investigación para equilibrar responsabilidad y empatía.","sm":""},{"id":404,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"When GenAI Can Do the Work: Rethinking Online Course Design and Delivery","te":"Cuando la IA generativa puede hacer el trabajo: repensar el diseño y el dictado de cursos online","sh":"When GenAI Can Do the Work: Rethinking Course Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Alena Rodick","po":"Director of Learning Design and Solutions, Empire State University","d":"GenAI is challenging how online courses use written work, discussions, projects, and assessments as evidence of learning. Drawing on participation in the Institute on AI, Pedagogy, and the Curriculum and collaborative faculty projects, this session maps unresolved design and delivery questions and invites attendees to compare what they are seeing.","de":"La IA generativa pone en cuestión cómo los cursos online usan textos escritos, discusiones, proyectos y evaluaciones como evidencia de aprendizaje. A partir de la participación en el Institute on AI, Pedagogy, and the Curriculum y de proyectos colaborativos con docentes, la sesión mapea preguntas de diseño y dictado aún abiertas e invita a comparar lo que cada uno está viendo.","sm":""},{"id":405,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Where Is Your Online University? Mapping Place in Digital Learning","te":"¿Dónde está tu universidad online? Mapear el lugar en el aprendizaje digital","sh":"Mapping Place in Digital Learning","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A3/A4","p":"Catherine Esposito","po":"Instructional Design Lead and Doctoral Candidate, The Pennsylvania State University","d":"What does an online university look like as a place? In this interactive session, participants create visual maps of online learning environments informed by student research. Together, we explore how tools, physical and digital spaces, and relationships shape engagement, belonging, and identity in digital education.","de":"¿Cómo se ve una universidad online como lugar? En esta sesión interactiva, los participantes crean mapas visuales de entornos de aprendizaje online a partir de investigación con estudiantes, y exploran cómo las herramientas, los espacios físicos y digitales y los vínculos moldean la participación, la pertenencia y la identidad en la educación digital.","sm":""},{"id":406,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Would You Launch This Doctorate? Using Learner Intent Data to Design Online Programs","te":"¿Lanzarías este doctorado? Usar datos de intención de los estudiantes para diseñar programas online","sh":"Designing Online Doctoral Programs","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere II","p":"Joe Lyons, Ph.D.","po":"Dir. & Professor - Intelligence Studies, Saint Louis University","d":"Using survey data from online master’s students, this session examines doctoral intent and its role in program design. Participants engage in a decision-making exercise to determine whether to launch an online doctorate, followed by a real-world case translating research into a newly developed professional doctoral program","de":"Con datos de encuestas a estudiantes de maestrías online, la sesión analiza su intención de hacer un doctorado y su papel en el diseño de programas. Los participantes hacen un ejercicio de decisión sobre si lanzar un doctorado online, seguido de un caso real en el que la investigación se tradujo en un nuevo doctorado profesional.","sm":""},{"id":407,"day":"Jue","s":660,"e":765,"b":"h-1100","t":"Instructional Design for Accessibility: Building Skills Through Microcredentials","te":"Diseño instruccional para la accesibilidad: desarrollar habilidades con microcredenciales","sh":"Accessibility Microcredentials","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 7","p":"Vivian Seki, MS.Ed.IT, CPACC","po":"Digital Accessibility Coordinator, University of North Texas Health Science Center","d":"Bridging the gap between accessibility awareness and applied practice, this interactive session introduces a scalable microcredential model grounded in WCAG POUR and UDL principles. Participants will evaluate and remediate digital content using industry tools, leaving with competency-based frameworks and scaffolded strategies to embed accessibility into course design and development workflows.","de":"Para cerrar la brecha entre conocer la accesibilidad y aplicarla, esta sesión interactiva presenta un modelo escalable de microcredenciales basado en los principios POUR de WCAG y en el Diseño Universal para el Aprendizaje. Los participantes evalúan y corrigen contenidos digitales con herramientas profesionales, y se llevan marcos basados en competencias y estrategias para integrar la accesibilidad en el diseño y desarrollo de cursos.","sm":""},{"id":408,"day":"Jue","s":660,"e":765,"b":"h-1100","t":"Leveraging AI As a Partner for Developing Effective, Accessible, (AWESOME) Pages using HTML in Your LMS","te":"La IA como aliada para crear páginas eficaces y accesibles con HTML en tu LMS","sh":"Leveraging AI to Build Accessible Pages in Your LMS","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 8","p":"Guillermo Rodriguez","po":"Instructional Tech Analyst, Edson College of Nursing and Health Innovation at Arizona State University","d":"This interactive workshop introduces participants to using AI tools to design accessible, visually effective pages in their LMS Rich Content Editor. Attendees will explore AI-assisted HTML generation, accessibility best practices, and WCAG 2.1 AA compliance while learning how to refine and customize AI-generated content through hands-on activities.","de":"Este taller interactivo enseña a usar herramientas de IA para diseñar páginas accesibles y visualmente eficaces en el editor de contenidos del LMS. Se explora la generación de HTML asistida por IA, buenas prácticas de accesibilidad y el cumplimiento de WCAG 2.1 AA, con actividades prácticas para ajustar y personalizar el contenido generado.","sm":""},{"id":409,"day":"Jue","s":660,"e":765,"b":"h-1100","t":"Micro-Strategies for Macro Impact: Streamlining Daily Workflows","te":"Microestrategias para un gran impacto: agilizar el trabajo diario","sh":"Streamlining Daily Workflows","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Asia 5","p":"Josephine Coco","po":"Instructional Technologist, SUNY Empire State University","d":"Whether you are new to digital workflows or looking to refine your approach, this interactive workshop offers practical strategies for all attendees. Participants will use everyday tools to improve organization, communication, and efficiency, leaving with personalized, adaptable techniques that can be applied immediately in any educational settings.","de":"Ya sea que recién empieces con flujos de trabajo digitales o quieras perfeccionarlos, este taller interactivo ofrece estrategias prácticas para todos. Los participantes usan herramientas cotidianas para mejorar la organización, la comunicación y la eficiencia, y se llevan técnicas personalizadas y adaptables para aplicar de inmediato en cualquier contexto educativo.","sm":""},{"id":410,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"\"I Fight for the Users!\": Deploying T.R.O.N. to De-Rez the Dirty Work of the Grid","te":"\"¡Yo lucho por los usuarios!\": un asistente de IA a medida para el trabajo pesado del LMS","sh":"A Custom AI Assistant for LMS Formatting","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Robert B. McKenzie MEd, MFA","po":"Curriculum Design Manager, BYU-Idaho","d":"Trapped on the digital Grid fixing bad HTML and CSS? Learn to build a custom AI assistant to automate tedious Canvas formatting, enforce WCAG standards, and utilize existing code snippets. We’ll de-rez the digital dirty work so you can free up your bandwidth and focus on actually mentoring students.","de":"¿Atrapado en la \"grilla digital\" corrigiendo HTML y CSS mal hechos? Aprendé a construir un asistente de IA personalizado para automatizar el formato tedioso en Canvas, aplicar los estándares WCAG y reutilizar fragmentos de código existentes, para liberar tiempo y enfocarte en acompañar a los estudiantes.","sm":""},{"id":411,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"A New Direction: Learning Design for Student Agency and Success","te":"Una nueva dirección: diseño del aprendizaje para la agencia y el éxito de los estudiantes","sh":"A New Direction: Learning Design for Student Agency","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 6","p":"Miranda Hawk","po":"Faculty, Madison College","d":"The challenge isn't making online courses more fun. It is designing learning where students see a reason to care, to think, and to continue. Borrowing from how a director guides an actor to bring a role to life, this interactive session offers a transferable design for student agency and success.","de":"El desafío no es hacer los cursos online más divertidos, sino diseñar aprendizajes donde los estudiantes encuentren razones para involucrarse, pensar y seguir. Tomando cómo un director de teatro guía a un actor para dar vida a un personaje, esta sesión interactiva ofrece un diseño transferible para la agencia y el éxito de los estudiantes.","sm":""},{"id":412,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Building AI Policy Together: A Community Conversation on Ethics and Practice","te":"Construir juntos la política de IA: una conversación comunitaria sobre ética y práctica","sh":"Building AI Policy Together","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 4","p":"Prof. Christian Moriarty JD MA","po":"Professor, St Petersburg College","d":"Faculty are making consequential AI policy decisions every day, and those decisions deserve to be made in the community. This session creates a structured space to think through course and assignment-level AI policy together, grounded in ethics, whether that means embracing AI, using it selectively, or keeping it out entirely.","de":"Los docentes toman todos los días decisiones importantes sobre el uso de IA, y esas decisiones merecen tomarse en comunidad. La sesión crea un espacio estructurado para pensar juntos políticas de IA a nivel del curso y de cada consigna, desde la ética, ya sea para adoptar la IA, usarla selectivamente o dejarla afuera.","sm":""},{"id":413,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Building an AI-Responsive Assignment Template for Every Classroom","te":"Una plantilla de consignas adaptadas a la IA para cualquier aula","sh":"Building an AI-Responsive Assignment Template","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 1","p":"Maddy Kadish","po":"Director, Online Education, George Washington University","d":"Address AI challenges through collaboration. This interactive session introduces a transparent, peer-tested template for designing AI-responsive assignments. Explore our community of practice model and actively customize the template to suit your unique disciplinary, course, and faculty needs.","de":"Abordar los desafíos de la IA de forma colaborativa. Esta sesión interactiva presenta una plantilla transparente y probada entre pares para diseñar consignas que respondan a la IA, junto con un modelo de comunidad de práctica, y permite adaptar la plantilla a cada disciplina, curso y necesidad docente.","sm":""},{"id":414,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Building Higher-Order Thinking Through Progressive Simulation Design","te":"Desarrollar el pensamiento de orden superior con simulaciones progresivas","sh":"Building Higher-Order Thinking Through Progressive Simulations","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"Lydia Kite OTD, MOT, OTR/L, CA","po":"Doctor, Bowling Green State University","d":"This session presents a transferable framework for using progressive simulation experiences to scaffold higher-order reasoning, communication, collaboration, and decision-making across a curriculum. Using healthcare education examples, attendees will explore how simulation can intentionally progress learners from foundational knowledge application toward complex professional judgment and interdisciplinary problem-solving.","de":"La sesión presenta un marco transferible para usar experiencias de simulación progresivas que andamien el razonamiento de orden superior, la comunicación, la colaboración y la toma de decisiones a lo largo de un plan de estudios. Con ejemplos de formación en salud, se explora cómo la simulación puede llevar a los estudiantes de aplicar conocimientos básicos al juicio profesional complejo y la resolución interdisciplinaria de problemas.","sm":""},{"id":415,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Cheat-Resistant by Design: Stop Grading Bots","te":"Resistente a las trampas por diseño: dejá de calificar bots","sh":"Cheat-Resistant by Design: Stop Grading Bots","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 2","p":"Graceful Beam","po":"Director of Online Learning and Development, Georgia Northwestern Technical College","d":"The question isn't how to catch AI use. It's how to design assignments where AI assistance doesn't help. When work requires a student's specific context, voice, and judgment, no tool can authentically complete it. Participants apply five design principles and a four-question audit to their own courses.","de":"La pregunta no es cómo detectar el uso de IA, sino cómo diseñar consignas en las que la ayuda de la IA no sirva. Cuando el trabajo exige el contexto, la voz y el juicio propios de cada estudiante, ninguna herramienta puede completarlo de forma auténtica. Los participantes aplican cinco principios de diseño y una auditoría de cuatro preguntas a sus propios cursos.","sm":""},{"id":416,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Cultivating Belonging in Online Graduate Education: Applying Research to Practice","te":"Cultivar la pertenencia en posgrados online: de la investigación a la práctica","sh":"Belonging in Online Graduate Education","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A3/A4","p":"Diane Perillo-Morabito EdD","po":"Sr. Director Finance & Operations, Stony Brook University","d":"An interactive session that will further strengthen the Community of Inquiry, Sense of Belonging, and Social Identity Theory among online learners. This session will discuss the correlation between these theories and share survey results that answer the question: \" Do graduate professional online learners have a sense of belonging?\"","de":"Una sesión interactiva para fortalecer la comunidad de indagación, el sentido de pertenencia y la identidad social entre estudiantes online. Se analiza la relación entre estas teorías y se comparten resultados de una encuesta que responde la pregunta: ¿los estudiantes de posgrados profesionales online sienten que pertenecen?","sm":""},{"id":417,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Embedding Career Readiness Across the Curriculum: A Collaborative Model for Hybrid Allied Health Education","te":"Integrar la preparación para el empleo en todo el plan de estudios: un modelo colaborativo en formación híbrida en salud","sh":"Embedding Career Readiness Across the Curriculum","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 5","p":"Jana Hickman","po":"Clinical Assistant Professor, Department of Occupational Therapy, Baylor University","d":"This session presents a collaborative model developed within a hybrid occupational therapy program that embeds career readiness throughout the curriculum through partnership with career services. Participants will explore curriculum-mapping strategies that integrate professional identity development, communication skills, and workforce preparation to apply this adaptable framework across allied health programs.","de":"La sesión presenta un modelo colaborativo desarrollado en un programa híbrido de terapia ocupacional que integra la preparación para el empleo en todo el plan de estudios, en alianza con el área de orientación laboral. Se exploran estrategias de mapeo curricular que integran el desarrollo de la identidad profesional, las habilidades de comunicación y la preparación para el trabajo, adaptables a otros programas de salud.","sm":""},{"id":418,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"From Foundations to Innovation: A Scalable Three-Tier Model for Online Faculty Development","te":"De los fundamentos a la innovación: un modelo escalable de tres niveles para la formación de docentes online","sh":"A Three-Tier Model for Online Faculty Development","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Angela Solic, Ph.D.","po":"Director, CTEI, Rush University","d":"Discover a scalable three-tier approach to preparing faculty for engaging, high-quality online and hybrid teaching. Explore how institutions can move instructors from foundational course design to interactive, AI-enhanced, and immersive learning strategies through project-based professional development that builds confidence, innovation, and student-centered teaching practices.","de":"Un enfoque escalable de tres niveles para preparar a los docentes para una enseñanza online e híbrida atractiva y de calidad. Cómo llevar a los docentes del diseño básico de cursos a estrategias interactivas, con IA e inmersivas mediante una formación basada en proyectos que fortalece la confianza, la innovación y una enseñanza centrada en el estudiante.","sm":""},{"id":419,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Leading and Operationalizing a Fully Remote Instructional Design Team","te":"Liderar y gestionar un equipo de diseño instruccional totalmente remoto","sh":"Leading a Fully Remote ID Team","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 1","p":"Sky Zhang","po":"Director of ID, The University of Tennessee-Knoxville","d":"How do you lead a scaled, fully remote instructional design team? This session shares operational frameworks from a remote unit of seventeen professionals. Learn replicable strategies for managing cohort-based course production, structured faculty consultations, and peer-led quality assurance to build a sustainable, collaborative remote ecosystem in higher education.","de":"¿Cómo se lidera un equipo grande de diseño instruccional totalmente remoto? La sesión comparte marcos operativos de una unidad remota de diecisiete profesionales: estrategias replicables para gestionar la producción de cursos por cohortes, asesorías estructuradas a docentes y control de calidad entre pares, para construir un ecosistema remoto sostenible y colaborativo.","sm":""},{"id":420,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Online Classroom Engagement Will NEVER Be The Same Again: Leveraging AI Tools for Online Learner Interaction","te":"La participación en el aula online nunca volverá a ser la misma: herramientas de IA para la interacción de los estudiantes","sh":"Leveraging AI Tools for Online Learner Interaction","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Dr. Ryan Barnhart, DHSc","po":"Part Time Adjunct Faculty member, National University","d":"In this session, we’ll talk about how AI tools can be leveraged to change the landscape of online learner engagement and student success outcomes in the online classroom.","de":"La sesión aborda cómo las herramientas de IA pueden cambiar el panorama de la participación de los estudiantes y sus resultados en el aula online.","sm":""},{"id":421,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Small Learners, Big Impact: Reimagining Early childhood teacher education preparation programs with UDL principles","te":"Pequeños estudiantes, gran impacto: reimaginar la formación docente en primera infancia con el Diseño Universal para el Aprendizaje","sh":"Early Childhood Teacher Education and UDL","ty":"Gamified session","tye":"Sesión gamificada","to":"Gamified Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere E3/E4","p":"Bweikia Foster Steen","po":"Professor of Early childhood education, George Mason University","d":"This interactive session will explore the role of technology within the early childhood education (ECE) field. Using the tool: https://www.playfactile.com/, participants will explore technology tools that promote engagement and empowerment for teacher educators. The session will also model practical strategies that can be implemented in ECE classrooms.","de":"Esta sesión gamificada explora el papel de la tecnología en la educación de la primera infancia. Con la herramienta Playfactile, los participantes prueban recursos tecnológicos que promueven la participación y el empoderamiento de los formadores de docentes, y se modelan estrategias prácticas para implementar en aulas de nivel inicial.","sm":""},{"id":422,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"The Dialogue Shift: Scaling Engagement and Career Simulations with Blackboard AI Conversations","te":"El giro del diálogo: escalar la participación y las simulaciones laborales con las conversaciones de IA de Blackboard","sh":"The Dialogue Shift: Career Simulations with AI Conversations","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Mr. Chase Lucas, M.S.","po":"Instructional Designer, Marshall University","d":"As digital learning enters its next era, Marshall Online uses Blackboard Ultra AI Conversations to turn AI from shortcut into scaffolded rehearsal. Grounded in cognitive apprenticeship, we simulate authentic career scenarios and foster online belonging. Join us to see the design, the early results, and the principles to adapt it.","de":"En esta nueva etapa del aprendizaje digital, Marshall Online usa las AI Conversations de Blackboard Ultra para convertir la IA de atajo en un ensayo guiado. Con base en el modelo de aprendizaje cognitivo tipo aprendiz, simulan situaciones laborales auténticas y fomentan la pertenencia online. La sesión muestra el diseño, los primeros resultados y los principios para adaptarlo.","sm":""},{"id":423,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Transforming and Scaling a Learning and Coaching System: Best Practices for Leveraging AI and Driving Adoption","te":"Transformar y escalar un sistema de aprendizaje y coaching: buenas prácticas para aprovechar la IA e impulsar su adopción","sh":"Scaling Learning and Coaching with AI Role-Play Scenarios","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere II","p":"Karen Milheim, Ed.D.","po":"Senior Director, Learning, Development, & Enablement, Covista/Center for Digital Excellence, Chamberlain University, Walden University","d":"Scaling learning and coaching effectively requires speed and strong employee adoption. This session explores how AI-powered learning technologies can accelerate learning, with a focus on designing and delivering realistic AI-driven roleplay scenarios. Participants will learn strategies for building AI agents, collaborating with SMEs, and fostering buy-in to successfully scale.","de":"Escalar el aprendizaje y el coaching requiere velocidad y una fuerte adopción por parte de los equipos. La sesión explora cómo las tecnologías de aprendizaje con IA pueden acelerar el aprendizaje, con foco en el diseño y la implementación de role-plays realistas con IA. Los participantes aprenden estrategias para construir agentes de IA, colaborar con expertos en contenido y lograr el compromiso necesario para escalar.","sm":""},{"id":424,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"What Happens When Faculty Stop Legacy Grading? Lessons from Specifications Grading in Online Graduate Education","te":"¿Qué pasa cuando los docentes dejan la calificación tradicional? Lecciones de la calificación por especificaciones en posgrados online","sh":"Specifications Grading in Graduate Programs","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Chery Lucarelli, PhD","po":"Chair, Doctorate and Graduate Education Studies, The College of Saint Scholastica","d":"What happens when graduate programs rethink grades altogether? This session explores how one institution implemented specifications grading across online graduate programs to advance equity, care, proficiency, transparency, and authentic learning. Participants will examine practical examples, implementation lessons, and strategies for redesigning assessment beyond compliance and point accumulation","de":"¿Qué pasa cuando los posgrados replantean por completo las calificaciones? La sesión explora cómo una institución implementó la calificación por especificaciones en sus posgrados online para promover la equidad, el cuidado, el dominio, la transparencia y el aprendizaje auténtico, con ejemplos prácticos, aprendizajes de la implementación y estrategias para rediseñar la evaluación más allá del cumplimiento y la acumulación de puntos.","sm":""},{"id":425,"day":"Jue","s":660,"e":705,"b":"h-1100","t":"Where Design and Pedagogy Meet: Folding Instructional Designers into Learning + Teaching Centers","te":"Donde se encuentran el diseño y la pedagogía: integrar a los diseñadores instruccionales en los centros de enseñanza y aprendizaje","sh":"Folding Instructional Designers into Teaching Centers","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Ruth Benander","po":"Professor, University of Cincinnati","d":"Digital learning blurs the lines between design and delivery where design choices imply pedagogical approaches. Through a case study of instructional designers, professional developers, and organizational structures, we explore the cultural and structural issues that surround creating strategic partnerships that better support teaching in a digital world.","de":"El aprendizaje digital desdibuja los límites entre el diseño y el dictado, porque las decisiones de diseño implican enfoques pedagógicos. A partir de un caso de diseñadores instruccionales, formadores docentes y estructuras organizacionales, se exploran los temas culturales y estructurales de construir alianzas estratégicas que apoyen mejor la enseñanza en un mundo digital.","sm":""},{"id":426,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"AI with Intent: How We Built IDA to Empower Instructional Designers Without Replacing Them","te":"IA con intención: cómo construimos IDA para empoderar a los diseñadores instruccionales sin reemplazarlos","sh":"AI with Intent: Building an Instructional Design Assistant","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"Dr. John Boekenoogen","po":"Executive Director, Embry-Riddle Aeronautical University","d":"AI tools built for everyone serve no one. ERAU used AI to design IDA — an Instructional Design Assistant built specifically for faculty — then let the design do the work. Come see how AI-informed (not AI-dependent) tools can transform your instructional support ecosystem.","de":"Las herramientas de IA hechas para todos no le sirven a nadie. Embry-Riddle (ERAU) usó IA para diseñar IDA, un asistente de diseño instruccional pensado específicamente para docentes, y dejó que el diseño hiciera el trabajo. Cómo herramientas informadas por la IA (no dependientes de ella) pueden transformar el ecosistema de apoyo pedagógico.","sm":""},{"id":427,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Beyond Migration: A Pedagogical, Collaborative Approach to LMS Transition through Cross-Campus Collaboration","te":"Más allá de la migración: un enfoque pedagógico y colaborativo para cambiar de LMS","sh":"A Pedagogy-First LMS Transition","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 1","p":"Hetal Thaker","po":"Assistant Director for Instructional Technologies Integration, Villanova University","d":"LMS transitions are critical opportunities for transformation in teaching and learning. This session shares a pedagogy-first model for LMS transition led by a teaching and learning center in partnership with university IT. Participants will leave with an adaptable framework for leading LMS transitions that integrate pedagogical vision with institutional strategy.","de":"Los cambios de LMS son oportunidades clave para transformar la enseñanza y el aprendizaje. La sesión comparte un modelo de transición \"con la pedagogía primero\", liderado por un centro de enseñanza y aprendizaje en alianza con el área de sistemas de la universidad, y un marco adaptable para integrar la visión pedagógica con la estrategia institucional.","sm":""},{"id":428,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Building a Faculty Development Framework: Scaling Professional Development for Online Instructors","te":"Construir un marco de formación docente: escalar la formación de docentes online","sh":"Scaling Professional Development for Online Instructors","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 5","p":"Angela Sparkman","po":"Assistant Faculty Lead and Professional Development Lead, Ivy Tech Community College","d":"How do you build a professional development program that faculty genuinely want to attend? Learn how a statewide community college system transformed a small collection of professional development sessions into a thriving, scalable faculty development framework. Discover practical strategies, lessons learned, and ready-to-use ideas for engaging online instructors at scale.","de":"¿Cómo crear un programa de formación al que los docentes realmente quieran ir? Cómo un sistema estatal de community colleges transformó un puñado de sesiones de formación en un marco de desarrollo docente sólido y escalable, con estrategias prácticas, aprendizajes e ideas listas para usar para involucrar a docentes online a escala.","sm":""},{"id":429,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Fixing the Grading Problem: Using Video and Technology to Improve Consistency Across Instructors","te":"Resolver el problema de la calificación: video y tecnología para mejorar la consistencia entre docentes","sh":"Fixing the Grading Problem: Consistency Across Instructors","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere II","p":"Kaitlyn Cremer, OTD, OTR","po":"Clinical Associate Professor, Baylor University","d":"Inconsistent grading across instructors is a persistent challenge in skills-based learning. This session introduces an adaptable, technology-enhanced model using video, faculty calibration, and structured feedback to improve inter-rater reliability, instructional alignment, and learner outcomes in distributed teaching environments.","de":"La calificación inconsistente entre docentes es un desafío persistente en el aprendizaje basado en habilidades. La sesión presenta un modelo adaptable, apoyado en tecnología, que usa video, calibración entre docentes y retroalimentación estructurada para mejorar la confiabilidad entre evaluadores, la alineación de la enseñanza y los resultados de los estudiantes en contextos de enseñanza distribuida.","sm":""},{"id":430,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"From Best Practices to Title II: Lessons from the Evolution of an Accessibility Checklist","te":"De las buenas prácticas al Título II: lecciones de la evolución de un checklist de accesibilidad","sh":"Evolving an Accessibility Checklist","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 6","p":"Kelsey Keefe","po":"eLearning Developer, eCampus, University of Connecticut","d":"Learn how an online course development unit built, implemented, and refined an accessibility checklist to support faculty, guide course review processes, and prepare for ADA Title II requirements. Through an action-planning activity, you'll explore practical strategies for strengthening accessibility practices and addressing challenges within your own institutional context.","de":"Cómo una unidad de desarrollo de cursos online construyó, implementó y ajustó un checklist de accesibilidad para apoyar a los docentes, guiar la revisión de cursos y prepararse para los requisitos del Título II de la ADA. Con una actividad de planificación, se exploran estrategias prácticas para fortalecer la accesibilidad en cada contexto institucional.","sm":""},{"id":431,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"From Frameworks to Infrastructure: Scaling Ethical AI and UDL Through Faculty Development Systems","te":"De los marcos a la infraestructura: escalar una IA ética y el DUA a través de sistemas de formación docente","sh":"From Frameworks to Infrastructure: Scaling Ethical AI and UDL","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Paul Miller, EdD","po":"Director, Center for Teaching and Learning, Montgomery College","d":"Move beyond isolated AI adoption to institutional design. This session introduces the PRIMED framework to align ethical AI, UDL, and faculty development systems. Participants will explore how to scale inclusive, AI-enabled teaching through coordinated professional learning, instructional design support, and policy alignment across complex higher education environments.","de":"De la adopción aislada de IA al diseño institucional. La sesión presenta el marco PRIMED para alinear una IA ética, el Diseño Universal para el Aprendizaje y los sistemas de formación docente, y explora cómo escalar una enseñanza inclusiva con IA a través de formación coordinada, apoyo de diseño instruccional y alineación de políticas en instituciones complejas.","sm":""},{"id":432,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"From Gaps to Gains: Scaling Connection to Drive Online Student Success","te":"De brechas a logros: escalar la conexión para impulsar el éxito de los estudiantes online","sh":"Scaling Connection for Online Student Success","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Julia Braun, M.Ed., M.S.","po":"Senior Associate Director, SUNY-University at Buffalo","d":"Online students often disengage without visible signals for timely intervention. This session invites student-facing professionals to examine how lifecycle touchpoints shape the online learner experience. Using a gap analysis framework, participants will identify disconnects and explore scalable strategies to strengthen communication, connection, and support for online student engagement and success.","de":"Los estudiantes online suelen desconectarse sin señales visibles que permitan intervenir a tiempo. La sesión invita a quienes trabajan en contacto con estudiantes a analizar cómo los puntos de contacto a lo largo de su recorrido moldean la experiencia online. Con un marco de análisis de brechas, se identifican desconexiones y se exploran estrategias escalables para fortalecer la comunicación, la conexión y el apoyo.","sm":""},{"id":433,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"From Optional to Required: Early Outcomes from a Campus-Wide Accessibility Training Initiative","te":"De opcional a obligatoria: primeros resultados de una capacitación en accesibilidad para toda la institución","sh":"Required Accessibility Training: Early Outcomes","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Americas Seminar","p":"Melanie Eley","po":"Digital Accessibility Manager, University of North Carolina at Greensboro","d":"Many institutions recognize accessibility training must become required but struggle to implement it at scale. This session presents a case study of launching required faculty training through cross-campus collaboration, aligned teaching expectations, and platform-supported delivery, while achieving a 78% completion rate in the first year.","de":"Muchas instituciones saben que la capacitación en accesibilidad debe ser obligatoria, pero les cuesta implementarla a escala. La sesión presenta el caso del lanzamiento de una capacitación docente obligatoria, con colaboración entre áreas, expectativas de enseñanza alineadas y una plataforma de apoyo, que logró un 78% de finalización en el primer año.","sm":""},{"id":434,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Illuminating Career Readiness: Connecting Learning to Real-World Application","te":"Iluminar la preparación para el empleo: conectar el aprendizaje con su aplicación en el mundo real","sh":"Illuminating Career Readiness: Connecting Learning to Real-World Skills","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Dawn Adolfson, Ph.D.","po":"Learning Designer, University of South Florida-Main Campus","d":"Graduating students often struggle to articulate their knowledge and skills to employers. This session shares a practical capstone redesign using the NACE framework to bridge that gap. Walk away with a ready-to-use approach for aligning assignments, activities, and ePortfolio artifacts to real-world competencies.","de":"A los estudiantes que se gradúan muchas veces les cuesta explicar a los empleadores lo que saben y saben hacer. La sesión comparte el rediseño práctico de un proyecto final con el marco de competencias de NACE para cerrar esa brecha, con un enfoque listo para alinear consignas, actividades y piezas del ePortfolio con competencias del mundo real.","sm":""},{"id":435,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Modern Mayer's: Using and Adapting Mayer's Principles for Modern Educational Multimedia","te":"Mayer moderno: usar y adaptar los principios de Mayer para el multimedia educativo actual","sh":"Modern Mayer's Multimedia Principles","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 2","p":"Benjamin Bohlin","po":"Video Production Specialist, Purdue University-Main Campus","d":"Multimedia in education is extremely valuable, especially in today's learning environment. Mayer's Principles of Multimedia provide guidelines of how to create educational content, but how do these principles hold up twenty-five years later? Join us for an event with first-hand experience, learning activities and mildly chaotic discussion of principle progress!","de":"El multimedia es muy valioso en la educación, sobre todo hoy. Los principios multimedia de Mayer orientan cómo crear contenido educativo, pero ¿cómo resisten veinticinco años después? Una sesión con experiencia de primera mano, actividades de aprendizaje y una discusión un poco caótica sobre la vigencia de los principios.","sm":""},{"id":436,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Plant Murder Mysteries: Narrative Storytelling and Digital Case Files for the Student Detective!","te":"Misterios de plantas asesinas: storytelling y expedientes digitales para estudiantes detectives","sh":"Narrative Storytelling and Digital Case Files for Student Detectives","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Jakia Salam","po":"Lead Instructional Designer, North Carolina State University at Raleigh","d":"“Plant Murder Mysteries\" is an immersive digital learning experience that transforms traditionally dry botanical content into an engaging detective-style adventure. Through interactive 360-degree environments and narrative storytelling, students investigate plant-related mysteries, encouraging active reasoning. This approach shifts learning from passive memorization to meaningful exploration, enhancing student engagement and knowledge retention.","de":"\"Plant Murder Mysteries\" es una experiencia digital inmersiva que transforma contenidos de botánica tradicionalmente áridos en una aventura detectivesca. Con entornos interactivos en 360 grados y storytelling, los estudiantes investigan misterios vinculados a plantas y razonan activamente. El enfoque pasa de la memorización pasiva a la exploración significativa y mejora la participación y la retención.","sm":""},{"id":437,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Reducing Cognitive Load Through Consistent Course Design: Lessons from a Standardized LMS Template","te":"Reducir la carga cognitiva con un diseño de cursos consistente: lecciones de una plantilla estandarizada en el LMS","sh":"Consistent Course Design with an LMS Template","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 4","p":"Ashley Bondurant,PT, DPT, M.Ed","po":"Instructional Designer, Medical University of South Carolina","d":"Inconsistent course design can increase cognitive load and hinder student success. This session shares lessons learned from implementing a standardized LMS course template, including student feedback, faculty adoption strategies, and practical approaches for creating consistent, learner-centered online experiences across academic programs.","de":"Un diseño de cursos inconsistente puede aumentar la carga cognitiva y afectar el éxito de los estudiantes. La sesión comparte aprendizajes de implementar una plantilla estandarizada de cursos en el LMS: feedback de estudiantes, estrategias para la adopción por parte de los docentes y enfoques prácticos para lograr experiencias online consistentes y centradas en el estudiante en distintos programas.","sm":""},{"id":438,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Relationship Management at Scale: Supporting Dozens (or hundreds) of Programs","te":"Gestión de relaciones a escala: acompañar a decenas (o cientos) de programas","sh":"Relationship Management at Scale: Supporting Many Programs","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Brittany Logue, M.Ed.","po":"Senior Program Manager, Colorado State University-Fort Collins","d":"Personalized support is the standard we set for ourselves, but it does not scale on its own. This session offers a practical model for managing relationships across dozens, or even hundreds of programs, including service structures, segmentation and communication strategies, with tools that protect quality and the people delivering it.","de":"El acompañamiento personalizado es el estándar que nos ponemos, pero no escala por sí solo. La sesión ofrece un modelo práctico para gestionar relaciones con decenas o cientos de programas, con estructuras de servicio, segmentación y estrategias de comunicación, y herramientas que protegen la calidad y a las personas que hacen el trabajo.","sm":""},{"id":439,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Silos to Structure: A Three-Part Framework to Centralize COIL","te":"De silos a estructura: un marco de tres partes para centralizar el aprendizaje internacional colaborativo online (COIL)","sh":"Silos to Structure: Scaling Collaborative Online International Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 1","p":"Brianna Stines","po":"Senior Learning Designer, University of Notre Dame","d":"Traditional study abroad is exclusive, but Collaborative Online International Learning (COIL) can help us democratize global learning. Sharing our mission-aligned nascent story and pilot learnings, we’ll outline a lean, three-part architecture to scale COIL through static resources, asynchronous onboarding, and sustainable consultation with minimal administrative staff.","de":"El intercambio estudiantil tradicional es excluyente, pero el aprendizaje internacional colaborativo online (COIL) puede democratizar el aprendizaje global. A partir de su historia incipiente y de los aprendizajes del piloto, se presenta una arquitectura liviana de tres partes para escalar COIL con recursos permanentes, una incorporación asincrónica y asesoría sostenible con muy poco personal administrativo.","sm":""},{"id":440,"day":"Jue","s":720,"e":765,"b":"h-1200","t":"Trust, but Verify: A Framework for Evaluating AI-Generated Assessment Criteria","te":"Confiar, pero verificar: un marco para evaluar criterios de evaluación generados con IA","sh":"Trust, but Verify: Evaluating AI-Generated Rubrics","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Parul Khurana, Ph.D.","po":"Associate Professor, SUNY Empire State University","d":"Generative AI can draft assessment criteria in seconds, but using it well means knowing when its output fails. Moving beyond basic AI use, this session offers a field-tested, five-phase framework for evaluating and correcting AI-generated rubrics, with decision rules that help online and STEM faculty pair efficiency with disciplinary judgment.","de":"La IA generativa puede redactar criterios de evaluación en segundos, pero usarla bien implica saber cuándo falla. Más allá del uso básico de IA, la sesión ofrece un marco de cinco fases, probado en la práctica, para evaluar y corregir rúbricas generadas con IA, con reglas de decisión que ayudan a docentes online y de STEM a combinar eficiencia con criterio disciplinar.","sm":""},{"id":441,"day":"Jue","s":765,"e":810,"b":"h-close","t":"OLC Accelerate 2026 Closing Celebration","te":"Celebración de cierre de OLC Accelerate 2026","sh":"Closing Celebration","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Southern Hemisphere Foyer","p":"","po":"","d":"Close out your OLC Acclerate  experience with light food, fun beverages, and good company and music. Join us in celebrating another great OLC conference and in our excitement for what's next! Help keep the momentum going into 2027!","de":"Cerrá tu experiencia en OLC Accelerate con comida liviana, bebidas, buena compañía y música. Celebremos juntos otra gran conferencia de OLC y lo que viene. ¡Sigamos con el impulso hacia 2027!","sm":""}]</script>

 var mine=S.who&&!x.sm&&pickOf(S.who,x.b)===x.id;
 var h='<article class="sess'+(mine?" mine":"")+'" id="s'+x.id+'" style="'+tvar(x.tr)+'"><button class="head" type="button" aria-expanded="'+open+'" data-toggle="'+x.id+'"><div class="t">'+esc(title(x))+'</div>'+(S.lang==="es"?'<div class="o">'+esc(x.t)+'</div>':"")+
  '<div class="meta tnum"><span>'+esc(stime(x))+'</span><span>'+esc(S.lang==="es"?x.tye:x.ty)+'</span>'+(/Immersion|Leadership Network/.test(x.to)?'<span class="pill paid">'+esc(u.paid)+'</span>':"")+'</div>'+
  (goers.length?'<div class="goers">'+goers.map(function(p){return '<span class="mini" style="'+cvar(p.k)+'"><span class="dot"></span>'+esc(p.n)+'</span>'}).join("")+'</div>':"")+'</button>';
 if(open){
  h+='<div class="body"><dl class="kv">'+(x.loc?'<dt>'+esc(u.loc)+'</dt><dd>'+esc(x.loc)+'</dd>':"")+(x.tr?'<dt>'+esc(u.track)+'</dt><dd>'+esc(S.lang==="es"?x.tre:x.tr)+'</dd>':"")+'<dt>'+esc(u.type)+'</dt><dd>'+esc(x.to)+'</dd>'+(x.p?'<dt>'+esc(u.pres)+'</dt><dd>'+esc(x.p)+(x.po?' · <span class="muted">'+esc(x.po)+'</span>':"")+'</dd>':"")+'</dl><p class="sum">'+esc(S.lang==="es"?x.de:x.d)+'</p>';
  h+=actionBtns(x)+'</div>';
 }
 return h+'</article>';
}
function actionBtns(x){
 var u=L();
 if(x.sm)return "";
 var selectable=BLOCKS[x.b]&&BLOCKS[x.b].sel;
 if(!selectable)return "";
 if(S.readonly)return '<p class="muted" style="font-size:13px;margin:6px 0 0">'+esc(u.roShort)+'</p>';
 if(!S.who)return '<p class="muted" style="font-size:13px;margin:6px 0 0">'+esc(u.setWho)+'</p>';
 var dis=S.busy||S.readonly?" disabled":"";
 if(x.sm)return "";
 var mine=pickOf(S.who,x.b)===x.id;
 return '<div class="btns">'+(mine?'<span class="pill">'+esc(u.chosen)+'</span><button class="btn" type="button" data-remove="'+x.b+'"'+dis+'>'+esc(u.remove)+'</button>':'<button class="btn primary" type="button" data-choose="'+x.id+'"'+dis+'>'+esc(u.choose)+'</button>')+'</div>';
}

/* ---------- people ---------- */
function personRow(pk,r,D){
 var u=L(),t=r[S.lang],p=PBY[pk];
 function row(cls,style,when,body){return '<div class="prow'+cls+'" style="'+style+'"><div class="blk tnum">'+when+'</div><div style="min-width:0">'+body+'</div></div>'}
 if(r.k==="block"){
  var b=r.b,id=pickOf(pk,b),prev=PREV[b],pv=prev?pickOf(pk,prev):null,cont=pv!=null&&BYID[pv]&&BYID[pv].e>BSTART[b],inner;
  if(id!=null&&BYID[id]){var x=BYID[id];
   var op=!!S.open["p"+x.id];
   inner=(cont?'<div class="flag" style="font-size:13px;margin-bottom:4px">⚠ '+esc(u.conflict)+'</div>':"")+'<button type="button" class="ttl" aria-expanded="'+op+'" data-ptoggle="'+x.id+'">'+esc(title(x))+' <span class="muted" aria-hidden="true">'+(op?"▴":"▾")+'</span></button>'+(S.lang==="es"?'<div class="note">'+esc(x.t)+'</div>':"")+'<div class="note tnum">'+esc(stime(x))+' · '+esc(S.lang==="es"?x.tye:x.ty)+(x.loc?' · '+esc(x.loc):"")+'</div>'+(x.p?'<div class="note">'+esc(x.p)+'</div>':"")+
   (op?'<div class="pdet">'+(x.po?'<div class="note">'+esc(x.po)+'</div>':"")+(x.tr?'<div class="note"><b>'+esc(u.track)+':</b> '+esc(S.lang==="es"?x.tre:x.tr)+'</div>':"")+'<p class="sum" style="margin:8px 0 0">'+esc(S.lang==="es"?x.de:x.d)+'</p></div>':"");}
  else if(cont)inner='<div class="muted"><i>↳ '+esc(u.cont)+'</i> · '+esc(BYID[pv].sh)+'</div>';
  else inner='<div class="muted">'+esc(pk==="itati"?u.pending:u.nochoice)+'</div>';
  return row("",cvar(pk),esc(t.w),(t.n?'<div class="note" style="margin:0 0 6px">'+esc(t.n)+'</div>':"")+inner+'<div class="btns"><button class="btn" type="button" data-see="'+b+'">'+esc(u.seeAll)+'</button></div>');
 }
 if(r.k==="summits"){
  var sm=STATE.summits[pk];
  return row("",cvar(pk),esc(t.w),'<div class="what">'+esc(sm?SUMMITS[sm][S.lang]:(pk==="itati"?u.pending:u.nochoice))+'</div>'+(sm?'<div style="margin-top:6px">'+summitLines(sm)+'</div>':""));
 }
 if(r.arr||r.dep){
  return row(" travel",cvar(pk),esc(r.arr?u.arrival:u.departure),'<div class="what tnum">'+esc(r.arr?p.land[S.lang]:p.leave[S.lang])+'</div>');
 }
 return row(" "+r.k,"",esc(t.w)+(together(r)?'<div class="badge" style="margin-top:2px">'+esc(u.group)+'</div>':""),'<div class="what">'+esc(t.t)+'</div>'+(t.n?'<div class="note">'+esc(t.n)+'</div>':""));
}
function renderPeople(){
 var u=L(),pk=PBY[S.person]?S.person:(S.who||"constanza"),p=PBY[pk];
 var tabs='<div class="ptabs">'+PEOPLE.map(function(q){return '<button type="button" style="'+cvar(q.k)+'" aria-pressed="'+(q.k===pk)+'" data-person="'+q.k+'"><span class="dot"></span>'+esc(q.n)+'</button>'}).join("")+'</div>';
 var sm=STATE.summits[pk];
 var head='<div class="phead" style="'+cvar(pk)+'"><div><h2>'+esc(p.n)+'</h2><div class="muted">'+esc(p.c)+'</div></div><div class="pinfo tnum"><div><div class="eyebrow">'+esc(u.land)+'</div>'+esc(p.land[S.lang])+'</div><div><div class="eyebrow">'+esc(u.leaves)+'</div>'+esc(p.leave[S.lang])+'</div><div><div class="eyebrow">'+esc(u.summit)+'</div>'+esc(sm?SUMMITS[sm][S.lang]:(pk==="itati"?u.pending:u.nochoice))+'</div></div></div>';
 var days=DAYS.map(function(D){return '<section class="pday"><h3>'+esc(D[S.lang])+'</h3><div class="plist">'+WEEK[D.k].map(function(r){return personRow(pk,r,D)}).join("")+'</div></section>'}).join("");
 var upd=STATE.log.filter(function(l){return l.p===pk}).slice(-1)[0];
 var foot=upd?'<p class="muted tnum" style="font-size:13px">'+esc(u.updated)+': '+esc(new Date(upd.at).toLocaleString(S.lang==="es"?"es-AR":"en-US",{dateStyle:"medium",timeStyle:"short"}))+'</p>':"";
 return tabs+head+days+foot;
}

/* ---------- agenda ---------- */
function renderAgenda(){
 var u=L();
 var types={};A.forEach(function(x){types[x.ty]=S.lang==="es"?x.tye:x.ty});
 var f='<div class="filters"><select id="fTrack" aria-label="'+esc(u.track)+'"><option value="">'+esc(u.allTracks)+'</option>'+TRACKS.filter(function(t){return t.k}).map(function(t){return '<option value="'+esc(t.k)+'"'+(S.track===t.k?" selected":"")+'>'+esc(tname(t))+'</option>'}).join("")+'</select>'+
  '<select id="fType" aria-label="'+esc(u.type)+'"><option value="">'+esc(u.allTypes)+'</option>'+Object.keys(types).sort().map(function(k){return '<option value="'+esc(k)+'"'+(S.type===k?" selected":"")+'>'+esc(types[k])+'</option>'}).join("")+'</select>'+
  '<input id="fQ" type="search" placeholder="'+esc(u.search)+'" value="'+esc(S.q)+'">'+
  (S.focus?'<span class="focus">'+esc(u.showing)+': '+esc(BLOCKS[S.focus][S.lang])+'<button type="button" data-clearfocus="1" aria-label="'+esc(u.clear)+'">×</button></span>':"")+'</div>';
 var keys='<div class="tkeys">'+TRACKS.map(function(t){return '<span style="'+tvar(t.k)+'"><i></i>'+esc(tname(t))+'</span>'}).join("")+'</div>';
 var days='<div class="daybar">'+DAYS.map(function(D){return '<button type="button" data-day="'+D.k+'" aria-pressed="'+(S.day===D.k)+'">'+esc(D[S.lang])+'</button>'}).join("")+'</div>';
 var q=S.q.trim().toLowerCase();
 var list=A.filter(function(x){
  if(x.sm)return false;
  if(S.focus){if(x.b!==S.focus)return false}else if(x.day!==S.day)return false;
  if(S.track&&x.tr!==S.track)return false; if(S.type&&x.ty!==S.type)return false;
  if(q&&(x.t+" "+x.te+" "+x.p+" "+x.po).toLowerCase().indexOf(q)<0)return false;
  return true});
 var groups={};list.forEach(function(x){(groups[x.b]=groups[x.b]||[]).push(x)});
 var body=BORDER.filter(function(b){return groups[b]}).map(function(b){
  var byT={};groups[b].forEach(function(x){(byT[x.tr]=byT[x.tr]||[]).push(x)});
  var inner=TRACKS.filter(function(t){return byT[t.k]}).map(function(t){
   return '<div class="trk" style="'+tvar(t.k)+'"><h4>'+esc(tname(t))+' <span class="muted">'+byT[t.k].length+'</span></h4><div class="sessions">'+byT[t.k].map(sessionCard).join("")+'</div></div>';
  }).join("");
  return '<section class="bgroup"><h3>'+esc(BLOCKS[b][S.lang])+'<span class="muted">'+groups[b].length+'</span></h3>'+inner+'</section>';
 }).join("");
 return f+keys+(S.focus?"":days)+(body||'<div class="empty">'+esc(u.noRes)+'</div>');
}
function renderNet(){var u=L();return '<div class="empty net" style="margin:0 auto"><h2 style="margin-bottom:8px;color:var(--ink)">'+esc(u.netT)+'</h2><p>'+esc(u.netB)+'</p></div>'}

function render(){
 renderChrome();
 if(!STATE)return;
 document.getElementById("main").innerHTML=S.tab==="people"?renderPeople():S.tab==="agenda"?renderAgenda():S.tab==="networking"?renderNet():renderWeek();
}

/* ---------- saving ---------- */
function save(mut,entry){
 if(S.readonly)return;
 var next=JSON.parse(JSON.stringify(STATE));mut(next);
 entry.at=new Date().toISOString();entry.by=S.who;next.log.push(entry);next.log=next.log.slice(-60);
 STATE=next;DIRTY++;ls("olc.draft",JSON.stringify({d:DIRTY,s:STATE}));
 var ex=entry.to!=null&&BYID[entry.to]&&!BYID[entry.to].sm?BYID[entry.to]:null;
 toast(ex&&overlaps(entry.p,ex)?L().overlapSaved:L().savedLocal);render();
}
function download(){
 if(!SRC){toast(L().err);return}
 var html=SRC.replace(/(<script id="picks-data" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+JSON.stringify(STATE).replace(/<\//g,"<\\/")+b});
 var url=URL.createObjectURL(new Blob([html],{type:"text/html"}));var a=document.createElement("a");a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000);
}
function overlaps(pk,x){var ps=(STATE.picks[pk]||{});return Object.keys(ps).some(function(b){var y=BYID[ps[b]];return y&&y.id!==x.id&&y.day===x.day&&y.b!==x.b&&y.s<x.e&&x.s<y.e})}
function choose(id){var x=BYID[id];save(function(n){n.picks[S.who]=n.picks[S.who]||{};n.picks[S.who][x.b]=x.id},{p:S.who,b:x.b,to:x.id})}
function removePick(b){save(function(n){if(n.picks[S.who])delete n.picks[S.who][b]},{p:S.who,b:b,to:null})}
function pickSummit(sm){save(function(n){n.summits[S.who]=sm},{p:S.who,b:"t-am",to:sm})}

/* ---------- routing & events ---------- */
function route(){
 var h=(location.hash||"").replace("#","");
 if(h.indexOf("people-")===0){S.tab="people";S.person=h.slice(7)}
 else if(["week","people","agenda","networking"].indexOf(h)>=0)S.tab=h; else S.tab="week";
 render();window.scrollTo(0,0);
}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("button");if(!t)return;
 if(t.id==="langEn"||t.id==="langEs"){S.lang=t.id==="langEn"?"en":"es";ls("olc.lang",S.lang);render();return}
 if(t.dataset.copy){var a=L().addr;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(a).then(function(){toast(L().copied)},function(){var r=document.createRange();r.selectNodeContents(document.getElementById("addr"));var s=getSelection();s.removeAllRanges();s.addRange(r)})}return}
 if(t.dataset.goPerson){location.hash="people-"+t.dataset.goPerson;return}
 if(t.dataset.person){location.hash="people-"+t.dataset.person;return}
 if(t.dataset.goSession){var x=BYID[t.dataset.goSession];S.focus=x.b;S.open={};S.open[x.id]=1;S.track="";S.type="";S.q="";if(location.hash==="#agenda")render();else location.hash="agenda";setTimeout(function(){var el=document.getElementById("s"+x.id);if(el)el.scrollIntoView({block:"center"})},40);return}
 if(t.dataset.see){S.focus=t.dataset.see;S.track="";S.type="";S.q="";location.hash="agenda";return}
 if(t.dataset.clearfocus){var d=BLOCKS[S.focus].d;S.focus="";S.day=d;render();return}
 if(t.dataset.day){S.day=t.dataset.day;render();return}
 if(t.dataset.stoggle){var k2="s"+t.dataset.stoggle;if(S.open[k2])delete S.open[k2];else S.open[k2]=1;render();var e2=document.querySelector('[data-stoggle="'+t.dataset.stoggle+'"]');if(e2)e2.focus();return}
 if(t.dataset.dl){download();return}
 if(t.dataset.discard){DIRTY=0;ls("olc.draft","");STATE=JSON.parse(document.getElementById("picks-data").textContent);STATE.log=STATE.log||[];toast(L().discardQ);render();return}
 if(t.dataset.ptoggle){var k="p"+t.dataset.ptoggle;if(S.open[k])delete S.open[k];else S.open[k]=1;render();var el=document.querySelector('[data-ptoggle="'+t.dataset.ptoggle+'"]');if(el)el.focus();return}
 if(t.dataset.toggle){var k=t.dataset.toggle;if(S.open[k])delete S.open[k];else S.open[k]=1;render();var el=document.querySelector('[data-toggle="'+k+'"]');if(el)el.focus();return}
 if(t.dataset.choose){choose(+t.dataset.choose);return}
 if(t.dataset.remove){removePick(t.dataset.remove);return}
 if(t.dataset.summit){pickSummit(t.dataset.summit);return}
});
document.addEventListener("change",function(ev){
 var t=ev.target;
 if(t.id==="whoSel"){S.who=t.value;ls("olc.who",S.who);if(S.tab==="people"&&S.who)S.person=S.who;render()}
 if(t.id==="fTrack"){S.track=t.value;render()}
 if(t.id==="fType"){S.type=t.value;render()}
});
document.addEventListener("input",function(ev){if(ev.target.id==="fQ"){S.q=ev.target.value;var pos=ev.target.selectionStart;render();var f=document.getElementById("fQ");if(f){f.focus();try{f.setSelectionRange(pos,pos)}catch(e){}}}});
window.addEventListener("hashchange",route);

renderChrome();
A=JSON.parse(document.getElementById("agenda-data").textContent);A.forEach(function(x){BYID[x.id]=x});
STATE=JSON.parse(document.getElementById("picks-data").textContent);STATE.log=STATE.log||[];
/* edit mode: open the page with ?edit (Lucila only). Changes live on this device until the updated file is uploaded. */
if(EDIT){S.readonly=false;
 try{var dr=JSON.parse(ls("olc.draft")||"null");if(dr&&dr.d){STATE=dr.s;DIRTY=dr.d}}catch(e){}
 fetch(location.href.split("#")[0],{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){SRC=t},function(){});
}
route();
})();
</script>
</body>
</html>
