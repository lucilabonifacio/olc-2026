<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ambassadors in Orlando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: a conference-week planner — badge-like header, day columns that stack on phones, color-coded people chips, track-banded agenda. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6478; --line:#DCE1EB; --soft:#EBEEF5;
  --accent:#1D3FBF; --accent-ink:#FFFFFF;
  --group:#FFF3C4; --group-line:#E9C949; --aiez:#E4F1FF; --aiez-line:#8CB8EA; --travel:#EEF0F4; --meal:#FCE9DE; --meal-line:#E3A57E;
  --warn:#B42318; --warn-bg:#FDECEA; --ok:#1E7B3A; --ok-bg:#E3F4E6;
  --p-constanza:#0E8A8C; --p-kevin:#C9480E; --p-rachel:#6A45E0; --p-roberto:#1A72C8; --p-itati:#BE2A63; --p-lucila:#2B8A3E;
  --k-ide:#3E5BA9; --k-lse:#B07A12; --k-lps:#8A4E8C; --k-pdq:#3F7F73; --k-ce:#B4533A; --k-none:#8892A6;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151C2D; --ink:#E7EBF5; --muted:#9AA4BA; --line:#283149; --soft:#1C2438;
  --accent:#8FA8FF; --accent-ink:#0D1220;
  --group:#332B10; --group-line:#8C7420; --aiez:#10263B; --aiez-line:#2F5F8C; --travel:#1A2133; --meal:#35200F; --meal-line:#93603A;
  --warn:#FF8A80; --warn-bg:#3A1714; --ok:#7BD88F; --ok-bg:#16301D;
  --p-constanza:#3CC9C3; --p-kevin:#FF8F57; --p-rachel:#A893FF; --p-roberto:#5EA8F5; --p-itati:#F27BAA; --p-lucila:#6CD67F;
  --k-ide:#8EA6F0; --k-lse:#E3B44F; --k-lps:#CE95D0; --k-pdq:#79C4B5; --k-ce:#EE9478; --k-none:#9AA4BA;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2D; --ink:#E7EBF5; --muted:#9AA4BA; --line:#283149; --soft:#1C2438;
  --accent:#8FA8FF; --accent-ink:#0D1220;
  --group:#332B10; --group-line:#8C7420; --aiez:#10263B; --aiez-line:#2F5F8C; --travel:#1A2133; --meal:#35200F; --meal-line:#93603A;
  --warn:#FF8A80; --warn-bg:#3A1714; --ok:#7BD88F; --ok-bg:#16301D;
  --p-constanza:#3CC9C3; --p-kevin:#FF8F57; --p-rachel:#A893FF; --p-roberto:#5EA8F5; --p-itati:#F27BAA; --p-lucila:#6CD67F;
  --k-ide:#8EA6F0; --k-lse:#E3B44F; --k-lps:#CE95D0; --k-pdq:#79C4B5; --k-ce:#EE9478; --k-none:#9AA4BA;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.top .dateline{margin:4px 0 0;font-family:var(--display);font-size:18px;font-weight:500}
.top .lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.who{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;color:var(--ink)}
nav.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--aiez);color:var(--ink);border:1px solid var(--aiez-line)}

/* week */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.fact .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.legend .tag{font-size:12px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.kinds{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.kinds span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;border:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1020px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.days{grid-template-columns:minmax(0,1fr)}}
.day{display:flex;flex-direction:column;gap:8px;min-width:0}
.dayhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:6px 0;border-bottom:2px solid var(--ink)}
.dayhead h2{font-size:19px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;min-width:0}
.slot.group{background:var(--group);border-color:var(--group-line)}
.slot.aiez{background:var(--aiez);border-color:var(--aiez-line)}
.slot.travel{background:var(--travel)}
.slot.meal{background:var(--meal);border-color:var(--meal-line)}
.when{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.what{font-weight:700;margin-top:2px}
.note{font-size:13px;color:var(--muted);margin-top:3px}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.chips{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.chip{display:flex;gap:7px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:4px 6px;border-radius:7px;cursor:pointer;width:100%;font-size:13px;line-height:1.3;border-left:4px solid var(--c)}
.chip:hover{background:var(--soft)}
.chip .nm{font-weight:700;color:var(--c);min-width:62px;flex:none}
.chip .ti{min-width:0;overflow-wrap:anywhere}
.chip.cont .ti{color:var(--muted);font-style:italic}
.chip.none .ti{color:var(--muted)}
.flag{color:var(--warn);font-weight:700}
.people{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:13px}
.people div{display:flex;gap:8px;align-items:baseline}
.people b{color:var(--c);min-width:70px}
.summit{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.summit:first-of-type{border-top:0;padding-top:0}
.summit .sname{font-weight:700;font-size:14px}
.summit .who-list{display:flex;flex-wrap:wrap;gap:4px 8px;margin:3px 0 5px}
.summit .who-list button{border:0;background:transparent;padding:0;cursor:pointer}
.sline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13px;line-height:1.3;text-align:left;border:0;background:transparent;padding:3px 4px;border-radius:6px;width:100%;cursor:pointer}
.sline:hover{background:var(--soft)}
.sline.brk{cursor:default;color:var(--muted);font-style:italic}
.sline.brk:hover{background:transparent}
.sline .tm{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px;padding-top:1px}

/* people */
.ptabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;display:inline-flex;gap:7px;align-items:center}
.ptabs button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.phead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.phead h2{color:var(--c);font-size:26px}
.pinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;flex:1 1 420px}
.pinfo>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:14px}
.pday{margin-bottom:18px}
.pday>h3{font-size:18px;padding:6px 0;border-bottom:2px solid var(--ink);margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:12px}
.prow.group{background:var(--group);border-color:var(--group-line);border-left-color:var(--group-line)}
.prow.aiez{background:var(--aiez);border-color:var(--aiez-line);border-left-color:var(--aiez-line)}
.prow.meal{background:var(--meal);border-color:var(--meal-line);border-left-color:var(--meal-line)}
.prow.travel{background:var(--travel)}
.prow .ttl{font-weight:700;line-height:1.3;text-align:left;border:0;background:transparent;padding:0;cursor:pointer;color:var(--ink)}
.prow .ttl:hover{text-decoration:underline}
.sdet{margin:2px 0 8px;padding:8px 10px;border-left:3px solid var(--line);font-size:13.5px}
.pdet{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr)}}
.prow .blk{font-weight:700;font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}

/* agenda */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;color:var(--ink);max-width:100%;min-width:0}
.filters input{flex:1 1 180px}
.daybar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.daybar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700}
.daybar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.focus{display:inline-flex;gap:8px;align-items:center;background:var(--aiez);border:1px solid var(--aiez-line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:700}
.focus button{border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;padding:0 6px}
.tkeys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:-2px 0 12px}
.tkeys span{display:inline-flex;align-items:center;gap:6px}
.tkeys i{width:12px;height:12px;border-radius:3px;background:var(--t)}
.bgroup{margin-bottom:22px}
.bgroup>h3{font-size:18px;padding:8px 0;border-bottom:2px solid var(--ink);margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bgroup>h3 .muted{font-family:var(--body);font-weight:400;font-size:13px}
.trk{margin-bottom:12px}
.trk>h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--t);display:flex;align-items:center;gap:8px}
.trk>h4::before{content:"";width:22px;height:4px;border-radius:2px;background:var(--t)}
.trk>h4 .muted{text-transform:none;letter-spacing:0;font-weight:400}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;align-items:start}
@media (max-width:640px){.sessions{grid-template-columns:minmax(0,1fr)}}
.sess{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--t,var(--line));border-radius:var(--r);min-width:0}
.sess.mine{border-color:var(--accent);border-left-color:var(--t,var(--accent));box-shadow:inset 0 0 0 1px var(--accent)}
.sess>button.head{display:block;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px;cursor:pointer}
.sess .t{font-weight:700;line-height:1.3}
.sess .o{font-size:12.5px;color:var(--muted);margin-top:2px}
.sess .meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sess .goers{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--c)}
.sess .body{padding:0 12px 12px;border-top:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13.5px;margin:10px 0}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;overflow-wrap:anywhere}
.sum{font-size:14.5px;max-width:68ch}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.paid{background:var(--warn-bg);color:var(--warn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.net{max-width:68ch}
.loading{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script id="agenda-data" type="application/json">[{"id":0,"day":"Lun","s":480,"e":1020,"b":"m-all","t":"The Sanctuary","te":"The Sanctuary (sala de descanso)","sh":"The Sanctuary (quiet room)","ty":"General","tye":"General","to":"Other","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"","po":"","d":"Our Sanctuary room is a quiet, reflective space available for all conference attendees to use. This is a quiet space room where disturbances should be kept to a minimum to allow conference attendees to rest and recharge. The Sanctuary room is open during regular conference hours. During the conference, join us for some quiet time to decompress, reconnect mind and body, and practice some self-care as we turn our focus inward for a short while. Mindfulness has been defined as a practice of “bringing one’s attention to the internal and external experiences occurring in the present moment” (Baer, 2003). Join us in the Sanctuary today for some special mindfulness sessions (see the engagement schedule), or just to relax and decompress a bit throughout the day.","de":"Espacio tranquilo y de reflexión abierto durante el horario de la conferencia para descansar, recargar energía y participar de sesiones de mindfulness.","sm":""},{"id":1,"day":"Lun","s":510,"e":525,"b":"m-am","t":"Leadership Network Symposium Welcome","te":"Bienvenida al Leadership Network Symposium","sh":"Leadership Network Symposium Welcome","ty":"Leadership Network Symposium","tye":"Leadership Network Symposium","to":"Leadership Network Symposium Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Dylan Barth, Ph.D.","po":"VP of Innovation and Programs, Online Learning Consortium","d":"The Leadership Network Symposium will kick off with a warm welcome from OLC’s VP of Innovation and Programs followed by remarks from the LNS sponsors. Then, a short warm-up activity will set the tone for a highly-interactive day.","de":"El Leadership Network Symposium arranca con una bienvenida del VP de Innovación y Programas de OLC y palabras de los sponsors del LNS. Luego, una breve actividad de calentamiento marca el tono de una jornada muy interactiva.","sm":""},{"id":2,"day":"Lun","s":525,"e":660,"b":"m-am","t":"AI for Leaders: A Best-Practice Exchange","te":"IA para líderes: intercambio de buenas prácticas","sh":"AI for Leaders: Best-Practice Exchange","ty":"Leadership Network Symposium","tye":"Leadership Network Symposium","to":"Leadership Network Symposium Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Alex Goryachev","po":"Goryachev, Independent Consultant","d":"\"AI for Leaders\" is a structured best-practice exchange where participants pool what works today and focus on where there is an immediate opportunity to use AI to achieve results, delivering on the promise of doing things cheaper, faster, and better. We break into three workstreams, one for each of those goals, and trade the practical, here-and-now applications that are already producing results. Running underneath the practical exchange is a deeper question: what this moment requires of us as leaders. As AI reshapes how our institutions work, leadership itself is changing, and our task is to guide our people through uncertainty and continuous change. Participants will have a common opportunity to build, and leave with, a single shared playbook they can put to use the moment they're back on campus.","de":"\"AI for Leaders\" es un intercambio estructurado de buenas prácticas en el que los participantes ponen en común lo que hoy funciona y se enfocan en las oportunidades inmediatas de usar IA para lograr resultados: hacer las cosas más baratas, más rápidas y mejor. Se trabaja en tres líneas, una por cada objetivo, intercambiando aplicaciones prácticas que ya están dando resultados. Detrás de ese intercambio hay una pregunta más profunda: qué exige este momento de nosotros como líderes. A medida que la IA transforma cómo funcionan las instituciones, el liderazgo también cambia, y la tarea es guiar a los equipos en la incertidumbre y el cambio continuo. Los participantes construirán juntos, y se llevarán, un playbook compartido para aplicar apenas vuelvan a su institución.","sm":""},{"id":3,"day":"Lun","s":540,"e":720,"b":"m-am","t":"Five Months Left: Moving from Accessibility Compliance to an Inclusive Culture in Digital Higher Education","te":"Quedan cinco meses: del cumplimiento normativo en accesibilidad a una cultura inclusiva en la educación superior digital","sh":"From Accessibility Compliance to Inclusive Culture","ty":"Immersion class (paid)","tye":"Immersion class (pago)","to":"Immersion Class (Pre-conference Workshop)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Asia 3","p":"Renee Ford","po":"Senior Instructional Designer, The Pennsylvania State University","d":"Higher education institutions got an extra year, and now just five months remain. Is your institution ready? This immersive workshop moves from regulatory requirements to lasting culture change, equipping educators and instructional designers with tools, checklists, and strategies to close compliance gaps and build accessibility culture that outlasts any deadline.","de":"Las instituciones de educación superior tuvieron un año más de plazo y ahora quedan solo cinco meses. ¿Tu institución está lista? Este taller inmersivo va de los requisitos regulatorios a un cambio cultural duradero, con herramientas, checklists y estrategias para que docentes y diseñadores instruccionales cierren brechas de cumplimiento y construyan una cultura de accesibilidad que trascienda cualquier fecha límite.","sm":""},{"id":4,"day":"Lun","s":540,"e":720,"b":"m-am","t":"From Prompt to Practice: Building AI-Supported Case-Based Learning Experiences","te":"Del prompt a la práctica: experiencias de aprendizaje basadas en casos con apoyo de IA","sh":"AI-Supported Case-Based Learning","ty":"Immersion class (paid)","tye":"Immersion class (pago)","to":"Immersion Class (Pre-conference Workshop)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Vanessa Dennen","po":"Tyner Distinguished Professor of Education, Florida State University","d":"How does generative AI support new possibilities for case-based learning? In this hands-on workshop, we will design, try, and revise AI-supported cases in real time. Together, we will explore prompts, lessons, and strategies that support ethical, reflective, and collaborative student learning across disciplines and contexts.","de":"¿Qué nuevas posibilidades abre la IA generativa para el aprendizaje basado en casos? En este taller práctico se diseñan, prueban y revisan casos con apoyo de IA en tiempo real. Juntos exploraremos prompts, clases y estrategias que favorecen un aprendizaje ético, reflexivo y colaborativo en distintas disciplinas y contextos.","sm":""},{"id":5,"day":"Lun","s":660,"e":720,"b":"m-am","t":"Leadership Lightning Showcase: What's Working Now","te":"Lightning Showcase de liderazgo: lo que funciona hoy","sh":"Leadership Lightning Showcase","ty":"Leadership Network Symposium","tye":"Leadership Network Symposium","to":"Leadership Network Symposium Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Dylan Barth, Ph.D. - moderator","po":"VP of Innovation and Programs, Online Learning Consortium","d":"In a series of brief lightning talks, leaders will share initiatives that have made a measurable impact at their institutions, from AI implementation and student success strategies to organizational change and team development. Each presentation will be followed by a few minutes of audience questions and discussion.","de":"En una serie de charlas relámpago, líderes comparten iniciativas que tuvieron un impacto medible en sus instituciones: implementación de IA, estrategias de éxito estudiantil, cambio organizacional y desarrollo de equipos. Cada presentación incluye unos minutos de preguntas y conversación con el público.","sm":""},{"id":6,"day":"Lun","s":780,"e":960,"b":"m-pm","t":"Discussion Boards That Don't Suck 2.0","te":"Foros de discusión que no aburran 2.0","sh":"Discussion Boards That Don't Suck 2.0","ty":"Immersion class (paid)","tye":"Immersion class (pago)","to":"Immersion Class (Pre-conference Workshop)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 3","p":"Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Tired of discussion boards that feel repetitive, forced, or transactional? This interactive workshop returns with new examples and stronger design tools. Participants will examine why discussions fail, explore practical alternatives, and redesign an activity for their own course. Move beyond “post once, reply twice” and create spaces for meaningful learning.","de":"¿Cansado de foros de discusión repetitivos, forzados o transaccionales? Este taller interactivo vuelve con nuevos ejemplos y mejores herramientas de diseño. Los participantes analizan por qué fallan las discusiones, exploran alternativas prácticas y rediseñan una actividad de su propio curso. Más allá de \"publicá una vez, respondé dos\": espacios para un aprendizaje significativo.","sm":""},{"id":7,"day":"Lun","s":780,"e":960,"b":"m-pm","t":"Working in Uncertainty: Learning from AI Experimentation in Online Education","te":"Trabajar en la incertidumbre: aprender de la experimentación con IA en educación online","sh":"Learning from AI Experimentation","ty":"Immersion class (paid)","tye":"Immersion class (pago)","to":"Immersion Class (Pre-conference Workshop)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 4","p":"Nathan Pritts, Ph.D.","po":"Principal AI Strategist, University of Arizona Global Campus","d":"AI experimentation is everywhere, but scattered activity is not strategy. This hands-on immersion session helps participants move from reactive AI efforts to intentional institutional learning. Through examples, guided reflection, and practical planning, participants will design a campus-ready learning loop for one real AI-related challenge in their own context.","de":"La experimentación con IA está en todas partes, pero la actividad dispersa no es estrategia. Esta sesión inmersiva y práctica ayuda a pasar de esfuerzos reactivos con IA a un aprendizaje institucional intencional. A partir de ejemplos, reflexión guiada y planificación práctica, los participantes diseñan un ciclo de aprendizaje listo para su institución sobre un desafío real vinculado a la IA en su propio contexto.","sm":""},{"id":8,"day":"Lun","s":795,"e":870,"b":"m-pm","t":"The Secret to Growing as a Digital Learning Leader","te":"El secreto para crecer como líder en aprendizaje digital","sh":"Growing as a Digital Learning Leader","ty":"Leadership Network Symposium","tye":"Leadership Network Symposium","to":"Leadership Network Symposium Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere V","p":"Garvey Pyke","po":"Executive Director, Center for Teaching and Learning, University of North Carolina at Charlotte","d":"Leadership growth happens as we move consequential ideas through complex organizations. In this interactive session, professionals whose leadership in digital learning is expanding will examine real challenges, engage with candid provocations, and work with peers to identify barriers and next steps—leaving with greater clarity and colleagues to call on.","de":"El liderazgo crece cuando impulsamos ideas relevantes dentro de organizaciones complejas. En esta sesión interactiva, profesionales cuyo liderazgo en aprendizaje digital se está ampliando analizan desafíos reales, discuten provocaciones francas y trabajan con pares para identificar obstáculos y próximos pasos, y se van con más claridad y colegas a quienes recurrir.","sm":""},{"id":9,"day":"Lun","s":795,"e":870,"b":"m-pm","t":"When Strategy Becomes Change: Leading Digital Learning Across Resources, Risk, and Relevance","te":"Cuando la estrategia se vuelve cambio: liderar el aprendizaje digital entre recursos, riesgos y relevancia","sh":"Leading Digital Learning Change","ty":"Leadership Network Symposium","tye":"Leadership Network Symposium","to":"Leadership Network Symposium Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere IV","p":"Dr. Thomas Cavanagh","po":"Vice Provost for Digital Learning, University of Central Florida","d":"Digital learning leaders are increasingly asked to translate institutional strategy into meaningful change. This roundtable explores how leaders align resources, manage risk, build coalitions, and advance institutional relevance amid shifting learner needs, emerging technologies, and constrained budgets.","de":"A los líderes de aprendizaje digital se les pide cada vez más que traduzcan la estrategia institucional en cambios concretos. Esta mesa redonda explora cómo alinean recursos, gestionan riesgos, construyen alianzas y sostienen la relevancia institucional ante necesidades cambiantes de los estudiantes, tecnologías emergentes y presupuestos ajustados.","sm":""},{"id":10,"day":"Lun","s":885,"e":945,"b":"m-pm","t":"Burning Questions Marketplace","te":"Mercado de preguntas candentes","sh":"Burning Questions Marketplace","ty":"Leadership Network Symposium","tye":"Leadership Network Symposium","to":"Leadership Network Symposium Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Sherri Restauri","po":"Director of Professional Learning, Online Learning Consortium","d":"In this highly interactive session, LNS attendees will discuss the challenges, opportunities, and uncertainties they face through a series of facilitated, small-group conversations. You’ll choose the questions most relevant to you and exchange perspectives with other attendees. Expect to leave the session with greater clarity around issues vexing you most.","de":"En esta sesión muy interactiva, los asistentes del LNS conversan sobre los desafíos, oportunidades e incertidumbres que enfrentan, en una serie de conversaciones facilitadas en grupos chicos. Cada uno elige las preguntas más relevantes para sí e intercambia perspectivas con otros asistentes, para salir con más claridad sobre los temas que más le preocupan.","sm":""},{"id":11,"day":"Lun","s":900,"e":1080,"b":"m-1500","t":"Early Registration","te":"Acreditación anticipada","sh":"Early Registration","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Convention Foyer","p":"","po":"","d":"Don't wait in line Tuesday morning and miss portions of our AI, HBCU, K-12, and Instructional Design Summits, First Time Attendee Welcome and Orientation, or the activities in our AI Exploration Zone and Engagement Hub, both located in the exhibit hall. Check-in at conference registration Monday evening from 3-6pm US Eastern Time Zone to pick up your conference badge and materials.  Following registration check-in, join us at the Exhibit Hall Preview for refreshments, games, and networking.","de":"Evitá la fila del martes a la mañana y no te pierdas parte de los Summits de IA, HBCU, K-12 y Diseño Instruccional, la bienvenida y orientación para quienes asisten por primera vez, ni las actividades de la AI Exploration Zone y el Engagement Hub, ambos en el salón de exposiciones. Acreditate el lunes de 3 a 6 pm (hora del Este de EE. UU.) para retirar tu credencial y materiales. Después, sumate al Exhibit Hall Preview, con refrigerios, juegos y networking.","sm":""},{"id":12,"day":"Lun","s":900,"e":1080,"b":"m-1500","t":"Early Registration Field Guide Welcome Station","te":"Punto de bienvenida de los Field Guides (acreditación anticipada)","sh":"Early Registration Field Guide Welcome Station","ty":"General","tye":"General","to":"Other","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Convention Foyer - Field Guide Station","p":"","po":"","d":"Welcome! The OLC Accelerate Field Guides are here to help you get oriented, learn how to navigate the mobile app, and find the best conference activities and groups for you. Stop by the Field Guide station near the registration desk for assistance.","de":"¡Bienvenidos! Los Field Guides de OLC Accelerate te ayudan a orientarte, a usar la app de la conferencia y a encontrar las actividades y grupos que mejor se adapten a vos. Pasá por su puesto, junto al mostrador de acreditación.","sm":""},{"id":13,"day":"Lun","s":900,"e":1080,"b":"m-1500","t":"Like Totally Rad OLC 80's Human Bingo","te":"Bingo humano ochentoso de OLC","sh":"80's Human Bingo","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"Human Bingo: Find Your OLC Connections Skip the awkward networking and start connecting! Human Bingo turns meeting fellow OLC Accelerate attendees into an interactive challenge. Participants will mingle to find colleagues who match prompts on their bingo cards—professional experiences, interests, accomplishments, and a few fun surprises. Complete a row, fill your card, or simply see how many new connections you can make. No prep required—just bring yourself and get ready to meet your OLC community! Note: Your Human Bingo card can be redeemed for tickets to play Skeeball and a chance at prizes.  Join us in the Engagement Hub (Atlantic Exhibit Hall) during evening receptions, lunches, and networking coffee breaks for your prize redemption!","de":"Bingo humano: encontrá tus conexiones en OLC. ¡Dejá atrás el networking incómodo y empezá a conectar! El bingo humano convierte el conocer a otros asistentes en un desafío interactivo: hay que encontrar colegas que coincidan con las consignas del cartón (experiencias profesionales, intereses, logros y algunas sorpresas). Completá una línea, el cartón entero o simplemente sumá conexiones. No requiere preparación. Nota: el cartón se canjea por fichas para jugar Skeeball y participar por premios en el Engagement Hub (Atlantic Exhibit Hall) durante recepciones, almuerzos y coffee breaks.","sm":""},{"id":14,"day":"Lun","s":900,"e":1080,"b":"m-1500","t":"OLC Accelerate 2026 AI Exploration Zone Preview","te":"Preview de la AI Exploration Zone","sh":"AI Exploration Zone","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"","tre":"","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Join us during the Accelerate Exhibit Hall Preview Reception for some Open Exploration time to learn what the AI Exploration Zone has to offer you this week. Stop watching AI from the sidelines. Open Exploration treats you as a lifelong learner with a question worth working on. Bring a teaching or learning challenge and use the space to work on it with support from experienced guides and access to a range of AI tools. There are no canned demos and no expectation that you arrive with AI expertise. Our emphasis is on curiosity and hands-on experimentation that leads you somewhere useful.","de":"Durante la recepción del Exhibit Hall Preview, un primer espacio de exploración abierta para conocer lo que ofrece la AI Exploration Zone esta semana. Dejá de mirar la IA desde afuera: traé un desafío de enseñanza o aprendizaje y trabajalo con el apoyo de guías con experiencia y acceso a distintas herramientas de IA. No hay demos armadas ni se espera que llegues con experiencia en IA; el foco está en la curiosidad y la experimentación práctica que lleve a algo útil.","sm":""},{"id":15,"day":"Lun","s":900,"e":1080,"b":"m-1500","t":"OLC Accelerate 2026 Exhibit Hall Preview and Reception","te":"Preview y recepción del salón de exposiciones","sh":"Exhibit Hall Preview & Reception","ty":"Evening event","tye":"Evento","to":"Evening Event","tr":"","tre":"","loc":"Atlantic Exhibit Hall","p":"","po":"","d":"As we open OLC Accelerate 2026, join us for an early evening of light snacks, beverages, and community networking! Take this chance to get ahead on your exhibitor stamp card and engage in 1:1 conversations with our sponsors, exhibitors, and the OLC team.  Stop by our AI Exploration Zone and Engagement Hub areas for special activities.","de":"Para abrir OLC Accelerate 2026, una tarde con snacks, bebidas y networking. Es la oportunidad para avanzar con la tarjeta de sellos de expositores y conversar uno a uno con sponsors, expositores y el equipo de OLC. Pasá por la AI Exploration Zone y el Engagement Hub, que tendrán actividades especiales.","sm":""},{"id":16,"day":"Lun","s":945,"e":960,"b":"m-pm","t":"Leadership Network Symposium Takeaways and Closing Remarks","te":"Cierre del Leadership Network Symposium: conclusiones y palabras finales","sh":"Leadership Network Symposium Takeaways and Closing Remarks","ty":"Leadership Network Symposium","tye":"Leadership Network Symposium","to":"Leadership Network Symposium Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Dylan Barth, Ph.D.","po":"VP of Innovation and Programs, Online Learning Consortium","d":"The Leadership Network Symposium will wrap up with a facilitated reflection activity followed by closing remarks from OLC’s VP of Innovation and Programs. LNS attendees will leave with concrete next steps to take back to their institutions.","de":"El Leadership Network Symposium cierra con una actividad de reflexión facilitada y palabras del VP de Innovación y Programas de OLC. Los asistentes se llevan próximos pasos concretos para sus instituciones.","sm":""},{"id":17,"day":"Lun","s":975,"e":1005,"b":"m-1500","t":"First Time Attendee Welcome and Orientation","te":"Bienvenida y orientación para quienes asisten por primera vez","sh":"First-Time Attendee Welcome","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 1","p":"Christine Hinkley, CMP","po":"Senior Director, Conferences and Events, Online Learning Consortium","d":"If you’re looking for support in orienting to the conference, the First Timers Welcome and Orientation is a must! Get support in planning your conference experience and kick things off with some casual networking.  Immediately following the orientation session, join us for our Field Guide-led tour of the WDW Dolphin Convention Center. NOTE:  There will be a repeat of this orientation session and tour on Tuesday morning for those arriving later to the conference.","de":"Si buscás ayuda para orientarte en la conferencia, esta bienvenida es imperdible: apoyo para planificar tu experiencia y un primer momento de networking informal. Al terminar, recorrido guiado por los Field Guides por el centro de convenciones del WDW Dolphin. Nota: la orientación y el recorrido se repiten el martes a la mañana para quienes lleguen más tarde.","sm":""},{"id":18,"day":"Lun","s":1005,"e":1050,"b":"m-1500","t":"Tour of the WDW Dolphin Convention Center","te":"Recorrido por el centro de convenciones del WDW Dolphin","sh":"Convention Center Tour","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Convention Foyer - Field Guide Station","p":"","po":"","d":"Immediately following the Monday afternoon First Time Attendee Orientation session, join the OLC Accelerate Field Guides and other conference attendees for a tour of the WDW Dolphin Convention Center. There is no better way to explore this hotel and learn about conference layout than on a guided tour. Meet near conference registration at the Field Guide Station. Be sure to wear comfortable clothing and shoes (as we will be moving throughout the tour). NOTE: There will be an additional opportunity to take this tour Tuesday morning.","de":"Justo después de la orientación del lunes a la tarde, recorrido con los Field Guides de OLC y otros asistentes por el centro de convenciones del WDW Dolphin. No hay mejor forma de conocer el hotel y la distribución de la conferencia. Punto de encuentro: el puesto de los Field Guides, junto a la acreditación. Usá ropa y calzado cómodos. Nota: el recorrido se repite el martes a la mañana.","sm":""},{"id":19,"day":"Mar","s":390,"e":450,"b":"t-early","t":"Classic Morning Yoga","te":"Yoga clásico por la mañana","sh":"Morning Yoga","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"Charlotte Jones-Roberts","po":"Instructional Designer, University of Central Florida","d":"Begin your day with a grounding, energizing yoga practice designed to awaken the body and settle the mind. This all-levels class combines gentle warm-ups, classic standing and seated postures, mindful breathwork, and a restful closing relaxation. Participants will be invited to move at their own pace, with modifications offered throughout. Come as you are and leave feeling refreshed, centered, and ready for the day. Please bring your own mat (BYOM). If you do not have a mat, towels will be available.","de":"Empezá el día con una práctica de yoga que despierta el cuerpo y calma la mente. La clase, apta para todos los niveles, combina un calentamiento suave, posturas clásicas de pie y sentado, respiración consciente y una relajación final. Cada uno se mueve a su ritmo, con variantes durante toda la clase. Traé tu propio mat; si no tenés, habrá toallas.","sm":""},{"id":20,"day":"Mar","s":450,"e":1020,"b":"t-early","t":"Attendee Registration","te":"Acreditación de asistentes","sh":"Attendee Registration","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Convention Foyer","p":"","po":"","d":"Stop by attendee registration for your name badge and conference materials prior to your first session of the day.  Learn about our conference mobile app and other tips to help you on your first full day of the conference.","de":"Pasá por la acreditación a retirar tu credencial y materiales antes de tu primera sesión del día. Conocé la app de la conferencia y otros consejos para tu primer día completo.","sm":""},{"id":21,"day":"Mar","s":450,"e":720,"b":"t-early","t":"Field Guide Welcome Station","te":"Punto de bienvenida de los Field Guides","sh":"Field Guide Welcome Station","ty":"General","tye":"General","to":"Other","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Convention Foyer - Field Guide Station","p":"","po":"","d":"Welcome! The OLC Accelerate Field Guides are here to help you get oriented, learn how to navigate the mobile app, and find the best conference activities and groups for you. Stop by the Field Guide station near the registration desk for assistance.","de":"¡Bienvenidos! Los Field Guides de OLC Accelerate te ayudan a orientarte, a usar la app de la conferencia y a encontrar las actividades y grupos que mejor se adapten a vos. Pasá por su puesto, junto al mostrador de acreditación.","sm":""},{"id":22,"day":"Mar","s":480,"e":1020,"b":"t-early","t":"The Sanctuary","te":"The Sanctuary (sala de descanso)","sh":"The Sanctuary (quiet room)","ty":"General","tye":"General","to":"Other","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"","po":"","d":"Our Sanctuary room is a quiet, reflective space available for all conference attendees to use. This is a quiet space room where disturbances should be kept to a minimum to allow conference attendees to rest and recharge. The Sanctuary room is open during regular conference hours. During the conference, join us for some quiet time to decompress, reconnect mind and body, and practice some self-care as we turn our focus inward for a short while. Mindfulness has been defined as a practice of “bringing one’s attention to the internal and external experiences occurring in the present moment” (Baer, 2003). Join us in the Sanctuary today for some special mindfulness sessions (see the engagement schedule), or just to relax and decompress a bit throughout the day.","de":"Espacio tranquilo y de reflexión abierto durante el horario de la conferencia para descansar, recargar energía y participar de sesiones de mindfulness.","sm":""},{"id":23,"day":"Mar","s":480,"e":550,"b":"t-am","t":"HBCU Summit Welcome and Opening Panel: The State of Online Learning at HBCUs","te":"Bienvenida al HBCU Summit y panel de apertura: el estado del aprendizaje online en las HBCU","sh":"HBCU Summit: Opening Panel","ty":"Summit","tye":"Summit","to":"HBCU Summit Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 5","p":"John Bannister","po":"Director of the FAMU Center for Teaching and Learning, Florida A&M University","d":"What does the future of online learning look like at HBCUs? Opening with an interactive welcome and HBCU roll call, this panel brings institutional leaders together to explore culturally responsive course design, student success and support, technology and infrastructure, and strategies for scaling online programs while advancing institutional missions.","de":"¿Cómo será el futuro del aprendizaje online en las HBCU (universidades históricamente afroamericanas)? Tras una bienvenida interactiva y un recorrido por las instituciones presentes, este panel reúne a líderes institucionales para conversar sobre diseño de cursos culturalmente pertinente, éxito y acompañamiento estudiantil, tecnología e infraestructura, y estrategias para escalar programas online en línea con la misión institucional.","sm":"HBCU"},{"id":24,"day":"Mar","s":480,"e":525,"b":"t-am","t":"Beyond the Bot: Building Purposeful AI-Powered Learning Experiences","te":"Más allá del bot: experiencias de aprendizaje con IA con propósito","sh":"Beyond the Bot: Purposeful AI Learning Experiences","ty":"Summit","tye":"Summit","to":"K-12 Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Heather Pelkie","po":"Innovation Enablement Manager, West Coast University","d":"Move beyond AI tool demos and learn how to design purposeful AI-powered learning experiences. This practical session offers a simple design framework, classroom-ready strategies, and adaptable examples that help educators create assignments, activities, and assessments that support meaningful learning across online, blended, and face-to-face environments.","de":"Más allá de las demos de herramientas: cómo diseñar experiencias de aprendizaje con IA que tengan un propósito. Esta sesión práctica ofrece un marco de diseño simple, estrategias listas para el aula y ejemplos adaptables para crear consignas, actividades y evaluaciones que apoyen un aprendizaje significativo en entornos online, híbridos y presenciales.","sm":"K12"},{"id":25,"day":"Mar","s":480,"e":525,"b":"t-am","t":"Speed Limits, Signals, Speed Bumps, and Racetracks: A Practical Framework for AI‑Aware Course Design","te":"Límites de velocidad, señales, lomos de burro y pistas de carrera: un marco práctico para diseñar cursos conscientes de la IA","sh":"Speed Limits & Signals: AI-Aware Course Design","ty":"Summit","tye":"Summit","to":"AI Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I/II","p":"Crystal Akers, Ph.D.","po":"Associate Teaching Professor, Rutgers, The State University of New Jersey","d":"Move beyond AI policing to purposeful course design. This session introduces a practical infrastructure of speed limits, signals, speed bumps, and racetracks for AI‑aware course design. Participants leave with a TiLT‑aligned template and assignment design prompts to support student judgment about AI use and its impact on learning.","de":"Del control del uso de IA al diseño de cursos con propósito. Esta sesión presenta una infraestructura práctica (límites de velocidad, señales, lomos de burro y pistas de carrera) para diseñar cursos conscientes de la IA. Los participantes se llevan una plantilla alineada con el marco TILT y disparadores para diseñar consignas que ayuden a los estudiantes a decidir sobre el uso de IA y su impacto en el aprendizaje.","sm":"AI"},{"id":26,"day":"Mar","s":480,"e":510,"b":"t-am","t":"ID Summit Welcome and Beyond the Pieces: Seeing the Whole in Instructional Design in a Rapidly Changing Environment","te":"Bienvenida al ID Summit y \"Más allá de las piezas\": una mirada integral del diseño instruccional en un entorno que cambia rápido","sh":"ID Summit Welcome: Seeing the Whole","ty":"Summit","tye":"Summit","to":"Instructional Design Summit Session","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere IV/V","p":"Sherri Restauri","po":"Director of Professional Learning, Online Learning Consortium","d":"Instructional design is rarely productive or impactful with the use of just a single skill or a linear process. It is a holistic practice shaped by pedagogy, technology, collaboration, creativity, accessibility, data, and an understanding of how people think and learn. In this interactive opening, participants will identify the interconnected competencies instructional designers bring to their work and consider what can be lost when one “piece” is treated in isolation. Through a brief collaborative activity and facilitated synthesis, participants will establish a shared lens for the ID Summit: effective instructional design requires us to protect the human cognitive work that makes learning possible while drawing on creative problem-solving, design thinking, and emerging technologies such as AI. Participants will carry forward from this session a guiding question to carry through the Summit: How can we connect our tools, methods, and professional strengths into learning experiences that remain purposeful, inclusive, and distinctly human?","de":"El diseño instruccional rara vez es productivo o tiene impacto con una sola habilidad o un proceso lineal. Es una práctica integral que combina pedagogía, tecnología, colaboración, creatividad, accesibilidad, datos y la comprensión de cómo piensan y aprenden las personas. En esta apertura interactiva, los participantes identifican las competencias interconectadas que aportan los diseñadores instruccionales y reflexionan sobre lo que se pierde cuando una \"pieza\" se trabaja aislada. Con una breve actividad colaborativa y una síntesis facilitada, se construye una mirada compartida para el ID Summit: un diseño instruccional eficaz protege el trabajo cognitivo humano que hace posible el aprendizaje, apoyándose en la resolución creativa de problemas, el design thinking y tecnologías emergentes como la IA. Pregunta guía para todo el Summit: ¿cómo conectamos nuestras herramientas, métodos y fortalezas profesionales en experiencias de aprendizaje que sigan siendo intencionales, inclusivas y profundamente humanas?","sm":"ID"},{"id":27,"day":"Mar","s":510,"e":570,"b":"t-am","t":"The Human Side of AI: Protecting the Cognitive Work That Makes Learning Possible","te":"El lado humano de la IA: proteger el trabajo cognitivo que hace posible el aprendizaje","sh":"The Human Side of AI","ty":"Summit","tye":"Summit","to":"Instructional Design Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere IV/V","p":"B. Jean Mandernach","po":"Exec. Dir., Center for Innovation & Research on Teaching, Grand Canyon University","d":"AI removes friction indiscriminately: it cannot tell the struggle that wastes learners' time from the struggle that does the teaching. Grounded in cognitive science, this session offers instructional designers questions for advising faculty on AI adoption: not just what a tool does for learners, but what it takes from them.","de":"La IA elimina la fricción sin distinguir: no diferencia el esfuerzo que le hace perder tiempo al estudiante del esfuerzo que efectivamente enseña. Con base en las ciencias cognitivas, esta sesión ofrece a los diseñadores instruccionales preguntas para asesorar a docentes sobre la adopción de IA: no solo qué hace una herramienta por los estudiantes, sino qué les quita.","sm":"ID"},{"id":28,"day":"Mar","s":525,"e":675,"b":"t-am","t":"Decoupling the Process from the Product: Redesigning Writing and Critical Thinking in an AI-First Era","te":"Separar el proceso del producto: rediseñar la escritura y el pensamiento crítico en la era de la IA","sh":"Redesigning Writing & Critical Thinking","ty":"Summit","tye":"Summit","to":"K-12 Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Naketa R. Jones, Ed.D.","po":"Director of Academic Innovation and Faculty Development, Baker College","d":"Generative AI bypasses traditional written assessments, threatening student critical thinking. This interactive session introduces a 3-milestone \"Socratic Process Portfolio\" framework that restructures writing from its traditional form into a visible, active cognitive process. Attendees will explore disciplinary case studies and leave with actionable, AI-resilient redesign strategies. There will be a Networking coffee break from 9:30am-10:30am during this workshop","de":"La IA generativa vuelve obsoletas las evaluaciones escritas tradicionales y pone en riesgo el pensamiento crítico. Esta sesión interactiva presenta el \"Portfolio de proceso socrático\", un marco de tres hitos que transforma la escritura en un proceso cognitivo visible y activo. Se exploran casos de distintas disciplinas y los asistentes se llevan estrategias concretas de rediseño resistentes a la IA. Incluye un coffee break de networking de 9:30 a 10:30.","sm":"K12"},{"id":29,"day":"Mar","s":525,"e":570,"b":"t-am","t":"AI-Powered Video Creation for Student-Centered Learning","te":"Creación de videos con IA para un aprendizaje centrado en el estudiante","sh":"AI-Powered Video Creation","ty":"Summit","tye":"Summit","to":"AI Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I/II","p":"Ashley Bondurant,PT, DPT, M.Ed","po":"Instructional Designer, Medical University of South Carolina","d":"AI-powered video tools are transforming online course development. This session shares a practical framework for using AI-generated instructional videos to improve student engagement, increase content consistency, and reduce production barriers. Participants will explore implementation strategies, lessons learned, and opportunities for scalable adoption across online programs.","de":"Las herramientas de video con IA están transformando el desarrollo de cursos online. Esta sesión comparte un marco práctico para usar videos instruccionales generados con IA que mejoren la participación de los estudiantes, aumenten la consistencia del contenido y reduzcan las barreras de producción. Se exploran estrategias de implementación, aprendizajes y oportunidades para adoptarlos a escala en programas online.","sm":"AI"},{"id":30,"day":"Mar","s":540,"e":1110,"b":"t-early","t":"The OLC Accelerate 2026 Engagement Hub","te":"Engagement Hub de OLC Accelerate 2026","sh":"Engagement Hub","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"At OLC Accelerate 2026 we invite attendees to visit the Engagement Hub, a dynamic space designed for connection, creativity, and community building. Attendees will collaborate in activities that foster peer connection, idea exchange, and just have fun!! Come see us in the Engagement Hub where the goal is simple: spark lasting connections, surface new perspectives, and empower everyone—from emerging professionals to senior leadership. Plan to contribute, converse, and create real-time connection. The Engagement Hub is open during regular exhibit hours.  Check the schedule for specific session times. Note:  Your Bingo cards can be turned in at the Engagement Hub during evening receptions, networking coffee breaks, and lunch time for Skeeball play and a chance to win fun prizes.  Don't miss our Lite Brite photo op as well!","de":"Espacio de conexión, creatividad y comunidad abierto en el horario del salón de exposiciones. Ahí se canjean los cartones de bingo para jugar Skeeball y participar por premios.","sm":""},{"id":31,"day":"Mar","s":540,"e":585,"b":"t-am","t":"AI Exploration Zone - Open Exploration","te":"AI Exploration Zone: exploración abierta","sh":"AI Exploration Zone","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"","tre":"","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Stop watching AI from the sidelines. Open Exploration treats you as a lifelong learner with a question worth working on. Bring a teaching or learning challenge and use the space to work on it with support from experienced guides and access to a range of AI tools. There are no canned demos and no expectation that you arrive with AI expertise. Our emphasis is on curiosity and hands-on experimentation that leads you somewhere useful.","de":"Traé un desafío de enseñanza o aprendizaje y trabajalo con guías y distintas herramientas de IA. No hay demos armadas ni hace falta experiencia previa.","sm":""},{"id":32,"day":"Mar","s":540,"e":585,"b":"t-am","t":"Open Play in the Engagement Hub","te":"Juego libre en el Engagement Hub","sh":"Open Play (Engagement Hub)","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"Open Play invites participants to explore creativity, collaboration, and communication through interactive, hands-on activities. Using visual prompts from story cubes to generate spontaneous narratives, experience how simple images can spark imagination, flexible thinking, and creative expression. Through the collaborative challenge of the Mystery Box, discover how taking seemingly unrelated materials to solve a creative task can highlight teamwork, resourcefulness, and the value of diverse perspectives and skills. And maybe even engage in a face-to-face simulation of an online discussion forum, role-playing familiar participant types such as the expert, newbie, skeptic, cheerleader, lurker, and de-railer to examine how different communication styles influence group dialogue and engagement. Through laughter, experimentation, reflection, and discussion, participants will experience firsthand how low-stakes, playful activities can foster community, encourage participation, uncover group dynamics, and support deeper learning.","de":"Actividades lúdicas para explorar la creatividad, la colaboración y la comunicación: historias con dados de imágenes, el desafío de la Caja Misteriosa y la simulación presencial de un foro online. Muestran cómo las actividades de bajo riesgo fomentan la comunidad y la participación.","sm":""},{"id":33,"day":"Mar","s":540,"e":570,"b":"t-am","t":"First Time Attendee Welcome and Onboarding","te":"Bienvenida y orientación para quienes asisten por primera vez (repetición)","sh":"First-Time Attendee Welcome","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 1","p":"Christine Hinkley, CMP","po":"Senior Director, Conferences and Events, Online Learning Consortium","d":"If you’re looking for support in orienting to the conference, the First Timers Welcome and Orientation is a must! Get support in planning your conference experience and kick things off with some casual networking.  Immediately following the orientation session, join us for our Field Guide-led tour of the WDW Dolphin Convention Center. NOTE: This is a repeat of the Monday orientation session.","de":"Si buscás ayuda para orientarte en la conferencia, esta bienvenida es imperdible: apoyo para planificar tu experiencia y un primer momento de networking informal. Al terminar, recorrido guiado por los Field Guides por el centro de convenciones del WDW Dolphin. Nota: repite la sesión de orientación del lunes.","sm":""},{"id":34,"day":"Mar","s":555,"e":580,"b":"t-am","t":"Table Talk & Reflection: Exploring the HBCU Community’s Priorities","te":"Mesa de conversación y reflexión: prioridades de la comunidad HBCU","sh":"HBCU Community Priorities","ty":"Summit","tye":"Summit","to":"HBCU Summit Session","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 5","p":"Dionne Thorne, Ph.D.","po":"Assistant Dean, Curriculum and Operations, Morgan State University","d":"What issues are shaping digital learning across the HBCU community? In this interactive table talk, participants will explore hot topics identified through an HBCU community survey, exchange experiences and ideas in small groups, and collaboratively capture insights around AI, course design, faculty development, student success, strategy, policy, and support.","de":"¿Qué temas están marcando el aprendizaje digital en la comunidad HBCU? En esta conversación por mesas, los participantes exploran los temas más relevantes que surgieron de una encuesta a la comunidad, intercambian experiencias e ideas en grupos chicos y registran en conjunto aportes sobre IA, diseño de cursos, formación docente, éxito estudiantil, estrategia, políticas y acompañamiento.","sm":"HBCU"},{"id":35,"day":"Mar","s":570,"e":630,"b":"t-am","t":"Networking Coffee Break","te":"Coffee break de networking","sh":"Networking Coffee Break","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Atlantic Exhibit Hall","p":"","po":"","d":"Join us in the Exhibit Hall for our first networking coffee break of the conference. Not only is this an opportunity to recharge with a fresh cup of coffee or tea, but you will also have the opportunity to network with other attendees. Check out the activities in the Engagement Hub and AI Exploration Zone, or use this time to meet with our conference exhibitors and work on your exhibitor stamp card for a chance at some awesome prizes! Don't forget to complete your Totally Rad OLC 80's Human Bingo card by chatting with other attendees. You can stop by the Engagement Hub during this break to redeem your Bingo card to play Skeeball and win prizes, or just participate in our OLC Lite Brite photo op!","de":"Pausa en el salón de exposiciones para conocer a otros asistentes y visitar el Engagement Hub, la AI Exploration Zone y a los expositores.","sm":""},{"id":36,"day":"Mar","s":570,"e":615,"b":"t-am","t":"Tour of the WDW Dolphin Convention Center","te":"Recorrido por el centro de convenciones del WDW Dolphin","sh":"Convention Center Tour","ty":"General","tye":"General","to":"Other","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Convention Foyer - Field Guide Station","p":"","po":"","d":"Immediately following Tuesday morning's First Time Attendee Orientation Session, join the OLC Accelerate Field Guides and other conference attendees for a tour of the WDW Dolphin Convention Center. There is no better way to explore this hotel and learn about conference layout than on a guided tour. Meet near conference registration at the Field Guide Station. Be sure to wear comfortable clothing and shoes (as we will be moving throughout the tour).","de":"Justo después de la orientación del martes a la mañana, recorrido con los Field Guides de OLC y otros asistentes por el centro de convenciones del WDW Dolphin. No hay mejor forma de conocer el hotel y la distribución de la conferencia. Punto de encuentro: el puesto de los Field Guides, junto a la acreditación. Usá ropa y calzado cómodos.","sm":""},{"id":37,"day":"Mar","s":585,"e":630,"b":"t-am","t":"HBCU Innovation & Networking Experience","te":"Experiencia de innovación y networking HBCU","sh":"HBCU Innovation & Networking","ty":"Summit","tye":"Summit","to":"HBCU Summit Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 5","p":"Dionne Thorne, Ph.D.","po":"Assistant Dean, Curriculum and Operations, Morgan State University","d":"Bring your coffee or snack and connect with the HBCU community! This facilitated networking experience transforms the conference break into an interactive space for conversation, connection, and idea-sharing. Explore topic tables and interactive stations, contribute to a collaborative digital wall, and continue conversations with panelists and fellow Summit participants.","de":"¡Traé tu café o snack y conectá con la comunidad HBCU! Esta experiencia de networking facilitada convierte el break en un espacio interactivo para conversar, conectar e intercambiar ideas: mesas temáticas, estaciones interactivas, un muro digital colaborativo y la posibilidad de seguir conversando con panelistas y participantes del Summit.","sm":"HBCU"},{"id":38,"day":"Mar","s":585,"e":630,"b":"t-am","t":"‘Reply All’ and Other Organizational Crises","te":"\"Responder a todos\" y otras crisis organizacionales","sh":"'Reply All' and Other Crises","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"Dr. Amy Johnson","po":"Program Chair, AAECE, University of Arizona Global Campus","d":"Participants work in small groups to create and defend fictional policies on topics such as meetings that should have been emails, conference snack distribution, and “reply all” misuse. Through playful debate, they explore decision-making, governance, and communication while examining how policies influence behavior, organizational culture, and outcomes.","de":"En grupos chicos, los participantes crean y defienden políticas ficticias sobre temas como reuniones que podrían haber sido un mail, la distribución de snacks en la conferencia o el mal uso de \"responder a todos\". A través de un debate lúdico, exploran la toma de decisiones, la gobernanza y la comunicación, y cómo las políticas influyen en las conductas, la cultura organizacional y los resultados.","sm":""},{"id":39,"day":"Mar","s":585,"e":630,"b":"t-am","t":"The Crossroads of AI and Gamification","te":"El cruce entre IA y gamificación","sh":"The Crossroads of AI and Gamification","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Gamification is not about making learning feel like a game. It is about designing responsive experiences that challenge learners while providing meaningful choice and feedback. This session examines how AI can make those experiences easier to create and personalize while keeping learning outcomes and educator judgment central to instructional practice.","de":"Gamificar no es hacer que el aprendizaje parezca un juego, sino diseñar experiencias que respondan al estudiante, lo desafíen y le ofrezcan decisiones y retroalimentación con sentido. Esta sesión analiza cómo la IA puede facilitar la creación y personalización de esas experiencias, manteniendo en el centro los resultados de aprendizaje y el criterio docente.","sm":""},{"id":40,"day":"Mar","s":630,"e":720,"b":"t-am","t":"AI Exploration Zone - Open Exploration","te":"AI Exploration Zone: exploración abierta","sh":"AI Exploration Zone","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"","tre":"","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Stop watching AI from the sidelines. Open Exploration treats you as a lifelong learner with a question worth working on. Bring a teaching or learning challenge and use the space to work on it with support from experienced guides and access to a range of AI tools. There are no canned demos and no expectation that you arrive with AI expertise. Our emphasis is on curiosity and hands-on experimentation that leads you somewhere useful.","de":"Traé un desafío de enseñanza o aprendizaje y trabajalo con guías y distintas herramientas de IA. No hay demos armadas ni hace falta experiencia previa.","sm":""},{"id":41,"day":"Mar","s":630,"e":720,"b":"t-am","t":"From Stuck to Solution: Using Creative Problem Solving, Design Thinking, and AI to Transform Learning Design","te":"De trabado a resuelto: resolución creativa de problemas, design thinking e IA para transformar el diseño de aprendizajes","sh":"From Stuck to Solution: Design Thinking + AI","ty":"Summit","tye":"Summit","to":"Instructional Design Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere IV/V","p":"Debby Marindin, EdD, PMP","po":"Instructional Designer/Assistant Professor and Adjunct Faculty, MUSC and College of Charleston","d":"Faculty face increasing pressure to innovate while navigating rapid technological change. In this highly interactive workshop, participants will use Creative Problem Solving, Design Thinking, and AI-supported ideation to tackle authentic educational challenges, generate innovative solutions, and leave with practical frameworks they can immediately apply.","de":"Los docentes enfrentan cada vez más presión para innovar en medio de cambios tecnológicos acelerados. En este taller muy interactivo, los participantes usan la resolución creativa de problemas, el design thinking y la ideación con apoyo de IA para abordar desafíos educativos reales, generar soluciones innovadoras y llevarse marcos prácticos para aplicar de inmediato.","sm":"ID"},{"id":42,"day":"Mar","s":630,"e":675,"b":"t-am","t":"Calibrating Trust in AI: Designing Assignments and Simulations That Build Critical Judgment","te":"Calibrar la confianza en la IA: diseñar consignas y simulaciones que desarrollen el juicio crítico","sh":"Calibrating Trust in AI","ty":"Summit","tye":"Summit","to":"AI Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I/II","p":"Julianna Woite","po":"Director of the Institute for Teaching Innovation, D'Youville University","d":"This session offers actionable approaches for designing assignments and AI-enabled simulations that strengthen students’ ability to critically assess AI use. Through concrete examples and interactive activities, participants will explore methods for calibrating trust, fostering informed judgment, and embedding responsible, scalable AI integration across diverse disciplines.","de":"Esta sesión ofrece enfoques concretos para diseñar consignas y simulaciones con IA que fortalezcan la capacidad de los estudiantes de evaluar críticamente el uso de IA. Con ejemplos y actividades interactivas, se exploran métodos para calibrar la confianza, promover un juicio informado e integrar la IA de forma responsable y escalable en distintas disciplinas.","sm":"AI"},{"id":43,"day":"Mar","s":645,"e":675,"b":"t-am","t":"What's Working at My HBCU? Lightning Spotlights","te":"¿Qué funciona en mi HBCU? Presentaciones relámpago","sh":"What's Working at My HBCU?","ty":"Summit","tye":"Summit","to":"HBCU Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 5","p":"Dionne Thorne - moderator","po":"Assistant Dean, Curriculum and Operations, Morgan State University","d":"What’s working at HBCUs right now? This high-energy series of five-minute lightning spotlights puts successful practices center stage. Presenters from different HBCUs will rapidly share innovations, approaches, and lessons from their institutions, giving participants a fast-paced opportunity to discover ideas, celebrate successes, and learn from across the HBCU community.","de":"¿Qué está funcionando hoy en las HBCU? Una serie dinámica de presentaciones de cinco minutos pone en primer plano prácticas exitosas. Representantes de distintas HBCU comparten rápidamente innovaciones, enfoques y aprendizajes de sus instituciones, para descubrir ideas, celebrar logros y aprender de toda la comunidad HBCU.","sm":"HBCU"},{"id":44,"day":"Mar","s":660,"e":705,"b":"t-am","t":"Know Your WHY","te":"Conocé tu \"para qué\"","sh":"Know Your WHY","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"Dr. Samira Galvao","po":"Alumni Navigator and Engagement Coordinator, National University","d":"Knowing Your “WHY” explores the purpose, values, and motivation that drive our personal and professional journeys. Understanding our WHY provides clarity, strengthens commitment, and helps us remain focused when challenges arise. When we connect our goals to a meaningful purpose, we are better equipped to move forward with intention, resilience, and confidence.","de":"Una exploración del propósito, los valores y las motivaciones que guían nuestro recorrido personal y profesional. Entender nuestro \"para qué\" da claridad, fortalece el compromiso y ayuda a mantener el foco ante los desafíos. Cuando conectamos nuestras metas con un propósito significativo, avanzamos con más intención, resiliencia y confianza.","sm":""},{"id":45,"day":"Mar","s":660,"e":705,"b":"t-am","t":"OLC Feud","te":"OLC Feud (juego de preguntas)","sh":"OLC Feud","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"Danny Beason","po":"Customer Success Manager, D2L Corporation","d":"Get ready to survey the OLC community! In this fast-paced, Family Feud–style game, participants will team up to guess the most popular responses to questions about online learning, higher education, technology, and the wonderfully relatable experiences of our profession. Come ready to laugh, compete, connect with colleagues, and see how well your answers match the OLC crowd. No prep required—just bring your best guesses and your competitive spirit!","de":"¡A encuestar a la comunidad OLC! En este juego dinámico al estilo \"100 argentinos dicen\" (Family Feud), los participantes forman equipos para adivinar las respuestas más populares a preguntas sobre aprendizaje online, educación superior, tecnología y las situaciones tan reconocibles de nuestra profesión. Para reírse, competir y conectar con colegas. No requiere preparación.","sm":""},{"id":46,"day":"Mar","s":675,"e":720,"b":"t-am","t":"Beyond AI Surrender: A Critical AI Pedagogy Framework for Scaffolded, Reflective Learning Environments","te":"Más allá de la \"rendición ante la IA\": un marco de pedagogía crítica de la IA para entornos de aprendizaje andamiados y reflexivos","sh":"Critical AI Pedagogy Framework","ty":"Summit","tye":"Summit","to":"AI Summit Session","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I/II","p":"Drew Moser","po":"Educational Development Specialist, Wayne State University","d":"Higher-ed conversations about AI often focus on avoiding “AI surrender,” where students use AI to short-circuit learning. This session introduces the Critical AI Pedagogy Framework, a scaffolded, iterative approach that helps faculty redesign learning experiences to promote critical literacy, thinking, reflection, and responsible AI use.","de":"En la educación superior, las conversaciones sobre IA suelen enfocarse en evitar la \"rendición ante la IA\", cuando los estudiantes la usan para saltearse el aprendizaje. Esta sesión presenta el Critical AI Pedagogy Framework, un enfoque andamiado e iterativo que ayuda a los docentes a rediseñar experiencias de aprendizaje para promover la alfabetización crítica, el pensamiento, la reflexión y el uso responsable de la IA.","sm":"AI"},{"id":47,"day":"Mar","s":675,"e":720,"b":"t-am","t":"Trust, Presence, and the Human Dimension of Digital Learning","te":"Confianza, presencia y la dimensión humana del aprendizaje digital","sh":"Trust, Presence and the Human Dimension","ty":"Summit","tye":"Summit","to":"K-12 Summit Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 4","p":"Alyssa Tormala","po":"Head of School, Laurel Springs School","d":"The closing session focuses on the human qualities that remain essential in digital education. As more aspects of teaching and learning are mediated through platforms and tools, the importance of teacher presence, trust, feedback, and relational connection only grows. This session will examine how schools can preserve the human dimension of learning while adapting to new realities in digital environments.","de":"La sesión de cierre se enfoca en las cualidades humanas que siguen siendo esenciales en la educación digital. A medida que más aspectos de la enseñanza y el aprendizaje pasan por plataformas y herramientas, crece la importancia de la presencia docente, la confianza, la retroalimentación y el vínculo. Se analiza cómo las escuelas pueden preservar la dimensión humana del aprendizaje mientras se adaptan a las nuevas realidades de los entornos digitales.","sm":"K12"},{"id":48,"day":"Mar","s":685,"e":700,"b":"t-am","t":"Shaping the HBCU Research Agenda: Online Learning, Scholarship, and Publication","te":"Definir la agenda de investigación HBCU: aprendizaje online, producción académica y publicaciones","sh":"HBCU Research Agenda","ty":"Summit","tye":"Summit","to":"HBCU Summit Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 5","p":"N'Dieye Danavall","po":"Instructional Designer, Morehouse School of Medicine","d":"What research and publications does the HBCU community need next? Join a collaborative conversation to identify priorities for HBCU-centered online learning scholarship, explore topics for a developing special journal issue, and connect researchers, practitioners, and potential contributors. Your ideas can help shape this publication opportunity—and future directions for HBCU scholarship.","de":"¿Qué investigaciones y publicaciones necesita ahora la comunidad HBCU? Una conversación colaborativa para identificar prioridades de investigación sobre apren
