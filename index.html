nd Story LLC","d":"Why do audiences skip 5-minute meetings but binge 40-minute YouTube deep-dives? The difference is architecture, not production. This session introduces \"Curiosity Loops,\" a creator-led framework to eliminate digital fatigue. Learn to transform dry content into high-stakes experiences that compel persistence and re-energize your virtual presence.","de":"¿Por qué el público saltea reuniones de 5 minutos pero mira de corrido videos de YouTube de 40? La diferencia está en la arquitectura, no en la producción. La sesión presenta los \"ciclos de curiosidad\", un marco inspirado en creadores de contenido para eliminar la fatiga digital y transformar contenidos áridos en experiencias que sostienen la atención y renuevan tu presencia virtual.","sm":""},{"id":108,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Beyond Best Practice: Lessons from 15+ years of collaborative, agile, learner-centered design","te":"Más allá de las buenas prácticas: lecciones de más de 15 años de diseño colaborativo, ágil y centrado en el estudiante","sh":"Lessons from 15+ Years of Learner-Centered Design","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 1","p":"Daniel Kalef","po":"Executive Vice President, Online Education Services, Inc (OES)","d":"How do we design online learning that preserves faculty voice, moves at pace, and still delivers an exceptional learner experience? Drawing on 15+ years of practice and the newly published SCALE framework, this session shares practical approaches to collaborative design, agile execution, and learner-centered quality.","de":"¿Cómo diseñar aprendizaje online que preserve la voz docente, avance a buen ritmo y aun así ofrezca una experiencia excepcional al estudiante? A partir de más de 15 años de práctica y del recién publicado marco SCALE, la sesión comparte enfoques prácticos de diseño colaborativo, ejecución ágil y calidad centrada en el estudiante.","sm":""},{"id":109,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Beyond One-Time Training: Building an Ecosystem for Digital Teaching Excellence","te":"Más allá de la capacitación aislada: construir un ecosistema para la excelencia en la enseñanza digital","sh":"Beyond One-Time Training: Digital Teaching Ecosystem","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 2","p":"Alli Peterson","po":"Director, Instructional Design, Texas Woman's University","d":"Examine how faculty development can evolve from scattered offerings into a more scalable, policy-aligned ecosystem. Explore how existing resources are being aligned with institutional priorities and how a structured pathway can support stronger digital teaching practices.","de":"Cómo la formación docente puede pasar de ofertas dispersas a un ecosistema más escalable y alineado con las políticas institucionales. Se explora cómo alinear los recursos existentes con las prioridades de la institución y cómo un trayecto estructurado puede fortalecer las prácticas de enseñanza digital.","sm":""},{"id":110,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Beyond Prompting: Teaching Faculty to Think Critically, Creatively, and Strategically with AI","te":"Más allá del prompting: enseñar a los docentes a pensar crítica, creativa y estratégicamente con IA","sh":"Beyond Prompting: Thinking Critically and Creatively with AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere II","p":"Debby Marindin, EdD, PMP","po":"Instructional Designer/Assistant Professor and Adjunct Faculty, MUSC and College of Charleston","d":"Many faculty workshops focus on AI tools, prompts, and productivity. This session explores a different question: How do we help educators think critically, creatively, and strategically with AI? Participants will learn practical frameworks for developing deeper AI literacy and fostering more thoughtful, innovative use of emerging technologies.","de":"Muchos talleres docentes se enfocan en herramientas, prompts y productividad. Esta sesión plantea otra pregunta: ¿cómo ayudamos a los educadores a pensar de forma crítica, creativa y estratégica con la IA? Los participantes aprenden marcos prácticos para desarrollar una alfabetización en IA más profunda y un uso más reflexivo e innovador de las tecnologías emergentes.","sm":""},{"id":111,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Beyond the AI Hype: Purposeful Design, Meaningful Engagement, and Lessons from the LMS","te":"Más allá del hype de la IA: diseño con propósito, participación significativa y lecciones del LMS","sh":"Beyond the AI Hype: Purposeful Design","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 6","p":"Lisa Clark","po":"Associate Vice President, Academic Transformation, Blackboard","d":"What happens when AI moves from novelty to necessity? Explore how institutions are moving beyond experimentation and using AI with intention. Leaders from multiple universities will share practical strategies, lessons learned, and real examples of leveraging AI to support instructional design, faculty innovation, and meaningful student engagement.","de":"¿Qué pasa cuando la IA pasa de novedad a necesidad? Cómo las instituciones van más allá de la experimentación y usan la IA con intención. Líderes de varias universidades comparten estrategias prácticas, aprendizajes y ejemplos reales del uso de IA para apoyar el diseño instruccional, la innovación docente y la participación significativa de los estudiantes.","sm":""},{"id":112,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Beyond the Bot: Navigating Integrity, Quality, and Long-Term Impact in AI","te":"Más allá del bot: integridad, calidad e impacto a largo plazo de la IA","sh":"Beyond the Bot: Integrity, Quality and Long-Term Impact of AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere E3/E4","p":"Dr. Heather Shellabarger","po":"Director of Distance Education, United Theological Seminary","d":"Explore a shift from AI experimentation to intentional integration. This session examines the ethical landscape of generative AI, evaluates its long-term impact on institutional success, and presents rigorous methodology for measuring AI response quality to ensure academic integrity and instructional excellence in digital learning environments.","de":"De la experimentación con IA a una integración intencional. La sesión analiza el panorama ético de la IA generativa, evalúa su impacto a largo plazo en el éxito institucional y presenta una metodología rigurosa para medir la calidad de las respuestas de la IA, a fin de asegurar la integridad académica y la excelencia pedagógica en entornos digitales.","sm":""},{"id":113,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Blueprint for Belonging: Scalable Strategies for Online Learner Success","te":"Un plan para la pertenencia: estrategias escalables para el éxito de los estudiantes online","sh":"Blueprint for Belonging at Scale","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A3/A4","p":"Jennifer Duncan","po":"Assistant Professor, Georgia State University","d":"How do you build belonging at scale with a small team? Discover a replicable model where hubs, faculty development, and coordinated support systems help online students and instructors feel connected, supported, and empowered. Walk away with immediately usable strategies to strengthen engagement, persistence, and community in any online environment.","de":"¿Cómo construir pertenencia a escala con un equipo chico? Un modelo replicable en el que espacios de encuentro, formación docente y sistemas de apoyo coordinados ayudan a estudiantes y docentes online a sentirse conectados, acompañados y empoderados. Estrategias para aplicar de inmediato y fortalecer la participación, la permanencia y la comunidad en cualquier entorno online.","sm":""},{"id":114,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Building Community by Design: Practical Strategies for Human Connection in Online Courses","te":"Comunidad por diseño: estrategias prácticas para la conexión humana en cursos online","sh":"Building Community by Design in Online Courses","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 5","p":"Allyson Schrimper-Minor","po":"Instructor/ Doctoral Candidate, Miami University of Ohio - Hamilton (Regionals)","d":"Online learning can feel isolating for both students and instructors. Drawing on qualitative research and practical teaching experience, this session explores evidence-informed strategies for fostering belonging, engagement, and meaningful connection in asynchronous courses. Participants will leave with actionable techniques to strengthen community in their own online learning environments.","de":"El aprendizaje online puede sentirse aislante para estudiantes y docentes. A partir de investigación cualitativa y experiencia docente, la sesión explora estrategias basadas en evidencia para fomentar la pertenencia, la participación y la conexión significativa en cursos asincrónicos. Los participantes se llevan técnicas concretas para fortalecer la comunidad en sus propios entornos online.","sm":""},{"id":115,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Clarity in the Process: Empowering Responsible Student Use of AI","te":"Claridad en el proceso: promover un uso responsable de la IA por parte de los estudiantes","sh":"Responsible Student Use of AI","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 2","p":"Leah Stockstill","po":"Senior Product Marketing Manager, Turnitin","d":"How do we embrace a model of intentional, collaborative innovation when it comes to student use of generative AI? This session explores how we can empower students to use these tools without compromising academic honesty by treating AI as a collaborator rather than a shortcut. Participants will explore practical strategies to incorporate AI into student learning, and discover how to build a classroom where innovation and integrity go hand in hand.","de":"¿Cómo adoptar un modelo de innovación intencional y colaborativa en el uso de IA generativa por parte de los estudiantes? La sesión explora cómo habilitar a los estudiantes a usar estas herramientas sin comprometer la honestidad académica, tratando a la IA como colaboradora y no como atajo, con estrategias prácticas para incorporarla al aprendizaje y construir un aula donde innovación e integridad vayan de la mano.","sm":""},{"id":116,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Creating Meaningful Engagement--- Results-Driven Strategies to Establish Transformative Online Learning Experiences","te":"Participación significativa: estrategias orientadas a resultados para experiencias de aprendizaje online transformadoras","sh":"Results-Driven Online Engagement","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 3","p":"Patty Ann Bogue, Ph.D.","po":"Dr., Mississippi State University","d":"During this session, we will discuss practical, results-driven strategies for creating impactful engagement in online learning environments. This session explores evidence-based approaches to foster connection, motivation, and active participation while helping educators and instructional designers transform online courses into impactful learning experiences that promote deeper learning, resilience, and successful outcomes.","de":"Estrategias prácticas y orientadas a resultados para generar una participación con impacto en entornos online. La sesión explora enfoques basados en evidencia para fomentar la conexión, la motivación y la participación activa, y ayuda a docentes y diseñadores instruccionales a transformar los cursos online en experiencias que promuevan un aprendizaje más profundo, la resiliencia y buenos resultados.","sm":""},{"id":117,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Design Matters: Key Lessons for Better Canvas Courses","te":"El diseño importa: lecciones clave para mejores cursos en Canvas","sh":"Design Matters: Better Canvas Courses","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 3","p":"Kenneth Larsen","po":"Chief Instructional Designer & Co-Founder, Cidi Labs","d":"Great course design isn't accidental—it's intentional. Explore research-backed principles from Cidi Labs' Design Matters series that improve engagement, accessibility, and student success in Canvas. Walk away with actionable, no-code strategies using DesignPLUS to elevate your course design practice.","de":"Un gran diseño de cursos no es casual: es intencional. Principios basados en investigación de la serie Design Matters de Cidi Labs para mejorar la participación, la accesibilidad y el éxito estudiantil en Canvas, con estrategias sin código usando DesignPLUS para potenciar tu práctica de diseño.","sm":""},{"id":118,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Designing the Magic: Building Your Leadership Presence in the First 90 Days","te":"Diseñar la magia: construir tu presencia como líder en los primeros 90 días","sh":"Leadership Presence in the First 90 Days","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 4","p":"Cairo Jones","po":"Assistant Director of LEDstudio, Virginia Commonwealth University","d":"Every great experience starts with strong leadership and your first 90 days really set the stage. Learn how to design the magic by setting priorities, understanding your team, building partnerships, and creating a credible, engaging leadership presence that inspires trust and lasting impact.","de":"Toda gran experiencia empieza con un liderazgo sólido, y los primeros 90 días marcan el rumbo. Cómo \"diseñar la magia\": definir prioridades, conocer al equipo, construir alianzas y desarrollar una presencia de liderazgo creíble y cercana que inspire confianza y genere un impacto duradero.","sm":""},{"id":119,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"From Access to Readiness: Closing the Quality Gap in Online Science Learning","te":"Del acceso a la preparación: cerrar la brecha de calidad en el aprendizaje online de ciencias","sh":"From Access to Readiness: Online Science Learning","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 4","p":"Dr. Caitlin Runne-Janczy","po":"Chief Academic Officer, Science Interactive Group","d":"Explore how to close the gap between access and quality, from student readiness and faculty capacity to added pressures facing allied health programs. Drawing on Science Interactive's Annual Lab Report, attendees explore strategies like pairing virtual and hands-on practice, matching support to student tools, and effective ways to use AI.","de":"Cómo cerrar la brecha entre acceso y calidad, desde la preparación de los estudiantes y la capacidad docente hasta las presiones adicionales en programas de ciencias de la salud. A partir del informe anual de laboratorios de Science Interactive, se exploran estrategias como combinar práctica virtual y presencial, ajustar el apoyo a las herramientas de los estudiantes y usar la IA de forma eficaz.","sm":""},{"id":120,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"From Check-box Compliance to Humanized Online Learning: Reframing RSI Through Social and Emotional Learning","te":"Del cumplimiento formal a un aprendizaje online humanizado: repensar la interacción regular y sustantiva (RSI) desde el aprendizaje socioemocional","sh":"Humanizing Online Learning Through SEL","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Americas Seminar","p":"Jessica Paruch","po":"Educational Development Specialist, Wayne State University","d":"Regular and substantive interaction (RSI) can be more than a compliance requirement. This session explores how social and emotional learning (SEL) principles can humanize online learning through intentional, meaningful interaction. Participants will redesign online course elements and leave with practical strategies for creating more supportive, engaging, human-centered online learning experiences.","de":"La interacción regular y sustantiva (RSI, un requisito normativo en EE. UU.) puede ser más que una exigencia formal. La sesión explora cómo los principios del aprendizaje socioemocional (SEL) pueden humanizar el aprendizaje online a través de interacciones intencionales y significativas. Los participantes rediseñan elementos de sus cursos y se llevan estrategias para experiencias online más contenedoras, atractivas y centradas en las personas.","sm":""},{"id":121,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"From Policy to Pedagogy: Building Custom AI Agents That Support Academic Integrity","te":"De la política a la pedagogía: agentes de IA a medida que cuidan la integridad académica","sh":"Custom AI Agents That Support Academic Integrity","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 5","p":"John D. Solis, Ph.D.","po":"Director of Online Learning & Curriculum Innovation, St. Mary's University","d":"Move beyond AI policy and into intentional design. This session explores how instructional designers and faculty collaborate to build custom AI agents, governed by instructor-authored instructions and curated knowledge sources, that scaffold student thinking, protect academic integrity, and create AI-enhanced learning experiences students cannot simply outsource to a chatbot.","de":"De las políticas de IA al diseño intencional. La sesión explora cómo diseñadores instruccionales y docentes colaboran para construir agentes de IA personalizados, guiados por instrucciones escritas por el docente y fuentes de conocimiento seleccionadas, que andamian el pensamiento de los estudiantes, cuidan la integridad académica y generan experiencias que no se pueden simplemente tercerizar en un chatbot.","sm":""},{"id":122,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Guardrails, Not Gotchas: Ethics, Policy, and Practice that Supports Real Learning","te":"Barandas, no trampas: ética, políticas y prácticas que apoyan el aprendizaje real","sh":"Guardrails, Not Gotchas: AI Ethics and Policy","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere D","p":"Prof. Christian Moriarty JD MA","po":"Professor, St Petersburg College","d":"Faculty across higher education are doing remarkable things with AI, and the policies supporting that work matter. This session offers practical, ethics-centered frameworks for building AI policies that genuinely serve learners, flexible enough to reflect your discipline, principled enough to defend. Walk away with tools you can use Monday morning.","de":"Docentes de toda la educación superior están haciendo cosas notables con la IA, y las políticas que acompañan ese trabajo importan. La sesión ofrece marcos prácticos centrados en la ética para construir políticas de IA que realmente sirvan a los estudiantes: lo bastante flexibles para reflejar cada disciplina y lo bastante fundamentadas para defenderlas. Herramientas para usar desde el lunes.","sm":""},{"id":123,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"High Expectations with High Structure: Redesign ideas for Digital Instruction in Higher Education","te":"Altas expectativas con alta estructura: ideas de rediseño para la enseñanza digital en la educación superior","sh":"High Expectations with High Structure","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere C","p":"Burcu Karabina","po":"Teaching Professor, university of Waterloo","d":"How do we maintain rigour without overwhelming students in complex courses? High expectations alone are not enough. This session translates cognitive science into practical design strategies. Experience a short lesson and see how structured learning can shift thinking from \"It doesn't make sense\" to \"Let me try this.\"","de":"¿Cómo mantener la exigencia sin abrumar a los estudiantes en cursos complejos? Las altas expectativas solas no alcanzan. La sesión traduce las ciencias cognitivas en estrategias de diseño prácticas. Con una breve clase de muestra, se ve cómo un aprendizaje estructurado puede llevar del \"no tiene sentido\" al \"a ver, lo intento\".","sm":""},{"id":124,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Incorporating LLMs into Written Assignments: Student Comparison of AI- vs. Student-Generated Writing","te":"Incorporar modelos de lenguaje en consignas escritas: estudiantes comparan textos generados por IA y por estudiantes","sh":"Students Compare AI- vs. Student-Generated Writing","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 6","p":"Elizabeth Bradley, Ph.D.","po":"Professor, SUNY Empire State University","d":"AI tools are both a challenge and opportunity in higher education. To engage students in deep learning, faculty are advised to take a process-oriented approach to written assignments while fostering AI literacy. This research evaluates the impact of incorporating LLMs into course assignments; methods, results, and recommendations will be discussed.","de":"Las herramientas de IA son a la vez un desafío y una oportunidad en la educación superior. Para promover un aprendizaje profundo, se recomienda abordar las consignas escritas con foco en el proceso y fomentar la alfabetización en IA. Esta investigación evalúa el impacto de incorporar modelos de lenguaje (LLM) en las consignas de un curso; se presentan métodos, resultados y recomendaciones.","sm":""},{"id":125,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Leveling Up: Climbing the AI Support Tiers for Student Success","te":"Subir de nivel: escalar los niveles de apoyo con IA para el éxito estudiantil","sh":"Leveling Up: AI Support Tiers for Student Success","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 5","p":"Adam Davi, M.A., M.S.","po":"Instructional Design Manager, University of Arizona","d":"Grab your climbing gear and get ready to scale the AI mountain of student support and explore tiers of student learning.  The AI mountain may look big from the bottom, but we’ll take you level by level to get to the top and deepen learning for students.","de":"Prepará el equipo de escalada para subir la \"montaña\" de la IA en el acompañamiento a estudiantes y explorar distintos niveles de aprendizaje. Desde abajo la montaña parece enorme, pero se avanza nivel por nivel hasta la cima para profundizar el aprendizaje de los estudiantes.","sm":""},{"id":126,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Luddite to Luddite: Making Sure You Don't Look Like a Dork in Instructional Videos","te":"De novato a novato: cómo no quedar mal en tus videos educativos","sh":"Getting Started with Instructional Videos","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 7","p":"Mara Driscoll","po":"Assistant Director of Instructional Technology, Lubbock Christian University","d":"You're teaching an online or hybrid course and need an engaging online presence. Now what? Social media content creators make video production look blissfully easy, but how the heck do you get started? Let's look at why and how instructors should be in front of the camera. Lights, Camera, Action!","de":"Das un curso online o híbrido y necesitás una presencia online atractiva. ¿Y ahora? Los creadores de contenido hacen que producir videos parezca facilísimo, pero ¿por dónde empezar? Por qué y cómo los docentes deberían ponerse frente a la cámara. ¡Luz, cámara, acción!","sm":""},{"id":127,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Mentoring Online Doctoral Students and Alumni Toward Scholarly Presentations and Publications","te":"Mentorear a doctorandos y graduados online hacia presentaciones y publicaciones académicas","sh":"Mentoring Online Doctoral Students","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 8","p":"Maggie Broderick, PhD","po":"Lead Faculty, National University","d":"This discovery session will present scenarios crafted from both research and personal experiences of mentoring online doctoral students and alumni toward scholarly presentations and publications. The goal is for attendees to have some strategies grounded in real-world scenarios to ponder. Let's share ideas to guide emerging scholars online!","de":"Esta sesión de conversación presenta escenarios basados en investigación y en experiencias propias de mentoría a doctorandos y graduados online hacia presentaciones y publicaciones académicas. La idea es que los asistentes se lleven estrategias basadas en casos reales para pensar. ¡Compartamos ideas para guiar a investigadores emergentes online!","sm":""},{"id":128,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Mission-Aligned AI in Adult Learning: Redesigning Online Programs with Cultural and Workplace Relevance","te":"IA alineada con la misión en la educación de adultos: rediseñar programas online con pertinencia cultural y laboral","sh":"Mission-Aligned AI in Adult Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Yan Xu, Ph.D.","po":"Online Program Director, Spelman College","d":"Explore a mission-aligned framework for redesigning online certificates for working adults while holding true to the HBCU institutional culture. This session showcases a co-design model integrating AI-supported pedagogies and Universal Design for Learning. Gain scalable strategies to ensure deep engagement and sustainable, personalized learning outcomes for diverse professional learners.","de":"Un marco alineado con la misión institucional para rediseñar certificados online para adultos que trabajan, respetando la cultura institucional de una HBCU. La sesión muestra un modelo de co-diseño que integra pedagogías con apoyo de IA y el Diseño Universal para el Aprendizaje, con estrategias escalables para lograr una participación profunda y resultados de aprendizaje sostenibles y personalizados para profesionales diversos.","sm":""},{"id":129,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Moving Beyond Detectors: Promoting Trust with AI in the Classroom","te":"Más allá de los detectores: promover la confianza con IA en el aula","sh":"Moving Beyond AI Detectors: Building Trust","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Stephanie Korslund, Ph.D.","po":"Senior Instructional Designer, University of Cincinnati","d":"Ditch the AI detector and explore practical strategies that promote trust and integrity with AI. Join us as we critically examine current practices and what can be done to develop more equitable approaches to integrity with AI. Walk away with ideas for creating more inclusive, integrity-driven AI-enhanced learning environments.","de":"Dejá de lado los detectores de IA y explorá estrategias prácticas que promuevan la confianza y la integridad. Se analizan críticamente las prácticas actuales y lo que se puede hacer para desarrollar enfoques más equitativos de integridad con IA, con ideas para crear entornos de aprendizaje con IA más inclusivos y basados en la integridad.","sm":""},{"id":130,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Navigating Online Writing Instruction in the Age of AI","te":"La enseñanza de la escritura online en la era de la IA","sh":"Online Writing Instruction in the Age of AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 2","p":"Jennifer Pellish, Ed.D.","po":"Online Instructor, Grand Canyon University","d":"As generative AI becomes commonplace, essay-only summative assessment no longer reliably evidences students’ composing, reasoning, and research. This session presents a practical approach to redesigning writing assessment around a coherent “assessment architecture” using lower-stakes artifacts to make learning observable, maintain rigor, and document process in AI-mediated writing.","de":"Con la IA generativa cada vez más presente, la evaluación sumativa basada solo en ensayos ya no muestra de forma confiable cómo los estudiantes escriben, razonan e investigan. La sesión presenta un enfoque práctico para rediseñar la evaluación de la escritura en torno a una \"arquitectura de evaluación\" coherente, con productos de menor peso que hacen observable el aprendizaje, sostienen la exigencia y documentan el proceso en una escritura mediada por IA.","sm":""},{"id":131,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Open Play in the Engagement Hub","te":"Juego libre en el Engagement Hub","sh":"Open Play (Engagement Hub)","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"Open Play invites participants to explore creativity, collaboration, and communication through interactive, hands-on activities. Using visual prompts from story cubes to generate spontaneous narratives, experience how simple images can spark imagination, flexible thinking, and creative expression. Through the collaborative challenge of the Mystery Box, discover how taking seemingly unrelated materials to solve a creative task can highlight teamwork, resourcefulness, and the value of diverse perspectives and skills. And maybe even engage in a face-to-face simulation of an online discussion forum, role-playing familiar participant types such as the expert, newbie, skeptic, cheerleader, lurker, and de-railer to examine how different communication styles influence group dialogue and engagement. Through laughter, experimentation, reflection, and discussion, participants will experience firsthand how low-stakes, playful activities can foster community, encourage participation, uncover group dynamics, and support deeper learning.","de":"Actividades lúdicas para explorar la creatividad, la colaboración y la comunicación: historias con dados de imágenes, el desafío de la Caja Misteriosa y la simulación presencial de un foro online. Muestran cómo las actividades de bajo riesgo fomentan la comunidad y la participación.","sm":""},{"id":132,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Pedagogical Penguinauts: Storytelling in Learning Design and Technology Labs","te":"Pingüinautas pedagógicos: storytelling en laboratorios de diseño de aprendizaje y tecnología","sh":"Storytelling in Online Labs","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 9","p":"Molly Caldera Arroyo, M.A.","po":"Learning Experience Designer, Baylor University","d":"Breaker! Breaker! This is Penguinaut, Scout, inviting you to an adventure about storytelling, curiosity, and evaluation rooted in instructional design best practices and principles. In this session, we will discuss the value of playfulness and character-driven learning in keeping learners engaged in online labs. Penguinauts—lift off!","de":"¡Atención, atención! Habla la pingüinauta Scout, que te invita a una aventura sobre storytelling, curiosidad y evaluación basada en buenas prácticas de diseño instruccional. La sesión aborda el valor del juego y del aprendizaje con personajes para sostener la participación en laboratorios online. Pingüinautas, ¡despegue!","sm":""},{"id":133,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Policy, Pills, and Playbills: Three AI-Enhanced Online Course Design Stories","te":"Políticas, pastillas y programas de teatro: tres historias de diseño de cursos online con IA","sh":"Three AI-Enhanced Course Design Stories","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Kimberly Hall","po":"Learning Designer, University of South Florida-Main Campus","d":"AI is reshaping higher education, emphasizing the need for purposeful, learning-centered AI integration. This session examines how learning designers and faculty incorporated AI into learning experiences while maintaining rigor and integrity, sharing three course examples with practical strategies, insights, and adaptable tips for effective AI use in online courses.","de":"La IA está transformando la educación superior y exige una integración intencional y centrada en el aprendizaje. La sesión muestra cómo diseñadores de aprendizaje y docentes incorporaron la IA en experiencias de aprendizaje manteniendo la exigencia y la integridad, con tres ejemplos de cursos, estrategias prácticas, aprendizajes y consejos adaptables para usar bien la IA en cursos online.","sm":""},{"id":134,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Raising the Bar: A Quality Scorecard for K-12 Blended Learning Programs","te":"Subir la vara: un scorecard de calidad para programas K-12 de aprendizaje híbrido","sh":"Quality Scorecard for K-12 Blended Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere A1/A2","p":"Dr. Kaye Shelton","po":"Professor, Educational Leadership, Lamar University","d":"K-12 blended learning contineus to grow but what constitutes quality remains underexplored. This paper presents the OLC Quality Scorecard for K-12 Blended Learning Programs. Drawing on current research and best practices, the scorecard provides K-12 educators with a practical tool for continuous program improvement, implications for policy, and program design.","de":"El aprendizaje híbrido en K-12 sigue creciendo, pero qué define su calidad sigue poco explorado. El trabajo presenta el OLC Quality Scorecard for K-12 Blended Learning Programs. Basado en investigación actual y buenas prácticas, ofrece a los educadores de K-12 una herramienta práctica para la mejora continua de los programas, con implicancias para las políticas y el diseño de programas.","sm":""},{"id":135,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Specifications Grading in Online Courses: Lessons from One Faculty Member's Journey","te":"Calificación por especificaciones en cursos online: lecciones del recorrido de un docente","sh":"Specifications Grading in Online Courses","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere E1/E2","p":"Dr. Leslie Gould","po":"Assistant Professor, Angelo State University","d":"Traditional grading systems often reward points over mastery. Specifications grading offers a alternative where faculty define standards, students meet them, and grades reflect real competence. In this workshop, participants will explore specifications grading, examine a real course implementation, and spend the majority of the session drafting their own framework.","de":"Los sistemas de calificación tradicionales suelen premiar los puntos más que el dominio. La calificación por especificaciones ofrece una alternativa: el docente define estándares, los estudiantes los alcanzan y la nota refleja la competencia real. En este taller se explora el enfoque, se analiza su implementación en un curso real y la mayor parte del tiempo se dedica a que cada participante esboce su propio marco.","sm":""},{"id":136,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Taming Wild AI: A Framework for Governed Practice in Online Professional Education","te":"Domar la IA salvaje: un marco para una práctica gobernada en la formación profesional online","sh":"Taming Wild AI in Professional Education","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 10","p":"Dr. Aman Sunder","po":"Dean, College for Financial Planning","d":"The Framework of AI-Augmented Advisory Performance (FAAP) shifts the conversation from “adding AI” to identifying the capabilities that remain scarce, defensible, and professionally required. Drawing on research in financial planning education, human-AI collaboration, and professional standards, presenters explore the distinction between governed and “wild” AI use in professional education.","de":"El marco FAAP (desempeño de asesoramiento aumentado con IA) cambia la conversación de \"agregar IA\" a identificar las capacidades que siguen siendo escasas, defendibles y exigidas por la profesión. A partir de investigación en formación en planificación financiera, colaboración humano-IA y estándares profesionales, se explora la diferencia entre un uso gobernado y un uso \"salvaje\" de la IA en la formación profesional.","sm":""},{"id":137,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"The Confidence Effect: What Drives Online STEM Students to Persist and Scale","te":"El efecto confianza: qué impulsa a los estudiantes online de STEM a persistir","sh":"The Confidence Effect: Online STEM Students","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 5","p":"Jaime Warren","po":"Labster, Labster","d":"New research shows 41% of online STEM students have questioned finishing their program and it's not quality and access driving that, it's confidence. See the data, then watch how immersive learning experiences turn that confidence gap into both an enrollment growth and retention advantage.","de":"Una nueva investigación muestra que el 41% de los estudiantes online de STEM dudó en terminar su carrera, y lo que lo explica no es la calidad ni el acceso, sino la confianza. Se presentan los datos y se muestra cómo experiencias de aprendizaje inmersivas convierten esa brecha de confianza en una ventaja tanto para la inscripción como para la retención.","sm":""},{"id":138,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"The power of personalized pathways for degree and non-degree programs","te":"El poder de los trayectos personalizados en programas con y sin título","sh":"Personalized Pathways with Adaptive AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Nathan Green","po":"Head of Growth, Skillwell","d":"With agentic and adaptive AI, institutions can finally deliver on the promise of personalized education, unlocking new programs for adult and online students and new pathways for corporate partnerships.","de":"Con IA agéntica y adaptativa, las instituciones por fin pueden cumplir la promesa de la educación personalizada, abriendo nuevos programas para estudiantes adultos y online y nuevos caminos para alianzas con empresas.","sm":""},{"id":139,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"The Sorcerer's AI Assistant: Are the Marching Broomsticks Helping Get the Job Done?","te":"El asistente de IA del aprendiz de brujo: ¿las escobas que marchan ayudan a terminar el trabajo?","sh":"The Sorcerer's AI Assistant","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 11","p":"Christopher Mong, Ph.D.","po":"Senior Instructional Designer, Purdue University-Main Campus","d":"Artificial intelligence is rapidly transforming course design, teaching, and learning. But are AI tools helping educators and students achieve better outcomes—or simply creating new challenges? Through guided discussion and collaborative activities, participants will explore faculty, instructional designer, and student perspectives on AI's role in online learning.","de":"La IA está transformando rápidamente el diseño de cursos, la enseñanza y el aprendizaje. Pero ¿las herramientas de IA ayudan a docentes y estudiantes a lograr mejores resultados, o solo generan nuevos desafíos? Con discusión guiada y actividades colaborativas, se exploran las miradas de docentes, diseñadores instruccionales y estudiantes sobre el papel de la IA en el aprendizaje online.","sm":""},{"id":140,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"To Infinity and Beyond Pixels: Building Online Courses Through Intentional Graphic Design","te":"Hasta el infinito y más allá de los píxeles: diseño gráfico intencional para cursos online","sh":"Intentional Graphic Design for Online Courses","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 12","p":"Tina Calandrino, M.Ed.","po":"Associate Instructional Designer, University of Central Florida","d":"\"Buzz\" into this interactive session where research shows that intentional visual design improves engagement, comprehension, and belonging for all learners in online courses. Discover practical, immediately applicable strategies for designing courses that are visually compelling, culturally aware, and built with every student in mind.","de":"Una sesión interactiva basada en investigación que muestra que un diseño visual intencional mejora la participación, la comprensión y la pertenencia de todos los estudiantes en cursos online. Estrategias prácticas y aplicables de inmediato para diseñar cursos visualmente atractivos, culturalmente sensibles y pensados para cada estudiante.","sm":""},{"id":141,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Using AI-Powered Classroom Simulations and Flexible Learning Environments to Reach Future Rural Teachers","te":"Simulaciones de aula con IA y entornos flexibles para llegar a futuros docentes rurales","sh":"AI Classroom Simulations for Future Rural Teachers","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 13","p":"Mark Gale","po":"Associate Professor of Instructional Design, Athens State University","d":"Rural teacher candidates may face barriers to frequent classroom placements and instructional coaching. Learn how AI-powered classroom simulations embedded within flexible learning environments can provide accessible, high-quality teaching practice and help future educators develop instructional skills through realistic scenarios, immediate feedback, and reflective practices.","de":"Los futuros docentes de zonas rurales pueden tener dificultades para acceder a prácticas frecuentes en el aula y a acompañamiento pedagógico. La sesión muestra cómo simulaciones de aula con IA, integradas en entornos de aprendizaje flexibles, ofrecen práctica docente accesible y de calidad, con escenarios realistas, retroalimentación inmediata y prácticas reflexivas.","sm":""},{"id":142,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"What’s Next for Digital Learning (and What to Do About It)","te":"Qué viene para el aprendizaje digital (y qué hacer al respecto)","sh":"What's Next for Digital Learning: Horizon Report","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 14","p":"Kim Arnold","po":"Director, Teaching and Learning Program, EDUCAUSE","d":"Explore how strategic foresight and futures thinking can help institutions navigate emerging challenges and opportunities in digital and online learning. Drawing on the 2026 EDUCAUSE T&L Horizon Report, participants will engage with signals of change, examine possible futures, and identify practical actions to support more intentional, future-focused strategies.","de":"Cómo la prospectiva estratégica y el pensamiento de futuros pueden ayudar a las instituciones a navegar desafíos y oportunidades emergentes en el aprendizaje digital y online. A partir del EDUCAUSE Horizon Report 2026 de enseñanza y aprendizaje, los participantes analizan señales de cambio, examinan futuros posibles e identifican acciones prácticas para estrategias más intencionales y orientadas al futuro.","sm":""},{"id":143,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"You Already Have What It Takes A Working Session on the Cognitive Prerequisite for AI Partnership","te":"Ya tenés lo que hace falta: sesión de trabajo sobre el requisito cognitivo para trabajar en equipo con la IA","sh":"The Cognitive Prerequisite for AI Partnership","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Tawnya Means","po":"Strategic Innovation & AI Advisor to the Provost, Bowling Green State University","d":"The prerequisite for thinking well with AI is not technical fluency. It is cognitive: the willingness to bring real problems, push back, and stay curious. This working session pairs evidence with practice, giving participants a chance to do partnership work in the room with a problem they are actually facing.","de":"El requisito para pensar bien con IA no es la fluidez técnica, sino cognitivo: la disposición a traer problemas reales, cuestionar y mantener la curiosidad. Esta sesión de trabajo combina evidencia y práctica, y da a los participantes la oportunidad de trabajar con la IA, en la sala, sobre un problema que realmente están enfrentando.","sm":""},{"id":144,"day":"Mar","s":1035,"e":1110,"b":"t-1715","t":"OLC Accelerate 2026 Engagement Hub Welcome Reception: Totally Rad Connections & Trivia!","te":"Recepción de bienvenida del Engagement Hub: conexiones ochentosas y trivia","sh":"Engagement Hub Welcome Reception & Trivia","ty":"Evening event","tye":"Evento","to":"Evening Event","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"Cheryl Fulghum","po":"Director of Instructional Design and Online Learning, Haywood Community College","d":"Step into our 80s-inspired Engagement Hub, where learning, networking, and friendly competition collide. Test your knowledge of 80s gaming, music, and film, while earning bragging rights and connecting with fellow attendees. Whether you're a pop culture pro or just here for the fun, the Engagement Hub is your go-to destination for building connections, sparking conversations, and making your OLC Accelerate experience truly unforgettable. So, grab your virtual mixtape and join us for a totally awesome adventure!","de":"Un Engagement Hub inspirado en los años 80, donde se mezclan aprendizaje, networking y competencia amistosa. Poné a prueba tus conocimientos sobre videojuegos, música y cine de los 80, ganá el derecho a presumir y conectá con otros asistentes. Seas experto en cultura pop o vengas solo a divertirte, es el lugar para hacer contactos, iniciar conversaciones y hacer inolvidable tu experiencia en OLC Accelerate.","sm":""},{"id":145,"day":"Mar","s":1035,"e":1110,"b":"t-1715","t":"OLC Accelerate 2026 Welcome Reception","te":"Recepción de bienvenida de OLC Accelerate 2026","sh":"Welcome Reception","ty":"Evening event","tye":"Evento","to":"Evening Event","tr":"","tre":"","loc":"Atlantic Exhibit Hall","p":"","po":"","d":"Wrap up your first full day at the conference by joining us in the exhibit hall for our Welcome Reception.  Connect with your fellow conference attendees, visit with our sponsors and exhibitors, and enjoy some food and refreshments.  This is a great time to work on completing your Totally Rad 80s Human Bingo card for a chance at prizes in the Engagement Hub, or finishing your exhibitor stamp card to enter that prize contest.  Don't forget to use your complimentary drink ticket!","de":"Para cerrar el primer día completo de la conferencia, recepción de bienvenida en el salón de exposiciones: conectá con otros asistentes, visitá a sponsors y expositores y disfrutá comida y bebidas. Es un buen momento para completar el bingo humano y participar por premios en el Engagement Hub, o terminar la tarjeta de sellos de expositores. ¡No te olvides de usar tu ticket de bebida de cortesía!","sm":""},{"id":146,"day":"Mie","s":360,"e":450,"b":"w-early","t":"Glow & Go 5K: Bright Minds in Motion Fun Run/Walk","te":"Glow & Go 5K: carrera/caminata recreativa","sh":"Glow & Go 5K","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Walt Disney World Swan (causeway entrance)","p":"","po":"","d":"Join us as we light up the morning and set our bright minds in motion with a 5K fun run/walk on Wednesday, November 18, during the OLC Accelerate conference. Lace up your sneakers and experience a scenic route through the beautiful EPCOT Resorts area, starting and finishing at the iconic Walt Disney World Swan (causeway entrance). Whether you’re a dedicated runner or a casual walker, this is the perfect way to kick off your day with some energizing exercise, fresh air, and a bit of Disney magic!","de":"Una carrera/caminata recreativa de 5 km el miércoles 18 de noviembre, durante la conferencia. Un recorrido escénico por la zona de los resorts de EPCOT, con salida y llegada en el emblemático Walt Disney World Swan (entrada por la calzada). Seas corredor o caminante ocasional, es una forma ideal de empezar el día con ejercicio, aire libre y un poco de magia Disney.","sm":""},{"id":147,"day":"Mie","s":480,"e":960,"b":"w-early","t":"The Sanctuary","te":"The Sanctuary (sala de descanso)","sh":"The Sanctuary (quiet room)","ty":"General","tye":"General","to":"Other","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"","po":"","d":"Our Sanctuary room is a quiet, reflective space available for all conference attendees to use. This is a quiet space room where disturbances should be kept to a minimum to allow conference attendees to rest and recharge. The Sanctuary room is open during regular conference hours. During the conference, join us for some quiet time to decompress, reconnect mind and body, and practice some self-care as we turn our focus inward for a short while. Mindfulness has been defined as a practice of “bringing one’s attention to the internal and external experiences occurring in the present moment” (Baer, 2003). Join us in the Sanctuary today for some special mindfulness sessions (see the engagement schedule), or just to relax and decompress a bit throughout the day.","de":"Espacio tranquilo y de reflexión abierto durante el horario de la conferencia para descansar, recargar energía y participar de sesiones de mindfulness.","sm":""},{"id":148,"day":"Mie","s":480,"e":570,"b":"w-early","t":"OLC Awards Recognition, Breakfast Celebration, and Fellows Panel","te":"Reconocimientos OLC, desayuno de celebración y panel de Fellows","sh":"Awards Breakfast & Fellows Panel","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Pacific Hall B/C","p":"","po":"","d":"Join us for breakfast, where will will recognize our OLC Awards of Excellence winners, OLC Fellows awardees, and our conference volunteers, followed by a panel discussion among our OLC Fellows.","de":"Desayuno en el que se reconoce a los ganadores de los OLC Awards of Excellence, a los nuevos OLC Fellows y a los voluntarios de la conferencia, seguido de un panel con los OLC Fellows.","sm":""},{"id":149,"day":"Mie","s":525,"e":570,"b":"w-early","t":"OLC Accelerate 2026 OLC Fellows Awards Panel","te":"Panel de los OLC Fellows 2026","sh":"OLC Fellows Panel","ty":"Plenary","tye":"Plenaria","to":"Plenary Address","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Pacific Hall B/C","p":"Dylan Barth, Ph.D. - moderator","po":"VP of Innovation and Programs, Online Learning Consortium","d":"Immediately following the OLC Awards presentation, please join us for an engaging panel featuring the 2026 OLC Fellows, distinguished leaders who have made significant contributions to the field of online, blended, and digital learning. The incoming Fellows will share insights from their work, reflect on the evolving landscape of digital education, and offer their perspectives on the challenges and opportunities ahead. The panel will be moderated by OLC Vice President of Innovation and Programs, Dr. Dylan Barth. Don’t miss this opportunity to hear from some of the field’s most innovative thinkers and dedicated practitioners.","de":"Inmediatamente después de los reconocimientos, un panel con los OLC Fellows 2026, líderes destacados que hicieron aportes significativos al aprendizaje online, híbrido y digital. Compartirán aprendizajes de su trabajo, reflexionarán sobre la evolución de la educación digital y darán su mirada sobre los desafíos y oportunidades que vienen. Modera el Dr. Dylan Barth, VP de Innovación y Programas de OLC.","sm":""},{"id":150,"day":"Mie","s":570,"e":900,"b":"w-early","t":"The OLC Accelerate 2026 Engagement Hub","te":"Engagement Hub de OLC Accelerate 2026","sh":"Engagement Hub","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"At OLC Accelerate 2026 we invite attendees to visit the Engagement Hub, a dynamic space designed for connection, creativity, and community building. Attendees will collaborate in activities that foster peer connection, idea exchange, and just have fun!! Come see us in the Engagement Hub where the goal is simple: spark lasting connections, surface new perspectives, and empower everyone—from emerging professionals to senior leadership. Plan to contribute, converse, and create real-time connection. The Engagement Hub is open during regular exhibit hours.  Check the schedule for specific session times. Note:  Your Bingo cards can be turned in at the Engagement Hub during evening receptions, networking coffee breaks, and lunch time for Skeeball play and a chance to win fun prizes.  Don't miss our Lite Brite photo op as well!","de":"Espacio de conexión, creatividad y comunidad abierto en el horario del salón de exposiciones. Ahí se canjean los cartones de bingo para jugar Skeeball y participar por premios.","sm":""},{"id":151,"day":"Mie","s":570,"e":630,"b":"w-0945","t":"AI Exploration Zone - Open Exploration","te":"AI Exploration Zone: exploración abierta","sh":"AI Exploration Zone","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"","tre":"","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Stop watching AI from the sidelines. Open Exploration treats you as a lifelong learner with a question worth working on. Bring a teaching or learning challenge and use the space to work on it with support from experienced guides and access to a range of AI tools. There are no canned demos and no expectation that you arrive with AI expertise. Our emphasis is on curiosity and hands-on experimentation that leads you somewhere useful.","de":"Traé un desafío de enseñanza o aprendizaje y trabajalo con guías y distintas herramientas de IA. No hay demos armadas ni hace falta experiencia previa.","sm":""},{"id":152,"day":"Mie","s":570,"e":630,"b":"w-0945","t":"Open Play in the Engagement Hub","te":"Juego libre en el Engagement Hub","sh":"Open Play (Engagement Hub)","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"Open Play invites participants to explore creativity, collaboration, and communication through interactive, hands-on activities. Using visual prompts from story cubes to generate spontaneous narratives, experience how simple images can spark imagination, flexible thinking, and creative expression. Through the collaborative challenge of the Mystery Box, discover how taking seemingly unrelated materials to solve a creative task can highlight teamwork, resourcefulness, and the value of diverse perspectives and skills. And maybe even engage in a face-to-face simulation of an online discussion forum, role-playing familiar participant types such as the expert, newbie, skeptic, cheerleader, lurker, and de-railer to examine how different communication styles influence group dialogue and engagement. Through laughter, experimentation, reflection, and discussion, participants will experience firsthand how low-stakes, playful activities can foster community, encourage participation, uncover group dynamics, and support deeper learning.","de":"Actividades lúdicas para explorar la creatividad, la colaboración y la comunicación: historias con dados de imágenes, el desafío de la Caja Misteriosa y la simulación presencial de un foro online. Muestran cómo las actividades de bajo riesgo fomentan la comunidad y la participación.","sm":""},{"id":153,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"“You’ve Got a Friend in Me” — Building Trust Through Human-Centered Online Advising and Mentoring","te":"\"Yo soy tu amigo fiel\": construir confianza con orientación y mentoría online centradas en las personas","sh":"Human-Centered Online Advising and Mentoring","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 5","p":"Dr. Molly A. West","po":"Associate Teaching Professor, The University of Tennessee-Knoxville","d":"Help your students reach for infinity and beyond! Online students thrive when advising and mentoring feel personal and consistent. This session explores human-centered strategies and best practices for building trust in virtual spaces through authentic communication, proactive outreach, and intentional connection. Attendees will learn to foster belonging and student success.","de":"¡Ayudá a tus estudiantes a llegar al infinito y más allá! Los estudiantes online prosperan cuando la orientación y la mentoría se sienten personales y consistentes. La sesión explora estrategias centradas en las personas y buenas prácticas para construir confianza en espacios virtuales mediante comunicación auténtica, contacto proactivo y conexión intencional, para fomentar la pertenencia y el éxito estudiantil.","sm":""},{"id":154,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"101 Ways to Succeed (Actually Just Three): A Unified Approach to Campus Resources and Adjunct Faculty Development","te":"101 formas de tener éxito (en realidad, tres): un enfoque unificado de recursos institucionales y formación de docentes adjuntos","sh":"Unified Student Resources and Adjunct Development","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Dr. Jill Winnington","po":"Director of Online Learning, Goldey-Beacom College","d":"This session presents a three-part model for improving online student and adjunct support. Together, these Canvas-based resource hubs, Student 101 and Faculty 101, and facilitated training, Teaching 101, reduce confusion, increase consistency, strengthen teaching readiness, and create a more connected, supportive, and effective online learning environment for all.","de":"La sesión presenta un modelo de tres partes para mejorar el apoyo a estudiantes online y docentes adjuntos: espacios de recursos en Canvas (Student 101 y Faculty 101) y una capacitación facilitada (Teaching 101) que, juntos, reducen la confusión, aumentan la consistencia, fortalecen la preparación docente y crean un entorno online más conectado, contenedor y eficaz para todos.","sm":""},{"id":155,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"A Tale of Two IDs: Two Approaches to Vibe Coding in Online Course Development","te":"Historia de dos diseñadores: dos enfoques de vibe coding en el desarrollo de cursos online","sh":"A Tale of Two IDs: Two Approaches to Vibe Coding","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"Joy Oettel","po":"Instructional Designer and Developer, The University of Tennessee-Knoxville","d":"Explore how two instructional designers successfully integrate AI \"vibe coding\" across different course development contexts. From LMS embeds to complex SCORM-packaged interactives, discover complementary workflows for building engaging activities. Attendees will gain practical strategies to  integrate AI-supported workflows into their own course development process","de":"Cómo dos diseñadores instruccionales integran con éxito el \"vibe coding\" con IA en distintos contextos de desarrollo de cursos: desde elementos insertados en el LMS hasta interactivos complejos empaquetados en SCORM. Se presentan flujos de trabajo complementarios para crear actividades atractivas y estrategias prácticas para integrar la IA en el propio proceso de desarrollo.","sm":""},{"id":156,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"A Whole New Workshop: Redesigning Faculty Development for Focused Virtual Learning","te":"Un taller completamente nuevo: rediseñar la formación docente para un aprendizaje virtual enfocado","sh":"Redesigning Faculty Development for Virtual Learning","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 1","p":"Connie Hahn","po":"Lead Instructional Designer, Purdue University-Main Campus","d":"Moving a workshop online takes more than shortening the agenda. Explore how a comprehensive faculty workshop became three focused, one-hour virtual working sessions where instructors applied strategies to a specific online course. Follow-up survey data highlighted course changes, planned behavior shifts, and the value of interaction and collaboration.","de":"Llevar un taller a modalidad online implica más que acortar la agenda. Cómo un taller docente integral se convirtió en tres sesiones virtuales de trabajo de una hora, en las que los docentes aplicaron estrategias a un curso online concreto. Los datos de la encuesta de seguimiento muestran cambios en los cursos, cambios de conducta previstos y el valor de la interacción y la colaboración.","sm":""},{"id":157,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"AI 2 Xcelerate: Accelerating AI Growth Through Personalized Action Plans","te":"AI 2 Xcelerate: acelerar el desarrollo en IA con planes de acción personalizados","sh":"AI 2 Xcelerate: Personalized AI Action Plans in a Learning Community","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 2","p":"Dorothy Hirata, Ph.D.","po":"Instructional Design Manager, University of Hawaii System Office","d":"Introducing the AI 2 Xcelerate program, this session shares how participants drive impactful integration through the implementation of personalized action plans. Explore how a system-wide professional learning community uplifts cross-disciplinary collaboration and empowers a diverse cohort to explore and innovate together on a joyful journey of collective growth.","de":"La sesión presenta el programa AI 2 Xcelerate y muestra cómo los participantes logran una integración con impacto a través de planes de acción personalizados. Se explora cómo una comunidad de aprendizaje profesional a nivel de todo el sistema impulsa la colaboración entre disciplinas y empodera a una cohorte diversa para explorar e innovar en conjunto, en un recorrido de crecimiento colectivo.","sm":""},{"id":158,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"AI as Cognitive Scaffolding: Supporting Neurodivergent Learners and Educators","te":"La IA como andamiaje cognitivo: acompañar a estudiantes y educadores neurodivergentes","sh":"AI as Cognitive Scaffolding for Neurodivergent Learners","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 5","p":"Sherri Restauri","po":"Director of Professional Learning, Online Learning Consortium","d":"Artificial intelligence can serve as cognitive scaffolding for neurodivergent individuals navigating executive dysfunction, cognitive overload, and information processing challenges. This session explores practical AI-supported strategies for organization, communication, planning, and learning while critically examining ethical considerations, accessibility, and inclusive digital learning design.","de":"La IA puede funcionar como andamiaje cognitivo para personas neurodivergentes que enfrentan dificultades en las funciones ejecutivas, sobrecarga cognitiva o en el procesamiento de información. La sesión explora estrategias prácticas con apoyo de IA para organizarse, comunicarse, planificar y aprender, y analiza críticamente las consideraciones éticas, la accesibilidad y el diseño inclusivo del aprendizaje digital.","sm":""},{"id":159,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"AI in Action: Turning Faculty Curiosity into Confident Practice","te":"IA en acción: de la curiosidad docente a una práctica con confianza","sh":"An AI Literacy Course for Online Faculty","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 3","p":"Dr. Julia Hart","po":"Dean, Faculty Development, Services, and Support, Columbia Southern University","d":"This session explores the design and implementation of an AI literacy course for online faculty, focused on practical application, ethical use, and student-centered teaching. Participants will learn strategies for integrating AI into instruction, assessment, and engagement while maintaining academic integrity and meaningful faculty presence in the online classroom.","de":"La sesión explora el diseño y la implementación de un curso de alfabetización en IA para docentes online, enfocado en la aplicación práctica, el uso ético y una enseñanza centrada en el estudiante. Se presentan estrategias para integrar la IA en la enseñanza, la evaluación y la participación, manteniendo la integridad académica y una presencia docente significativa en el aula online.","sm":""},{"id":160,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"An Internship to Remember: Setting Learners up for Long-Term Career Success","te":"Una pasantía para recordar: preparar a los estudiantes para el éxito profesional a largo plazo","sh":"An Internship to Remember: Setting Learners Up for Career Success","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 4","p":"Brittany Huffman","po":"GPSU Manager, Guidepoint Security","d":"While working to build a pipeline of future cybersecurity experts, our organization created an engaging, inclusive internship for a fully remote world. Through live virtual training, asynchronous content, and individual mentorship, interns leave ready to tackle pressing industry challenges. Our program has data showing strong retention and lasting mentor relationships.","de":"Para formar una cantera de futuros expertos en ciberseguridad, esta organización creó una pasantía atractiva e inclusiva en modalidad totalmente remota. Con capacitación virtual en vivo, contenido asincrónico y mentoría individual, los pasantes terminan preparados para enfrentar desafíos reales del sector. El programa tiene datos que muestran alta retención y vínculos de mentoría duraderos.","sm":""},{"id":161,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond Compliance: What Happens After the Course Review?","te":"Más allá del cumplimiento: ¿qué pasa después de la revisión de un curso?","sh":"What Happens After the Course Review?","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 5","p":"Dr. Nasiha Lachaud","po":"Director of Instructional Design, Texas A&M - Texarkana","d":"Institutional course reviews often surface recurring challenges related to alignment, course structure, and interaction. This session explores how institutions can move from review findings to actionable learning design practices through faculty support, clearer expectations, and scalable approaches to online course improvement.","de":"Las revisiones institucionales de cursos suelen mostrar problemas recurrentes de alineación, estructura e interacción. La sesión explora cómo pasar de los hallazgos de la revisión a prácticas de diseño concretas, con apoyo a los docentes, expectativas más claras y enfoques escalables para mejorar los cursos online.","sm":""},{"id":162,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond Course Builders: Instructional Designers as Catalysts for Institutional Innovation","te":"Más allá de armar cursos: los diseñadores instruccionales como catalizadores de la innovación institucional","sh":"Instructional Designers as Catalysts for Innovation","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 4","p":"Ashley Bondurant,PT, DPT, M.Ed","po":"Instructional Designer, Medical University of South Carolina","d":"Instructional designers are increasingly leading innovation initiatives that extend beyond course development. This session explores how instructional designers can drive strategic change through faculty development, educational technology implementation, AI initiatives, quality improvement efforts, and cross-campus partnerships.","de":"Los diseñadores instruccionales lideran cada vez más iniciativas de innovación que van más allá del desarrollo de cursos. La sesión explora cómo pueden impulsar cambios estratégicos a través de la formación docente, la implementación de tecnología educativa, iniciativas de IA, la mejora de la calidad y alianzas entre áreas de la institución.","sm":""},{"id":163,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond Onboarding: A Case Study in Building Community, Quality, and Culture Among Online Adjunct Faculty","te":"Más allá de la inducción: un caso de construcción de comunidad, calidad y cultura entre docentes adjuntos online","sh":"Building Community Among Online Adjunct Faculty","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere D","p":"Jennie Harrop, PhD, DMin, MFA","po":"Dean, George Fox University","d":"As online programs scale, adjunct faculty need more than orientation. This case study examines how George Fox Digital redesigned faculty development to foster community, strengthen instructional quality, reinforce institutional culture, and create a sustainable framework for engaging and supporting a geographically distributed adjunct workforce.","de":"A medida que crecen los programas online, los docentes adjuntos necesitan más que una orientación inicial. Este caso analiza cómo George Fox Digital rediseñó la formación docente para fomentar la comunidad, fortalecer la calidad de la enseñanza, reforzar la cultura institucional y crear un marco sostenible para involucrar y acompañar a docentes geográficamente dispersos.","sm":""},{"id":164,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond the Final Answer: AI, Critical Thinking, and Process-Based Assessment","te":"Más allá de la respuesta final: IA, pensamiento crítico y evaluación del proceso","sh":"Beyond the Final Answer: AI, Critical Thinking and Process-Based Assessment","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Judith Littlejohn","po":"Director of Online Learning, Genesee Community College","d":"A practical framework for moving from \"AI-resistant\" to \"AI-ready\" course design. Participants will explore five key assessment shifts: process-based assessment, metacognitive reflection, judgment-focused assignments, structured oral components, and clear AI disclosure expectations. Participants will acquire practical tools for creating assignments emphasizing human thinking, reflection, and judgment rather than AI-generated products.","de":"Un marco práctico para pasar de un diseño de cursos \"resistente a la IA\" a uno \"preparado para la IA\". Se exploran cinco cambios clave en la evaluación: evaluar el proceso, la reflexión metacognitiva, consignas centradas en el juicio, instancias orales estructuradas y expectativas claras sobre la declaración del uso de IA. Los participantes se llevan herramientas para diseñar consignas que pongan en valor el pensamiento, la reflexión y el juicio humanos por sobre los productos generados por IA.","sm":""},{"id":165,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond the Lab: Bringing Health Science Skills Home","te":"Más allá del laboratorio: llevar las habilidades de ciencias de la salud a casa","sh":"Bringing Health Science Skills Home","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 2","p":"Brandy Fleming","po":"Business Development Manager, Carolina Distance Learning","d":"Explore how Carolina Distance Learning helps nursing and phlebotomy programs expand skills training beyond the traditional lab. Attendees will learn how comprehensive at-home nursing and phlebotomy kits, digital resources, and faculty support create authentic hands-on experiences that improve flexibility, increase practice opportunities, and support student success.","de":"Cómo Carolina Distance Learning ayuda a programas de enfermería y flebotomía a extender la práctica de habilidades más allá del laboratorio tradicional. Kits completos para practicar en casa, recursos digitales y apoyo a los docentes que generan experiencias prácticas auténticas, más flexibilidad, más oportunidades de práctica y mejores resultados para los estudiantes.","sm":""},{"id":166,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond the Slide Deck: A Practical Framework for Transforming Static Content into Accessible, Engaging Online Learning","te":"Más allá de las diapositivas: un marco práctico para transformar contenido estático en ap
