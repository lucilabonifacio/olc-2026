ada a una estrategia coordinada de aprendizaje digital. Los participantes conversan sobre dominios comunes, competencias por rol, desafíos de implementación y próximos pasos para alinear la gobernanza, la formación y el apoyo entre los distintos roles de la institución.","sm":""},{"id":224,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"From Skill-Collector to Value Architect: Designing Your Professional Story","te":"De coleccionista de habilidades a arquitecto de valor: diseñar tu historia profesional","sh":"From Skill-Collector to Value Architect: Designing Your Professional Story","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 4","p":"Ed Buchanan","po":"Consultant, Independent Consultant","d":"Stop listing skills—start demonstrating value. This interactive session shows how to transform your experience into compelling professional stories that drive connection, trust, and opportunity. Learn a simple framework to clearly communicate your impact and add value in any learning environment.","de":"Dejá de enumerar habilidades y empezá a demostrar valor. Esta sesión interactiva muestra cómo transformar tu experiencia en historias profesionales convincentes que generen conexión, confianza y oportunidades, con un marco simple para comunicar con claridad tu impacto y aportar valor en cualquier entorno de aprendizaje.","sm":""},{"id":225,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Guiding Light: Embedding Accessibility into Online Learning from Day One","te":"Una luz guía: integrar la accesibilidad en el aprendizaje online desde el primer día","sh":"Embedding Accessibility from Day One","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere E1/E2","p":"Raul Pineda","po":"Assistant Director of Educational Technology, University of Texas at Austin","d":"Accessible learning starts at ideation. This session helps educators, instructional designers, and leaders build from the beginning with the mindset, strategies, and processes to embed accessibility from day one, align with WCAG 2.1 Level AA requirements, and make informed design decisions using real-world examples so students light up with learning.","de":"El aprendizaje accesible empieza en la ideación. La sesión ayuda a docentes, diseñadores instruccionales y líderes a construir desde el inicio con la mentalidad, las estrategias y los procesos para integrar la accesibilidad desde el primer día, cumplir con WCAG 2.1 nivel AA y tomar decisiones de diseño informadas a partir de ejemplos reales.","sm":""},{"id":226,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"How Virtual Communities Drive Online Student Retention","te":"Cómo las comunidades virtuales impulsan la permanencia de los estudiantes online","sh":"How Virtual Communities Drive Retention","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 1","p":"Katy Kappler","po":"Co-Founder and CEO, InScribe","d":"Drawing on insights from institutions such as Maryland Global Campus, Alamo Colleges Online, and the evolution of online learning, Katy will examine how institutions can intentionally create environments where students develop a sense of belonging, connection, and social capital—the relationships and networks that help students navigate challenges, access resources, find support, and ultimately feel that they have a place within their institution.","de":"A partir de la experiencia de instituciones como Maryland Global Campus y Alamo Colleges Online, y de la evolución del aprendizaje online, Katy analiza cómo las instituciones pueden crear con intención entornos donde los estudiantes desarrollen pertenencia, conexión y capital social: las relaciones y redes que los ayudan a enfrentar dificultades, acceder a recursos, encontrar apoyo y sentir que tienen un lugar en su institución.","sm":""},{"id":227,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Mind the Gap: Designing for Student Thinking in an AI-Driven World","te":"Atención a la brecha: diseñar para el pensamiento de los estudiantes en un mundo impulsado por la IA","sh":"Mind the Gap: Designing for Student Thinking in an AI-Driven World","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere V","p":"Dylan Barth, Ph.D.","po":"Vice President of Innovation and Programs, Online Learning Consortium","d":"AI can support learning, but overreliance may weaken critical thinking and intellectual agency. This session draws upon three diverse roles to explore how intentional design can ensure AI serves as a scaffold, not a substitute, while offering practical strategies to preserve higher-order thinking across diverse higher education contexts.","de":"La IA puede apoyar el aprendizaje, pero la dependencia excesiva puede debilitar el pensamiento crítico y la autonomía intelectual. La sesión recoge la mirada de tres roles distintos para explorar cómo un diseño intencional puede asegurar que la IA funcione como andamiaje y no como reemplazo, con estrategias prácticas para preservar el pensamiento de orden superior en distintos contextos de educación superior.","sm":""},{"id":228,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Not Another AI Training: Building AI Capacity Through Confidence, Use Cases, and Shared Practice","te":"No otra capacitación en IA: desarrollar capacidades a través de la confianza, los casos de uso y la práctica compartida","sh":"Not Another AI Training: Building AI Capacity Through Shared Practice","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere IV","p":"Nathan Pritts, Ph.D.","po":"Principal AI Strategist, University of Arizona Global Campus","d":"AI readiness requires more than workshops, tool demos, or prompt-writing sessions. This session explores how institutions can build capacity through confidence, practical use cases, shared practice, and continuous improvement. Participants will consider strategies for supporting experimentation, reducing burnout, aligning AI with goals, and scaling impact across teams.","de":"Estar preparados para la IA requiere más que talleres, demos de herramientas o sesiones de prompts. La sesión explora cómo las instituciones pueden desarrollar capacidades a través de la confianza, casos de uso prácticos, la práctica compartida y la mejora continua, con estrategias para apoyar la experimentación, reducir el agotamiento, alinear la IA con los objetivos y escalar el impacto entre equipos.","sm":""},{"id":229,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Open Play in the Engagement Hub","te":"Juego libre en el Engagement Hub","sh":"Open Play (Engagement Hub)","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"Open Play invites participants to explore creativity, collaboration, and communication through interactive, hands-on activities. Using visual prompts from story cubes to generate spontaneous narratives, experience how simple images can spark imagination, flexible thinking, and creative expression. Through the collaborative challenge of the Mystery Box, discover how taking seemingly unrelated materials to solve a creative task can highlight teamwork, resourcefulness, and the value of diverse perspectives and skills. And maybe even engage in a face-to-face simulation of an online discussion forum, role-playing familiar participant types such as the expert, newbie, skeptic, cheerleader, lurker, and de-railer to examine how different communication styles influence group dialogue and engagement. Through laughter, experimentation, reflection, and discussion, participants will experience firsthand how low-stakes, playful activities can foster community, encourage participation, uncover group dynamics, and support deeper learning.","de":"Actividades lúdicas para explorar la creatividad, la colaboración y la comunicación: historias con dados de imágenes, el desafío de la Caja Misteriosa y la simulación presencial de un foro online. Muestran cómo las actividades de bajo riesgo fomentan la comunidad y la participación.","sm":""},{"id":230,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Piloting AI at Scale: Lessons in Change Management, Capacity Building, and Knowing What You Don't Know","te":"Pilotear IA a escala: lecciones sobre gestión del cambio, desarrollo de capacidades y saber lo que no sabés","sh":"Piloting AI at Scale: Lessons in Change Management","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Keegan Long-Wheeler","po":"Lead Educational Technologist, OU Education Services","d":"OU Education Services manages large-scale course production across dozens of University of Oklahoma programs. This session documents what happened when they piloted AI across real EdTech workflows: Canvas automation, course QA tools, PowerPoint migrations, and learning app development. Practical lessons for institutions trying to move from experimentation to intentional practice.","de":"OU Education Services gestiona la producción de cursos a gran escala para decenas de programas de la University of Oklahoma. La sesión documenta qué pasó cuando pilotearon la IA en flujos de trabajo reales de tecnología educativa: automatización en Canvas, herramientas de control de calidad, migraciones de PowerPoint y desarrollo de apps de aprendizaje. Lecciones prácticas para pasar de la experimentación a una práctica intencional.","sm":""},{"id":231,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Reflect to Refine: A Practical Reflection Tool for Adjunct Online Teaching Excellence","te":"Reflexionar para mejorar: una herramienta práctica de reflexión para la excelencia de docentes adjuntos online","sh":"A Self-Reflection Tool for Adjunct Online Teaching","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 8","p":"Dr. Jill Winnington","po":"Director of Online Learning, Goldey-Beacom College","d":"This interactive session presents a practical self-assessment survey for adjunct online instructors that reflects on course design, engagement, and improvement. Participants will explore how the tool can enhance the quality of online teaching.","de":"Esta sesión interactiva presenta una encuesta de autoevaluación práctica para docentes adjuntos online, que invita a reflexionar sobre el diseño del curso, la participación y la mejora, y explora cómo puede elevar la calidad de la enseñanza online.","sm":""},{"id":232,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Restoring Trust in Assessment: Evidence from AI-Enabled Oral Exams Across Higher Ed and K–12","te":"Recuperar la confianza en la evaluación: evidencia de exámenes orales con IA en educación superior y K-12","sh":"Restoring Trust in Assessment: AI-Enabled Oral Exams in Higher Ed and K-12","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 8","p":"Bivin Sadler, Ph.D.","po":"Clinical Associate Professor of Data Science, Southern Methodist University","d":"As generative AI challenges traditional assessment, oral exams offer a path toward authentic evaluation but are difficult to scale. This session presents early mixed-methods evidence from AI-supported oral exams across higher education and K-12 settings, including student and instructor perceptions, pre/post learning outcomes, and implementation lessons.","de":"Ante el desafío que la IA generativa plantea a la evaluación tradicional, los exámenes orales ofrecen un camino hacia una evaluación auténtica, pero son difíciles de escalar. La sesión presenta evidencia preliminar de métodos mixtos sobre exámenes orales con apoyo de IA en educación superior y K-12: percepciones de estudiantes y docentes, resultados de aprendizaje pre/post y aprendizajes de la implementación.","sm":""},{"id":233,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Supporting Online Graduate Students with Literature Review Synthesis: Illuminating Scholarly Thinking in Digital Spaces","te":"Acompañar a estudiantes de posgrado online en la síntesis de la revisión bibliográfica","sh":"Supporting Graduate Literature Reviews","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 9","p":"Lisa St. Louis, PhD, MEd","po":"Full Professor, National University","d":"Let’s shine a light on practices for guiding online graduate students through the often-daunting process of writing a solid literature review! Participants will share feedback on their experiences teaching literature review at the graduate level and will leave with fresh insight on how online students can master this essential skill.","de":"Prácticas para guiar a estudiantes de posgrado online en el proceso, muchas veces abrumador, de escribir una buena revisión bibliográfica. Los participantes comparten sus experiencias enseñando revisión de literatura en posgrado y se llevan nuevas ideas sobre cómo los estudiantes online pueden dominar esta habilidad clave.","sm":""},{"id":234,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Teaching in the Age of AI: Redefining Trust, Authority, and Control in Learning","te":"Enseñar en la era de la IA: redefinir la confianza, la autoridad y el control en el aprendizaje","sh":"Teaching in the Age of AI: Trust, Authority and Control","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 1","p":"Wendy Wallberg, JD, LL.M","po":"Associate Professor, Lynn University","d":"This session examines how increasing student reliance on AI is reshaping perceptions of authority in the classroom. Through familiar scenarios and guided discussion, participants explore shifts in trust, expertise, and control, and gain practical strategies for designing learning experiences that promote critical thinking and reduce uncritical dependence on AI.","de":"La sesión analiza cómo la creciente dependencia de los estudiantes respecto de la IA está cambiando la percepción de autoridad en el aula. A través de situaciones conocidas y discusión guiada, se exploran cambios en la confianza, la experticia y el control, con estrategias prácticas para diseñar experiencias que promuevan el pensamiento crítico y reduzcan la dependencia acrítica de la IA.","sm":""},{"id":235,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Teaching Through Tales: The Power of Storytelling with Multimedia","te":"Enseñar con historias: el poder del storytelling multimedia","sh":"Multimedia Storytelling","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 10","p":"Kate Bowersox","po":"Director, Center for Digital Education, Washington University in Saint Louis","d":"Learn to create engaging digital stories for your courses. This session covers planning, design, and integration, offering a logical workflow to maximize impact. We'll address challenges like time and alignment with learning objectives. Leave with new ideas and a reusable framework to enhance your teaching through multimedia storytelling.","de":"Cómo crear historias digitales atractivas para tus cursos: planificación, diseño e integración, con un flujo de trabajo lógico para maximizar el impacto. Se abordan desafíos como el tiempo y la alineación con los objetivos de aprendizaje. Los participantes se llevan nuevas ideas y un marco reutilizable para enriquecer su enseñanza con storytelling multimedia.","sm":""},{"id":236,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"The Future of Faculty Infrastructure: Centralization as a Strategic Lever","te":"El futuro de la infraestructura docente: la centralización como palanca estratégica","sh":"Centralizing Faculty Operations","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 11","p":"Dr. Bryan Aylward","po":"AVP, Office of Academic Innovation, Operations, & Technology, University of Arizona","d":"This session examines how the University of Arizona Global Campus redesigned faculty operations through a centralized lifecycle model. By integrating scheduling, contracts, payroll, compliance, and performance systems into a unified platform, the initiative reduced administrative complexity, improved data integrity, strengthened compliance, and enabled scalable, data-informed decision-making aligned with institutional strategy.","de":"La sesión analiza cómo University of Arizona Global Campus rediseñó la gestión de sus docentes con un modelo centralizado de todo el ciclo. Al integrar en una plataforma única la asignación de horarios, contratos, liquidación de sueldos, cumplimiento y desempeño, la iniciativa redujo la complejidad administrativa, mejoró la calidad de los datos, fortaleció el cumplimiento y habilitó decisiones escalables basadas en datos y alineadas con la estrategia institucional.","sm":""},{"id":237,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"The Mindful Meeting Makeover: Designing Meetings That Foster Presence, Participation, and Purpose","te":"Renovar las reuniones con mindfulness: reuniones que favorezcan la presencia, la participación y el propósito","sh":"The Mindful Meeting Makeover","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Asia 5","p":"Maxine Frendel, MA","po":"Manager, Design and Development, Western Governors University","d":"Too many meetings leave participants distracted, disengaged, and wondering why they were there. This interactive session explores how mindfulness principles can transform meetings into more purposeful, engaging, and productive experiences. Participants will evaluate common meeting challenges, redesign a meeting, and leave with practical strategies they can immediately apply.","de":"Demasiadas reuniones dejan a los participantes distraídos, desconectados y preguntándose para qué fueron. Esta sesión interactiva explora cómo los principios del mindfulness pueden convertir las reuniones en experiencias más productivas, participativas y con propósito. Los participantes analizan problemas habituales, rediseñan una reunión y se llevan estrategias para aplicar de inmediato.","sm":""},{"id":238,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"The return of oral assessment and why it’s different this time.","te":"La vuelta de la evaluación oral y por qué esta vez es distinta","sh":"The Return of Oral Assessment","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 3","p":"Bas Hintemann","po":"Chief Strategy Officer, FeedbackFruits","d":"As AI makes it harder to verify what students genuinely understand, oral assessment offers a powerful way to see students think, reason, and explain. This session by FeedbackFruits explores how institutions can bring oral practice, assessment, and reflection into the learning journey at scale without adding significant workload for instructors.","de":"Como la IA hace más difícil verificar qué entienden realmente los estudiantes, la evaluación oral ofrece una forma poderosa de verlos pensar, razonar y explicar. En esta sesión, FeedbackFruits explora cómo las instituciones pueden incorporar práctica, evaluación y reflexión orales a escala, sin sumar una carga de trabajo significativa para los docentes.","sm":""},{"id":239,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"The True Crime Classroom: Rebuilding a Gateway Course Around Investigation","te":"El aula policial: rediseñar una materia de ingreso en torno a una investigación","sh":"The True Crime Classroom","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 5","p":"Roni Jackson","po":"Co-CEO, Red Flag Mania","d":"A required course at Western Governors University, the one students used to dread before they'd even logged in, was rebuilt around a true crime investigation, and completion rates rose more than 50% in six months as a result. This session breaks down how that shift built real problem solving skills, not just higher completion numbers.","de":"Una materia obligatoria de Western Governors University, la que los estudiantes temían antes de entrar a la plataforma, se rediseñó en torno a la investigación de un caso policial real, y la tasa de finalización subió más del 50% en seis meses. La sesión explica cómo ese cambio desarrolló habilidades reales de resolución de problemas, no solo mejores números de finalización.","sm":""},{"id":240,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Trust by Design: Learner Readiness and Proctoring Centered on the Student Experience in the AI Era","te":"Confianza por diseño: preparación del estudiante y supervisión de exámenes centradas en su experiencia en la era de la IA","sh":"Learner-Centered Proctoring","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 4","p":"Chris Bergeron","po":"Director, SmarterServices, LLC","d":"As AI reshapes what's possible in learning and assessment, this session reframes proctoring around the student experience: consistent on campus or at a distance, with accommodations built in, and paired with proactive support that helps students succeed honestly.","de":"Ante los cambios que la IA trae al aprendizaje y la evaluación, la sesión replantea la supervisión de exámenes a partir de la experiencia del estudiante: consistente en el campus o a distancia, con adecuaciones incorporadas y acompañada de apoyo proactivo para que los estudiantes tengan éxito de manera honesta.","sm":""},{"id":241,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"What’s the Point? Rethinking the Goal of Digital Tool Use in A&P","te":"¿Para qué? Repensar el objetivo del uso de herramientas digitales en anatomía y fisiología","sh":"Rethinking Digital Tools in Anatomy & Physiology","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 12","p":"Dr. Kerrie McDaniel","po":"Professor, Western Kentucky University","d":"A wide range of digital tools are now embedded in Anatomy & Physiology (A&P) courses. While these tools were historically adopted to enhance student learning, the rise of AI-enabled content retrieval raises an important question: Are digital assignments still promoting learning, or are they simply helping students accumulate points?","de":"En los cursos de anatomía y fisiología se usan hoy muchas herramientas digitales. Aunque se adoptaron para mejorar el aprendizaje, el auge de la búsqueda de contenidos con IA plantea una pregunta importante: ¿las tareas digitales siguen promoviendo el aprendizaje o solo ayudan a los estudiantes a sumar puntos?","sm":""},{"id":242,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"You Built it and They Didn’t Come: Devising Strategies to Drive Faculty Engagement in Professional Development","te":"Lo construiste y nadie vino: estrategias para impulsar la participación docente en la formación profesional","sh":"Driving Faculty Engagement in Professional Development","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 13","p":"Eric Simon","po":"Associate Director, Hybrid & Faculty Development Support Programs, Florida International University, Center for the Advancement of Teaching","d":"You spent many hours designing an exciting new workshop for faculty, but a disappointing number signed up and only a small percentage showed up. If this is a familiar scenario, join us to brainstorm solutions for increasing participation in training and other professional development opportunities for faculty.","de":"Dedicaste muchas horas a diseñar un taller nuevo y atractivo para docentes, pero se inscribieron pocos y vinieron menos. Si te suena, sumate a pensar soluciones para aumentar la participación en capacitaciones y otras instancias de formación docente.","sm":""},{"id":243,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Your Students Deserve More Than a Chatbot: How to Improve Learning Outcomes with AI-Powered Instruction","te":"Tus estudiantes merecen más que un chatbot: mejorar los resultados de aprendizaje con enseñanza basada en IA","sh":"AI-Powered Instruction Beyond the Chatbot","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 2","p":"Erin Riklin","po":"Higher Education Partnerships, Kyron Learning","d":"This session explores how AI-powered instruction can support the full learning process through guided explanation, practice, feedback, and reinforcement. See how faculty-controlled, interactive learning experiences can personalize support for students while strengthening engagement, understanding, confidence, and measurable learning outcomes.","de":"La sesión explora cómo una enseñanza basada en IA puede acompañar todo el proceso de aprendizaje con explicación guiada, práctica, retroalimentación y refuerzo. Se muestra cómo experiencias interactivas controladas por el docente pueden personalizar el apoyo a los estudiantes y fortalecer la participación, la comprensión, la confianza y resultados de aprendizaje medibles.","sm":""},{"id":244,"day":"Mie","s":720,"e":780,"b":"w-lunch","t":"Lunch On Your Own","te":"Almuerzo libre","sh":"Lunch On Your Own","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Atlantic Exhibit Hall","p":"","po":"","d":"The exhibit hall will be open from 12:00pm- 1:00pm today.  Lunch is on your own, but the exhibit hall will be open during this time for a final opportunity to work on your exhibitor stamp card, 80's bingo card, or visit the Engagement Hub to redeem your bingo card and play Skeeball for prizes!","de":"El salón de exposiciones está abierto de 12:00 a 1:00 pm. El almuerzo es por cuenta propia, pero es la última oportunidad para completar la tarjeta de sellos de expositores y el bingo, o canjear el bingo en el Engagement Hub para jugar Skeeball y participar por premios.","sm":""},{"id":245,"day":"Mie","s":780,"e":900,"b":"w-1300","t":"AI Exploration Zone - Final Open Exploration","te":"AI Exploration Zone: última exploración abierta","sh":"AI Exploration Zone (last one)","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"","tre":"","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Join us in the AI Exploration Zone for our final Open Exploration session. Stop watching AI from the sidelines. Open Exploration treats you as a lifelong learner with a question worth working on. Bring a teaching or learning challenge and use the space to work on it with support from experienced guides and access to a range of AI tools. There are no canned demos and no expectation that you arrive with AI expertise. Our emphasis is on curiosity and hands-on experimentation that leads you somewhere useful.","de":"Última oportunidad de exploración abierta: traé un desafío propio y trabajalo con guías y herramientas de IA.","sm":""},{"id":246,"day":"Mie","s":780,"e":900,"b":"w-1300","t":"Open Play in the Engagement Hub","te":"Juego libre en el Engagement Hub","sh":"Open Play (Engagement Hub)","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"Open Play invites participants to explore creativity, collaboration, and communication through interactive, hands-on activities. Using visual prompts from story cubes to generate spontaneous narratives, experience how simple images can spark imagination, flexible thinking, and creative expression. Through the collaborative challenge of the Mystery Box, discover how taking seemingly unrelated materials to solve a creative task can highlight teamwork, resourcefulness, and the value of diverse perspectives and skills. And maybe even engage in a face-to-face simulation of an online discussion forum, role-playing familiar participant types such as the expert, newbie, skeptic, cheerleader, lurker, and de-railer to examine how different communication styles influence group dialogue and engagement. Join us for our final Open Play session for this conference and experience firsthand how low-stakes, playful activities can foster community, encourage participation, uncover group dynamics, and support deeper learning.","de":"Actividades lúdicas para explorar la creatividad, la colaboración y la comunicación: historias con dados de imágenes, el desafío de la Caja Misteriosa y la simulación presencial de un foro online. Muestran cómo las actividades de bajo riesgo fomentan la comunidad y la participación.","sm":""},{"id":247,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"Baking in Storytelling and Accessibility: Efficient story construction with built-in accessibility workflow","te":"Storytelling y accesibilidad desde el inicio: construir historias de forma eficiente con un flujo de accesibilidad integrado","sh":"Storytelling and Accessibility with AI","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 7","p":"Molly Caldera Arroyo, M.A.","po":"Learning Experience Designer, Baylor University","d":"In this session, participants will learn a practical AI-supported workflow for turning raw course materials into accessible, story-based learning experiences. Participants will practice prompting AI for story arcs, storyboards, characters, assets, and accessibility checkpoints, leaving with a reusable process for developing inclusive, production-ready narratives without treating accessibility as an afterthought.","de":"Los participantes aprenden un flujo de trabajo práctico con apoyo de IA para convertir materiales de curso en experiencias de aprendizaje accesibles basadas en historias. Practican prompts para generar arcos narrativos, storyboards, personajes, recursos y controles de accesibilidad, y se llevan un proceso reutilizable para desarrollar narrativas inclusivas y listas para producir, sin dejar la accesibilidad para el final.","sm":""},{"id":248,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"Before Burnout: Building Emotional Awareness in Online Educators","te":"Antes del agotamiento: desarrollar la conciencia emocional de los educadores online","sh":"Emotional Awareness for Educators","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere E1/E2","p":"Anita Samuel","po":"Dr., Uniformed Services University","d":"Higher education faculty are navigating an era of compounding disruption. An overlooked dimension in professional development is the emotional conditions of learning. This workshop introduces the Emotional Readiness Inventory for Educators self-reflection tool. Participants complete the ERIE, interpret their profile, and apply a practical recovery tool to identify sustainable actions.","de":"Los docentes de educación superior atraviesan una época de disrupciones acumuladas, y una dimensión olvidada en su formación son las condiciones emocionales del aprendizaje. Este taller presenta el Inventario de Preparación Emocional para Educadores (ERIE), una herramienta de autorreflexión: los participantes lo completan, interpretan su perfil y aplican una herramienta práctica de recuperación para identificar acciones sostenibles.","sm":""},{"id":249,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"Don’t Panic! The GOAT Toolkit to Help You Redesign Assessments for Visible Thinking in the GenAI Galaxy","te":"¡Que no cunda el pánico! El kit GOAT para rediseñar evaluaciones que hagan visible el pensamiento en la galaxia de la IA generativa","sh":"Don't Panic! A Toolkit to Redesign Assessments for Visible Thinking","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere C","p":"Xiaoyan Ma Ph.D.","po":"Instructional Designer, Virginia Tech","d":"Our traditional assessments grade the essay, the report, and the final project. Now AI generates those effortlessly. This workshop hands you the GenAI Online Assessment Toolkit (GOAT): practical tools for redesigning online assessments so human thinking is built in. Bring your assignments and see how these tools make them AI-resilient.","de":"Nuestras evaluaciones tradicionales califican el ensayo, el informe y el proyecto final, y ahora la IA los genera sin esfuerzo. Este taller entrega el GenAI Online Assessment Toolkit (GOAT): herramientas prácticas para rediseñar evaluaciones online de modo que el pensamiento humano quede incorporado. Traé tus consignas y mirá cómo estas herramientas las vuelven resistentes a la IA.","sm":""},{"id":250,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"From Course Artifacts to AI-Powered Faculty Development: Design Your Own Instructional Insight Tool","te":"De los materiales del curso a una formación docente potenciada por IA: diseñá tu propia herramienta de análisis pedagógico","sh":"Design Your Own AI Teaching Insight Tool","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Asia 5","p":"Suzanne Healy, EdD","po":"Associate Dean, Curricular Innovation, Case Western Reserve University","d":"What if your syllabi, evaluations, and class data could talk back? In this hands-on workshop, explore PROF—an AI-powered faculty development tool—and then design your own. Reverse-engineer real outputs, build custom prompts, and leave with a practical blueprint to turn course artifacts into actionable teaching intelligence.","de":"¿Y si tus programas, evaluaciones y datos de clase pudieran \"responderte\"? En este taller práctico se explora PROF, una herramienta de formación docente basada en IA, y luego cada participante diseña la propia: analiza resultados reales, construye prompts a medida y se lleva un plan para convertir los materiales del curso en información útil para mejorar la enseñanza.","sm":""},{"id":251,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"From Ideation to Implementation: A Dual-Framework Studio for Innovative Collaborative Online Program Design","te":"De la ideación a la implementación: un estudio de doble marco para diseñar programas online de forma colaborativa e innovadora","sh":"From Ideation to Implementation: Design Thinking + Project Management Studio","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 8","p":"Amy Murzyn, EdD","po":"Chair of Teacher Licensure and Director of Special Education Programs, College of St. Scholastica","d":"This interactive workshop explores how Design Thinking and Project Management can work together to support collaborative, innovative online program design. Participants will engage in hands-on activities using learner personas, stakeholder mapping, prototyping, and project planning tools to create more inclusive, agile, and learner-centered digital learning experiences.","de":"Este taller interactivo explora cómo el design thinking y la gestión de proyectos pueden complementarse para diseñar programas online de forma colaborativa e innovadora. Con actividades prácticas de personas de usuario, mapeo de actores, prototipado y herramientas de planificación de proyectos, se busca crear experiencias de aprendizaje digital más inclusivas, ágiles y centradas en el estudiante.","sm":""},{"id":252,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"No Code, No Subscriptions, No Problem: Vibe-Coding Learning Activities for IDs","te":"Sin código, sin suscripciones, sin problema: actividades de aprendizaje con vibe coding para diseñadores instruccionales","sh":"No Code, No Subscriptions: Vibe-Coding Learning Activities","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 6","p":"Jason Johnston, PhD","po":"Exec. Dir. of Online Learning & Course Production, The University of Tennessee-Knoxville","d":"Vibe-code your way from idea to learning object. No code background, no subscriptions, no LMS plug-ins. In this hands-on workshop, instructional designers will build timers, flashcards, scenarios, and small games using free AI chatbots, then leave with free tools, prompts, code, and a team integration playbook.","de":"Pasá de la idea al objeto de aprendizaje con \"vibe coding\", sin saber programar, sin suscripciones y sin plugins del LMS. En este taller práctico, los diseñadores instruccionales construyen temporizadores, tarjetas de estudio, escenarios y pequeños juegos con chatbots de IA gratuitos, y se llevan herramientas gratuitas, prompts, código y un playbook para integrarlo en sus equipos.","sm":""},{"id":253,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"Strategic Rapid-Prototyping for the Next Era of Online Programming","te":"Prototipado rápido estratégico para la nueva etapa de los programas online","sh":"Strategic Rapid-Prototyping for Online Programs","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Americas Seminar","p":"Greg Weaver, PhD","po":"Director of Online Program Development, University of Virginia-Main Campus","d":"This interactive workshop focuses on applying forward-thinking methodologies for online program development. We invite participants from diverse perspectives to engage with frameworks to drive data-informed decision-making. Through rapid prototyping activities grounded in design-thinking methodology, participants will work in cross-functional design sprints tackling real challenges in online program development.","de":"Este taller interactivo aplica metodologías prospectivas al desarrollo de programas online. Participantes de distintas perspectivas trabajan con marcos para tomar decisiones basadas en datos y, a través de actividades de prototipado rápido basadas en design thinking, participan en sprints de diseño entre áreas para abordar desafíos reales del desarrollo de programas online.","sm":""},{"id":254,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"The Johari Window of GenAI in Teaching: Diagnostic Workshop for Academic Leaders on Awareness Gaps Shaping Institutions","te":"La ventana de Johari de la IA generativa en la enseñanza: taller de diagnóstico para autoridades académicas sobre las brechas de conocimiento en las instituciones","sh":"The Johari Window of GenAI for Academic Leaders","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Northern Hemisphere E3/E4","p":"Tawnya Means","po":"Strategic Innovation & AI Advisor to the Provost, Bowling Green State University","d":"Institutional AI policy is being written on a thin, fast-moving evidence base. This workshop equips academic leaders with a diagnostic framework, the Johari Window of GenAI in Teaching, to identify where awareness gaps are widening and make concrete, evidence-grounded decisions about AI integration at the course, program, and institutional levels.","de":"Las políticas institucionales de IA se están escribiendo con una base de evidencia escasa y cambiante. Este taller ofrece a las autoridades académicas un marco de diagnóstico, la ventana de Johari de la IA generativa en la enseñanza, para identificar dónde se amplían las brechas de conocimiento y tomar decisiones concretas y basadas en evidencia sobre la integración de la IA en cursos, programas e institución.","sm":""},{"id":255,"day":"Mie","s":780,"e":885,"b":"w-1300","t":"The Value of Difference: Exploring the Valued Minds Model to Support Neurodiverse Learners","te":"El valor de la diferencia: el modelo Valued Minds para acompañar a estudiantes neurodiversos","sh":"The Valued Minds Model for Neurodiverse Learners","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere D","p":"Megan Kohler","po":"Assistant Teaching Professor, The Pennsylvania State University","d":"As our understanding of neurodiversity has increased, we find ourselves in need of a holistic model that extends beyond condition-specific support. Join us for an engaging and transformational workshop as we explore The Valued Minds Model and illuminate the future of our classrooms with neurodiversity in mind.","de":"A medida que entendemos mejor la neurodiversidad, necesitamos un modelo integral que vaya más allá del apoyo específico para cada condición. Un taller atractivo y transformador para explorar el modelo Valued Minds y pensar el futuro de las aulas con la neurodiversidad en mente.","sm":""},{"id":256,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"A Whole New World of Learner Engagement: Using DesignPlus to Create Engagement in Canvas","te":"Un mundo nuevo de participación: usar DesignPlus para generar participación en Canvas","sh":"Engagement in Canvas with DesignPlus","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 1","p":"Rebecca Stooks","po":"Instructional Designer, Virginia Commonwealth University","d":"Now more than ever, keeping learners engaged in online learning content is incredibly important for their success. In this presentation we’ll explore some of the ways we’ve leveraged the application DesignPlus to create a whole new world of engaging knowledge checks and activities.","de":"Hoy más que nunca, sostener la participación de los estudiantes en el contenido online es clave para su éxito. La presentación muestra cómo se usó la aplicación DesignPlus para crear un mundo nuevo de autoevaluaciones y actividades atractivas.","sm":""},{"id":257,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"AI Course Design: Improving Efficiency and Engagement at Scale","te":"Diseño de cursos con IA: eficiencia y participación a escala","sh":"AI Course Design: Efficiency and Engagement at Scale","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 2","p":"Fatimah Wirth, Ph.D.","po":"Senior Instructional Designer, Georgia Institute of Technology","d":"Learn how AI can enhance online course design by improving efficiency and engagement. This session shares practical, research-informed strategies aligned with Quality Matters standards to help educators and instructional designers integrate AI effectively and responsibly into their workflows.","de":"Cómo la IA puede mejorar el diseño de cursos online haciéndolo más eficiente y atractivo. La sesión comparte estrategias prácticas, basadas en investigación y alineadas con los estándares de Quality Matters, para que docentes y diseñadores instruccionales integren la IA de forma eficaz y responsable en su trabajo.","sm":""},{"id":258,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Before the Stakes Are Real: Scaling Career-Ready Communication Practice with Ovation","te":"Antes de que sea en serio: práctica de comunicación para el empleo a escala con Ovation","sh":"Before the Stakes Are Real: Practicing Interviews with AI Avatars","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 2","p":"Jeff Marshall","po":"Founder/CEO, VRSpeaking LLC","d":"See how colleges and universities can give every student realistic, repeatable practice for interviews, presentations, and difficult conversations. This live Ovation demonstration features responsive AI avatars, customizable scenarios, personalized feedback, expanded access, and clearer insights into learner participation and progress.","de":"Cómo universidades e instituciones pueden ofrecer a cada estudiante práctica realista y repetible para entrevistas laborales, presentaciones y conversaciones difíciles. Demostración en vivo de Ovation: avatares de IA que responden, escenarios personalizables, retroalimentación individual, mayor acceso y mejor información sobre la participación y el progreso de los estudiantes.","sm":""},{"id":259,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Belonging by Design: Fostering Student Connectedness Through Virtual Lab Immersion","te":"Pertenencia por diseño: fomentar la conexión entre estudiantes con una inmersión en laboratorio virtual","sh":"Belonging Through Virtual Lab Immersion","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 1","p":"Jana Hickman","po":"Clinical Assistant Professor, Baylor University","d":"Discover how intentional instructional design can promote belonging and connectedness in online learning. This presentation examines a three-day virtual lab immersion in a hybrid occupational therapy program and shares transferable strategies, grounded in Moore's Triangle of Interaction, for enhancing engagement, faculty presence, and community among geographically dispersed learners.","de":"Cómo un diseño instruccional intencional puede promover la pertenencia y la conexión en el aprendizaje online. La presentación analiza una inmersión de tres días en laboratorio virtual en un programa híbrido de terapia ocupacional y comparte estrategias transferibles, basadas en el triángulo de interacción de Moore, para fortalecer la participación, la presencia docente y la comunidad entre estudiantes geográficamente dispersos.","sm":""},{"id":260,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Beyond the Contract: Leadership Strategies for Engaging Adjunct Faculty","te":"Más allá del contrato: estrategias de liderazgo para involucrar a los docentes adjuntos","sh":"Engaging Adjunct Faculty","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 3","p":"Stacy Cognetti","po":"Associate Dean of eLearning, Lackawanna College","d":"Online adjunct faculty often experience isolation and limited institutional connection. This interactive session explores strategies to build engagement, belonging, and support for adjunct instructors. Participants will assess current practices, discuss shared challenges, and identify practical steps to create a more connected and sustainable faculty community.","de":"Los docentes adjuntos online suelen sentirse aislados y poco conectados con la institución. Esta sesión interactiva explora estrategias para generar compromiso, pertenencia y apoyo para ellos. Los participantes revisan sus prácticas actuales, conversan sobre desafíos comunes e identifican pasos concretos para construir una comunidad docente más conectada y sostenible.","sm":""},{"id":261,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Beyond the Textbook: Designing Business Courses That Launch Careers","te":"Más allá del libro de texto: diseñar cursos de negocios que impulsen carreras profesionales","sh":"Beyond the Textbook: Designing Courses That Launch Careers","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"Renee Ford, Ph.D.","po":"Senior Instructional Designer, The Pennsylvania State University","d":"In an era when AI can generate information instantly, career success depends on human competencies. Learn how instructional designers and faculty at Penn State’s Smeal College of Business embed career-ready skills into courses through authentic assessments, active learning, and evidence-based design that connects classroom learning to workplace success.","de":"En una época en que la IA genera información al instante, el éxito profesional depende de competencias humanas. Cómo diseñadores instruccionales y docentes del Smeal College of Business de Penn State integran habilidades para el empleo en sus cursos con evaluaciones auténticas, aprendizaje activo y un diseño basado en evidencia que conecta lo aprendido en el aula con el éxito en el trabajo.","sm":""},{"id":262,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Beyond Transactions: The Art of Strategic Partnership","te":"Más allá de lo transaccional: el arte de las alianzas estratégicas","sh":"The Art of Strategic Partnership","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 5","p":"Brittany Logue, M.Ed.","po":"Senior Program Manager, Colorado State University-Fort Collins","d":"Challenge the dynamic that online units that wait for direction get treated like vendors. Through a real case study and a practical repositioning framework, participants will explore how to shift from service provider to strategic partner, building the trust, language, and credibility needed to shape institutional decisions from within.","de":"Cuestiona la dinámica en la que las unidades online que esperan instrucciones terminan tratadas como proveedores. A partir de un caso real y un marco práctico de reposicionamiento, los participantes exploran cómo pasar de prestador de servicios a aliado estratégico, construyendo la confianza, el lenguaje y la credibilidad necesarios para incidir en las decisiones institucionales desde adentro.","sm":""},{"id":263,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Building Early Momentum: Systems That Support Students in the First 48 Hours","te":"Impulso temprano: sistemas que acompañan a los estudiantes en las primeras 48 horas","sh":"Supporting Students in the First 48 Hours","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 4","p":"Dr. Nazish Siddiqi MD, MPH, MS","po":"Associate Dean of General Education, Chamberlain University","d":"This presentation explores the impact of faculty outreach within the first 48 hours of online courses. Early communication conveying care and support, before grades or assignments are submitted, builds trust, encourages belonging, and establishes a partnership rather than punitive interactions between faculty and students during the early phase of learning.","de":"La presentación analiza el impacto del contacto de los docentes en las primeras 48 horas de un curso online. Una comunicación temprana que transmite cuidado y apoyo, antes de cualquier nota o entrega, genera confianza, fomenta la pertenencia y establece una relación de colaboración, en lugar de interacciones punitivas, en la etapa inicial del aprendizaje.","sm":""},{"id":264,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Course Ready, AI Supported: A Connected Framework","te":"Cursos listos, con apoyo de IA: un marco conectado","sh":"Course Ready, AI Supported","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 1","p":"Matthew Compton-Clark","po":"Vice President, Simple Higher Ed","d":"Discover a practical framework for preparing stronger courses and supporting students with trustworthy AI. Attendees will examine automated and human review, AI grounded in approved course content, institutional data governance, and feedback loops that use student questions to guide ongoing improvement.","de":"Un marco práctico para preparar cursos más sólidos y acompañar a los estudiantes con una IA confiable. Se analizan la revisión automatizada y humana, una IA basada en contenidos aprobados del curso, la gobernanza institucional de los datos y ciclos de retroalimentación que usan las preguntas de los estudiantes para guiar la mejora continua.","sm":""},{"id":265,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Design Over Detection: Rethinking Academic Integrity in the Age of AI","te":"El diseño por sobre la detección: repensar la integridad académica en la era de la IA","sh":"Design Over Detection: Rethinking Academic Integrity","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 5","p":"Dr. Michael Webb","po":"Director of Innovation and Faculty Excellence, Capella University","d":"Generative AI has exposed the limits of detection-based academic integrity. This session introduces Design Over Detection, a practical, field tested framework for embedding accountability into assessment design. Participants will explore strategies that make student thinking visible, reduce reliance on surveillance and produce defensible evidence of learning in AI enabled environments.","de":"La IA generativa mostró los límites de una integridad académica basada en la detección. La sesión presenta \"Design Over Detection\", un marco práctico y probado en el terreno para incorporar la responsabilidad en el diseño de la evaluación. Se exploran estrategias que hacen visible el pensamiento de los estudiantes, reducen la dependencia de la vigilancia y producen evidencia sólida de aprendizaje en entornos con IA.","sm":""},{"id":266,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Detection to documentation: Using a ‘Revision History’ extension to support authentic student writing in the age of AI","te":"De la detección a la documentación: la extensión \"Revision History\" para apoyar una escritura auténtica en la era de la IA","sh":"Revision History to Support Authentic Writing","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 6","p":"Brianna M. Pack, MPH, MBA","po":"Assistant Professor, Azusa Pacific University","d":"Discover how the ‘Revision History’ extension transforms Google Docs/Slides into writing process documentation tools. Move beyond AI detection and plagiarism tools by examining drafting patterns, revisions, and engagement. This presentation equips educators with adaptable techniques to foster student growth, originality, and transparency by valuing authentic writing process over products.","de":"Cómo la extensión \"Revision History\" convierte Google Docs y Slides en herramientas para documentar el proceso de escritura. Más allá de los detectores de IA y de plagio, se analizan los patrones de borradores, las revisiones y el compromiso con la tarea. La presentación ofrece técnicas adaptables para promover el crecimiento, la originalidad y la transparencia, valorando el proceso auténtico de escritura por sobre el producto.","sm":""},{"id":267,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Empowering Educators at Scale: LMS-Based Professional Development and Faculty Support at UCF","te":"Empoderar a los educadores a escala: formación y apoyo docente desde el LMS en UCF","sh":"LMS-Based Faculty Development at UCF","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 7","p":"Nafije K. Prishtina M.S IDS","po":"Instructional Designer and Technology Specialist, University of Central Florida","d":"Learn how UCF uses LMS-based special programs to support over 6,000 courses for faculty and staff development. Explore practical approaches to course creation, enrollment, and instructional support that extend the LMS beyond traditional academic courses to support non-academic learning needs.","de":"Cómo UCF usa programas especiales en su LMS para sostener más de 6.000 cursos de formación para docentes y personal. Enfoques prácticos para crear cursos, gestionar inscripciones y brindar apoyo pedagógico que extienden el LMS más allá de los cursos académicos tradicionales para cubrir necesidades de aprendizaje no académicas.","sm":""},{"id":268,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Fostering Belongingness in Online Learning: Strategies for Supporting Student Success, Engagement, and Well-being","te":"Fomentar la pertenencia en el aprendizaje online: estrategias para el éxito, la participación y el bienestar de los estudiantes","sh":"Fostering Belonging and Well-Being Online","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A3/A4","p":"Laura Sliwinski, PhD, MHA","po":"Sr. Director, Doctoral Affairs & Academic Resource, Westcliff University","d":"Feelings of isolation in online education can negatively impact student retention and mental well-being. This session highlights strategies for advising, mentoring, community-building, and engagement that support student success and well-being. Participants will learn practical approaches to foster belonging, persistence, and meaningful connections in online programs.","de":"La sensación de aislamiento en la educación online puede afectar la permanencia y el bienestar emocional de los estudiantes. La sesión presenta estrategias de orientación, mentoría, construcción de comunidad y participación que apoyan el éxito y el bienestar, con enfoques prácticos para fomentar la pertenencia, la permanencia y conexiones significativas en programas online.","sm":""},{"id":269,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"From Content to Connection: Designing Digital Courses That Engage and Retain Learners","te":"Del contenido a la conexión: cursos digitales que involucren y retengan a los estudiantes","sh":"From Content to Connection: Supporting the Transition from High School to College","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere II","p":"Jason Baughman","po":"Associate Director, University of Texas at Austin","d":"Course design significantly influences student persistence in higher education. This session highlights how instructional designers use UDL-aligned course architecture to scaffold students from high school into authentic college learning. Participants explore practical strategies and learning supports that improve engagement, retention, and college readiness.","de":"El diseño de los cursos influye mucho en la permanencia en la educación superior. La sesión muestra cómo los diseñadores instruccionales usan una arquitectura de cursos alineada con el Diseño Universal para el Aprendizaje para acompañar la transición de los estudiantes de la secundaria al aprendizaje universitario. Se exploran estrategias y apoyos que mejoran la participación, la permanencia y la preparación para la universidad.","sm":""},{"id":270,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"From Inner Critic to Inner Coach: Using AI to Scale Growth Mindset and Learner Success","te":"Del crítico interior al coach interior: usar IA para escalar la mentalidad de crecimiento y el éxito de los estudiantes","sh":"From Inner Critic to Inner Coach: Using AI to Build a Growth Mindset","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A1/A2","p":"Dr. Sue McKenzie","po":"Senior Associate Dean of STEM, Southern New Hampshire University","d":"Struggling students don’t always ask for help, especially online. This session shows how AI can support students in real time, shifting self-doubt into productive learning. Explore a simple “AI Inner Coach Model,” see it in action, and leave with ready-to-use strategies to boost engagement without adding to your workload.","de":"Los estudiantes con dificultades no siempre piden ayuda, sobre todo online. La sesión muestra cómo la IA puede acompañarlos en tiempo real y convertir la inseguridad en aprendizaje productivo. Se presenta un modelo simple de \"coach interior con IA\", se lo ve en acción y los participantes se llevan estrategias listas para usar que aumentan la participación sin sumar trabajo.","sm":""},{"id":271,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"From Isolation to Innovation: How to Build High Impact Virtual PLCs that Work","te":"Del aislamiento a la innovación: comunidades profesionales de aprendizaje virtuales que funcionan","sh":"Building Virtual Professional Learning Communities","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 4","p":"Dr. Jennifer Reed","po":"Lecturer, University of North Carolina at Charlotte","d":"Online faculty don't have to teach alone. Learn how Virtual Professional Learning Communities (VPLCs) can create meaningful collaboration, strengthen teaching practice, and build lasting professional connections across distances. Based on a successful implementation study, you'll leave with actionable strategies, proven insights, and a practical plan for launching your own VPLC.","de":"Los docentes online no tienen por qué enseñar solos. Cómo las comunidades profesionales de aprendizaje virtuales (VPLC) generan colaboración significativa, fortalecen la práctica docente y construyen vínculos profesionales duraderos a la distancia. A partir de un estudio de implementación exitoso, estrategias concretas, aprendizajes probados y un plan práctico para lanzar la propia.","sm":""},{"id":272,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Gen Ed, Transformed: WGU’s Skills-First, Career-Connected, Project-Based Approach for Today’s Learners","te":"Formación general transformada: el enfoque de WGU basado en habilidades, conectado con el empleo y por proyectos","sh":"Skills-First, Career-Connected, Project-Based Learning at WGU","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 8","p":"Kristy Conlin","po":"Lead General Education Program Manager, Western Governors University","d":"WGU is transforming General Education from a checklist of requirements into a skills-focused, career-connected, project-based learning experience. This session shares practical design principles and implementation lessons for building interdisciplinary courses that integrate transferable skills, career exploration, digital literacy, and responsible AI use.","de":"WGU está transformando su formación general, de una lista de requisitos a una experiencia de aprendizaje por proyectos, centrada en habilidades y conectada con el mundo laboral. La sesión comparte principios de diseño y aprendizajes de la implementación para construir cursos interdisciplinarios que integren habilidades transferibles, exploración vocacional, alfabetización digital y uso responsable de la IA.","sm":""},{"id":273,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"How are we doing? Investigating Undergraduate Student AI Competency and Workforce Readiness","te":"¿Cómo estamos? Competencias en IA y preparación para el trabajo de estudiantes universitarios","sh":"How Are We Doing? Student AI Competency and Workforce Readiness","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 9","p":"Bethany Schultz, Ph.D.","po":"Director of Teaching & Learning, Northwest Nazarene University","d":"Students will graduate into AI-saturated workplaces, but how ready are they, and do their professors agree? This action research study compares undergraduate and faculty perceptions of AI competency and workforce readiness at a liberal arts university, revealing the gaps and alignments shaping our campus's next move.","de":"Los estudiantes se van a graduar en lugares de trabajo saturados de IA, pero ¿qué tan preparados están y coinciden sus profesores? Esta investigación-acción compara las percepciones de estudiantes y docentes sobre competencias en IA y preparación para el trabajo en una universidad de artes liberales, y muestra las brechas y coincidencias que orientan sus próximos pasos.","sm":""},{"id":274,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Illuminating the Path: Using QA Frameworks to Guide Online Course Design","te":"Iluminar el camino: usar marcos de aseguramiento de la calidad para guiar el diseño de cursos online","sh":"QA Frameworks to Guide Online Course Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 1","p":"Jon Hughes","po":"Senior Instructional Designer, University of Pittsburgh","d":"Quality assurance in online course design is a growing priority — but how do you choose a model that scales? This session explores the OLC Course Review Scorecard as a practical framework, leaving attendees with a revised syllabus template and streamlined QA checklist they can immediately apply at their institution.","de":"El aseguramiento de la calidad en el diseño de cursos online es una prioridad creciente, pero ¿cómo elegir un modelo que escale? La sesión presenta el OLC Course Review Scorecard como marco práctico, y los asistentes se llevan una plantilla de programa revisada y un checklist de calidad simplificado para aplicar de inmediato en su institución.","sm":""},{"id":275,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Improving Retention in Digital Learning: A Proactive At-Risk Engagement Framework for Student Success","te":"Mejorar la permanencia en el aprendizaje digital: un marco proactivo para acompañar a estudiantes en riesgo","sh":"Proactive Support for At-Risk Students","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 2","p":"Brigitte Powell, Ph.D., Ed.D.","po":"Associate Dean, Chamberlain University-Illinois","d":"Improve student retention and learning outcomes by identifying disengaged learners early and delivering timely, personalized, holistic support across teams. This proactive framework guides faculty in recognizing academic and engagement risks, coordinating communication, and implementing targeted outreach and individualized plans that prevent course failure, strengthen persistence, and promote measurable student success.","de":"Mejorar la permanencia y los resultados identificando temprano a los estudiantes desconectados y brindando un apoyo oportuno, personalizado e integral entre equipos. Este marco proactivo guía a los docentes para reconocer riesgos académicos y de participación, coordinar la comunicación e implementar contactos dirigidos y planes individuales que eviten la desaprobación, fortalezcan la permanencia y generen un éxito estudiantil medible.","sm":""},{"id":276,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Intentional AI: Designing for Impact, Not Hype Lessons from Bots, Avatars, and Accessibility at Scale","te":"IA intencional: diseñar para el impacto y no para el hype. Lecciones de bots, avatares y accesibilidad a escala","sh":"Intentional AI: Lessons from Bots, Avatars and Accessibility at Scale","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"John Bellotti III, MS","po":"Instructional Designer, University of Wisconsin-Oshkosh","d":"After two years of building AI-supported bots, avatars, and accessibility workflows, this session explores how intentional design can turn experimentation into impact in online learning. Participants will consider ways to set boundaries, evaluate quality, and support accessible, authentic assessment while scaling AI use without losing trust or the human experience.","de":"Tras dos años construyendo bots, avatares y flujos de accesibilidad con IA, la sesión explora cómo un diseño intencional puede convertir la experimentación en impacto en el aprendizaje online. Se analizan formas de poner límites, evaluar la calidad y apoyar una evaluación accesible y auténtica, escalando el uso de IA sin perder la confianza ni la experiencia humana.","sm":""},{"id":277,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Iterate with Intention: Designing a Continuous Improvement Framework","te":"Iterar con intención: diseñar un marco de mejora continua","sh":"A Continuous Improvement Framework for Courses","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Connie Hahn","po":"Lead Instructional Designer, Purdue University-Main Campus","d":"Have you collected course data but struggled to turn it into action? This session shares an Iterative Course Design Workshop model that helps faculty, instructors, and instructional designers gather, interpret, categorize, and prioritize evidence using reflection, feedback strategies, and AI support. Attendees leave with adaptable resources for continuous course improvement.","de":"¿Recolectaste datos de tus cursos pero te cuesta convertirlos en acción? La sesión comparte un modelo de taller de diseño iterativo que ayuda a docentes y diseñadores instruccionales a reunir, interpretar, clasificar y priorizar evidencia con reflexión, estrategias de retroalimentación y apoyo de IA. Los asistentes se llevan recursos adaptables para la mejora continua de los cursos.","sm":""},{"id":278,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Next Chapter: A Asynchronous Online College and Career Readiness Initiative","te":"Next Chapter: una iniciativa online asincrónica de preparación para la universidad y el trabajo","sh":"Next Chapter: An Online College and Career Readiness Initiative","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 10","p":"Chris Eck","po":"Associate Professor, The University of Tennessee-Knoxville","d":"This session will present the development and pilot implementation of Next Chapter, an asynchronous online college and career readiness initiative designed to create a scalable and student-centered pathway for youth preparation and postsecondary success.","de":"La sesión presenta el desarrollo y la implementación piloto de Next Chapter, una iniciativa online asincrónica de preparación para la universidad y el mundo laboral, pensada como un trayecto escalable y centrado en el estudiante para preparar a los jóvenes y apoyar su éxito en los estudios superiores.","sm":""},{"id":279,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"OSU Ecampus Student and Faculty Perceptions of Generative AI Use: \"I hope it dies. Vain hope, I know.\"","te":"Percepciones de estudiantes y docentes de OSU Ecampus sobre la IA generativa: \"Ojalá desaparezca. Una vana esperanza, lo sé\"","sh":"Student and Faculty Perceptions of GenAI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Josh Jorgensen, PhD, MPH","po":"Assistant Professor of Teaching, Oregon State University","d":"We surveyed approximately 700 Oregon State University Ecampus students in Fall 2023 and Fall 2024 and 195 Ecampus faculty in Fall 2025 regarding their perceptions of generative AI in online learning. Student and faculty perspectives were remarkably similar and faculty perceptions were closely tied to their emotions about AI. Where do we go from here?","de":"Se encuestó a unos 700 estudiantes de Oregon State University Ecampus en 2023 y 2024 y a 195 docentes en 2025 sobre sus percepciones de la IA generativa en el aprendizaje online. Las miradas de estudiantes y docentes resultaron notablemente parecidas, y las percepciones docentes estaban muy ligadas a sus emociones respecto de la IA. ¿Cómo seguimos a partir de acá?","sm":""},{"id":280,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Pause, Pilot, or Pass? A Framework for Evaluating AI and EdTech Tools Responsibly","te":"¿Pausar, pilotear o descartar? Un marco para evaluar herramientas de IA y edtech de forma responsable","sh":"Pause, Pilot, or Pass? Evaluating AI Tools Responsibly","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Lissa Fresquez","po":"Director, Technology Innovations Learning Team, EdPlus-ASU, Arizona State University-Skysong","d":"A promising tool. A stalled security review. Faculty waiting. Sound familiar? This session introduces a five-step EdTech pilot framework built from real institutional experience, designed to keep evaluations moving, surface accessibility and AI concerns early, and give teams the structure to make confident adoption decisions.","de":"Una herramienta prometedora, una revisión de seguridad trabada, docentes esperando. ¿Te suena? La sesión presenta un marco de cinco pasos para pilotear tecnología educativa, construido a partir de experiencia institucional real, que mantiene las evaluaciones en movimiento, hace aparecer temprano las preocupaciones de accesibilidad e IA y da a los equipos una estructura para decidir con confianza qué adoptar.","sm":""},{"id":281,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Persistence Requires a Complete Picture: Data for Online, CE & Virtual Programs","te":"La permanencia requiere el panorama completo: datos para programas online, de educación continua y virtuales","sh":"Persistence Data for Online Programs","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 4","p":"Justin Vondra","po":"Ex-Academia, Pantheon, Skyward, Doowii","d":"Online, CE, and K-12 virtual programs run on six-week blocks and self-paced tracks. Most data integrations break under that structure. Doowii's managed data foundation is built for it, giving teams persistence data early enough to act.","de":"Los programas online, de educación continua y virtuales de K-12 funcionan en bloques de seis semanas y trayectos autoadministrados, y la mayoría de las integraciones de datos no resisten esa estructura. La base de datos gestionada de Doowii está pensada para eso y da a los equipos datos de permanencia a tiempo para actuar.","sm":""},{"id":282,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Refreshing Assignments for AI with Peer Insight Design Sprints","te":"Renovar las consignas para la era de la IA con sprints de diseño entre pares","sh":"Refreshing Assignments for AI with Design Sprints","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y a
