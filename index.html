poyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 11","p":"Patrick Horton","po":"Associate Director for Instructional Innovation, Center for the Advancement of Teaching Excellence, University of Illinois Chicago","d":"Redesigning assessments for the AI era requires careful planning and creative problem-solving. Discover a collaborative faculty development design sprint framework for revising assessments that leverages cross-disciplinary insights and brainstorming. Attendees will leave with practical resources and a complete toolkit to replicate this sprint at their own institution.","de":"Rediseñar las evaluaciones para la era de la IA requiere planificación cuidadosa y resolución creativa de problemas. Un marco de sprint de diseño colaborativo para la formación docente, que aprovecha miradas de distintas disciplinas y la lluvia de ideas para revisar evaluaciones. Los asistentes se llevan recursos prácticos y un kit completo para replicar el sprint en su institución.","sm":""},{"id":283,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Reimagine Learning with Interactive Course Design","te":"Reimaginar el aprendizaje con diseño de cursos interactivo","sh":"Interactive Course Design with Genially","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 3","p":"Pamela Molero","po":"Country Marketer, Genially","d":"Discover how Genially transforms online learning through interactive, multimodal experiences—perfect for kinesthetic, visual, and auditory learners. This session features dynamic examples, quick polls, and take-home ideas for creating accessible, no-code content. Walk away with scalable strategies grounded in UDL and digital pedagogy that truly make learning click.","de":"Cómo Genially transforma el aprendizaje online con experiencias interactivas y multimodales para distintos estilos de aprendizaje. La sesión incluye ejemplos dinámicos, encuestas rápidas e ideas para crear contenido accesible sin código, con estrategias escalables basadas en el Diseño Universal para el Aprendizaje y la pedagogía digital.","sm":""},{"id":284,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Rethinking Assessment for the AI Era: A Flexible, Modular Approach with TimelyGrader","te":"Repensar la evaluación para la era de la IA: un enfoque flexible y modular con TimelyGrader","sh":"Rethinking Assessment with TimelyGrader","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 5","p":"Robert Peregoodoff","po":"Chief Learning Officer, TimelyGrader","d":"Experience how TimelyGrader helps institutions and instructors rethink and redesign assessment for the AI era. Everyone is saying \"We must redesign Assessment\" but few are bold enough to share a vision. This demonstration connects instructor-guided, rubric-based grading and feedback with modular learning activities, including drafts, reflection, and oral assessments. Discover how to make student thinking visible while preserving productive struggle, educator judgment, and room for creativity. Be challenged with new concepts such as cognitive apprenticeship, multi-dimensional rubrics, and assessment design 'for the ethical, hardworking students'.","de":"Cómo TimelyGrader ayuda a instituciones y docentes a repensar y rediseñar la evaluación para la era de la IA. Todos dicen \"hay que rediseñar la evaluación\", pero pocos se animan a compartir una visión. Esta demostración conecta calificación y retroalimentación basadas en rúbricas y guiadas por el docente con actividades modulares (borradores, reflexión, evaluaciones orales) para hacer visible el pensamiento de los estudiantes, preservando el esfuerzo productivo, el criterio docente y el espacio para la creatividad. Introduce conceptos como aprendizaje cognitivo tipo aprendiz, rúbricas multidimensionales y una evaluación pensada \"para los estudiantes éticos y trabajadores\".","sm":""},{"id":285,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"The Continuity Imperative: Preparing for Disruption","te":"El imperativo de la continuidad: prepararse para las disrupciones","sh":"Preparing for Disruption","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Kim Arnold","po":"Director, Teaching & Learning, EDUCAUSE","d":"Recent outages and security incidents have exposed vulnerabilities in digital learning ecosystems. Grounded in emerging research and peer dialog, this interactive conversation explores instructional continuity as a shared institutional responsibility, as we consider moving from reactive responses to proactive planning while addressing the complex challenge of sustaining teaching during disruption.","de":"Caídas de sistemas e incidentes de seguridad recientes mostraron vulnerabilidades en los ecosistemas de aprendizaje digital. A partir de investigación reciente y del diálogo entre pares, esta conversación interactiva analiza la continuidad de la enseñanza como responsabilidad institucional compartida y cómo pasar de respuestas reactivas a una planificación proactiva para sostener la enseñanza ante disrupciones.","sm":""},{"id":286,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"The Future of Connection: AI, Play, and Meaningful Online Engagement","te":"El futuro de la conexión: IA, juego y participación online significativa","sh":"AI, Play and Online Engagement","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 12","p":"Leslie Johnson","po":"Assistant Department Chair, Mathematics, Purdue University Global","d":"Experience an interactive exploration of AI-powered engagement strategies designed to strengthen human connection in digital learning spaces. Through collaborative Padlet activities (visually engaging games and creative icebreakers), participants will discover practical, transferable ideas for using generative AI to foster engagement, build inclusive learning communities, and create meaningful student connections.","de":"Una exploración interactiva de estrategias de participación con IA pensadas para fortalecer la conexión humana en espacios de aprendizaje digital. Con actividades colaborativas en Padlet (juegos visuales y rompehielos creativos), los participantes descubren ideas prácticas y transferibles para usar la IA generativa para fomentar la participación, construir comunidades de aprendizaje inclusivas y generar vínculos significativos entre estudiantes.","sm":""},{"id":287,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"The Imagineering of Change: Building Communities That Accelerate AI and Digital Innovation.","te":"La \"imaginería\" del cambio: comunidades que aceleran la IA y la innovación digital","sh":"Building Communities That Accelerate AI Innovation","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 3","p":"Sherri Castanzo, Sc.D.","po":"Deputy CIO for Digital Innovation, Bowdoin College","d":"Successful AI adoption requires more than technology—it requires community. Learn how Bowdoin College leveraged communities of practice, storytelling, and AI fellowships to build institutional capacity, foster cross-campus collaboration, and create sustainable pathways for innovation, professional learning, and digital transformation.","de":"Adoptar IA con éxito requiere más que tecnología: requiere comunidad. Cómo Bowdoin College aprovechó comunidades de práctica, storytelling y becas internas de IA para desarrollar capacidades institucionales, fomentar la colaboración entre áreas y crear caminos sostenibles para la innovación, la formación profesional y la transformación digital.","sm":""},{"id":288,"day":"Mie","s":780,"e":825,"b":"w-1300","t":"Using GenAI to Support Online Education Doctoral Student Dissertation Work","te":"Usar IA generativa para acompañar las tesis de doctorandos online en educación","sh":"GenAI for Doctoral Dissertations","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 13","p":"Catherine A. Manly, Ph.D.","po":"Assistant Professor, Fairleigh Dickinson University-Metropolitan Campus","d":"How can GenAI assist doctoral students with their dissertations? Example use cases will be presented illustrating results from a pilot program that gave online education doctoral students in leadership (Ed.D.) access to an institutional instance of a GenAI agent. Ethical and practical guidance students need will be discussed.","de":"¿Cómo puede la IA generativa ayudar a los doctorandos con sus tesis? Se presentan casos de uso de un programa piloto que dio a estudiantes online de un doctorado en liderazgo educativo (Ed.D.) acceso a un agente de IA generativa institucional, y se conversa sobre las orientaciones éticas y prácticas que necesitan los estudiantes.","sm":""},{"id":289,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"A Protocol that Sparks Possibility: Navigating Common Challenges in the Online Space","te":"Un protocolo que abre posibilidades: enfrentar desafíos comunes en el espacio online","sh":"A Peer Protocol for Online Challenges","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 1","p":"Dr. Wendy Kubasko","po":"Associate Professor, Shippensburg University","d":"Want to leverage the brilliance of peers navigating similar challenges? Through structured dialogue, participants will explore transforming problems of practice into professional strategies for alternative pathways and thinking. No prep needed-come with your wonderings and ideas. This session creates meaningful collaboration, offering participants new lenses for problem-solving and practical application.","de":"¿Querés aprovechar la inteligencia de colegas que enfrentan desafíos parecidos? Con un diálogo estructurado, los participantes transforman problemas de su práctica en estrategias profesionales y nuevas formas de pensar. No requiere preparación: traé tus preguntas e ideas. Una sesión de colaboración significativa que ofrece nuevas miradas para resolver problemas y aplicarlas.","sm":""},{"id":290,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"AI-Powered Pathways: Aligning Learning, Faculty Practice, and Workforce Readiness Across Institutions","te":"Trayectos con IA: alinear aprendizaje, práctica docente y preparación para el trabajo entre instituciones","sh":"AI-Powered Pathways: Learning Design and Workforce Readiness","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Dr. Michael Webb","po":"Director of Innovation, Capella University","d":"How can institutions move from AI experimentation to meaningful implementation? This session explores how  universities are aligning learning design, faculty practice and workforce readiness through AI. Participants will examine practical models, contribute examples and apply strategies to integrate AI into learning, assessment and student skill development.","de":"¿Cómo pueden las instituciones pasar de la experimentación con IA a una implementación con sentido? La sesión explora cómo distintas universidades alinean el diseño del aprendizaje, la práctica docente y la preparación para el trabajo a través de la IA. Los participantes analizan modelos prácticos, aportan ejemplos y aplican estrategias para integrar la IA en el aprendizaje, la evaluación y el desarrollo de habilidades.","sm":""},{"id":291,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Assessing in the Age of AI: Challenges, Opportunities, and New Design Thinking","te":"Evaluar en la era de la IA: desafíos, oportunidades y nuevo pensamiento de diseño","sh":"Assessing in the Age of AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 2","p":"Min Yuan","po":"Lead Instructional Designer, Georgia Tech","d":"AI is transforming how we design and experience assessments in higher education. This interactive session explores AI's impact across the assessment spectrum, from quizzes and exams to authentic tasks, examines practical strategies for more effective and future-ready assessments, and invites attendees to apply these strategies through real-world scenarios.","de":"La IA está transformando cómo se diseñan y viven las evaluaciones en la educación superior. Esta sesión interactiva explora el impacto de la IA en todo el espectro de la evaluación, de cuestionarios y exámenes a tareas auténticas, analiza estrategias prácticas para evaluaciones más eficaces y preparadas para el futuro, e invita a aplicarlas en escenarios reales.","sm":""},{"id":292,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Asynchronous Faculty Development with Social Annotation","te":"Formación docente asincrónica con anotación social","sh":"Asynchronous Faculty Development with Social Annotation","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 2","p":"Patrick Horton","po":"Associate Director for Instructional Innovation, Center for the Advancement of Teaching Excellence, University of Illinois Chicago","d":"Traditional faculty development models either do not align with busy instructor schedules or fail to build community. Discover an asynchronous book discussion model that leverages social annotation to support instructors while modeling high-impact online teaching practices. Attendees leave with a digital toolkit for adapting this program at their home institution.","de":"Los modelos tradicionales de formación docente no se adaptan a las agendas apretadas de los docentes o no logran construir comunidad. Un modelo asincrónico de discusión de un libro que usa la anotación social para acompañar a los docentes mientras modela prácticas de enseñanza online de alto impacto. Los asistentes se llevan un kit digital para adaptar el programa a su institución.","sm":""},{"id":293,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Authenticity in the AI Era: Reading the Signals of a Student’s Own Work","te":"Autenticidad en la era de la IA: leer las señales del trabajo propio de un estudiante","sh":"Authenticity in the AI Era","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 1","p":"Tal Havivi","po":"Product Marketing, Superhuman","d":"When a student’s work comes into question, what should an institution actually look at? Superhuman shares what it’s learned about authentic work in the AI era, and why reading several signals together gives instructors and students a clearer, fairer picture than any single score.","de":"Cuando se cuestiona el trabajo de un estudiante, ¿qué debería mirar realmente una institución? Superhuman comparte lo que aprendió sobre el trabajo auténtico en la era de la IA y por qué leer varias señales en conjunto da a docentes y estudiantes una imagen más clara y justa que cualquier puntaje aislado.","sm":""},{"id":294,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Beyond Captions: Exploring Advanced Approaches to tackle Math Accessibility in Lecture Capture Video","te":"Más allá de los subtítulos: enfoques avanzados para la accesibilidad de la matemática en videos de clase","sh":"Math Accessibility in Lecture Videos","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 3","p":"Christine Roach","po":"Instructional Designer, Texas A&M University-College Station","d":"Math-heavy instructional videos often present accessibility challenges that captions alone cannot address. Handwritten notation, visual problem-solving steps, equations that are never spoken aloud, and the relationship between narration and on-screen work can remain inaccessible. This session explores a resourceful approach to making that missing mathematical content more accessible.","de":"Los videos con mucha matemática presentan desafíos de accesibilidad que los subtítulos solos no resuelven: notación manuscrita, pasos visuales de resolución, ecuaciones que nunca se dicen en voz alta y la relación entre lo que se narra y lo que aparece en pantalla. La sesión explora un enfoque ingenioso para hacer accesible ese contenido matemático.","sm":""},{"id":295,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Bots with Purpose: Instructional Design Principles for AI-Powered Course Assistants","te":"Bots con propósito: principios de diseño instruccional para asistentes de curso con IA","sh":"Bots with Purpose: Design Principles for AI Course Assistants","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 4","p":"Cheryl Horten","po":"Instructor, The Pennsylvania State University","d":"This session presents a purposeful approach to building AI-powered course assistants that go beyond FAQ automation to become genuine instructional tools. Drawing on instructional design principles, presenters share how LMS-integrated course bots can reduce student anxiety and support instructor goals, with a practical, student-centered design framework attendees can apply immediately.","de":"La sesión presenta un enfoque intencional para construir asistentes de curso con IA que vayan más allá de responder preguntas frecuentes y se conviertan en verdaderas herramientas de enseñanza. A partir de principios de diseño instruccional, se muestra cómo bots integrados al LMS pueden reducir la ansiedad de los estudiantes y apoyar los objetivos docentes, con un marco de diseño práctico y centrado en el estudiante para aplicar de inmediato.","sm":""},{"id":296,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Closing the AI Competency Gap: Employer Research, Curriculum Design, and the Human Work of Change","te":"Cerrar la brecha de competencias en IA: investigación con empleadores, diseño curricular y el trabajo humano del cambio","sh":"Closing the AI Competency Gap: Employer Research and Curriculum Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 5","p":"Dr. Jenifer Norton","po":"Executive Director of Emerging Technologies, Moravian University","d":"Higher education is under pressure to produce AI-ready graduates, but lacks precise, practitioner-level data on what that actually means. This session presents a mixed-methods employer and alumni research model alongside a human-centered implementation framework to help institutions close the competency gap with both rigor and intention.","de":"La educación superior está bajo presión para formar graduados preparados para la IA, pero le faltan datos precisos, desde la práctica, sobre qué significa eso. La sesión presenta un modelo de investigación de métodos mixtos con empleadores y graduados, junto con un marco de implementación centrado en las personas, para ayudar a cerrar la brecha de competencias con rigor e intención.","sm":""},{"id":297,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Coaching for Connection: Supporting Online Students at Scale","te":"Coaching para la conexión: acompañar a estudiantes online a escala","sh":"Coaching for Connection at Scale","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 5","p":"Janessa Guzman","po":"Assistant Director, Success Coaching, Florida International University","d":"Online student success depends on intentional, relationship-centered support. This session highlights the Student Success Team at Florida International University (FIU Online) and its coaching model using proactive, multi-channel outreach and individualized conversations to foster belonging, persistence, and momentum through scalable, human-centered strategies.","de":"El éxito de los estudiantes online depende de un acompañamiento intencional y centrado en el vínculo. La sesión presenta al equipo de Éxito Estudiantil de FIU Online y su modelo de coaching, con contacto proactivo por múltiples canales y conversaciones individuales que fomentan la pertenencia, la permanencia y el avance con estrategias escalables y centradas en las personas.","sm":""},{"id":298,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Cultivating Joy and Belonging in Gen Z Learning Communities","te":"Cultivar la alegría y la pertenencia en comunidades de aprendizaje de la Gen Z","sh":"Cultivating Joy and Belonging in Gen Z Learning Communities","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 1","p":"Heather Olson, Ph.D.","po":"Director, Florida SouthWestern State College","d":"Gen Z learners seek connection, relevance, and meaning in their learning experiences. This session introduces a research-informed framework grounded in self-determination theory to cultivate joy and belonging in online courses. Participants will redesign a learning activity using peer interaction and video discussion to foster authentic engagement.","de":"Los estudiantes de la Generación Z buscan conexión, relevancia y sentido en lo que aprenden. La sesión presenta un marco basado en investigación y en la teoría de la autodeterminación para cultivar la alegría y la pertenencia en cursos online. Los participantes rediseñan una actividad con interacción entre pares y discusión en video para fomentar una participación genuina.","sm":""},{"id":299,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Designing Online Graduate Student Programs to Enhance Student Engagement","te":"Diseñar programas de posgrado online que aumenten la participación de los estudiantes","sh":"Designing Online Graduate Programs for Engagement","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A1/A2","p":"Stephanie M. Foote","po":"Vice President, Gardner Institute","d":"Online graduate students need more than content delivery; they need connection, community, and opportunities for authentic learning. Drawing on the Online Engagement Framework and High-Impact Practices, this session presents evidence-based strategies for designing online graduate courses that intentionally foster social, cognitive, collaborative, behavioral, and emotional engagement among adult learners.","de":"Los estudiantes de posgrado online necesitan más que contenidos: necesitan conexión, comunidad y oportunidades de aprendizaje auténtico. A partir del Online Engagement Framework y las prácticas de alto impacto, la sesión presenta estrategias basadas en evidencia para diseñar cursos de posgrado online que fomenten intencionalmente la participación social, cognitiva, colaborativa, conductual y emocional de los estudiantes adultos.","sm":""},{"id":300,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Ditching Emotional Friction: The Power of Intentional Design","te":"Eliminar la fricción emocional: el poder del diseño intencional","sh":"Ditching Emotional Friction Through Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A3/A4","p":"Heather Medley","po":"Instructional Design, Community Portal Self Registration Account","d":"Student confidence, engagement, and academic integrity are deeply connected to emotional well-being. Explore how intentional course design can reduce anxiety, confusion, and disengagement through practical strategies, including human-centered assessment, clearer pathways, and emotionally supportive learning experiences that increase confidence, persistence, and stronger academic performance in online environments.","de":"La confianza, la participación y la integridad académica de los estudiantes están profundamente ligadas a su bienestar emocional. Cómo un diseño de cursos intencional puede reducir la ansiedad, la confusión y la desconexión con estrategias prácticas: evaluación centrada en las personas, recorridos más claros y experiencias emocionalmente contenedoras que aumentan la confianza, la permanencia y el desempeño en entornos online.","sm":""},{"id":301,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Feedback as Connection: A Self-Study of Instructor Feedback in Asynchronous Online Courses","te":"La retroalimentación como conexión: un autoestudio sobre la retroalimentación docente en cursos online asincrónicos","sh":"Feedback as Connection","ty":"Discovery session","tye":"Discovery session","to":"Graduate Student Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 6","p":"Victoria Buckley","po":"Sr. Instructional Designer, University of Cincinnati","d":"This work-in-progress explores instructor feedback as a relational practice in online asynchronous courses. Using artifacts from archived and current courses, this research examines responses to student work through a Relational-Cultural Theory lens. Participants will reflect on how their own practices foster or constrain connection, responsiveness, and power in online learning.","de":"Este trabajo en curso explora la retroalimentación docente como práctica relacional en cursos online asincrónicos. Con materiales de cursos archivados y actuales, la investigación analiza las devoluciones al trabajo de los estudiantes desde la teoría relacional-cultural. Los participantes reflexionan sobre cómo sus propias prácticas favorecen o limitan la conexión, la capacidad de respuesta y las relaciones de poder en el aprendizaje online.","sm":""},{"id":302,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"From Compliance to Magic: Reframing Digital Accessibility Through Faculty Workshops","te":"Del cumplimiento a la magia: replantear la accesibilidad digital a través de talleres docentes","sh":"Accessibility Through Faculty Workshops","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 7","p":"Christopher Mong, Ph.D.","po":"Senior Instructional Designer, Purdue University-Main Campus","d":"As institutions prepare for Title II compliance, faculty need practical support rather than fear-based messaging. This session explores how online accessibility workshops can build awareness, foster engagement, and connect faculty with resources. Attendees will discuss communication strategies, support models, and tools that promote sustainable accessibility efforts.","de":"Mientras las instituciones se preparan para cumplir con el Título II de la ADA, los docentes necesitan apoyo práctico, no mensajes basados en el miedo. La sesión explora cómo talleres online de accesibilidad pueden generar conciencia, compromiso y conexión con recursos, y se conversa sobre estrategias de comunicación, modelos de apoyo y herramientas para esfuerzos de accesibilidad sostenibles.","sm":""},{"id":303,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"From Vision to Launch: Building an Online Faculty Institute that Cultivates Teaching Excellence and Belonging","te":"De la visión al lanzamiento: un instituto para docentes online que cultiva la excelencia y la pertenencia","sh":"Building an Online Faculty Institute","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 1","p":"Chris Zakrzewski, Ed.D.","po":"Director of Learning Design, Baylor University","d":"In a time of rapid change and growing online learning, faculty need support that develops both competence and connection. Explore Baylor University's Online Faculty Institute (OFI), a year-long model that cultivates instructional excellence, professional belonging, and sustained engagement among online educators.","de":"En tiempos de cambio acelerado y crecimiento del aprendizaje online, los docentes necesitan un apoyo que desarrolle tanto competencias como vínculos. Se presenta el Online Faculty Institute (OFI) de Baylor University, un modelo de un año que cultiva la excelencia en la enseñanza, la pertenencia profesional y el compromiso sostenido de los educadores online.","sm":""},{"id":304,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"How Do We Design for Motivation? Exploring Self-Determination Theory","te":"¿Cómo diseñamos para la motivación? La teoría de la autodeterminación","sh":"How Do We Design for Motivation? Self-Determination Theory","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 8","p":"Julie Mendez","po":"Associate Professor of Practice, Purdue University-Main Campus","d":"This Discovery Session explores how self-determination theory can enhance student motivation. Through brief examples and interactive discussion, participants will examine strategies to support autonomy, competence, and relatedness, and generate actionable ideas to improve engagement and effectiveness in their own digital or blended course designs.","de":"Esta sesión de conversación explora cómo la teoría de la autodeterminación puede aumentar la motivación de los estudiantes. Con ejemplos breves y discusión interactiva, se analizan estrategias para apoyar la autonomía, la competencia y el vínculo con otros, y se generan ideas concretas para mejorar la participación y la eficacia en el diseño de cursos digitales o híbridos.","sm":""},{"id":305,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Igniting the Uninspired: A Gamified Strategy to Engage Reluctant Faculty in Professional Development","te":"Encender a los desmotivados: una estrategia gamificada para involucrar a docentes reticentes en la formación","sh":"A Gamified Strategy for Reluctant Faculty","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 9","p":"Dr. Jana Gerard","po":"Director, Learning & Teaching Center/NW Online, Northwest Missouri state University","d":"Tired of sending generic emails to reluctant faculty, only to get radio silence? Change the game. Literally. In this fast-paced session, we turn faculty engagement into a puzzle. Team up with peers to dismantle barriers, swap success stories, and walk away with a gamified strategy that gets faculty excited.","de":"¿Cansado de mandar mails genéricos a docentes reticentes y no recibir respuesta? Cambiá las reglas del juego, literalmente. En esta sesión dinámica, el compromiso docente se convierte en un rompecabezas: en equipo, se derriban barreras, se comparten casos de éxito y los participantes se llevan una estrategia gamificada que entusiasme a los docentes.","sm":""},{"id":306,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Illuminating Balance: Practical Wellness Strategies","te":"Iluminar el equilibrio: estrategias prácticas de bienestar","sh":"Practical Wellness Strategies","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"Dr. Jacquelyn Cato","po":"Chief Strategy Officer, Instructional Connections","d":"Join this interactive engagement session to explore practical wellness strategies designed to support balance and overall well-being. While reflecting on their own habits, attendees will examine actionable tools for managing workload, stress, and fatigue. The session will equip attendees with strategies to enhance personal well-being and promote balance in life.","de":"Una sesión interactiva para explorar estrategias prácticas de bienestar y equilibrio. Reflexionando sobre sus propios hábitos, los asistentes analizan herramientas concretas para manejar la carga de trabajo, el estrés y el cansancio, y se llevan estrategias para mejorar su bienestar y equilibrio.","sm":""},{"id":307,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Leading with Critical Curiosity: Building Capacity for Instructional Change","te":"Liderar con curiosidad crítica: desarrollar capacidades para el cambio en la enseñanza","sh":"Leading with Critical Curiosity","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 3","p":"Nicole Weber","po":"Assistant Professor, Educational Foundations, University of Wisconsin-Whitewater","d":"Instructional change is no longer episodic. It's constant, overlapping, and often under-supported. This interactive session invites academic leaders to adopt critical curiosity, prioritize strategically, fund professional learning, clarify expectations, and build capacity for sustainable change. Participants will leave with key questions to drive action-planning when they return to their campus.","de":"El cambio en la enseñanza ya no es ocasional: es constante, superpuesto y muchas veces sin el apoyo necesario. Esta sesión interactiva invita a las autoridades académicas a adoptar una curiosidad crítica, priorizar estratégicamente, financiar la formación, aclarar expectativas y desarrollar capacidades para un cambio sostenible. Los participantes se llevan preguntas clave para planificar acciones al volver a su institución.","sm":""},{"id":308,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Measuring What Matters: Using Learning Time Data to Understand and Enhance Student Engagement","te":"Medir lo que importa: usar datos de tiempo de aprendizaje para entender y mejorar la participación","sh":"Measuring What Matters: Learning Time Data","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 2","p":"Parker Story","po":"Instructional Designer, University of Pittsburgh","d":"Struggling to meet RSI engagement requirements in your online or hybrid courses? This session introduces the Learning Time Estimator — a practical, customizable tool that calculates and categorizes student engagement hours. Attendees observe a live demonstration, complete a hands-on activity using the tool, and discuss practical applications for their institutions.","de":"¿Te cuesta cumplir los requisitos de interacción (RSI) en tus cursos online o híbridos? La sesión presenta el Learning Time Estimator, una herramienta práctica y personalizable que calcula y clasifica las horas de dedicación de los estudiantes. Incluye una demostración en vivo, una actividad práctica con la herramienta y una conversación sobre su aplicación en cada institución.","sm":""},{"id":309,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Multimedia Mastery: Engaging Gen Z (and almost Alpha) in Higher Education","te":"Dominio multimedia: involucrar a la Gen Z (y casi Alfa) en la educación superior","sh":"Multimedia for Gen Z and Gen Alpha","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Erica Porter","po":"Independent Consultant, Independent Consultant","d":"This presentation is designed to provide higher education faculty members with the tools and knowledge to integrate multimedia effectively into their course design, specifically tailored for Gen Z learners, and Gen Alpha on its way. Incorporating multimedia elements is crucial to keeping them engaged in their educational journey.","de":"La presentación busca dar a los docentes universitarios herramientas y conocimientos para integrar recursos multimedia de forma eficaz en el diseño de sus cursos, pensando específicamente en la Generación Z y en la Alfa que ya llega. Incorporar elementos multimedia es clave para sostener su participación en su recorrido educativo.","sm":""},{"id":310,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Oh, Hack No! Preparing for the Worst, so an LMS Breach Doesn’t Become a Campus Crisis for Small Colleges.","te":"¡Oh, no, nos hackearon! Prepararse para lo peor, para que una vulneración del LMS no se convierta en una crisis en instituciones pequeñas","sh":"Preparing for an LMS Breach","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 10","p":"Dr. Jill Winnington","po":"Director of Online Learning, Goldey-Beacom College","d":"This interactive session helps leaders across campus of small private colleges use the Spring 2026 LMS cyber incident to strengthen online campus resilience. Attendees will explore practical strategies for data protection, crisis communication, and academic continuity while engaging in discussion and reflection activities that support immediate, institution-specific action planning.","de":"Esta sesión interactiva ayuda a autoridades de pequeñas instituciones privadas a usar el incidente informático del LMS de 2026 para fortalecer la resiliencia de su campus online. Se exploran estrategias prácticas de protección de datos, comunicación en crisis y continuidad académica, con actividades de discusión y reflexión para planificar acciones concretas en cada institución.","sm":""},{"id":311,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Postdoctoral Fellowship for Emerging Scholars","te":"Beca posdoctoral para investigadores emergentes","sh":"Postdoctoral Fellowship for Emerging Scholars","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 11","p":"Deepa Shriram, MA","po":"Senior Manager, Walden University","d":"Walden University’s Postdoctoral Fellowship program provides emerging scholars with professional development opportunities that direct them towards a path to become emerging scholars. Mentors, coaches, and staff guide Fellows using a structured annual plan with measurable quarterly activities and reflections that strengthen teaching skills, professional development, and community impact.","de":"El programa de becas posdoctorales de Walden University ofrece a investigadores emergentes oportunidades de desarrollo profesional para consolidar su trayectoria académica. Mentores, coaches y equipo guían a los becarios con un plan anual estructurado, con actividades trimestrales medibles y reflexiones que fortalecen sus habilidades docentes, su desarrollo profesional y su impacto en la comunidad.","sm":""},{"id":312,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Practice Makes Perfect: Using Virtual Audiences and AI Feedback to Strengthen Student Communication","te":"La práctica hace al maestro: audiencias virtuales y retroalimentación con IA para fortalecer la comunicación de los estudiantes","sh":"Practice Makes Perfect: AI Feedback to Rehearse Interviews and Presentations","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Dr. Georgette Kluiters","po":"Distance Education Coordinator & Instructional Assistant Professor, University of Florida","d":"Imagine students rehearsing presentations, defenses, and interviews, answering audience questions, and receiving immediate feedback before a high-stakes academic or professional presentation. This session explores how AI-generated audiences, real-time questioning, and automated communication feedback create scalable practice opportunities for learners. Participants will experience the technology firsthand and gain practical implementation strategies.","de":"Imaginá a tus estudiantes ensayando presentaciones, defensas y entrevistas, respondiendo preguntas del público y recibiendo retroalimentación inmediata antes de una presentación académica o profesional importante. La sesión explora cómo audiencias generadas con IA, preguntas en tiempo real y retroalimentación automática sobre la comunicación crean oportunidades de práctica escalables. Los participantes prueban la tecnología y se llevan estrategias de implementación.","sm":""},{"id":313,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Scaffolding at Scale: Leveraging GenAI to Support Engagement and Learning in Online Environments","te":"Andamiaje a escala: usar IA generativa para apoyar la participación y el aprendizaje en entornos online","sh":"Scaffolding at Scale: Using GenAI to Support Learners","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere II","p":"Hong Wang, Ph.D.","po":"Professor/Associate Director of Instructional Technology Training, Northern Virginia Community College","d":"As online learning continues grow, providing timely, personalized, and meaningful instructional support remains a persistent challenge for educators. This session frames GenAI as a pedagogical partner to scaffold online learners at scale through various ways. Participants will leave with practical ideas and strategies to apply in their own online courses.","de":"Con el crecimiento del aprendizaje online, brindar un apoyo pedagógico oportuno, personalizado y significativo sigue siendo un desafío para los docentes. La sesión plantea la IA generativa como aliada pedagógica para andamiar a los estudiantes online a escala de distintas maneras, con ideas y estrategias prácticas para aplicar en los propios cursos.","sm":""},{"id":314,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Teaching with Intention: A 5-Lens PAUSE Framework for Flexible Online Learning Design","te":"Enseñar con intención: el marco PAUSE de cinco lentes para un diseño online flexible","sh":"The PAUSE Framework for Flexible Online Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 3","p":"Fanny Tsai, UC Irvine","po":"Instructional Designer, University of California, Irvine","d":"Online courses can quietly become too complicated for both students and faculty. This session introduces the 5-Lens PAUSE Framework- Pedagogical Fit, Access, Usability, Sustainability, and Equity to help educators pause, simplify online learning decisions, use flexible strategies, and design a more supportive student learning experience.","de":"Los cursos online pueden volverse, sin que nadie lo note, demasiado complicados para estudiantes y docentes. La sesión presenta el marco PAUSE de cinco lentes (pertinencia pedagógica, acceso, usabilidad, sostenibilidad y equidad) para ayudar a los educadores a hacer una pausa, simplificar decisiones, usar estrategias flexibles y diseñar una experiencia de aprendizaje más contenedora.","sm":""},{"id":315,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"Test Day Anywhere: Implementing Remote State Summatives (A Practical Statewide Model from Utah)","te":"Exámenes en cualquier lugar: evaluaciones estatales a distancia (un modelo práctico de Utah)","sh":"Remote Statewide Testing in Utah (K-12)","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Ms. DelRae L. Mullins, M.A.","po":"Compliance and Assessment Manager, Utah Connections Academy","d":"Transitioning to remote statewide summative assessments requires careful planning and stakeholder cooperation to maintain test integrity and reduce costs. The Utah case study demonstrates a successful two-year initiative of securely administering remote tests, covering strategic planning, live proctoring, and post-test reflections for future policy recommendations.","de":"Pasar a evaluaciones sumativas estatales a distancia requiere planificación cuidadosa y cooperación entre actores para mantener la integridad de las pruebas y reducir costos. El caso de Utah muestra una iniciativa exitosa de dos años de evaluaciones remotas seguras: planificación estratégica, supervisión en vivo y reflexiones posteriores para futuras recomendaciones de política.","sm":""},{"id":316,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"The Conversation Continues: Creating Student-Centered Online Courses for All Learners","te":"La conversación continúa: cursos online centrados en el estudiante para todos","sh":"Student-Centered Online Courses for All","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 4","p":"Tina Calandrino, M.Ed.","po":"Associate Instructional Designer, University of Central Florida","d":"Online learning communities thrive when educators lead with empathy, consistency, and purposeful care. This conversation session explores how deliberate, quiet actions can build trust and belonging across all learner experiences. Together, we examine how small, human acts sustain connection when the world makes connection hard.","de":"Las comunidades de aprendizaje online prosperan cuando los educadores lideran con empatía, consistencia y un cuidado intencional. Esta conversación explora cómo acciones deliberadas y silenciosas pueden construir confianza y pertenencia en todas las experiencias de los estudiantes, y cómo pequeños gestos humanos sostienen la conexión cuando el mundo la hace difícil.","sm":""},{"id":317,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"The Messy Middle: Our Journey to Streamlining Course Development Processes","te":"El desordenado punto intermedio: nuestro camino para agilizar los procesos de desarrollo de cursos","sh":"Streamlining Course Development Processes","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere V","p":"Jennifer Zaur","po":"Senior Director of Learning Solutions and Experience Design, University of Arizona Global Campus","d":"When course development processes become barriers rather than supports, redesign is essential. This session shares lessons learned from evaluating and improving workflows, stakeholder communication, and faculty support. Participants will leave with actionable strategies for identifying friction points, managing change, and creating more effective development processes.","de":"Cuando los procesos de desarrollo de cursos se vuelven obstáculos en lugar de apoyos, hay que rediseñarlos. La sesión comparte aprendizajes de evaluar y mejorar flujos de trabajo, la comunicación con los distintos actores y el apoyo a los docentes, con estrategias para identificar puntos de fricción, gestionar el cambio y crear procesos de desarrollo más eficaces.","sm":""},{"id":318,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"The Multi-Threaded Studio: Principles for Success with Instructional Content Design, Production and Innovation","te":"El estudio de múltiples hilos: principios para el éxito en el diseño, la producción y la innovación de contenidos educativos","sh":"The Multi-Threaded Studio","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 12","p":"Chris Blakesley","po":"Executive Director, Instructional Design and Media Production Studio, University of Illinois Chicago","d":"How can digital learning leaders build an agile media and instructional design studio that transcends reactive workflows? This session shares a project-centric framework through a three-year studio evolution. Attendees will explore a transferable 4-thread operational matrix designed to concurrently scale. Discover core administrative principles and innovation facilitation strategies.","de":"¿Cómo pueden los líderes de aprendizaje digital construir un estudio ágil de medios y diseño instruccional que supere los flujos de trabajo reactivos? La sesión comparte un marco centrado en proyectos a partir de la evolución de un estudio durante tres años, con una matriz operativa transferible de cuatro hilos para escalar en paralelo, principios de gestión y estrategias para facilitar la innovación.","sm":""},{"id":319,"day":"Mie","s":840,"e":885,"b":"w-1400","t":"With A Little Help From AI Friends: AI Usage and Expectations Among Online Computing Students and Instructional Staff","te":"Con una ayudita de mis amigos de IA: uso y expectativas de IA entre estudiantes y docentes de computación online","sh":"How Students and Instructors Actually Use AI","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 13","p":"Alex S. Duncan","po":"Senior Director of OMSCS, Georgia Institute of Technology-Main Campus","d":"Online students are using AI far more than instructors, but not in the ways you might expect. This session reveals surprising alignment between student AI practices and faculty expectations, alongside a critical trust gap, and offers actionable strategies for designing policies and learning experiences in the age of generative AI.","de":"Los estudiantes online usan la IA mucho más que los docentes, pero no de la forma que se espera. La sesión muestra una sorprendente coincidencia entre las prácticas de los estudiantes y las expectativas de los docentes, junto con una brecha crítica de confianza, y ofrece estrategias concretas para diseñar políticas y experiencias de aprendizaje en la era de la IA generativa.","sm":""},{"id":320,"day":"Mie","s":900,"e":945,"b":"w-1500","t":"AI-Aware Teaching","te":"Enseñanza consciente de la IA","sh":"AI-Aware Teaching: Helping Students Develop Discernment","ty":"Featured session","tye":"Sesión destacada","to":"Featured Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere I","p":"Marc Watkins","po":"Lecturer, University of Mississippi","d":"AI is the subject of provocative pedagogy. It is contested, consequential, ethically tangled, and changing weekly. How can we help students develop discernment when they approach this new technology? This session will explore responses to AI gathered from the Norton Guide to AI-Aware Teaching.","de":"La IA es un tema que pide una pedagogía provocadora: está en disputa, tiene consecuencias, es éticamente compleja y cambia cada semana. ¿Cómo ayudar a los estudiantes a desarrollar criterio frente a esta nueva tecnología? La sesión explora respuestas a la IA recogidas en la guía de Norton sobre enseñanza consciente de la IA.","sm":""},{"id":321,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Accelerating Student and Faculty Success with Pacing Guides","te":"Impulsar el éxito de estudiantes y docentes con guías de ritmo","sh":"3:00 · Pacing Guides for Student Success","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 4","p":"Dr. Heather Rivera, DNP, RN","po":"Associate Dean of Faculty, General Education, Chamberlain University-Administrative Office","d":"Online students often struggle with time management despite flexible course designs. This session explores how assignment pacing guides can reduce overwhelm, support consistent engagement, and improve outcomes for both students and faculty. Participants will learn practical strategies for designing and implementing pacing guides in online courses.","de":"Los estudiantes online suelen tener dificultades para organizar su tiempo, aun con cursos flexibles. La sesión explora cómo las guías de ritmo de entregas pueden reducir la sensación de agobio, sostener una participación constante y mejorar los resultados de estudiantes y docentes, con estrategias para diseñarlas e implementarlas.","sm":""},{"id":322,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"AI literacy as a key driver of user experience in AI- powered assessment: insights from Socratic mind","te":"La alfabetización en IA como clave de la experiencia de usuario en evaluaciones con IA: aprendizajes de Socratic Mind","sh":"3:00 · AI Literacy as a Key Driver in AI-Powered Assessment","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Jeonghyun Lee","po":"Director of Research in Education Innovation, Georgia Tech - Center for 21st Century Universities","d":"As AI-powered learning tools proliferate in higher education, a critical question emerges: do students actually know how to use them well? Drawing on data from 309 undergraduates using an AI-based oral assessment tool, this session reveals that AI literacy—not prior AI exposure—is what determines whether students benefit.","de":"Con la multiplicación de herramientas de aprendizaje con IA, surge una pregunta crítica: ¿los estudiantes saben usarlas bien? A partir de datos de 309 estudiantes universitarios que usaron una herramienta de evaluación oral con IA, la sesión muestra que lo que determina si los estudiantes se benefician es la alfabetización en IA, no la exposición previa a la IA.","sm":""},{"id":323,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"AI-Assisted, Human-Guided: Turning an Everyday Problem into a Working Solution","te":"Asistido por IA, guiado por personas: convertir un problema cotidiano en una solución que funciona","sh":"3:00 · AI-Assisted, Human-Guided: From Everyday Problem to Working Solution","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 5","p":"Addie Sweet","po":"Senior Support Specialist, Purdue University-Main Campus","d":"What happens when you understand the problem but don’t know how to build the solution? Follow one educational technology consultant’s journey from recurring operational frustration to a working automated solution, using generative AI to learn, troubleshoot, and iterate while keeping human expertise at the center of every decision.","de":"¿Qué pasa cuando entendés el problema pero no sabés cómo construir la solución? El recorrido de un consultor en tecnología educativa que pasó de una frustración operativa recurrente a una solución automatizada que funciona, usando IA generativa para aprender, resolver problemas e iterar, con la experiencia humana en el centro de cada decisión.","sm":""},{"id":324,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Beyond Lurking: Attitudinal Communities and Engagement Trajectories in Online Courses","te":"Más allá de \"solo mirar\": comunidades actitudinales y trayectorias de participación en cursos online","sh":"3:00 · Beyond \"Lurking\": Engagement Trajectories","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 1","p":"David Joyner","po":"Executive Director of Online Education & OMSCS, Georgia Institute of Technology-Main Campus","d":"We routinely label students who don't post in online discussions as \"lurkers\"—but what does that label tell us? Drawing on forum logs, social presence surveys, and network-based community detection, this session challenges the deficit framing of passive participation and reveals the diverse experiential worlds hiding behind this behavioral category.","de":"Solemos etiquetar como \"lurkers\" (los que solo miran) a quienes no publican en los foros, pero ¿qué nos dice esa etiqueta? A partir de registros de foros, encuestas de presencia social y detección de comunidades en redes, la sesión cuestiona la mirada deficitaria sobre la participación pasiva y muestra la diversidad de experiencias que se esconden detrás de esa categoría.","sm":""},{"id":325,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Designers Comic: Using AI to Turn Course Content into Graphic Narratives","te":"Cómic de diseñadores: usar IA para convertir contenidos en narrativas gráficas","sh":"3:00 · Using AI to Turn Content into Graphic Narratives","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Europe 4","p":"Ricardo Lopez","po":"Mr., The University of Texas Rio Grande Valley","d":"As AI reshapes digital learning, educators have new opportunities to become storytellers. This session demonstrates how AI-generated graphic narratives can transform traditional course content into immersive learning experiences that provide context, spark curiosity, and help students connect with complex concepts.","de":"A medida que la IA transforma el aprendizaje digital, los docentes tienen nuevas oportunidades de contar historias. La sesión muestra cómo narrativas gráficas generadas con IA pueden transformar contenidos tradicionales en experiencias inmersivas que dan contexto, despiertan curiosidad y ayudan a conectar con conceptos complejos.","sm":""},{"id":326,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Do Interactive, Ungraded Activities Actually Improve Online Student Outcomes? A Meta-Analysis","te":"¿Las actividades interactivas sin calificación mejoran los resultados de los estudiantes online? Un metaanálisis","sh":"3:00 · Do Ungraded Interactive Activities Work? A Meta-Analysis","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Europe 5","p":"Dr. Jess Kahlow","po":"Adjunct Assistant Professor, University of Texas at Arlington","d":"Do the interactive, ungraded activities we build into online courses actually help students succeed? The literature says both yes and no, depending on which study you read. This session cuts through that contradiction with a preliminary random-effects meta-analysis of 10+ quantitative studies and delivers an evidence-based answer.","de":"¿Las actividades interactivas y sin nota que incluimos en los cursos online realmente ayudan a los estudiantes? La literatura dice que sí y que no, según el estudio. La sesión resuelve esa contradicción con un metaanálisis preliminar de efectos aleatorios de más de 10 estudios cuantitativos y ofrece una respuesta basada en evidencia.","sm":""},{"id":327,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Expanding Interdisciplinary Education Through Project-Based Collaboration","te":"Ampliar la educación interdisciplinaria a través de la colaboración por proyectos","sh":"3:00 · Interdisciplinary Project-Based Collaboration","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 1","p":"Kaitlyn Cremer, OTD, SCLV","po":"Clinical Associate Professor, Baylor University","d":"Looking to expand interdisciplinary education within your institution? Explore how a primarily virtual collaboration between occupational therapy and engineering students improved teamwork and communication outcomes. This session shares pilot findings and design strategies for implementing scalable, project-based collaboration in hybrid and distributed learning environments.","de":"¿Querés ampliar la educación interdisciplinaria en tu institución? Cómo una colaboración principalmente virtual entre estudiantes de terapia ocupacional y de ingeniería mejoró el trabajo en equipo y la comunicación. La sesión comparte hallazgos del piloto y estrategias de diseño para implementar colaboración escalable por proyectos en entornos híbridos y distribuidos.","sm":""},{"id":328,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"From AI Use to AI Fluency: Advancing Ethical, Critical, and Responsible AI Integration in Higher Education","te":"Del uso de la IA a la fluidez en IA: una integración ética, crítica y responsable en la educación superior","sh":"3:00 · From AI Use to AI Fluency: Ethics, Critical Thinking and Workforce Readiness","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 2","p":"Douglene Jackson, PhD, OTR/L","po":"Professor, Southern California University of Health Sciences","d":"As artificial intelligence becomes embedded across professions, higher education must move beyond teaching students how to use AI and focus on developing AI fluency. This session introduces the AI with EASE Framework and practical applications of AI tools to support learning, professionalism, critical thinking, ethical decision-making, and workforce readiness.","de":"Con la IA integrada en todas las profesiones, la educación superior debe ir más allá de enseñar a usarla y enfocarse en desarrollar fluidez en IA. La sesión presenta el marco \"AI with EASE\" y aplicaciones prácticas de herramientas de IA para apoyar el aprendizaje, el profesionalismo, el pensamiento crítico, la toma de decisiones éticas y la preparación para el trabajo.","sm":""},{"id":329,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"From Mandate to Momentum: Scaling Asynchronous Professional Learning Through Strategic Pivoting","te":"Del mandato al impulso: escalar la formación profesional asincrónica con un giro estratégico","sh":"3:00 · Scaling Asynchronous Educator Learning","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 4","p":"Samantha Reynolds","po":"Director of Educator Learning & Resources, South Carolina ETV and Public Radio","d":"When legislative changes shifted educator recertification responsibilities back to school districts, a public media network launched an asynchronous professional learning initiative designed to support scalable implementation and educator flexibility. This session explores how educator-created content, strategic partnerships, and online learning models supported district adoption during a period of rapid change.","de":"Cuando cambios legislativos devolvieron a los distritos escolares la responsabilidad de la recertificación docente, una red de medios públicos lanzó una iniciativa de formación asincrónica pensada para una implementación escalable y flexible. La sesión explora cómo contenidos creados por educadores, alianzas estratégicas y modelos de aprendizaje online facilitaron la adopción en los distritos en un período de cambio rápido.","sm":""},{"id":330,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"From Prompt to Canvas: One Professor's AI Workflow","te":"Del prompt a Canvas: el flujo de trabajo con IA de un profesor","sh":"3:00 · One Professor's AI Workflow","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 1","p":"Wayne Yeatman","po":"Professor, Central Oregon Community College","d":"What does it actually look like when a community college professor uses AI as a daily teaching tool — not as a gimmick, but as a genuine workflow partner?","de":"¿Cómo se ve, en la práctica, que un profesor de community college use la IA como herramienta cotidiana de enseñanza, no como truco, sino como verdadero aliado en su flujo de trabajo?","sm":""},{"id":331,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Illuminate Your Team: Building Sustainable, High-Impact Remote Instructional Design Teams Through Intentional Leadership","te":"Iluminá a tu equipo: equipos remotos de diseño instruccional sostenibles y de alto impacto con un liderazgo intencional","sh":"3:00 · Sustainable Remote ID Teams","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 5","p":"Sydney Wilk","po":"Instructional Design Lead, Virginia Commonwealth University","d":"Remote instructional design teams face burnout in high-demand digital learning environments. This session explores how leaders can build resilient, high-performing teams through intentional check-ins, clear systems, and meaningful recognition in a remote environment. Attendees will gain practical strategies to reduce cognitive load, support well-being, and foster sustainable, engaged team cultures.","de":"Los equipos remotos de diseño instruccional sufren agotamiento en entornos digitales de alta demanda. La sesión explora cómo los líderes pueden construir equipos resilientes y de alto desempeño con reuniones de seguimiento intencionales, sistemas claros y un reconocimiento significativo en la distancia, con estrategias para reducir la carga cognitiva, cuidar el bienestar y fomentar culturas de equipo sostenibles y comprometidas.","sm":""},{"id":332,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Stay HONEST: How Ethical AI Can Illuminate the Future of Nursing Research","te":"Mantenete HONESTO: cómo una IA ética puede iluminar el futuro de la investigación en enfermería","sh":"3:00 · Ethical AI in Nursing Research","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 3","p":"Dr. Tanya L. W. Morris","po":"Assistant Nursing Professor, Monroe University","d":"Artificial intelligence is reshaping nursing research education, yet its speed can quietly weaken scholarly judgment. This session introduces the HONEST framework, helping educators detect bias, protect academic integrity, safeguard patient data, and preserve critical thinking. Discover how ethical AI becomes a thinking partner advancing rigorous, responsible nursing research.","de":"La IA está transformando la formación en investigación en enfermería, pero su velocidad puede debilitar en silencio el juicio académico. La sesión presenta el marco HONEST, que ayuda a los docentes a detectar sesgos, proteger la integridad académica, resguardar los datos de pacientes y preservar el pensamiento crítico, para que una IA ética sea aliada de una investigación rigurosa y responsable.","sm":""},{"id":333,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Then and Now: The Evolution of Wearable Technologies from COVID-19 Disruption to AI-Enabled Faculty Performance","te":"Antes y ahora: la evolución de los dispositivos portátiles, de la disrupción del COVID-19 al desempeño docente con IA","sh":"3:00 · Wearables and Faculty Performance","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 2","p":"Dr. Suzanne Ensmann","po":"Associate Professor, The University of Tampa","d":"Are faculty wearables becoming ambient AI partners? This cross-sectional follow-up study examines how university faculty's use of wearable technology has shifted from COVID-19 health monitoring to AI-enabled performance, productivity, and social presence. Using a five-category taxonomy, researchers reveal trends and implications for instructional design, faculty development, and social presence theory.","de":"¿Los dispositivos portátiles de los docentes se están convirtiendo en aliados de IA siempre presentes? Este estudio de seguimiento analiza cómo el uso de wearables por parte de docentes universitarios pasó del monitoreo de salud durante el COVID-19 al desempeño, la productividad y la presencia social con IA. Con una taxonomía de cinco categorías, muestra tendencias e implicancias para el diseño instruccional, la formación docente y la teoría de la presencia social.","sm":""},{"id":334,"day":"Mie","s":900,"e":915,"b":"w-1500","t":"Time by Design: Architecting Student Time Management in Asynchronous Online STEM Courses","te":"El tiempo por diseño: construir la gestión del tiempo de los estudiantes en cursos online asincrónicos de STEM","sh":"3:00 · Designing Student Time Management","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"Arunava Roy","po":"Assistant Professor, University of Oklahoma","d":"Time management is the hidden curriculum of asynchronous online learning and most courses leave students to figure it out alone. Drawing on an ongoingstudy, this session presents one central argument: time management is a design responsibility. Attendees will walk away with one question that reshapes how they design their courses.","de":"La gestión del tiempo es el currículo oculto del aprendizaje online asincrónico, y la mayoría de los cursos deja que los estudiantes lo resuelvan solos. A partir de un estudio en curso, la sesión plantea un argumento central: organizar el tiempo es una responsabilidad del diseño. Los asistentes se llevan una pregunta que cambia la forma de diseñar sus cursos.","sm":""},{"id":335,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"AI in Action: How My Marketing Students Build Smarter, Stronger Brands","te":"IA en acción: cómo mis estudiantes de marketing construyen marcas más inteligentes y sólidas","sh":"3:30 · AI in Action: How Students Build Brands with AI","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 6","p":"Shanika Wright Turner","po":"Associate Professor, Georgia Highlands College","d":"Discover how marketing students use artificial intelligence to build smarter, stronger brands. This session highlights assignments where students use AI to conduct market research, create customer personas, develop content, and design marketing strategies. Attendees will leave with practical ideas for integrating AI to enhance creativity, critical thinking, and learning outcomes.","de":"Cómo estudiantes de marketing usan IA para construir marcas más inteligentes y sólidas. La sesión muestra consignas en las que los estudiantes usan IA para hacer estudios de mercado, crear perfiles de clientes, desarrollar contenidos y diseñar estrategias de marketing, con ideas prácticas para integrar la IA y potenciar la creatividad, el pensamiento crítico y los resultados de aprendizaje.","sm":""},{"id":336,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Beyond Shared Drives: Capturing and Sharing Knowledge in Instructional Design Teams","te":"Más allá de las carpetas compartidas: capturar y compartir conocimiento en equipos de diseño instruccional","sh":"3:30 · Knowledge Sharing in ID Teams","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 5","p":"Kileigh Munso, MS","po":"Instructional Designer, The University of Tennessee-Knoxville","d":"Instructional design teams generate enormous amounts of knowledge, but where does it live, how is it shared, and how does it evolve? This session explores practical strategies for organizing knowledge, capturing team expertise, and maintaining sustainable knowledge-sharing practices that reduce duplicated effort, improve collaboration, and create space for creativity & innovation.","de":"Los equipos de diseño instruccional generan muchísimo conocimiento, pero ¿dónde vive, cómo se comparte y cómo evoluciona? La sesión explora estrategias prácticas para organizar el conocimiento, capturar la experiencia del equipo y sostener prácticas de intercambio que reduzcan el trabajo duplicado, mejoren la colaboración y abran espacio a la creatividad y la innovación.","sm":""},{"id":337,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Care and Rigor: Emotionally Intelligent Conversations About AI in the Classroom","te":"Cuidado y exigencia: conversaciones emocionalmente inteligentes sobre la IA en el aula","sh":"3:30 · Care and Rigor: Emotionally Intelligent Conversations About AI","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 1","p":"Amy Martin","po":"Lead Faculty, Colorado Technical University","d":"Care is an intentional practice, a skill that can be learned, and something that educators need to continually commit to delivering. Grounded in emotional intelligence, humanizing the online classroom through genuine care for students and faculty helps everyone navigate the complexities from AI’s emergence with empathy, trust, and shared purpose.","de":"El cuidado es una práctica intencional, una habilidad que se aprende y un compromiso que los educadores deben renovar continuamente. Desde la inteligencia emocional, humanizar el aula online con un cuidado genuino hacia estudiantes y docentes ayuda a todos a atravesar las complejidades de la llegada de la IA con empatía, confianza y un propósito compartido.","sm":""},{"id":338,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Creating Community on the Digital Campus: AI, Ethics, and Empathy in Student Services","te":"Crear comunidad en el campus digital: IA, ética y empatía en los servicios al estudiante","sh":"3:30 · AI, Ethics and Empathy in Student Services","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Europe 4","p":"Samantha Adamczewski","po":"Associate Director, University of Notre Dame","d":"As AI reshapes student services, how do we ensure students feel seen in the online classroom and remain connected after graduation? This session will tackle the intersection of AI, ethics, accessibility, and empathy, providing practical strategies and resources to champion student belonging in the digital classroom.","de":"Con la IA transformando los servicios al estudiante, ¿cómo asegurar que los estudiantes se sientan vistos en el aula online y sigan conectados después de graduarse? La sesión aborda el cruce entre IA, ética, accesibilidad y empatía, con estrategias y recursos prácticos para promover la pertenencia en el aula digital.","sm":""},{"id":339,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Do you know how your course looks on a smartphone? Your students do.","te":"¿Sabés cómo se ve tu curso en un celular? Tus estudiantes sí","sh":"3:30 · How Your Course Looks on a Smartphone","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Europe 5","p":"Mindy Colin, PhD","po":"Associate Director of Digital Pedagogy, University of California-Santa Barbara","d":"Traditional course design that assumes students sit at computers to study can create barriers for students with complex life circumstances. Using survey data from 1,500+ students, researchers share data-driven insights into students' use of smartphones for learning, how mobile-friendly course design advances educational access, and actionable course redesign resources.","de":"Un diseño de cursos que da por sentado que los estudiantes estudian frente a una computadora puede generar barreras para quienes tienen circunstancias de vida complejas. Con datos de encuestas a más de 1.500 estudiantes, se comparten hallazgos sobre el uso del celular para aprender, cómo un diseño adaptado a móviles amplía el acceso y recursos concretos para rediseñar cursos.","sm":""},{"id":340,"day
