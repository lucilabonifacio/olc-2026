dizaje online centradas en las HBCU, explorar temas para un número especial de una revista en preparación y conectar a investigadores, profesionales y posibles autores. Tus ideas pueden dar forma a esta publicación y al rumbo futuro de la investigación HBCU.","sm":"HBCU"},{"id":49,"day":"Mar","s":700,"e":720,"b":"t-am","t":"Shaping the Next Era of Online Learning at HBCUs: Summit Closing Conversation","te":"La próxima etapa del aprendizaje online en las HBCU: conversación de cierre del Summit","sh":"HBCU Summit Closing","ty":"Summit","tye":"Summit","to":"HBCU Summit Session","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 5","p":"John Bannister","po":"Director of the FAMU Center for Teaching and Learning, Florida A&M University","d":"Where does HBCU online learning go from here? Close the Summit with a forward-looking conversation featuring reflections from speakers and panelists, bold predictions, and calls to action. Participants will add their own insights to our collaborative notes, make final connections, and consider how we can shape what comes next—together.","de":"¿Hacia dónde va el aprendizaje online en las HBCU? El Summit cierra con una conversación prospectiva: reflexiones de oradores y panelistas, predicciones audaces y llamados a la acción. Los participantes suman sus ideas a notas colaborativas, hacen las últimas conexiones y piensan juntos cómo dar forma a lo que viene.","sm":"HBCU"},{"id":50,"day":"Mar","s":720,"e":810,"b":"t-lunch","t":"Attendee Lunch on Own","te":"Almuerzo libre","sh":"Attendee Lunch on Own","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Atlantic Exhibit Hall","p":"","po":"","d":"The exhibit hall will be closed today for lunch from 12:00pm-1:00pm. Please rejoin us at 1:00pm in the exhibit hall for desserts and coffee as you enter Pacific Hall for our 1:30pm keynote address.","de":"El salón de exposiciones cierra para el almuerzo de 12:00 a 1:00 pm. A la 1:00 pm reabre con postres y café, de camino al Pacific Hall para la keynote de la 1:30 pm.","sm":""},{"id":51,"day":"Mar","s":810,"e":885,"b":"t-key","t":"Educating for the Unknown","te":"Educar para lo desconocido","sh":"Keynote: Educating for the Unknown","ty":"Keynote","tye":"Keynote","to":"Keynote Address","tr":"","tre":"","loc":"Pacific Hall B/C","p":"Alex Goryachev","po":"Goryachev, Independent Consultant","d":"We are now preparing learners for jobs that don’t yet exist, with tools that didn’t exist last year, to solve problems we can’t yet name. AI has collapsed the half-life of what we teach, shifting education’s mission from transferring knowledge to building the capacity to learn, unlearn, and relearn alongside intelligent machines. Drawing on the largest AI deployment in public higher education and two decades of enterprise innovation, this keynote shares entrepreneurial best practices for moving from access to equity, protecting integrity and critical thinking, and reinventing our institutions to lead what’s ahead.","de":"Hoy preparamos a los estudiantes para trabajos que todavía no existen, con herramientas que no existían el año pasado, para resolver problemas que aún no sabemos nombrar. La IA acortó la vida útil de lo que enseñamos y desplazó la misión de la educación: de transmitir conocimiento a desarrollar la capacidad de aprender, desaprender y reaprender junto a máquinas inteligentes. A partir del mayor despliegue de IA en la educación superior pública y de dos décadas de innovación empresarial, esta keynote comparte buenas prácticas emprendedoras para pasar del acceso a la equidad, proteger la integridad y el pensamiento crítico, y reinventar las instituciones para liderar lo que viene.","sm":""},{"id":52,"day":"Mar","s":885,"e":1110,"b":"t-1500","t":"AI Exploration Zone - Open Exploration","te":"AI Exploration Zone: exploración abierta","sh":"AI Exploration Zone","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"","tre":"","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Stop watching AI from the sidelines. Open Exploration treats you as a lifelong learner with a question worth working on. Bring a teaching or learning challenge and use the space to work on it with support from experienced guides and access to a range of AI tools. There are no canned demos and no expectation that you arrive with AI expertise. Our emphasis is on curiosity and hands-on experimentation that leads you somewhere useful.","de":"Traé un desafío de enseñanza o aprendizaje y trabajalo con guías y distintas herramientas de IA. No hay demos armadas ni hace falta experiencia previa.","sm":""},{"id":53,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"A Closer Look at Generation Z: Research Findings and Implications for Higher Education and the Workplace.","te":"Una mirada a la Generación Z: hallazgos de investigación e implicancias para la educación superior y el mundo laboral","sh":"A Closer Look at Gen Z: Research for Higher Ed and the Workplace","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 5","p":"Dr. Stacey Bose","po":"Professor, Cedarville University","d":"This session describes one department’s quest to learn about Gen Z and uncovers surprising truths. Quantitative data collected from professors and Gen Z students will be presented along with recommendations for teaching and connecting with Gen Z in the higher education classroom and preparing Gen Z to enter the workforce.","de":"La sesión relata la búsqueda de un departamento por conocer a la Generación Z y revela verdades sorprendentes. Se presentan datos cuantitativos de docentes y estudiantes de la Gen Z, junto con recomendaciones para enseñar y conectar con ellos en la educación superior y prepararlos para ingresar al mundo laboral.","sm":""},{"id":54,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"A Community of One – Tips and Strategies for Creating Inclusive and Supportive Online Community for Individual Student","te":"Una comunidad de uno: estrategias para construir comunidad online inclusiva y de apoyo para cada estudiante","sh":"A Community of One: Building Belonging for Each Online Student","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 1","p":"Dr. Puja Shahi, Ph.D.","po":"Senior Manager, Academic Success, Chamberlain University-Illinois","d":"This presentation highlights multi-layered strategies to boost engagement and retention in online courses through early connection, structured academic interactions, targeted nudges, and personalized feedback on assignments. By prioritizing meaningful faculty-student relationships and intentionally designing assignments, these interactions foster belonging, confidence, and increased use of academic support while balancing faculty workload.","de":"La presentación muestra estrategias en varios niveles para aumentar la participación y la permanencia en cursos online: conexión temprana, interacciones académicas estructuradas, recordatorios dirigidos y retroalimentación personalizada en las entregas. Priorizando vínculos significativos entre docentes y estudiantes y un diseño intencional de las consignas, estas interacciones fomentan la pertenencia, la confianza y el mayor uso de los apoyos académicos, sin sobrecargar a los docentes.","sm":""},{"id":55,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"A Gamified Approach to a Classroom Equipment Orientation","te":"Una orientación gamificada sobre el equipamiento del aula","sh":"A Gamified Classroom Equipment Orientation","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 2","p":"Brent Hirata","po":"Instructional Designer, University of Hawaiʻi, Leeward Community College","d":"Improving upon traditional in-person classroom technology orientations, a gamified learning experience was developed to engage busy faculty and staff. The Technology Enhanced Classroom (TEC) Escape Room utilizes H5P Game Map and supporting technologies to provide an immersive, scalable training model that appeals to a diverse range of instructional styles.","de":"Para mejorar las tradicionales capacitaciones presenciales sobre tecnología en el aula, se desarrolló una experiencia gamificada para atraer a docentes y personal con poco tiempo. El Escape Room del aula tecnológica (TEC) usa H5P Game Map y otras tecnologías para ofrecer un modelo de capacitación inmersivo y escalable, adaptado a distintos estilos de enseñanza.","sm":""},{"id":56,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Access First - A Digital‑Ready Student Aid Kit to Boost Student Confidence, Resilience, and Mental Health","te":"Access First: un kit de primeros auxilios digital para fortalecer la confianza, la resiliencia y la salud mental de los estudiantes","sh":"Access First: A Digital Student Aid Kit","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A3/A4","p":"Paul Mueller, Ph.D","po":"Sr. Manager, Chamberlain University-Illinois","d":"Online students often face academic and emotional strain amid fragmented support. This facilitated session explores the design of a scenario-based Student First Aid Kit that organizes help around student situations, reducing cognitive load. Participants analyze friction points and co-create adaptable design principles for human-centered, accessible digital support.","de":"Los estudiantes online suelen enfrentar tensiones académicas y emocionales ante apoyos fragmentados. Esta sesión facilitada explora el diseño de un \"kit de primeros auxilios\" basado en escenarios, que organiza la ayuda según las situaciones de los estudiantes y reduce la carga cognitiva. Los participantes analizan puntos de fricción y co-crean principios de diseño adaptables para un apoyo digital accesible y centrado en las personas.","sm":""},{"id":57,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Beyond Doing Good Work: Strategically Communicating the Value of Centers for Teaching and Learning","te":"Más allá de hacer un buen trabajo: comunicar estratégicamente el valor de los centros de enseñanza y aprendizaje","sh":"Communicating the Value of Centers for Teaching and Learning","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 8","p":"Nicole Weber","po":"Assistant Professor, Educational Foundations, University of Wisconsin-Whitewater","d":"Recent critiques of Centers for Teaching and Learning (CTL) raise timely questions about visibility, value, and impact. In this conversation, CTL leaders and staff will examine how we communicate our work upward and across institutions, exchange advocacy strategies, and co-create approaches for making CTL contributions more visible and valued.","de":"Las críticas recientes a los centros de enseñanza y aprendizaje (CTL) abren preguntas sobre su visibilidad, su valor y su impacto. En esta conversación, líderes y equipos de CTL analizan cómo comunicar su trabajo hacia arriba y hacia otras áreas de la institución, intercambian estrategias de incidencia y co-crean enfoques para que sus aportes sean más visibles y valorados.","sm":""},{"id":58,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Beyond Teaching: Digital Pathways for Mid-Career Faculty Development","te":"Más allá de enseñar: trayectos digitales para el desarrollo de docentes a mitad de carrera","sh":"Digital Pathways for Mid-Career Faculty Development","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 3","p":"Sara Kacin, Ph.D.","po":"Assistant Vice Provost Faculty Development & Success and Director, Office for Teaching & Learning, Wayne State University","d":"Mid-Career faculty advancement remains under-supported in digital learning. This session introduces a scalable, on-demand model providing 24/7 access to resources that complement decentralized support structures. Participants will explore a three-phase framework and adaptable tools to expand access, equity, and sustainability in faculty development.","de":"El desarrollo de los docentes a mitad de carrera sigue teniendo poco apoyo en el aprendizaje digital. Esta sesión presenta un modelo escalable y a demanda, con acceso 24/7 a recursos que complementan estructuras de apoyo descentralizadas. Se explora un marco de tres fases y herramientas adaptables para ampliar el acceso, la equidad y la sostenibilidad de la formación docente.","sm":""},{"id":59,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Beyond the Dashboard: Turning AI Sentiment into Better Learning Experiences","te":"Más allá del dashboard: convertir el análisis de sentimiento con IA en mejores experiencias de aprendizaje","sh":"Beyond the Dashboard: Turning AI Sentiment into Better Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 5","p":"Jennifer Wurch","po":"Director, Curriculum Operations, Penn Foster","d":"AI-driven sentiment and visibility data can help institutions turn abundant learner feedback into actionable change. By aligning marketing, curriculum, and academic teams, institutions can translate Large Language Model (LLM) insights into improvements in learner experience, persistence, and program quality through shared accountability and cross-functional collaboration.","de":"Los datos de sentimiento y visibilidad obtenidos con IA pueden ayudar a las instituciones a transformar el abundante feedback de los estudiantes en cambios concretos. Alineando a los equipos de marketing, currículo y académicos, es posible convertir los hallazgos de modelos de lenguaje (LLM) en mejoras de la experiencia de aprendizaje, la permanencia y la calidad de los programas, con responsabilidad compartida y colaboración entre áreas.","sm":""},{"id":60,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Beyond the Mock Interview: Designing Community-Engaged Learning Experiences Through Virtual Partnerships","te":"Más allá de la entrevista simulada: experiencias de aprendizaje vinculadas a la comunidad a través de alianzas virtuales","sh":"Beyond the Mock Interview: Community-Engaged Learning","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 4","p":"Holly Mace, Ph.D.","po":"Associate Professor, Southwestern Oklahoma State University","d":"This presentation highlights a virtual community-engaged learning project connecting business students and ReMerge participants through mock interviews conducted via Zoom. Attendees will explore course design strategies, technology-enabled engagement, lessons learned from implementation, and practical ideas for developing meaningful university-community partnerships that extend learning beyond the traditional classroom.","de":"La presentación muestra un proyecto virtual de aprendizaje vinculado a la comunidad que conecta a estudiantes de negocios con participantes de ReMerge mediante entrevistas laborales simuladas por Zoom. Se exploran estrategias de diseño del curso, participación mediada por tecnología, aprendizajes de la implementación e ideas prácticas para construir alianzas significativas entre universidad y comunidad que lleven el aprendizaje más allá del aula.","sm":""},{"id":61,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Clarifying Competency-Based Education: AI-Augmented Design and Active Engagement in Professional Health Science Programs","te":"Aclarando la educación basada en competencias: diseño aumentado con IA y participación activa en programas de ciencias de la salud","sh":"AI-Augmented Competency-Based Education in Health Sciences","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Jessica Packer","po":"Instructional Designer, Stony Brook University","d":"Transform your online programs by moving from testing to authentic, competency-based assessment. This session showcases a nursing curriculum redesign using AI as a pedagogical partner for source-grounded research, leadership simulations, and professional synthesis. Learn a scalable roadmap for integrating emerging technologies while maintaining alignment and human engagement.","de":"Pasar de los exámenes a una evaluación auténtica basada en competencias en programas online. La sesión muestra el rediseño de un plan de estudios de enfermería que usa la IA como aliada pedagógica para investigación basada en fuentes, simulaciones de liderazgo y síntesis profesional. Se presenta una hoja de ruta escalable para integrar tecnologías emergentes manteniendo la alineación y la participación humana.","sm":""},{"id":62,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Combining Academia with External Clinical Practice to Enhance Faculty Retention and Recruitment Research Idea","te":"Combinar la academia con la práctica clínica externa para retener y atraer docentes (idea de investigación)","sh":"Academia + Clinical Practice for Faculty Retention","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 5","p":"Virginia Edwards, DVM","po":"Senior Instructor, Colorado State University-Fort Collins","d":"With the critical shortage of teaching faculty within clinical education programs, creative approaches at retention warrant consideration.  This research idea explores if faculty prefer a hybrid approach to their job responsibilities and discusses how they can be applied to strengthen faculty recruitment and retention.","de":"Ante la escasez crítica de docentes en programas de formación clínica, vale la pena explorar enfoques creativos de retención. Esta idea de investigación indaga si los docentes prefieren un esquema híbrido de responsabilidades laborales y cómo aplicarlo para fortalecer la contratación y retención de docentes.","sm":""},{"id":63,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Consultation Coach: AI-Supported Role-Play for Educational Development Consultations","te":"Consultation Coach: role-play con IA para asesorías de desarrollo educativo","sh":"Consultation Coach: AI-Supported Role-Play","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Asia 3","p":"Rachel Bowens","po":"Educational Development Specialist, Wayne State University","d":"This session explores how custom GPTs can support low-stakes consultation practice for educational developers through iterative role-play and coaching-based feedback. Participants will explore how to create customizable GPTs that support consultation practice, professional confidence, and reflective development through AI-supported role-play.","de":"La sesión explora cómo los GPT personalizados pueden ofrecer práctica de bajo riesgo para quienes asesoran a docentes, mediante role-play iterativo y retroalimentación tipo coaching. Los participantes aprenden a crear GPT adaptables que apoyen la práctica de asesoría, la confianza profesional y el desarrollo reflexivo.","sm":""},{"id":64,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Designing Engaging Virtual Experiences: Using Gallery Walks to Recreate In-Person Interaction Online","te":"Experiencias virtuales atractivas: gallery walks para recrear la interacción presencial online","sh":"Gallery Walks to Recreate In-Person Interaction Online","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Americas Seminar","p":"Kaitlyn Cremer, OTD, SCLV","po":"Clinical Associate Professor, Baylor University","d":"Reimagine virtual events as interactive, engaging experiences. This session showcases how a gallery walk combined with live Zoom interactions transformed a virtual event into a dynamic, high-energy scholarly event. Participants will explore practical strategies to design engaging virtual experiences that foster interaction, feedback, and connection.","de":"Reimaginar los eventos virtuales como experiencias interactivas y atractivas. La sesión muestra cómo un gallery walk (recorrido por estaciones) combinado con interacciones en vivo por Zoom convirtió un evento virtual en un encuentro académico dinámico y con mucha energía. Se exploran estrategias prácticas para diseñar experiencias virtuales que promuevan la interacción, la retroalimentación y la conexión.","sm":""},{"id":65,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Designing for Cognitive Variability: AI + UDL for Neurodivergence, Giftedness, and Disabilities","te":"Diseñar para la variabilidad cognitiva: IA + DUA para neurodivergencia, altas capacidades y discapacidad","sh":"Designing for Cognitive Variability: AI + UDL","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere D","p":"Dr. Amanda Pacheco","po":"Lecturer, University of Central Florida","d":"This presentation explores how AI, Universal Design for Learning (UDL), and emotionally responsive pedagogy supports anxious, gifted, and neurodivergent learners in online environments. Findings from this mixed-methods study examine how students use AI for organization, emotional regulation, tutoring, and motivation, illuminating intersections between cognitive variability, digital learning, and learner agency.","de":"La presentación explora cómo la IA, el Diseño Universal para el Aprendizaje (DUA) y una pedagogía emocionalmente sensible acompañan a estudiantes con ansiedad, altas capacidades y neurodivergentes en entornos online. Los hallazgos de este estudio de métodos mixtos muestran cómo los estudiantes usan la IA para organizarse, regular emociones, recibir tutoría y motivarse, y echan luz sobre la relación entre variabilidad cognitiva, aprendizaje digital y agencia del estudiante.","sm":""},{"id":66,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Enable and Engage at the Right Moment","te":"Habilitar y comprometer en el momento justo","sh":"Enable and Engage at the Right Moment","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 5","p":"Kyle Cole","po":"Sr. Solutions Engineer Specialist, Instructure Inc","d":"Most users don't open emails, so timing and placement matter more than ever. This session shows how Impact delivers relevant messages, surveys, and walkthroughs directly inside the learning experience. Learn practical strategies for reaching overwhelmed learners and educators, gathering real-time feedback, and building a connected experience without disrupting anyone's workflow.","de":"La mayoría de las personas no abre los mails, así que el momento y el lugar de los mensajes importan más que nunca. La sesión muestra cómo Impact entrega mensajes, encuestas y recorridos guiados dentro de la propia experiencia de aprendizaje. Estrategias prácticas para llegar a estudiantes y docentes sobrecargados, recoger feedback en tiempo real y construir una experiencia conectada sin interrumpir el trabajo de nadie.","sm":""},{"id":67,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Enhancing the Transparency of GenAI Assignment Guidance: A Research Based Approach for Faculty Development & Measurement","te":"Más transparencia en las pautas sobre IA generativa en las consignas: un enfoque basado en investigación para la formación docente y la medición","sh":"Transparent GenAI Assignment Guidance (TILTai scale)","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere A1/A2","p":"Andrew Wiss, PhD, EdM, FNAP","po":"Assistant Dean for Academic Innovation, George Washington University","d":"This session presents a faculty development initiative that adapted the Transparency in Learning and Teaching (TILT) framework to provide assignment-level generative AI guidance. We will share essential elements of this faculty development program and outcomes. We also introduce the TILTai scale, a validated instrument for measuring student perceptions of genAI-transparency.","de":"La sesión presenta una iniciativa de formación docente que adaptó el marco TILT (Transparencia en el Aprendizaje y la Enseñanza) para dar pautas sobre IA generativa a nivel de cada consigna. Se comparten los elementos centrales del programa y sus resultados, y se presenta la escala TILTai, un instrumento validado para medir la percepción de los estudiantes sobre la transparencia en el uso de IA generativa.","sm":""},{"id":68,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Evaluating Teaching in the Digital Era","te":"Evaluar la enseñanza en la era digital","sh":"Evaluating Teaching in the Digital Era","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere E1/E2","p":"Thomas J. Tobin","po":"Sole Proprietor, Independent Consultant","d":"Come to this hands-on, interactive session and learn a comprehensive model for observing, evaluating, and assessing teaching that takes place across multiple technology-supported environments. We’ll cover: 1: Planning to evaluate technology-mediated teaching 2: Incorporating technology across teaching feedback methods 3: Data gathering and implementation 4: Customizing your evaluation strategies","de":"Una sesión práctica e interactiva para conocer un modelo integral de observación y evaluación de la enseñanza en distintos entornos mediados por tecnología. Temas: 1) planificar la evaluación de la enseñanza mediada por tecnología; 2) incorporar tecnología en los métodos de retroalimentación sobre la enseñanza; 3) recolección de datos e implementación; 4) adaptar las estrategias de evaluación.","sm":""},{"id":69,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"From Overwhelmed to On Board: A Tiered Approach to Building Faculty Accessibility Capacity","te":"De abrumados a comprometidos: un enfoque escalonado para fortalecer la capacidad de los docentes en accesibilidad","sh":"Building Faculty Accessibility Capacity","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 6","p":"Kiley Forsythe","po":"Instructional Design Manager, Mississippi State University","d":"When mandates arrive, faculty compliance anxiety is real. This session shares how one instructional support team built a tiered professional development model — from scalable awareness tools to personalized consultations — that moves faculty from overwhelmed to genuinely confident in making their own courses accessible.","de":"Cuando llegan las normativas, la ansiedad de los docentes por cumplir es real. La sesión muestra cómo un equipo de apoyo pedagógico construyó un modelo de formación escalonado, desde herramientas de sensibilización escalables hasta asesorías personalizadas, que lleva a los docentes de sentirse abrumados a sentirse realmente seguros para hacer accesibles sus propios cursos.","sm":""},{"id":70,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"From Pillar to Portfolio: Leading Coherent Innovation in AI for Online Learning","te":"Del pilar al portfolio: liderar una innovación coherente con IA en el aprendizaje online","sh":"From Pillar to Portfolio: Coherent AI Innovation","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 1","p":"Nathan Pritts, Ph.D.","po":"Principal AI Strategist, University of Arizona Global Campus","d":"Many institutions name AI a strategic priority, but scattered pilots rarely create coherence or measurable impact. This facilitated conversation helps participants examine AI as an operational portfolio across online learning, curriculum, faculty development, learner support, governance, and workforce alignment, using shared questions to map activity, gaps, partnerships, and next steps.","de":"Muchas instituciones declaran la IA como prioridad estratégica, pero los pilotos dispersos rara vez generan coherencia o un impacto medible. Esta conversación facilitada ayuda a analizar la IA como un portfolio operativo que abarca aprendizaje online, currículo, formación docente, acompañamiento a estudiantes, gobernanza y vinculación con el mundo laboral, usando preguntas compartidas para mapear actividades, brechas, alianzas y próximos pasos.","sm":""},{"id":71,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"From Resistance to Responsible Use: A Behind the Scenes Look at Ethical, Human-Centered AI Integration","te":"De la resistencia al uso responsable: detrás de escena de una integración ética de la IA centrada en las personas","sh":"From Resistance to Responsible Use of AI","ty":"Gamified session","tye":"Sesión gamificada","to":"Gamified Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere E3/E4","p":"Mallory Matthews, Ph.D.","po":"Instructional Designer, Tennessee Tech University","d":"Meet the cast of student AI learners in this gamified session exploring how attitudes shape AI use in higher education. Participants step into the spotlight through live scenarios and real-time polling. Faculty set the scene for effective AI integration by comparing participant responses with findings from a course-based AI implementation.","de":"Una sesión gamificada con un \"elenco\" de estudiantes que aprenden con IA, para explorar cómo las actitudes influyen en el uso de la IA en la educación superior. Los participantes se ponen en escena con situaciones en vivo y encuestas en tiempo real. Los docentes comparan las respuestas con los hallazgos de una implementación de IA en un curso para pensar una integración eficaz.","sm":""},{"id":72,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"From Too Many Tools to the Right Tools: Lessons in Learning Technology Consolidation at ASU","te":"De demasiadas herramientas a las herramientas correctas: lecciones de la consolidación de tecnología educativa en ASU","sh":"From Too Many Tools to the Right Tools","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 2","p":"Marcus Popetz","po":"CEO/Founder, Harmonize Learning","d":"As institutions look to streamline their learning technology ecosystems, tool consolidation is becoming an increasingly common strategy. But reducing the number of platforms on campus is rarely a simple technical decision. It affects faculty workflows, departmental needs, student experiences, support models, procurement priorities, and vendor relationships.","de":"A medida que las instituciones buscan simplificar su ecosistema de tecnología educativa, consolidar herramientas se vuelve una estrategia cada vez más común. Pero reducir la cantidad de plataformas rara vez es una decisión técnica simple: afecta el trabajo de los docentes, las necesidades de cada área, la experiencia de los estudiantes, los modelos de soporte, las prioridades de compra y la relación con proveedores.","sm":""},{"id":73,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"GitHub is for IDs, Too: Using Free Developer Tools to Build Custom LMS Interactives","te":"GitHub también es para diseñadores instruccionales: herramientas gratuitas para crear interactivos en el LMS","sh":"GitHub Is for IDs, Too: Building LMS Interactives","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 7","p":"Anna Everett, Ph.D.","po":"Instructional Designer, The University of Tennessee-Knoxville","d":"Think GitHub is only for software engineers? Think again! Conquer code anxiety in this hands-on sandbox session. You will use simple, browser-based GitHub tools and AI to \"vibe code\" stunning interactive elements. You will actively create, host, and embed an interactive element in your LMS – no programming experience required!","de":"¿Pensás que GitHub es solo para programadores? ¡Pensalo de nuevo! En esta sesión práctica tipo sandbox, se pierde el miedo al código: con herramientas simples de GitHub en el navegador y con IA se hace \"vibe coding\" de elementos interactivos atractivos. Cada participante crea, aloja e inserta un elemento interactivo en su LMS, sin experiencia previa en programación.","sm":""},{"id":74,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Group Projects, Reimagined: A Gamified Look at What Actually Works in Online Courses","te":"Trabajos grupales reimaginados: una mirada gamificada a lo que realmente funciona en cursos online","sh":"Group Projects, Reimagined","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 3","p":"Brennen Cannon, Ed.D.","po":"Director of Instructional Technology, Florida Polytechnic University","d":"Group projects in online courses are harder to manage than they should be. In this interactive session, attendees will step into the student role to simulate an entire group project using a rubric-based digital tool. Along the way, we’ll compare each step to the familiar paper-based process so attendees can weigh both approaches.","de":"Los trabajos grupales en cursos online son más difíciles de gestionar de lo que deberían. En esta sesión interactiva, los asistentes se ponen en el rol de estudiantes y simulan un trabajo grupal completo con una herramienta digital basada en rúbricas. En cada paso se compara con el proceso tradicional en papel para valorar ambos enfoques.","sm":""},{"id":75,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Illuminating Online Health Professions Education:Beyond the Syllabus Strategies in Professional Identity and Soft Skills","te":"Formación online en profesiones de la salud: estrategias más allá del programa para la identidad profesional y las habilidades blandas","sh":"Professional Identity and Soft Skills in Health Education","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 7","p":"Cynthia Patrick","po":"Academic Advisor and Instructor, SUNY Empire State University","d":"Illuminate the next era of digital learning by reimagining how we teach professional identity, empathy, and teamwork online. This session highlights human-centered design strategies, authentic assessments, and interprofessional frameworks that empower health professions learners to develop essential competencies for collaborative, patient-centered practice.","de":"Reimaginar cómo enseñar online la identidad profesional, la empatía y el trabajo en equipo. La sesión destaca estrategias de diseño centradas en las personas, evaluaciones auténticas y marcos interprofesionales que ayudan a estudiantes de profesiones de la salud a desarrollar competencias clave para una práctica colaborativa y centrada en el paciente.","sm":""},{"id":76,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Keeping Learning Real: Navigating AI Use, Motivation, Engagement in Online Courses","te":"Que el aprendizaje siga siendo real: uso de IA, motivación y participación en cursos online","sh":"Keeping Learning Real: AI Use, Motivation and Engagement","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 8","p":"Dr. Molly Vetter Dreier","po":"Associate Teaching Professor, University of Missouri-Columbia","d":"This session explores how student AI use is shifting from cognitive offloading to cognitive outsourcing in asynchronous online courses. Presenters share evidence-based course design strategies that discourage outsourcing, enhance authentic engagement and motivation, and involve participants in a collaborative strategy-swap to develop practical approaches for promoting meaningful, sustained student learning.","de":"La sesión explora cómo el uso de IA por parte de los estudiantes pasa de \"descargar\" parte del esfuerzo cognitivo a tercerizarlo por completo en cursos online asincrónicos. Se comparten estrategias de diseño basadas en evidencia que desalientan esa tercerización y fortalecen la participación genuina y la motivación, y se invita a los participantes a intercambiar estrategias para lograr un aprendizaje significativo y sostenido.","sm":""},{"id":77,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Leading Responsible AI Process Change in Online Quality Review: Human-on-the-Loop Leadership and Evidence of Impact","te":"Liderar el cambio hacia una IA responsable en la revisión de calidad online: liderazgo \"human-on-the-loop\" y evidencia de impacto","sh":"Responsible AI in Online Quality Review","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Dr. Tonya Amankwatia, PhD","po":"Head, AI 2030 Institute, AI2030","d":"In a new collaboration between AI 2030 and OLC, this session positions instructional designers as human-on-the-loop leaders in responsible AI adoption and online quality review. Participants will explore where AI creates new leadership and documentation responsibilities, applying OLC's program-level quality scorecard through the lens of AI 2030's responsible AI framework.","de":"En una nueva colaboración entre AI 2030 y OLC, la sesión posiciona a los diseñadores instruccionales como líderes que supervisan la adopción responsable de IA y la revisión de calidad online. Se explora dónde la IA genera nuevas responsabilidades de liderazgo y documentación, aplicando el scorecard de calidad de programas de OLC con la mirada del marco de IA responsable de AI 2030.","sm":""},{"id":78,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Lightening Innovation Round: Universities transforming Learning","te":"Ronda relámpago de innovación: universidades que transforman el aprendizaje","sh":"Lightning Round: Universities Transforming Learning","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 1","p":"Gregory Barker","po":"Managing Director, Digital Education, University of Michigan-Ann Arbor","d":"This lightning innovation round features innovators in higher education, including University of Michigan, George Washington University, Tufts University, and Project Kitty Hawk, transforming the learning experience through better curriculum design, thoughtful applications of AI, and new ways of teaching.","de":"Esta ronda relámpago reúne a innovadores de la educación superior, entre ellos University of Michigan, George Washington University, Tufts University y Project Kitty Hawk, que transforman la experiencia de aprendizaje con mejor diseño curricular, usos cuidadosos de la IA y nuevas formas de enseñar.","sm":""},{"id":79,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Lighting the Way: Embedding Information and AI Literacy into the Digital Classroom","te":"Iluminar el camino: integrar la alfabetización informacional y en IA en el aula digital","sh":"Embedding Information and AI Literacy","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere II","p":"Megan Bowers","po":"Dean for the College of Arts and Sciences, Columbia Southern University","d":"To illuminate the future of digital learning, educators must do more than build resources; they must help students discover, value, and apply them. This session shines a light on how collaboration, course design, and assessment can integrate information and AI literacy into online courses and brighten pathways to student success.","de":"Para iluminar el futuro del aprendizaje digital, no alcanza con crear recursos: hay que ayudar a los estudiantes a descubrirlos, valorarlos y aplicarlos. La sesión muestra cómo la colaboración, el diseño de cursos y la evaluación pueden integrar la alfabetización informacional y en IA en cursos online y abrir caminos hacia el éxito estudiantil.","sm":""},{"id":80,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Online Students Are Lonely. Let's Talk About What's Changing That.","te":"Los estudiantes online se sienten solos. Hablemos de lo que está cambiando eso","sh":"Online Students Are Lonely","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Katy Kappler","po":"Co-Founder and CEO, InScribe","d":"Online learners chose asynchronous education to fit into a full life, not to navigate it alone. In this panel, administrators from leading institutions explore how digital communities are showing us what the online experience was always meant to be, creating spaces where students feel belonging, build social capital, and persist.","de":"Los estudiantes online eligieron una educación asincrónica para que encaje en una vida llena de compromisos, no para transitarla solos. En este panel, autoridades de instituciones líderes analizan cómo las comunidades digitales muestran lo que la experiencia online siempre debió ser: espacios donde los estudiantes sienten pertenencia, construyen capital social y sostienen su recorrido.","sm":""},{"id":81,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Open Play in the Engagement Hub","te":"Juego libre en el Engagement Hub","sh":"Open Play (Engagement Hub)","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"","po":"","d":"Open Play invites participants to explore creativity, collaboration, and communication through interactive, hands-on activities. Using visual prompts from story cubes to generate spontaneous narratives, experience how simple images can spark imagination, flexible thinking, and creative expression. Through the collaborative challenge of the Mystery Box, discover how taking seemingly unrelated materials to solve a creative task can highlight teamwork, resourcefulness, and the value of diverse perspectives and skills. And maybe even engage in a face-to-face simulation of an online discussion forum, role-playing familiar participant types such as the expert, newbie, skeptic, cheerleader, lurker, and de-railer to examine how different communication styles influence group dialogue and engagement. Through laughter, experimentation, reflection, and discussion, participants will experience firsthand how low-stakes, playful activities can foster community, encourage participation, uncover group dynamics, and support deeper learning.","de":"Actividades lúdicas para explorar la creatividad, la colaboración y la comunicación: historias con dados de imágenes, el desafío de la Caja Misteriosa y la simulación presencial de un foro online. Muestran cómo las actividades de bajo riesgo fomentan la comunidad y la participación.","sm":""},{"id":82,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Practical Design Decisions for Real Courses: Human-Centered AI in ADDIE","te":"Decisiones de diseño prácticas para cursos reales: IA centrada en las personas dentro de ADDIE","sh":"Human-Centered AI in ADDIE","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 2","p":"Nafije Prishtina","po":"Instructional Technology Specialist II, University of Central Florida","d":"Are your courses still human by design? In this interactive session, participants examine how instructional designers and faculty integrate generative AI within ADDIE without compromising pedagogy, accessibility, alignment, or ethical responsibility. Grounded in UCF practice, participants engage in collaborative discussions to identify practical strategies for learner-centered, responsible course design.","de":"¿Tus cursos siguen siendo humanos por diseño? En esta sesión interactiva, los participantes analizan cómo diseñadores instruccionales y docentes integran la IA generativa en el modelo ADDIE sin resignar pedagogía, accesibilidad, alineación ni responsabilidad ética. A partir de la práctica de UCF, conversaciones colaborativas para identificar estrategias concretas de diseño responsable y centrado en el estudiante.","sm":""},{"id":83,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Principal Preparation Programs Address the Research on What Principals Need by Implementing Innovative Digital Practices","te":"Programas de formación de directivos escolares que responden a la investigación con prácticas digitales innovadoras","sh":"AI Simulations in Principal Preparation","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 9","p":"Stephanie Sullivan","po":"Ed.D., Murray State University","d":"Addressing the readiness gap identified in recent research, this session demonstrates how an Educator Preparation Provider integrates AI and digital simulations to support principal candidates. Participants will engage with innovative tools for communication, high-stress decision-making, and well-being, gaining actionable, crowdsourced strategies to ensure leaders are \"day-one ready\" for modern challenges.","de":"Para cerrar la brecha de preparación identificada en investigaciones recientes, la sesión muestra cómo una institución formadora de educadores integra IA y simulaciones digitales para acompañar a futuros directores de escuela. Los participantes prueban herramientas innovadoras para la comunicación, la toma de decisiones bajo presión y el bienestar, y se llevan estrategias construidas colectivamente para que los líderes estén listos desde el primer día.","sm":""},{"id":84,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Proving expertise and impact: a structured and measurable learning approach for urgent AI upskilling at scale","te":"Demostrar experiencia e impacto: un enfoque de aprendizaje estructurado y medible para capacitar en IA a escala","sh":"Proving Impact: Measurable AI Upskilling at Scale","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 10","p":"David Matthew","po":"Senior Vice President of Corporate Strategy, Pluralsight","d":"Standard success metrics are still emerging in the age of AI, meaning leaders are left without a reliable way to scale initiatives or demonstrate value. This session can highlight how new structured approaches can provide a blueprint for these efforts through targeted skill development, governance models, and enterprise learning frameworks.","de":"En la era de la IA todavía no hay métricas de éxito estándar, por lo que los líderes no tienen una forma confiable de escalar iniciativas ni de demostrar su valor. La sesión muestra cómo nuevos enfoques estructurados pueden servir de guía, a través del desarrollo de habilidades específicas, modelos de gobernanza y marcos de aprendizaje organizacional.","sm":""},{"id":85,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Respondus Exam Integrity: New Features, Fresh Ideas","te":"Integridad en exámenes con Respondus: nuevas funciones e ideas","sh":"Respondus Exam Integrity","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 4","p":"Arie Sowers","po":"Director of Customer Success and Training, Respondus","d":"See the latest enhancements for LockDown Browser and Respondus Monitor, including second camera support, handheld device detection, and the use of MS Word and Excel during secure exams. You'll also discover innovative and cost-effective ways these tools are used for in-class assessments, labs, pop-up testing centers, presentations, and remote proctoring.","de":"Las últimas mejoras de LockDown Browser y Respondus Monitor: soporte para una segunda cámara, detección de dispositivos móviles y uso de Word y Excel durante exámenes seguros. También formas innovadoras y económicas de usar estas herramientas en evaluaciones en el aula, laboratorios, centros de examen temporarios, presentaciones y supervisión remota.","sm":""},{"id":86,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Rethinking Teaching Classroom Management in Graduate Asynchronous Online Courses in the Age of AI","te":"Repensar un curso de gestión del aula en posgrados online asincrónicos en la era de la IA","sh":"Classroom Management in Online Courses in the Age of AI","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 11","p":"Dr. Kelly S. Rippard","po":"Teaching Professor, Old Dominion University","d":"This conversation focuses on how to make an asynchronous graduate secondary classroom management course work when many students choose to use AI to complete assignments. Topics include how some activities are structured to limit the value of AI while others capitalize on the affordances that AI offers to enhance learning.","de":"Esta conversación se centra en cómo hacer funcionar un curso de posgrado asincrónico sobre gestión del aula en secundaria cuando muchos estudiantes eligen usar IA para resolver las consignas. Se ve cómo algunas actividades se estructuran para limitar el valor de la IA y otras aprovechan lo que la IA ofrece para potenciar el aprendizaje.","sm":""},{"id":87,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Smeal AI@Work: A Replicable Blueprint for Upskilling Faculty and Staff with AI in Higher Education","te":"Smeal AI@Work: un modelo replicable para capacitar en IA a docentes y personal en la educación superior","sh":"Smeal AI@Work: Upskilling Faculty and Staff with AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere III","p":"Renee Ford, Ph.D.","po":"Senior Instructional Designer, The Pennsylvania State University","d":"How do you move an entire college to a coordinated community of practice? Smeal AI@Work is a staff-focused college-wide upskilling AI initiative built on tools, training, and peer learning for administration and operations. Learn about the model, sessions, incentives, and lessons learned so your institution can build something similar.","de":"¿Cómo llevar a toda una facultad a una comunidad de práctica coordinada? Smeal AI@Work es una iniciativa de capacitación en IA para todo el personal de la facultad, basada en herramientas, formación y aprendizaje entre pares para la administración y las operaciones. Se presentan el modelo, las sesiones, los incentivos y los aprendizajes para que otras instituciones puedan replicarlo.","sm":""},{"id":88,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Stacking Competency: A Simulation-Driven Framework for Interdisciplinary Microcredentials","te":"Apilar competencias: un marco basado en simulaciones para microcredenciales interdisciplinarias","sh":"Simulation-Driven Microcredentials","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 12","p":"Lydia Kite OTD, MOT,OTR/L,CAPS","po":"Director of Student Affairs and Clinical Assistant Professor, Bowling Green State University","d":"This session explores a scalable framework for developing competency-based microcredentials through interdisciplinary simulation partnerships. Attendees will examine how stackable digital badges, simulation-based learning, authentic assessment, and cross-disciplinary collaboration can support workforce readiness, experiential learning, and transferable professional skill development across academic programs.","de":"La sesión explora un marco escalable para desarrollar microcredenciales basadas en competencias a través de alianzas interdisciplinarias de simulación. Se analiza cómo las insignias digitales acumulables, el aprendizaje basado en simulaciones, la evaluación auténtica y la colaboración entre disciplinas pueden apoyar la preparación para el trabajo, el aprendizaje experiencial y el desarrollo de habilidades profesionales transferibles.","sm":""},{"id":89,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Sunsetting with Purpose: Protecting Student Success During Program Deactivation","te":"Cerrar programas con propósito: proteger el éxito de los estudiantes al discontinuar un programa","sh":"Sunsetting Programs with Purpose","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 13","p":"Dr. Bryan Aylward","po":"AVP, Office of Academic Innovation, Operations, & Technology, University of Arizona Global Campus","d":"Academic programs must sometimes be phased out, but without a clear strategy, program deactivation can create uncertainty for students, faculty, and staff. Providing a high-level practical roadmap for sunsetting online programs while prioritizing student success. Drawing from UAGC’s experience in managing program closures, this presentation will explore best practices.","de":"A veces hay que cerrar programas académicos, pero sin una estrategia clara la discontinuación genera incertidumbre en estudiantes, docentes y personal. A partir de la experiencia de UAGC con cierres de programas, la sesión ofrece una hoja de ruta práctica para discontinuar programas online priorizando el éxito estudiantil.","sm":""},{"id":90,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Tech Recess","te":"Recreo tecnológico","sh":"Tech Recess","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"Dr. Samira Galvao","po":"Alumni Navigator and Engagement Coordinator, National University","d":"Tech Recess encourages intentional breaks from technology to reset, recharge, and reconnect. Stepping away from screens, even briefly, can create space for reflection, movement, meaningful connection, and renewed focus. The goal is not to disconnect from technology completely, but to create a healthier and more purposeful relationship with it.","de":"Una invitación a hacer pausas intencionales de la tecnología para reiniciarse, recargar energía y reconectar. Alejarse de las pantallas, aunque sea un rato, abre espacio para la reflexión, el movimiento, la conexión y un foco renovado. La idea no es desconectarse por completo, sino construir una relación más sana y consciente con la tecnología.","sm":""},{"id":91,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"The New Accessibility Roadmap: Scaling Digital Accessibility Across an Institution","te":"La nueva hoja de ruta de accesibilidad: escalar la accesibilidad digital en toda una institución","sh":"The New Accessibility Roadmap","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 4","p":"Abby Ruessler","po":"Operations Coordinator, Southeast Missouri State University","d":"In April 2024, the DOJ updated ADA digital requirements to WCAG 2.1 AA. Though the deadline has been extended to 2027, many organizations remain unprepared. This presentation compares how two institutions achieved large-scale compliance without additional staffing by maximizing localized, scalable strategies and existing campus structures.","de":"En abril de 2024, el Departamento de Justicia de EE. UU. actualizó los requisitos digitales de la ADA al estándar WCAG 2.1 AA. Aunque el plazo se extendió a 2027, muchas organizaciones siguen sin estar preparadas. La presentación compara cómo dos instituciones lograron cumplir a gran escala sin sumar personal, aprovechando estrategias locales escalables y estructuras existentes.","sm":""},{"id":92,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"The Prompt Is the Pedagogy: Teaching Faculty to Design with AI","te":"El prompt es la pedagogía: enseñar a los docentes a diseñar con IA","sh":"The Prompt Is the Pedagogy","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 14","p":"John D. Solis, Ph.D.","po":"Director of Online Learning & Curriculum Innovation, St. Mary's University","d":"Prompting is not a technical skill – it is an instructional design competency. This session introduces faculty and instructional designers to structured prompt templates that redesign assignments for higher-order thinking, develop rubrics, and draft AI course policies. Attendees leave with ready-to-use tools that also model productive AI use for students.","de":"Escribir prompts no es una habilidad técnica: es una competencia de diseño instruccional. La sesión presenta a docentes y diseñadores plantillas de prompts estructuradas para rediseñar consignas que promuevan el pensamiento de orden superior, elaborar rúbricas y redactar políticas de IA para los cursos. Los asistentes se llevan herramientas listas para usar que además modelan un uso productivo de la IA para los estudiantes.","sm":""},{"id":93,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"The Vibe Coding Calculator: A Decision Framework for Developing Interactive Learning Activities","te":"La calculadora del vibe coding: un marco de decisión para desarrollar actividades de aprendizaje interactivas","sh":"The Vibe Coding Calculator","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 6","p":"Joy Oettel","po":"Instructional Designer and Developer, The University of Tennessee-Knoxville","d":"When should you use AI \"vibe coding\" versus eLearning authoring tools? Discover a custom \"Development Approach Calculator\" to make the best choice. Learn to package vibe-coded interactives into SCORM files for grade tracking, and get the exact AI prompts to build custom decision tools for your team.","de":"¿Cuándo conviene hacer \"vibe coding\" con IA y cuándo usar herramientas de autoría de eLearning? Se presenta una \"calculadora de enfoque de desarrollo\" para tomar la mejor decisión. Además: cómo empaquetar interactivos hechos con vibe coding en archivos SCORM para registrar calificaciones, y los prompts exactos para crear herramientas de decisión a medida para tu equipo.","sm":""},{"id":94,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"Walden University’s AI-Ready Graduates Framework","te":"El marco de graduados preparados para la IA de Walden University","sh":"AI-Ready Graduates Framework (Walden University)","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Joseline Castaños, PhD","po":"Dean, Walden University","d":"Students are already using AI. Faculty are struggling to keep up. Employers are demanding AI skills. But higher education is grappling with a critical gap: AI use without fluency. This session introduces the AI‑Ready Graduates Framework, a scaffolded approach to developing ethical, reflective, and human-centered AI fluency.","de":"Los estudiantes ya usan IA. Los docentes tienen dificultades para seguirles el ritmo. Los empleadores piden habilidades en IA. Pero la educación superior enfrenta una brecha crítica: uso de IA sin fluidez. La sesión presenta el AI-Ready Graduates Framework, un enfoque andamiado para desarrollar una fluidez en IA ética, reflexiva y centrada en las personas.","sm":""},{"id":95,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"What Are We Assuming? Using Positioning Theory to Reveal Hidden Narratives in Digital Learning Design","te":"¿Qué estamos dando por sentado? La teoría del posicionamiento para revelar narrativas ocultas en el diseño del aprendizaje digital","sh":"Hidden Narratives in Digital Learning Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere C","p":"Vanessa P. Dennen","po":"Tyner Distinguished Professor of Education, Florida State University","d":"Digital learning is shaped by powerful, often invisible narratives about innovation, data, and learner responsibility. This session uses positioning theory to analyze common storylines and uncover their impact on learner agency. Participants will leave with a practical framework for critically examining assumptions and redesigning learning environments in more human-centered ways.","de":"El aprendizaje digital está atravesado por narrativas poderosas y muchas veces invisibles sobre la innovación, los datos y la responsabilidad del estudiante. La sesión usa la teoría del posicionamiento para analizar relatos frecuentes y su impacto en la agencia de los estudiantes. Los participantes se llevan un marco práctico para revisar críticamente supuestos y rediseñar entornos de aprendizaje más centrados en las personas.","sm":""},{"id":96,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"What’s New in Federal Policy—and What It Means for Digital Learning","te":"Novedades en la política federal de EE. UU. y qué significan para el aprendizaje digital","sh":"What's New in Federal Policy","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 1","p":"Cheryl Dowd","po":"Senior Director, WICHE Cooperative for Educational Technologies","d":"Federal policy is reshaping the digital learning landscape. We break down the latest rulemakings from the U.S. Department of Education and the web accessibility regulations from the U.S. Department of Justice, translating complex requirements into clear institutional implications. Walk away with an understanding of what’s changing, the compliance risks, and what's next.","de":"La política federal está transformando el panorama del aprendizaje digital. Se analizan las últimas normativas del Departamento de Educación y las regulaciones de accesibilidad web del Departamento de Justicia de EE. UU., traduciendo requisitos complejos en implicancias claras para las instituciones: qué cambia, los riesgos de incumplimiento y lo que viene.","sm":""},{"id":97,"day":"Mar","s":900,"e":945,"b":"t-1500","t":"You Are the Investigator: A Live True-Crime Case Study in Digital Learning Design","te":"Vos sos el investigador: un caso policial en vivo sobre diseño del aprendizaje digital","sh":"You Are the Investigator: Story-Driven Course Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Roni Jackson Co-CEO/Co-Founder","po":"Co-CEO, Red Flag Mania","d":"Step into a live investigation, make a decision in minutes, then unpack why it worked. This session reveals a proven framework for designing high-stakes, story-driven courses that boost engagement and completion, and ends with a hands-on sprint to improve your own course immediately.","de":"Sumate a una investigación en vivo, tomá una decisión en minutos y después analizá por qué funcionó. La sesión presenta un marco probado para diseñar cursos basados en historias con desafíos importantes, que aumentan la participación y la finalización, y cierra con un sprint práctico para mejorar tu propio curso en el momento.","sm":""},{"id":98,"day":"Mar","s":945,"e":990,"b":"t-brk","t":"Beyond the Elevator Pitch: Mindful Networking for Meaningful Connections","te":"Más allá del elevator pitch: networking consciente para conexiones significativas","sh":"Mindful Networking","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"Maxine Frendel, MA","po":"Manager, Design and Development, Western Governors University","d":"Networking sometimes feels rushed or transactional. This interactive session begins with a brief guided meditation practice and explores how presence, curiosity, and active listening can transform networking into meaningful connection. Participants will engage in conversations and practical activities such as a story exchange, curiosity conversation, and ask and offer exchange.","de":"A veces el networking se siente apurado o transaccional. Esta sesión interactiva empieza con una breve meditación guiada y explora cómo la presencia, la curiosidad y la escucha activa pueden convertirlo en una conexión significativa. Incluye conversaciones y actividades prácticas como intercambio de historias, conversaciones desde la curiosidad e intercambio de pedidos y ofrecimientos.","sm":""},{"id":99,"day":"Mar","s":945,"e":990,"b":"t-brk","t":"Networking Coffee Break","te":"Coffee break de networking","sh":"Networking Coffee Break","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Atlantic Exhibit Hall","p":"","po":"","d":"Join us in the Exhibit Hall for our second networking coffee break of the conference. Not only is this an opportunity to recharge with a fresh cup of coffee or tea, but you will also have the opportunity to network with other attendees. Check out the activities in the Engagement Hub and AI Exploration Zone, or use this time to meet with our conference exhibitors and work on your exhibitor stamp card for a chance at some awesome prizes! Don't forget to complete your Totally Rad OLC 80's Human Bingo card by chatting with other attendees. You can stop by the Engagement Hub during this break to redeem your Bingo card to play Skeeball and win prizes, or just participate in our Lite Bright photo op!","de":"Pausa en el salón de exposiciones para conocer a otros asistentes y visitar el Engagement Hub, la AI Exploration Zone y a los expositores.","sm":""},{"id":100,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"A Back-Office AI Playbook: Analytics, Automation, and Innovation for Continuing Education and Academic Operations","te":"Un playbook de IA para la gestión interna: análisis, automatización e innovación en educación continua y operaciones académicas","sh":"A Back-Office AI Playbook for Academic Operations","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 1","p":"Matthew Vick","po":"Professor of Curriculum and Instruction, University of Wisconsin-Whitewater","d":"Beyond the classroom, generative AI provides new opportunities to improve the business operations that empower innovation in higher education.  Participants will in exploring and evaluate four use cases of AI with sanitized data to help automate tasks allowing better communication, pricing decisions, and market analysis.","de":"Más allá del aula, la IA generativa ofrece nuevas oportunidades para mejorar las operaciones que hacen posible la innovación en la educación superior. Los participantes exploran y evalúan cuatro casos de uso de IA con datos anonimizados para automatizar tareas y mejorar la comunicación, las decisiones de precios y el análisis de mercado.","sm":""},{"id":101,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"A Design Perspective: Lessons in coaching teachers to build online courses","te":"Una mirada desde el diseño: lecciones de acompañar a docentes a construir cursos online","sh":"Coaching Teachers to Build Online Courses","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 8","p":"Dr. Scott Nolt","po":"Assistant Professor & Instructional Designer, Medical University of South Carolina","d":"Expand your online offerings without sacrificing quality, even with limited resources. Learn how we trained educators to see through the lens of a designer, build facilitator-ready courses, and ensure consistency and reliability across sections. Gain practical frameworks, templates, and strategies for creating scalable, transferable online learning.","de":"Ampliar la oferta online sin resignar calidad, aun con pocos recursos. Cómo se formó a educadores para mirar con ojos de diseñador, construir cursos listos para facilitar y asegurar consistencia y confiabilidad entre comisiones. Marcos prácticos, plantillas y estrategias para crear aprendizaje online escalable y transferible.","sm":""},{"id":102,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"A Faculty Perspective: Strategies and Challenges in Providing Feedback in Online and Blended Courses","te":"La mirada docente: estrategias y desafíos para dar retroalimentación en cursos online e híbridos","sh":"Feedback in Online and Blended Courses","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 1","p":"Hong Wang, Ph.D.","po":"Professor/Associate Director of Instructional Technology Training, Northern Virginia Community College","d":"Feedback is an essential component in teaching. As online and blended learning continue to expand in higher education, educators are seeking practical and sustainable approaches to delivering feedback that is effective and manageable. This session will share top ten strategies and major challenges with solutions faculty shared through practitioners’ lens.","de":"La retroalimentación es un componente esencial de la enseñanza. Con la expansión del aprendizaje online e híbrido en la educación superior, los docentes buscan formas prácticas y sostenibles de dar retroalimentación eficaz y manejable. La sesión comparte las diez principales estrategias y los grandes desafíos, con soluciones aportadas por los propios docentes.","sm":""},{"id":103,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"A Jacket Too Big? University Futures Reimagined through an AI Task Force, AI Accelerator, and AI Curriculum Pathways","te":"¿Un saco demasiado grande? El futuro de la universidad reimaginado con una comisión de IA, un acelerador de IA y trayectos curriculares en IA","sh":"A Jacket Too Big? Growing into AI Leadership (UNC Charlotte)","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Dr. Kiran Budhrani","po":"Director, Teaching and Learning Innovation, University of North Carolina at Charlotte","d":"What happens when AI leadership feels like a jacket that is too big, but the university must grow into it quickly? This session shares how UNC Charlotte moved AI task force recommendations to an AI Accelerator model that advances AI literacy, leadership engagement, faculty development, and AI Curriculum Pathways.","de":"¿Qué pasa cuando el liderazgo en IA se siente como un saco que queda grande, pero la universidad tiene que crecer rápido para llenarlo? La sesión cuenta cómo UNC Charlotte pasó de las recomendaciones de una comisión de IA a un modelo de \"acelerador de IA\" que impulsa la alfabetización en IA, el compromiso de las autoridades, la formación docente y trayectos curriculares en IA.","sm":""},{"id":104,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"A Scalable Workshop Model for GenAI Integration in the Online Classroom","te":"Un modelo escalable de talleres para integrar la IA generativa en el aula online","sh":"A Scalable Workshop Model for GenAI Integration","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 1","p":"Dr. Steven Goss","po":"Chair and Clinical Professor, New York University","d":"A Scalable Workshop Model for GenAI Integration in the Online Classroom","de":"Un modelo escalable de talleres para integrar la IA generativa en el aula online (la agenda no incluye más descripción).","sm":""},{"id":105,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"AI as a Learning Co-Designer: A Recipe for Engaging Students Beyond Basic Prompting","te":"La IA como co-diseñadora del aprendizaje: una receta para involucrar a los estudiantes más allá del prompting básico","sh":"AI as a Learning Co-Designer: Beyond Basic Prompting","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 7","p":"Jennifer Yowell","po":"Instructional Designer, Virginia Commonwealth University","d":"This session explores how educators can use AI as a co-designer to create engaging, adaptive learning activities. Participants will analyze and refine AI-generated content, applying structured workflows and pedagogical strategies to move beyond basic prompting toward more intentional, learner-centered course design.","de":"La sesión explora cómo los educadores pueden usar la IA como co-diseñadora para crear actividades de aprendizaje atractivas y adaptativas. Los participantes analizan y ajustan contenido generado por IA, aplicando flujos de trabajo estructurados y estrategias pedagógicas para ir más allá del prompting básico hacia un diseño de cursos más intencional y centrado en el estudiante.","sm":""},{"id":106,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"AIM-HE: A Modality-Flexible Accessibility Implementation Model for the Next Era of Digital Learning","te":"AIM-HE: un modelo de implementación de accesibilidad flexible según la modalidad","sh":"AIM-HE: An Accessibility Implementation Model","ty":"Featured session","tye":"Sesión destacada","to":"Featured Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Asia 3","p":"Dr. Eunice Ofori","po":"Associate Director for Instructional Design, Tulane University","d":"This session introduces AIM-HE, a modality-flexible accessibility implementation model organized around three recurring phases and six actions: Assess, Align, Imagine, Implement, Monitor, and Maintain. Attendees will examine how AIM-HE supports accessible course design, faculty development, digital learning, and quality assurance across online, hybrid, HyFlex, and face-to-face environments.","de":"La sesión presenta AIM-HE, un modelo de implementación de accesibilidad adaptable a cualquier modalidad, organizado en tres fases recurrentes y seis acciones: evaluar, alinear, imaginar, implementar, monitorear y mantener. Se analiza cómo apoya el diseño de cursos accesibles, la formación docente, el aprendizaje digital y el aseguramiento de la calidad en entornos online, híbridos, HyFlex y presenciales.","sm":""},{"id":107,"day":"Mar","s":990,"e":1035,"b":"t-1630","t":"Architecting Attention: Using Creator \"Curiosity Loops\" to Beat Digital Learner Fatigue","te":"Arquitectura de la atención: los \"ciclos de curiosidad\" de los creadores de contenido contra la fatiga digital","sh":"Curiosity Loops to Beat Learner Fatigue","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 4","p":"Ed Buchanan","po":"Consultant, Signal a
