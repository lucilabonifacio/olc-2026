":"Mie","s":930,"e":945,"b":"w-1500","t":"Does Claude AI dream of Higher Education? Possible AI futures for Instructional Designers and Faculty","te":"¿Sueña Claude con la educación superior? Futuros posibles de la IA para diseñadores instruccionales y docentes","sh":"3:30 · Possible AI Futures for Designers and Faculty","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 1","p":"Mark A. Lewis","po":"Associate Director of Learning Design, SUNY Empire State University","d":"This presentation explores what Claude AI predicts for the future of higher education instructional designers and faculty. Using Joseph Davis's four megatrends: artificial intelligence, globalization, demographics, and government debt, as a question framework, it presents seven AI-generated scenarios spanning 5-year and 10-year horizons to inform institutional strategic planning amid uncertainty.","de":"La presentación explora qué predice Claude sobre el futuro de los diseñadores instruccionales y docentes en la educación superior. Con las cuatro megatendencias de Joseph Davis (inteligencia artificial, globalización, demografía y deuda pública) como marco de preguntas, presenta siete escenarios generados por IA a 5 y 10 años para orientar la planificación estratégica institucional en contextos de incertidumbre.","sm":""},{"id":341,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Down with Discussions - Using Open Ended Community Input Style Topics Instead of Traditional Discussions","te":"Abajo los foros: temas abiertos de aporte comunitario en lugar de las discusiones tradicionales","sh":"3:30 · Open-Ended Community Topics Instead of Discussions","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 3","p":"Justin Wiethop, D.C., MTAA","po":"Associate Dean of General Education, Chamberlain University-Administrative Office","d":"With the growing use of artificial intelligence (AI) in the classroom, it is important to create assignments where the input of AI can be limited. In this session, we will demonstrate the construction of open-ended questions for an online course that requires more human input to answer.","de":"Con el uso creciente de la IA en el aula, es importante crear consignas en las que su aporte sea limitado. La sesión muestra cómo construir preguntas abiertas para un curso online que requieran más aporte humano para responderse.","sm":""},{"id":342,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"From Guidance to Growth: The Evolving Power of Mentorship","te":"De la orientación al crecimiento: el poder cambiante de la mentoría","sh":"3:30 · The Evolving Power of Mentorship","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Europe 2","p":"Dr. Bryan Aylward","po":"AVP, Office of Academic Innovation, Operations, & Technology, University of Arizona","d":"Exploring four essential mentorship models, traditional one-on-one, peer-to-peer, reverse, and group mentorship, and their impact on careers. Participants examine how mentorship drives development not only for mentees, but also for mentors, reframing mentorship as a dynamic, reciprocal process that fosters learning, adaptability, and leadership in a rapidly evolving professional landscape.","de":"Una exploración de cuatro modelos de mentoría clave (individual tradicional, entre pares, inversa y grupal) y su impacto en las trayectorias profesionales. Los participantes analizan cómo la mentoría impulsa el desarrollo no solo de los mentoreados sino también de los mentores, y la replantean como un proceso dinámico y recíproco que fomenta el aprendizaje, la adaptabilidad y el liderazgo en un entorno profesional que cambia rápido.","sm":""},{"id":343,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"From Passive Content to Active Investigation: Designing for Student Engagement","te":"Del contenido pasivo a la investigación activa: diseñar para la participación de los estudiantes","sh":"3:30 · From Passive Content to Active Investigation","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 4","p":"Katie S. Lamb, M.Ed.","po":"Instructional Designer, Medical University of South Carolina","d":"Static assignments often position students as passive consumers of content rather than active participants in real-world problem solving. This session explores how scenario-based investigations designed within the LMS—and enhanced through branching experiences—can create more engaging, applied learning experiences that support richer student-content interaction, authentic decision-making, and deeper student engagement.","de":"Las consignas estáticas suelen poner a los estudiantes como consumidores pasivos de contenido y no como participantes activos en la resolución de problemas reales. La sesión explora cómo investigaciones basadas en escenarios, diseñadas en el LMS y enriquecidas con recorridos ramificados, generan experiencias más atractivas y aplicadas, con una interacción más rica con el contenido, toma de decisiones auténtica y mayor participación.","sm":""},{"id":344,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"From procedure to prediction: a design framework for courses where students interpret evidence","te":"Del procedimiento a la predicción: un marco de diseño para cursos donde los estudiantes interpretan evidencia","sh":"3:30 · From Procedure to Prediction","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 1","p":"Arunava Roy","po":"Assistant Professor, University of Oklahoma","d":"Too many course assignments are designed to confirm, not to challenge. This session presents a concrete framework for redesigning any evidence-based task around prediction, inquiry, and reflection. Examples come from astronomy lab redesigns, but the core move; predict before you know, return to that prediction after transfers to any discipline.","de":"Demasiadas consignas están diseñadas para confirmar, no para desafiar. La sesión presenta un marco concreto para rediseñar cualquier tarea basada en evidencia en torno a la predicción, la indagación y la reflexión. Los ejemplos vienen de rediseños de laboratorios de astronomía, pero el movimiento central (predecir antes de saber y volver a esa predicción después) se transfiere a cualquier disciplina.","sm":""},{"id":345,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"From Zero to Online: An 8-Month Institutional Transformation","te":"De cero a online: una transformación institucional en ocho meses","sh":"3:30 · From Zero to Online in 8 Months","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 4","p":"Corynn Carnio","po":"Student Success Coach, Maine College of Art & Design","d":"How do you launch online programs in less than eight months with limited staff, legacy systems, and no prior online infrastructure? Maine College of Art & Design shares its transformation from a campus-based institution to an emerging provider of online graduate education through cross-functional collaboration.","de":"¿Cómo lanzar programas online en menos de ocho meses con poco personal, sistemas heredados y sin infraestructura online previa? Maine College of Art & Design comparte su transformación de institución presencial a proveedora emergente de posgrados online, gracias a la colaboración entre áreas.","sm":""},{"id":346,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Immersive Virtual Simulation in Graduate Nursing: The Impact of Online Engagement on Learning Success","te":"Simulación virtual inmersiva en posgrados de enfermería: el impacto de la participación online en el aprendizaje","sh":"3:30 · Immersive Virtual Simulation and Engagement","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 3","p":"Christi Doherty, DNP, RN, CNE","po":"Executive Director, Nursing & Academic Simulations, Kaplan North America","d":"Research that evaluated an immersive, case-based virtual simulation resource among 1,331 graduate nursing students examined how online engagement impacts clinical learning. Regression modeling revealed that active participation significantly drove learning enhancement, whereas traditional study habits paradoxically decreased success odds. These data-driven findings help faculty optimize future immersive digital pedagogies.","de":"Una investigación que evaluó un recurso de simulación virtual inmersiva basada en casos con 1.331 estudiantes de posgrado en enfermería analizó cómo la participación online influye en el aprendizaje clínico. Los modelos de regresión mostraron que la participación activa mejoró significativamente el aprendizaje, mientras que los hábitos de estudio tradicionales, paradójicamente, redujeron las probabilidades de éxito. Hallazgos para optimizar futuras pedagogías digitales inmersivas.","sm":""},{"id":347,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Mentoring Future Instructional Designers: An ID Internship Initiative","te":"Mentorear a futuros diseñadores instruccionales: una iniciativa de pasantías","sh":"3:30 · An Instructional Design Internship Program","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 2","p":"Sara Ombres","po":"Senior Instructional Designer, Embry-Riddle Aeronautical University-Worldwide","d":"Our Instructional Design Internship Program has provided multiple current students and recent graduates with meaningful, real-world ID experience while also creating a valuable hiring pathway for our Instructional Design team. In this session, we’ll discuss the program and lessons learned while sharing the successes seen in the data.","de":"Este programa de pasantías en diseño instruccional dio a varios estudiantes y recién graduados una experiencia real y significativa, y a la vez creó un camino valioso de contratación para el equipo de diseño instruccional. La sesión presenta el programa, sus aprendizajes y los resultados que muestran los datos.","sm":""},{"id":348,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"Opening the Door, but not Entering: Strategies to Support Adult Students to Apply AND Enroll","te":"Abrir la puerta pero no entrar: estrategias para que los estudiantes adultos se postulen Y se inscriban","sh":"3:30 · Helping Adult Students Enroll","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 5","p":"Dr. Juliette Punchello","po":"Senior Director, Enrollment Management and Recruitment, Thomas Edison State University","d":"Adult students apply to college but many not enroll due to financial pressures, debt aversion, and professional responsibilities. Institutions can help by communicating the value of a degree, and provide affordable options.","de":"Muchos estudiantes adultos se postulan a la universidad pero no se inscriben, por presiones económicas, rechazo al endeudamiento y responsabilidades laborales. Las instituciones pueden ayudar comunicando el valor del título y ofreciendo opciones accesibles.","sm":""},{"id":349,"day":"Mie","s":930,"e":945,"b":"w-1500","t":"The Dual Role of AI in Online Project-Based Learning at Scale","te":"El doble rol de la IA en el aprendizaje online por proyectos a escala","sh":"3:30 · The Dual Role of AI in Project-Based Learning","ty":"Express (15 min)","tye":"Express (15 min)","to":"Express Session (15 Min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"David Joyner","po":"Executive Director of Online Education & OMSCS, Georgia Institute of Technology-Main Campus","d":"When students in an online graduate course reach for AI, what are they actually doing—and what are they building? Drawing on surveys and project data from 467 students across six semesters, this session presents a framework for understanding AI's dual role in project-based learning: as tool and as medium.","de":"Cuando los estudiantes de un posgrado online recurren a la IA, ¿qué están haciendo realmente y qué están construyendo? Con encuestas y datos de proyectos de 467 estudiantes durante seis cuatrimestres, la sesión presenta un marco para entender el doble rol de la IA en el aprendizaje por proyectos: como herramienta y como medio.","sm":""},{"id":350,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Breaking the Board: Redesigning Discussion Boards for Authentic Engagement","te":"Romper el foro: rediseñar los foros de discusión para una participación auténtica","sh":"Redesigning Discussion Boards","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 5","p":"Dr. Wendy Kubasko","po":"Associate Professor, Shippensburg University","d":"Tired of discussion boards that feel compliance-driven rather than meaningful? This interactive session will explore practical strategies to transform discussion boards to authentic, collaborative spaces. Participants will have opportunities to share their own experiences, exchange ideas, and leave with next steps for immediate application into their courses.","de":"¿Cansado de foros que se sienten como un trámite y no como algo significativo? Esta sesión interactiva explora estrategias prácticas para convertir los foros en espacios auténticos y colaborativos. Los participantes comparten experiencias, intercambian ideas y se llevan próximos pasos para aplicar de inmediato en sus cursos.","sm":""},{"id":351,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Building a Successful Team Online: Faculty and Administration Partnership and Collaboration in Digital Higher Education","te":"Construir un equipo online exitoso: alianza y colaboración entre docentes y gestión en la educación superior digital","sh":"Faculty–Administration Partnership","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 1","p":"Maggie Broderick, PhD","po":"Lead Faculty, National University","d":"This conversation will be led by faculty and administrators at an online HEI. We believe in building strong partnerships and collaboration behind the scenes. Let’s discuss what works for other online teams and how you navigate difficulties toward positive outcomes. Bring your ideas, experiences, and reflections to this important conversation!","de":"Una conversación liderada por docentes y autoridades de una institución de educación superior online, convencidos de la importancia de construir alianzas y colaboración sólidas detrás de escena. Hablemos de qué funciona en otros equipos online y cómo atraviesan las dificultades hacia buenos resultados. Traé tus ideas, experiencias y reflexiones.","sm":""},{"id":352,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Building AI-Enabled Academic Operations Without New Staff: A Practitioner Model for Lean Institutions","te":"Operaciones académicas con IA sin sumar personal: un modelo práctico para instituciones con pocos recursos","sh":"AI-Enabled Academic Operations Without New Staff","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 4","p":"Sean Owen, Ph.D.","po":"Associate Dean, Mississippi State University","d":"How does a small academic unit design and launch 40 courses in two years without adding personnel? This session presents a model for building AI-enabled academic operations that extend institutional capacity without expanding headcount. Attendees will leave with a starter template for designing AI-assisted processes suited to lean academic environments.","de":"¿Cómo una unidad académica pequeña diseña y lanza 40 cursos en dos años sin sumar personal? La sesión presenta un modelo para construir operaciones académicas con IA que amplían la capacidad institucional sin aumentar la planta. Los asistentes se llevan una plantilla inicial para diseñar procesos asistidos por IA adaptados a entornos con pocos recursos.","sm":""},{"id":353,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Building Feedback-Rich Environments: Strategies for Self and Peer Review in Instructional Design","te":"Entornos ricos en retroalimentación: estrategias de autoevaluación y revisión entre pares en el diseño instruccional","sh":"Building Feedback-Rich Environments: Self and Peer Review","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Europe 2","p":"Nicole Messier","po":"Associate Director of Instructional Design, University of Illinois Chicago","d":"Want to create online courses that deepen learning and build student confidence? In this presentation, we will explore how self-review, peer feedback, and metacognitive strategies can transform your course design. These techniques not only enhance student performance; they also foster ownership, reflection, and meaningful engagement.","de":"¿Querés crear cursos online que profundicen el aprendizaje y den confianza a los estudiantes? La presentación explora cómo la autoevaluación, la retroalimentación entre pares y las estrategias metacognitivas pueden transformar el diseño de tus cursos. Estas técnicas no solo mejoran el desempeño: también fomentan la apropiación, la reflexión y una participación significativa.","sm":""},{"id":354,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Course Building With Limited Resources: Creating Firm but Flexible Systems","te":"Construir cursos con pocos recursos: sistemas firmes pero flexibles","sh":"Course Building with Limited Resources","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 3","p":"Susan Leigh Brooks, Ph.D.","po":"Director, Faith+Lead Academy at Luther Seminary","d":"Join us for a conversational session to share course-building challenges and solutions in settings with limited resources and staff. We will provide examples from our experience as a two-member team integrating curated tools, empowered contributors, and replicable workflows into a firm but flexible system for course building","de":"Una sesión de conversación para compartir desafíos y soluciones en la construcción de cursos con pocos recursos y poco personal. Se comparten ejemplos de la experiencia de un equipo de dos personas que integra herramientas seleccionadas, colaboradores empoderados y flujos de trabajo replicables en un sistema firme pero flexible para construir cursos.","sm":""},{"id":355,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Designing for the Designers: A Culture-First Approach to Thriving Instructional Design Teams","te":"Diseñar para los diseñadores: un enfoque que prioriza la cultura para equipos de diseño instruccional que prosperan","sh":"Culture-First Instructional Design Teams","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Stephanie Tammen, Ph.D.","po":"Manager of Instructional Design, University of Arizona","d":"Somewhere between “do more with less” and “can you also learn AI by next Tuesday?” lies the challenge of sustaining the humans behind digital learning. Introducing: culture-by-design! Our approach to community-building for IDs.","de":"Entre el \"hacer más con menos\" y el \"¿podés aprender IA para el martes que viene?\" está el desafío de cuidar a las personas detrás del aprendizaje digital. La sesión presenta la \"cultura por diseño\", un enfoque para construir comunidad entre diseñadores instruccionales.","sm":""},{"id":356,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Designing Joyful Assessment with AI Agents Where Integrity and Engagement Meet","te":"Evaluaciones que dan alegría con agentes de IA: donde se encuentran la integridad y la participación","sh":"Designing Joyful Assessment with AI Agents","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Xiaoyan Ma Ph.D.","po":"Instructional Designer, Virginia Polytechnic Institute and State University","d":"What if assessment felt joyful instead of stressful? This session shows you how to design assessments where AI agents are built in on purpose. Watch a live walkthrough where an AI agent plays stakeholder personas and dialogue becomes the evidence of learning, then sketch a redesign for your course.","de":"¿Y si la evaluación generara alegría en lugar de estrés? La sesión muestra cómo diseñar evaluaciones que incorporan agentes de IA con un propósito. Incluye una demostración en vivo en la que un agente de IA interpreta a distintos actores y el diálogo se convierte en la evidencia de aprendizaje; luego cada participante esboza un rediseño para su curso.","sm":""},{"id":357,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"eLearning Authoring Tool vs. LMS: Student Performance and Preference in Online Graduate Education","te":"Herramienta de autoría eLearning vs. LMS: desempeño y preferencias de estudiantes de posgrado online","sh":"Authoring Tool vs. LMS: A Study","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Europe 5","p":"Lama Bergstrand Othman, Ph.D.","po":"Professor, university of Wisconsin-Whitewater","d":"This session presents findings from a three-phase study comparing instruction delivered through an eLearning authoring tool versus a Learning Management System in an online graduate course. Using a crossover design with 45 students, the study examines quiz performance, student preference, and engagement through multilevel modeling and survey data.","de":"La sesión presenta hallazgos de un estudio en tres fases que comparó la enseñanza a través de una herramienta de autoría de eLearning y a través de un LMS en un curso de posgrado online. Con un diseño cruzado con 45 estudiantes, analiza el desempeño en cuestionarios, las preferencias y la participación mediante modelos multinivel y encuestas.","sm":""},{"id":358,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"From 0% to 100%: Creating and Implementing an Online Design Checklist and Course Review Process","te":"Del 0% al 100%: crear e implementar un checklist de diseño online y un proceso de revisión de cursos","sh":"An Online Design Checklist and Course Review Process","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Asia 5","p":"Kade Parry","po":"Associate Professor, Snow College","d":"Ensuring quality in online course design is an essential, yet difficult, process for institutions of higher education. By sharing our experience of establishing institutional design standards, this presentation reveals the streamlined process that helped our institution reduce achievement gaps by ensuring 100% of our online courses met design checklist standards.","de":"Asegurar la calidad del diseño de cursos online es un proceso esencial pero difícil para las instituciones de educación superior. A partir de su experiencia con estándares institucionales de diseño, la presentación muestra el proceso simplificado que ayudó a reducir brechas de rendimiento al lograr que el 100% de sus cursos online cumpliera el checklist de diseño.","sm":""},{"id":359,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"From Compliance to Capability: AI-Assisted Digital Accessibility for Complex Biomedical Content in Graduate Education","te":"Del cumplimiento a la capacidad: accesibilidad digital asistida por IA para contenidos biomédicos complejos en posgrados","sh":"AI-Assisted Accessibility for Biomedical Content","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere E3/E4","p":"Katherine C. Aquino, Ph.D.","po":"Executive Director for Research Training and Devel, Rutgers, The State University of New Jersey","d":"This session explores how institutions can move beyond Title II compliance to build sustainable digital accessibility practices for complex biomedical content. Using a graduate biomedical sciences case study, participants will examine scalable strategies for accessible scientific visuals, AI-assisted alternative text development, faculty engagement, and systems-level implementation adaptable across STEM disciplines.","de":"Cómo ir más allá del cumplimiento del Título II y construir prácticas de accesibilidad digital sostenibles para contenidos biomédicos complejos. A partir de un caso de un posgrado en ciencias biomédicas, se analizan estrategias escalables para imágenes científicas accesibles, textos alternativos generados con apoyo de IA, el compromiso de los docentes y una implementación a nivel sistema adaptable a disciplinas STEM.","sm":""},{"id":360,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"From Course Design to Course Facilitation: Supporting Effective Online Teaching","te":"Del diseño del curso a su facilitación: apoyar una enseñanza online eficaz","sh":"From Course Design to Course Facilitation","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere E1/E2","p":"Scott Nolt, Ed.D.","po":"Assistant Professor & Instructional Designer, Medical University of South Carolina","d":"Great course design is not enough; online teaching makes the difference. This session explores practical strategies using communication, feedback, and presence to enhance the online learning experience for students and instructors. Discuss how to apply these practices through formal training, coaching, or informal faculty support to increase engagement and satisfaction.","de":"Un buen diseño no alcanza: la enseñanza online es la que marca la diferencia. La sesión explora estrategias prácticas de comunicación, retroalimentación y presencia para mejorar la experiencia online de estudiantes y docentes, y cómo aplicarlas mediante capacitación formal, coaching o apoyo informal para aumentar la participación y la satisfacción.","sm":""},{"id":361,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"From Innovation to Infrastructure: Building Scalable Digital Learning Ecosystems Through Operational Intelligence","te":"De la innovación a la infraestructura: ecosistemas de aprendizaje digital escalables con inteligencia operativa","sh":"Scalable Digital Learning Ecosystems","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Europe 4","p":"Dr. Karina Hernandez","po":"Dean of Digital Learning, Austin Community College District","d":"As institutions expand online learning, workforce education, and credential pathways, innovation often outpaces operational infrastructure. This session explores how Austin Community College is building a scalable digital learning ecosystem through operational intelligence, governance, and strategic alignment. Attendees will gain practical frameworks for sustaining innovation and organizational growth.","de":"A medida que las instituciones amplían el aprendizaje online, la formación para el trabajo y las credenciales, la innovación suele avanzar más rápido que la infraestructura operativa. La sesión explora cómo Austin Community College está construyendo un ecosistema digital escalable a partir de inteligencia operativa, gobernanza y alineación estratégica, con marcos prácticos para sostener la innovación y el crecimiento organizacional.","sm":""},{"id":362,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Hesitancy isn’t resistance: Rethinking faculty innovation adoption in the post-pandemic and AI era","te":"Dudar no es resistirse: repensar la adopción de innovaciones por parte de los docentes en la pospandemia y la era de la IA","sh":"Hesitancy Isn't Resistance: Rethinking Innovation Adoption","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 7","p":"Dr. Ariel Fleurimond, Ed.D","po":"Dr., Columbia University, School of Professional Studies","d":"This session presents findings from a mixed-methods study examining faculty hesitancy toward innovation in higher education. Participants will use the Diffusion of Innovations (DOI) framework to explore practical strategies for supporting sustainable innovation adoption in the post-pandemic and AI era.","de":"La sesión presenta hallazgos de un estudio de métodos mixtos sobre la reticencia de los docentes frente a la innovación en la educación superior. Con el marco de la difusión de innovaciones, los participantes exploran estrategias prácticas para apoyar una adopción sostenible de innovaciones en la pospandemia y la era de la IA.","sm":""},{"id":363,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Humor, Flexibility, and Good Timing: Building System-Wide AI Professional Development","te":"Humor, flexibilidad y buen timing: formación en IA a nivel de todo un sistema","sh":"Humor, Flexibility and Good Timing: Building AI Professional Development","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Europe 1","p":"Graceful Beam","po":"Director of Online Learning and Development, Georgia Northwestern Technical College","d":"What happens when AI professional development is built close to the news cycle instead of a curriculum plan? More than 500 educators, 20+ colleges, 37 sessions, and a repeat attendance pattern that reflects genuine engagement. This session presents the structural decisions behind a model that works without a budget line.","de":"¿Qué pasa cuando la formación en IA se construye al ritmo de las noticias y no de un plan curricular? Más de 500 educadores, más de 20 instituciones, 37 sesiones y un patrón de asistencia repetida que muestra un compromiso genuino. La sesión presenta las decisiones estructurales detrás de un modelo que funciona sin presupuesto propio.","sm":""},{"id":364,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Proactive AI Support: Scaling Student Care Without Losing the Human Touch","te":"Apoyo proactivo con IA: escalar el cuidado de los estudiantes sin perder el toque humano","sh":"Proactive AI Support: Scaling Student Care Without Losing the Human Touch","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 8","p":"Rena Barbosa","po":"Innovation LAB Manager, West Coast University","d":"Learn how proactive AI support can help institutions meet students at their moment of need. This session explores an AI-powered student support pilot designed to provide 24/7 assistance, identify risk earlier, connect students to resources, and strengthen learner success while preserving human care, oversight, and trust.","de":"Cómo un apoyo proactivo con IA puede ayudar a las instituciones a llegar a los estudiantes en el momento en que lo necesitan. La sesión analiza un piloto de apoyo estudiantil con IA pensado para brindar asistencia 24/7, identificar riesgos antes, conectar a los estudiantes con recursos y fortalecer su éxito, preservando el cuidado humano, la supervisión y la confianza.","sm":""},{"id":365,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Reclaiming Faculty Time: Using AI to Reduce Busywork and Protect Time for Teaching","te":"Recuperar el tiempo docente: usar IA para reducir tareas repetitivas y proteger el tiempo para enseñar","sh":"Using AI to Reduce Faculty Busywork","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Dr. Michael Webb","po":"Director of Innovation and Faculty Excellence, Capella University","d":"How much teaching time is spent answering the same questions? This session explores how AI integrated into course design and communication workflows can reduce faculty busywork and protect time for meaningful teaching. Participants will identify inefficiencies and apply strategies to redesign workflows for improved efficiency and engagement.","de":"¿Cuánto tiempo de enseñanza se va en responder siempre las mismas preguntas? La sesión explora cómo una IA integrada al diseño del curso y a la comunicación puede reducir las tareas repetitivas de los docentes y proteger el tiempo para una enseñanza significativa. Los participantes identifican ineficiencias y aplican estrategias para rediseñar sus flujos de trabajo.","sm":""},{"id":366,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Rhetorical Choices & Voice: Building Student Agency Using Generative-AI","te":"Elecciones retóricas y voz: desarrollar la agencia de los estudiantes con IA generativa","sh":"Rhetorical Choices and Voice: Building Student Agency with GenAI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 6","p":"Guy J. Krueger","po":"Writing 101 Curriculum Chair, University of Mississippi","d":"This session will include audience participation in examining how generative-AI can be used to help students make complex rhetorical choices and consider their unique voices as writers. The presenter will also share writing assignment ideas and students' reflective thoughts on their work.","de":"Con participación del público, la sesión analiza cómo la IA generativa puede ayudar a los estudiantes a tomar decisiones retóricas complejas y a reconocer su voz propia como escritores. También se comparten ideas de consignas de escritura y reflexiones de los estudiantes sobre su trabajo.","sm":""},{"id":367,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Strategic Course Renewal: Balancing Learner Success, Academic Quality, and ROI in Online Programs","te":"Renovación estratégica de cursos: equilibrar el éxito estudiantil, la calidad académica y el retorno de la inversión en programas online","sh":"Strategic Course Renewal","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Dr. Bryan Aylward","po":"AVP, Office of Academic Innovation, Operations, & Technology, University of Arizona Global Campus","d":"Exploring strategic approaches to online course renewal that balance learner success, academic quality, operational efficiency, and long-term sustainability. Presenters from UAGC and OES will share practical frameworks for evaluating refresh, revision, and redevelopment decisions using learner feedback, retention data, faculty input, governance considerations, and institutional priorities across online program portfolios.","de":"Enfoques estratégicos para renovar cursos online equilibrando el éxito estudiantil, la calidad académica, la eficiencia operativa y la sostenibilidad. Representantes de UAGC y OES comparten marcos prácticos para decidir entre actualizar, revisar o redesarrollar cursos, usando feedback de estudiantes, datos de permanencia, aportes docentes, criterios de gobernanza y prioridades institucionales.","sm":""},{"id":368,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Syncing Success: HyFlex by Design — Integrating Synchronous and Asynchronous Delivery for Deeper Learning","te":"Sincronizar el éxito: HyFlex por diseño, integrando lo sincrónico y lo asincrónico para un aprendizaje más profundo","sh":"HyFlex by Design: A Longitudinal Study","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Dr. Roseanna J. Wright","po":"Dr., Holy Family University","d":"This longitudinal study examines whether intentionally integrating synchronous and asynchronous HyFlex delivery, rather than treating modalities as alternatives, produces measurable improvements in student outcomes. Tracking special education teacher candidates through Praxis certification, supervisor evaluations, and alumni self-reports, it also explores how design enables cross-cultural identity formation through a U.S.-German partnership","de":"Este estudio longitudinal analiza si integrar intencionalmente la modalidad sincrónica y la asincrónica en HyFlex, en lugar de tratarlas como alternativas, mejora de forma medible los resultados. Siguiendo a futuros docentes de educación especial a través de su certificación, evaluaciones de supervisores y autoinformes de graduados, también explora cómo el diseño favorece la formación de identidades interculturales en una alianza entre EE. UU. y Alemania.","sm":""},{"id":369,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Taking the BIG out of AmBIGuity: Strategies for Multi-Modality Course Design","te":"Sacarle lo \"grande\" a la ambigüedad: estrategias para diseñar cursos en múltiples modalidades","sh":"Multi-Modality Course Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere II","p":"Larissa Cremeens","po":"Senior Instructional Designer, Purdue University-Main Campus","d":"What happens when one course becomes five? This case study explores how instructional designers and a video producer navigated evolving challenges across multiple course modalities. This session highlights lessons learned, collaborative workflows, and emerging technology strategies developed through real-time course design and delivery.","de":"¿Qué pasa cuando un curso se convierte en cinco? Este caso analiza cómo diseñadores instruccionales y un productor de video enfrentaron desafíos cambiantes en múltiples modalidades, con aprendizajes, flujos de trabajo colaborativos y estrategias tecnológicas surgidas del diseño y dictado en tiempo real.","sm":""},{"id":370,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"The Power of a Nudge: Scalable Targeted Interventions to Influence Online Learner Persistence and Success","te":"El poder de un empujoncito: intervenciones dirigidas y escalables para la permanencia y el éxito de estudiantes online","sh":"The Power of a Nudge: Persistence Interventions","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere D","p":"Mary Berkery, PhD","po":"Associate Dean, Excelsior University","d":"This session highlights the impact of a multi-year, cross-university \"Strong Start Project\", focusing on two effective interventions: registration nudges and Continual Persistence and Retention (CPR). Participants will examine data-informed outreach strategies for at-risk online learners and discuss adapting these scalable practices for their own environments.","de":"La sesión presenta el impacto del \"Strong Start Project\", un proyecto de varios años entre universidades, con foco en dos intervenciones eficaces: recordatorios para la inscripción y un programa de permanencia continua (CPR). Se analizan estrategias de contacto basadas en datos para estudiantes online en riesgo y cómo adaptarlas a cada contexto.","sm":""},{"id":371,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"The Sequence Is the Strategy: Why Instructional Design, Not AI, Determines Online Learning Outcomes","te":"La secuencia es la estrategia: por qué el diseño instruccional, y no la IA, define los resultados del aprendizaje online","sh":"The Sequence Is the Strategy: Why Design, Not AI, Drives Outcomes","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 2","p":"Desiree Bowlby","po":"Academic Program Manager, University of Colorado Colorado Springs","d":"Post-secondary online learning often fails not because of technological gaps, but because of sequencing gaps. This session demonstrates how reordering the instructional arc: placing conceptual foundation before content, practice before application, dramatically improves learner outcomes in asynchronous environments, regardless of the AI tools deployed.","de":"El aprendizaje online en la educación postsecundaria muchas veces falla no por brechas tecnológicas sino por problemas de secuencia. La sesión muestra cómo reordenar el arco de enseñanza (base conceptual antes del contenido, práctica antes de la aplicación) mejora notablemente los resultados en entornos asincrónicos, más allá de las herramientas de IA que se usen.","sm":""},{"id":372,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Tiered, Sustained, Connected: A Faculty Mentoring Model That Meets Instructors Where They Are","te":"Escalonado, sostenido, conectado: un modelo de mentoría docente que acompaña a cada uno donde está","sh":"A Tiered Faculty Mentoring Model","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Oceanic 1","p":"Dr. Alexandria Deaton","po":"Executive Director of Faculty Development and Associate Professor, University of the Cumberlands","d":"Faculty development works best when it's relational and differentiated. Explore how the University of the Cumberlands built a tiered mentoring model that supports faculty from course setup through every week of the term. Walk away with real examples and a clear sense of what to bring back to your institution.","de":"La formación docente funciona mejor cuando es relacional y diferenciada. Cómo University of the Cumberlands construyó un modelo de mentoría escalonado que acompaña a los docentes desde la preparación del curso y durante cada semana del cuatrimestre, con ejemplos reales y una idea clara de qué llevar a tu institución.","sm":""},{"id":373,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"To Infinity and Beyond: What's Next for AI in the Online Classroom, Grading with AI, and AI Beyond","te":"Hasta el infinito y más allá: lo que viene para la IA en el aula online, la calificación con IA y más","sh":"To Infinity and Beyond: What's Next for AI in the Classroom","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 3","p":"Dr. Kersten Schroeder","po":"Associate Professor of Medicine, University of Central Florida","d":"Like Toy Story, this session is about growth, adaptation, and reimagining what's possible. Rather than focusing on one AI tool, we present a journey of experimentation and evolution grounded in real practice & multiple perspectives. Through storytelling, humor, & critical reflection, we guide participants from skepticism to confidence in using AI effectively.","de":"Como Toy Story, esta sesión habla de crecimiento, adaptación y reimaginar lo posible. En lugar de enfocarse en una herramienta, presenta un recorrido de experimentación y evolución basado en la práctica real y en múltiples miradas. Con historias, humor y reflexión crítica, acompaña a los participantes del escepticismo a la confianza en el uso eficaz de la IA.","sm":""},{"id":374,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Uncharted Waters: Implementing an Asynchronous VR Simulation in Social Work Education","te":"Aguas desconocidas: una simulación de realidad virtual asincrónica en la formación en trabajo social","sh":"Asynchronous VR Simulation in Social Work","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere C","p":"Cris Emberton","po":"Director, Interactive Learning Technologies, The University of Tennessee-Knoxville","d":"This session explores how a fully asynchronous online social work program implemented virtual reality learning experiences for distance learners. Participants will learn how this immersive experience was designed, developed, scaled, and supported, including cross-functional collaboration, LMS integration, headset deployment, and student support strategies for experiential learning, contextual understanding, and more.","de":"Cómo un programa de trabajo social totalmente online y asincrónico implementó experiencias de realidad virtual para estudiantes a distancia: diseño, desarrollo, escalamiento y acompañamiento, incluyendo colaboración entre áreas, integración con el LMS, entrega de visores y estrategias de apoyo al estudiante para el aprendizaje experiencial y la comprensión del contexto.","sm":""},{"id":375,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Vibe Coding for Accessibility: From Brightspace Export to Actionable Fix List","te":"Vibe coding para la accesibilidad: de la exportación de Brightspace a una lista de correcciones concreta","sh":"Vibe Coding for Accessibility","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Pamela Doran, EdD Candidate","po":"Digital Accessibility and Multilingual Technology Coordinator, SUNY Empire State University","d":"What happens when a non-technical accessibility practitioner uses “vibe coding” to solve a real course review problem? This session shares the development of Online A11y, a local desktop tool that scans Brightspace course exports and turns WCAG-aligned accessibility issues into an actionable checklist for remediation teams.","de":"¿Qué pasa cuando una especialista en accesibilidad sin perfil técnico usa el \"vibe coding\" para resolver un problema real de revisión de cursos? La sesión cuenta el desarrollo de Online A11y, una herramienta de escritorio que analiza exportaciones de cursos de Brightspace y convierte los problemas de accesibilidad según WCAG en un checklist concreto para los equipos de corrección.","sm":""},{"id":376,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"What a Test Can't See: AI That Resists Students to Reveal How They Actually Think","te":"Lo que un examen no ve: una IA que \"se resiste\" a los estudiantes para mostrar cómo piensan realmente","sh":"What a Test Can't See: AI That Resists Students to Reveal Their Thinking","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere A1/A2","p":"Michael Kentz","po":"Founder, AI Friction Labs","d":"Most classroom AI is built to help—which often means doing the thinking for students. This session presents the opposite: AI built to resist. Across three classrooms, students taught, explained, and defended ideas to bots that refused easy answers. The conversation transcripts revealed what tests cannot: who actually understands.","de":"La mayoría de la IA para el aula está hecha para ayudar, lo que muchas veces significa pensar por los estudiantes. La sesión presenta lo opuesto: una IA diseñada para resistirse. En tres aulas, los estudiantes enseñaron, explicaron y defendieron ideas ante bots que se negaban a dar respuestas fáciles, y las transcripciones mostraron lo que los exámenes no pueden ver: quién entiende de verdad.","sm":""},{"id":377,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"When AI Literacy Isn't What We Think It Is: What Happens When We Measure Knowledge Instead of Confidence?","te":"Cuando la alfabetización en IA no es lo que creemos: ¿qué pasa si medimos conocimiento en lugar de confianza?","sh":"When AI Literacy Isn't What We Think: Measuring Knowledge vs. Confidence","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Americas Seminar","p":"Christine D. DeStefano, PhD","po":"Researcher/Methodologist, University of Central Florida","d":"Using a factual AI literacy instrument developed to assess knowledge rather than self-perceived competence, this session draws on multi-semester data from over 4,000 higher education students examining the relationship between academic generative AI (GenAI) use and AI literacy, challenging common assumptions about AI readiness and informing institutional AI literacy efforts.","de":"Con un instrumento de alfabetización en IA que mide conocimiento y no competencia autopercibida, la sesión analiza datos de varios cuatrimestres de más de 4.000 estudiantes de educación superior sobre la relación entre el uso académico de IA generativa y la alfabetización en IA. Los resultados cuestionan supuestos habituales sobre la preparación para la IA y aportan a las iniciativas institucionales de alfabetización.","sm":""},{"id":378,"day":"Mie","s":960,"e":1005,"b":"w-1600","t":"Who Are Online Student Parents? Voices, Data, and What Institutions Must Do Differently","te":"¿Quiénes son los estudiantes online que son madres y padres? Voces, datos y qué deben cambiar las instituciones","sh":"Who Are Online Student Parents?","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"","tre":"","loc":"Northern Hemisphere A3/A4","p":"Lei Luo, MBA, MASS","po":"Senior Research Scientist, Western Governors University","d":"Student parents are enrolled in online higher education in significant numbers, yet institutions rarely see them. Drawing on a large-scale mixed-methods study of online undergraduate student parents, this session presents new data on who they are, what they face, and what institutions can do right now.","de":"Hay muchos estudiantes que son madres y padres en la educación superior online, pero las instituciones rara vez los ven. A partir de un estudio de métodos mixtos a gran escala, la sesión presenta nuevos datos sobre quiénes son, qué enfrentan y qué pueden hacer hoy las instituciones.","sm":""},{"id":379,"day":"Jue","s":390,"e":450,"b":"h-early","t":"3-Minute Resets: Seated Yoga for Everyday Ease","te":"Pausas de 3 minutos: yoga en silla para el día a día","sh":"Seated Yoga","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"Charlotte Jones-Roberts","po":"Instructional Designer, University of Central Florida","d":"Discover simple, effective ways to reset your body and mind without leaving your chair. In this 45-minute seated yoga session, participants will learn a collection of accessible three-minute practices to relieve tension, improve circulation, support posture, and create moments of calm throughout the day. Through gentle chair-based movement, mindful breathing, and grounding pauses, you will build a practical toolkit for use at a desk, while traveling, between meetings, or whenever you need a quick reset. Open to all levels; no prior yoga experience required.","de":"Formas simples y eficaces de reiniciar el cuerpo y la mente sin levantarte de la silla. En esta sesión de 45 minutos de yoga en silla, los participantes aprenden prácticas accesibles de tres minutos para aliviar tensiones, mejorar la circulación, cuidar la postura y crear momentos de calma durante el día. Movimientos suaves, respiración consciente y pausas para usar en el escritorio, de viaje o entre reuniones. Para todos los niveles, sin experiencia previa.","sm":""},{"id":380,"day":"Jue","s":480,"e":720,"b":"h-early","t":"The Sanctuary","te":"The Sanctuary (sala de descanso)","sh":"The Sanctuary (quiet room)","ty":"General","tye":"General","to":"Other","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"","po":"","d":"Our Sanctuary room is a quiet, reflective space available for all conference attendees to use. This is a quiet space room where disturbances should be kept to a minimum to allow conference attendees to rest and recharge. The Sanctuary room is open during regular conference hours. During the conference, join us for some quiet time to decompress, reconnect mind and body, and practice some self-care as we turn our focus inward for a short while. Mindfulness has been defined as a practice of “bringing one’s attention to the internal and external experiences occurring in the present moment” (Baer, 2003). Join us in the Sanctuary today for some special mindfulness sessions (see the engagement schedule), or just to relax and decompress a bit throughout the day.","de":"Espacio tranquilo y de reflexión abierto durante el horario de la conferencia para descansar, recargar energía y participar de sesiones de mindfulness.","sm":""},{"id":381,"day":"Jue","s":495,"e":585,"b":"h-early","t":"Attendee Breakfast","te":"Desayuno para asistentes","sh":"Attendee Breakfast","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Pacific Hall B/C","p":"","po":"","d":"Join us for continental breakfast and specialty coffee service, followed by our plenary panel.","de":"Desayuno continental y café de especialidad, seguido del panel plenario.","sm":""},{"id":382,"day":"Jue","s":540,"e":585,"b":"h-early","t":"Educating for Human Agency: What Learning Must Become in an AI-Transformed World","te":"Educar para la agencia humana: en qué debe convertirse el aprendizaje en un mundo transformado por la IA","sh":"Plenary: Educating for Human Agency","ty":"Plenary","tye":"Plenaria","to":"Plenary Address","tr":"","tre":"","loc":"Pacific Hall B/C","p":"Tawnya Means - moderator","po":"Strategic Innovation & AI Advisor to the Provost, Bowling Green State University","d":"Artificial intelligence is changing not only how people learn and work, but also what it means to be capable, credible, and prepared. Yet much of higher education’s response remains focused on tools, policies, and the quality of AI-generated answers. The more consequential question is what learners must still be able to understand, discern, create, communicate, and defend for themselves.","de":"La IA está cambiando no solo cómo aprenden y trabajan las personas, sino también qué significa ser capaz, creíble y estar preparado. Sin embargo, buena parte de la respuesta de la educación superior sigue centrada en herramientas, políticas y la calidad de las respuestas de la IA. La pregunta de fondo es qué deben seguir siendo capaces de entender, discernir, crear, comunicar y defender por sí mismos los estudiantes.","sm":""},{"id":383,"day":"Jue","s":600,"e":705,"b":"h-1000","t":"Designing for Human Learning: A D&D-Inspired Gamified Workshop on AI and Assessment","te":"Diseñar para el aprendizaje humano: un taller gamificado inspirado en Dungeons & Dragons sobre IA y evaluación","sh":"Designing for Human Learning: A D&D-Inspired Workshop on AI and Assessment","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere C","p":"Dr. Hannah Ruehl","po":"Instructional Designer, University of Tennessee - Knoxville","d":"This D&D-inspired gamified workshop explores how educators can redesign assessments for meaningful learning in the age of generative AI. Working in collaborative “design guilds,” participants identify where AI bypasses cognition, redesign common assignments to preserve learning, and then test their solutions through an interactive AI “boss battle.”","de":"Este taller gamificado inspirado en Dungeons & Dragons explora cómo rediseñar evaluaciones para un aprendizaje significativo en la era de la IA generativa. En \"gremios de diseño\" colaborativos, los participantes identifican dónde la IA se saltea el esfuerzo cognitivo, rediseñan consignas habituales para preservar el aprendizaje y ponen a prueba sus soluciones en una \"batalla final\" interactiva contra la IA.","sm":""},{"id":384,"day":"Jue","s":600,"e":705,"b":"h-1000","t":"From Fixed to Future-Focused: Applying Growth Mindset and ADKAR to Lead Through Change","te":"De una mentalidad fija a una orientada al futuro: mentalidad de crecimiento y ADKAR para liderar el cambio","sh":"From Fixed to Future-Focused: Growth Mindset and Leading Change","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere A1/A2","p":"Maxine Frendel, MA","po":"Manager, Design and Development, Western Governors University","d":"Leading change isn't only about implementing new processes or technologies; it is about helping people navigate uncertainty, overcome resistance, and build confidence. This interactive session combines principles of Growth Mindset and the ADKAR Change Management Model to help leaders effectively support teams during periods of transformation.","de":"Liderar el cambio no es solo implementar nuevos procesos o tecnologías: es ayudar a las personas a atravesar la incertidumbre, superar resistencias y ganar confianza. Esta sesión interactiva combina principios de mentalidad de crecimiento y el modelo de gestión del cambio ADKAR para que los líderes acompañen eficazmente a sus equipos en períodos de transformación.","sm":""},{"id":385,"day":"Jue","s":600,"e":705,"b":"h-1000","t":"Illuminate Connections: How Leaders Build, Bridge, and Mobilize for Digital Learning Success","te":"Iluminar conexiones: cómo los líderes construyen, tienden puentes y movilizan para el éxito del aprendizaje digital","sh":"Leaders Who Build, Bridge and Mobilize","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Americas Seminar","p":"Maureen Kinney","po":"SUNY Online Campus Partnerships Project Manager, SUNY-System Office","d":"Explore how distance learning leaders illuminate their impact by building trust, bridging silos, and mobilizing relationships across faculty, staff, administration, and teams. Using our “Build, Bridge, Mobilize” framework, participants identify priorities and leave with clear, actionable steps to strengthen collaboration, alignment, and leadership effectiveness in today’s evolving digital learning environment.","de":"Cómo los líderes de educación a distancia potencian su impacto construyendo confianza, tendiendo puentes entre áreas y movilizando relaciones con docentes, personal, autoridades y equipos. Con el marco \"Construir, tender puentes, movilizar\", los participantes identifican prioridades y se llevan pasos claros para fortalecer la colaboración, la alineación y la eficacia del liderazgo en el entorno digital actual.","sm":""},{"id":386,"day":"Jue","s":600,"e":705,"b":"h-1000","t":"The Innovation Toolkit: Using Creative Problem Solving, Design Thinking, and AI to Lead Educational Change","te":"La caja de herramientas de la innovación: resolución creativa de problemas, design thinking e IA para liderar el cambio educativo","sh":"The Innovation Toolkit: Creative Problem Solving, Design Thinking and AI","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere E1/E2","p":"Debby Marindin, EdD, PMP","po":"Instructional Designer/Assistant Professor and Adjunct Faculty, MUSC and College of Charleston","d":"Educational leaders face growing pressure to innovate amid rapid technological change, limited resources, and evolving learner needs. This interactive workshop introduces Creative Problem Solving, Design Thinking, and AI-supported innovation strategies that help participants lead change, foster collaboration, and build sustainable cultures of innovation within their organizations.","de":"Los líderes educativos enfrentan una presión creciente para innovar en medio de cambios tecnológicos acelerados, recursos limitados y necesidades cambiantes de los estudiantes. Este taller interactivo presenta la resolución creativa de problemas, el design thinking y estrategias de innovación con apoyo de IA para liderar el cambio, fomentar la colaboración y construir culturas de innovación sostenibles en las organizaciones.","sm":""},{"id":387,"day":"Jue","s":600,"e":705,"b":"h-1000","t":"The Vocal Advantage: Elevating E-Learning Through Human Centered Voice Narration, AI Strategy, and Audio Engagement","te":"La ventaja de la voz: potenciar el eLearning con narración humana, estrategia de IA y audio","sh":"Voice Narration, AI and Audio in eLearning","ty":"Workshop (105 min)","tye":"Taller (105 min)","to":"Workshop (105 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere D","p":"Erica Porter","po":"Independent Consultant, Independent Consultant","d":"This interactive workshop will explore how intentional voice narration can transform e-learning from passive content into engaging, human-centered instruction. Participants will learn foundational voice-over techniques, evaluate the role of AI-generated narration versus human voice for learner engagement, and explore how podcasting can be integrated into modern course design.","de":"Este taller interactivo explora cómo una narración de voz intencional puede convertir el eLearning de contenido pasivo en una enseñanza atractiva y centrada en las personas. Los participantes aprenden técnicas básicas de locución, evalúan el papel de la narración generada con IA frente a la voz humana en la participación de los estudiantes y exploran cómo integrar podcasts en el diseño de cursos.","sm":""},{"id":388,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"90 hours of In-Person: A Transformational Residency Model that Combats Virtual Isolation","te":"90 horas presenciales: un modelo de residencias que combate el aislamiento virtual","sh":"In-Person Residencies Against Virtual Isolation","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 5","p":"Mike de Vera, M.A.","po":"Director of Graduate Student Services, Online, Northeastern University","d":"Online graduate programs struggle to replicate the connection, engagement, and empowerment of on-ground cohorts. This session unpacks a three residency model — nine days in-person across a learner's first year — that drives community, learner success, and confidence. Takeaways transfer to any online graduate program, regardless of budget.","de":"A los posgrados online les cuesta replicar la conexión, la participación y el empoderamiento de las cohortes presenciales. La sesión analiza un modelo de tres residencias (nueve días presenciales durante el primer año) que impulsa la comunidad, el éxito y la confianza de los estudiantes. Los aprendizajes se pueden aplicar a cualquier posgrado online, con cualquier presupuesto.","sm":""},{"id":389,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Accessibility Natives: Digital Accessibility Literacy as Pedagogical Strategy","te":"Nativos de la accesibilidad: la alfabetización en accesibilidad digital como estrategia pedagógica","sh":"Digital Accessibility Literacy for Students","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 8","p":"Jennifer Wagner, M.Ed.","po":"Instructional Designer, Accessibility Specialist, Pennsylvania State University","d":"Compliance ensures access today; literacy ensures it tomorrow. This session shares an openly licensed digital accessibility literacy curriculum that helps students create accessible digital work within existing assignments. We then use a four-part culture framework to explore what institutions build, practice, surface, and reframe when literacy leads.","de":"El cumplimiento garantiza el acceso hoy; la alfabetización lo garantiza mañana. La sesión comparte un currículo de alfabetización en accesibilidad digital con licencia abierta que ayuda a los estudiantes a producir trabajos digitales accesibles dentro de las consignas existentes, y usa un marco cultural de cuatro partes para analizar qué construyen, practican, visibilizan y replantean las instituciones cuando la alfabetización toma la delantera.","sm":""},{"id":390,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"AI Literacy in Action: Role-Based Exploration for Digital Learning","te":"Alfabetización en IA en acción: una exploración por roles para el aprendizaje digital","sh":"AI Literacy in Action: Role-Based Exploration","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Southern Hemisphere V","p":"Dr. Jamie Nelson","po":"Competency-Based Education Coordinator / AI Innovation Lead, Tennessee Board of Regents","d":"Explore how role-based AI literacy competencies can guide practical professional learning and support strategies for digital education. Presenters will share a framework approach, examples across institutional roles, and engagement prompts that help participants consider how to adapt AI literacy planning for their own context.","de":"Cómo las competencias de alfabetización en IA definidas por rol pueden guiar la formación profesional y las estrategias de apoyo en la educación digital. Se comparten un enfoque de marco, ejemplos de distintos roles institucionales y disparadores para que cada participante piense cómo adaptar la planificación de la alfabetización en IA a su propio contexto.","sm":""},{"id":391,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"AI Meets Access: Transforming the Online Lab Experience","te":"La IA se encuentra con el acceso: transformar la experiencia de laboratorio online","sh":"AI Meets Access: A Socratic AI Assistant for Online Labs","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Dr. Susan McKenzie","po":"Sr. Associate Dean, Southern New Hampshire University","d":"Discover how AI and accessibility reshape online science labs through Carolina Online Gateway. Experience TESS, an AI assista nt delivering real-time, Socratic guidance as students conduct experiments and interpretdata. Explore virtual lab simulations that build confidence, persistence, and rigor, empowering diverse learners to succeed in STEM anytime, anywhere.","de":"Cómo la IA y la accesibilidad transforman los laboratorios de ciencias online a través de Carolina Online Gateway. Se presenta TESS, un asistente de IA que da orientación socrática en tiempo real mientras los estudiantes hacen experimentos e interpretan datos, y simulaciones de laboratorio virtual que generan confianza, persistencia y rigor para que estudiantes diversos tengan éxito en STEM en cualquier momento y lugar.","sm":""},{"id":392,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Beyond the Awareness Trap: Designing the Path from AI Literacy to True Fluency","te":"Más allá de la trampa de la conciencia: el camino de la alfabetización en IA a una verdadera fluidez","sh":"Beyond the Awareness Trap: From AI Literacy to AI Fluency","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 7","p":"Thomas Mathews Horne","po":"INSTRUCTIONAL DESIGNER AND ADJUNCT FACULTY OF ENGLISH COMPOSITION, Fort Hays State University","d":"Most campuses chase AI “literacy” and mistake awareness for ability. This session reframes the goal as genuine fluency, the practiced capacity to collaborate with AI effectively, ethically, and safely. We share a whole-institution design pathway, grounded in two established frameworks, which moves faculty and students from knowing to doing.","de":"Muchas instituciones persiguen la \"alfabetización\" en IA y confunden estar informado con saber hacer. La sesión replantea el objetivo como una fluidez genuina: la capacidad, ejercitada, de colaborar con la IA de forma eficaz, ética y segura. Se comparte un trayecto de diseño para toda la institución, basado en dos marcos reconocidos, que lleva a docentes y estudiantes del saber al hacer.","sm":""},{"id":393,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Building Relationships and Rapport Between Online Faculty and Graduate Students: Illuminating the Path in Digital Spaces","te":"Construir vínculos entre docentes y estudiantes de posgrado online","sh":"Faculty–Student Rapport Online","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 6","p":"Cary Gillenwater, PhD","po":"Professor, National University","d":"We will present scenarios crafted from both research and personal experiences to stimulate discussion on ideas for relationship-building and rapport between online faculty and graduate students. Please join us for an important discussion about how to build and maintain positive relationships and rapport in digital spaces!","de":"Escenarios basados en investigación y en experiencias propias para conversar sobre cómo construir y sostener vínculos positivos entre docentes y estudiantes de posgrado online. ¡Sumate a esta conversación sobre la relación en los espacios digitales!","sm":""},{"id":394,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Centering Students in LMS Faculty Development: The Brightspace Summer Institute Experience at the University of Arizona","te":"Centrar a los estudiantes en la formación docente sobre el LMS: la experiencia del Brightspace Summer Institute de University of Arizona","sh":"Student-Centered LMS Faculty Development","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 2","p":"Amy Hamman Hader","po":"Senior Instructional Technologist, University of Arizona","d":"What happens when student feedback shapes faculty development? Learn how a Student Experience Survey informed the development of the Brighspace Summer Institute at the University of Arizona. Gain concrete strategies, practical examples, and actionable frameworks you can implement at your institutions to create student-centered, inclusive, and scalable faculty development programs.","de":"¿Qué pasa cuando el feedback de los estudiantes da forma a la formación docente? Cómo una encuesta de experiencia estudiantil orientó el desarrollo del Brightspace Summer Institute en University of Arizona. Estrategias concretas, ejemplos prácticos y marcos aplicables para crear programas de formación docente centrados en el estudiante, inclusivos y escalables.","sm":""},{"id":395,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Conversational Grading with Your AI Companion: Feedback that Builds Student Trust and Sustains Instructor Energy","te":"Calificación conversacional con tu compañero de IA: retroalimentación que genera confianza y sostiene la energía docente","sh":"Conversational Grading with AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Matthew Phillips","po":"Teaching Professor of Law & Ethics, Wake Forest University","d":"Grading subjective assignments is where instructors build trust with students, but the work is exhausting. This session reframes AI as a conversation partner that sustains instructor engagement and helps deliver more targeted, individualized feedback. Participants will learn about research support for the approach and take away practical approaches and tools.","de":"Calificar trabajos subjetivos es donde los docentes construyen confianza con los estudiantes, pero es agotador. La sesión replantea la IA como un interlocutor que sostiene el compromiso del docente y lo ayuda a dar retroalimentación más focalizada e individual. Se presenta la investigación que respalda el enfoque y herramientas prácticas.","sm":""},{"id":396,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Designing AI-Enhanced Student Engagement and Active Learning for the Future Classroom","te":"Diseñar participación y aprendizaje activo con IA para el aula del futuro","sh":"Designing AI-Enhanced Student Engagement and Active Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 4","p":"Jakia Salam","po":"Lead Instructional Designer, North Carolina State University at Raleigh","d":"Generative AI is changing how students engage, collaborate, and learn. This session explores practical strategies to integrate  AI in active learning, discussions, peer feedback, and assignments. Participants will explore strategies that encourage meaningful student engagement, build AI literacy, and support responsible and ethical AI use in online and blended courses.","de":"La IA generativa está cambiando cómo los estudiantes participan, colaboran y aprenden. La sesión explora estrategias prácticas para integrar la IA en el aprendizaje activo, las discusiones, la retroalimentación entre pares y las consignas, fomentando una participación significativa, la alfabetización en IA y un uso responsable y ético en cursos online e híbridos.","sm":""},{"id":397,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Finding Nemo (and Other Faculty): Strategies for How to Reach Missing Faculty","te":"Buscando a Nemo (y a otros docentes): estrategias para llegar a los docentes que no aparecen","sh":"Reaching Disengaged Faculty","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 5","p":"Cherie Dodd","po":"Sr. Instructional Strategies Specialist, Indiana University-Kokomo","d":"How do you move faculty from \"missing\" to \"actively engaging\"? Join our presentation to diagnose common participation challenges and explore the anatomy of successful faculty events. Through real-world examples and interactive crowdsourcing, attendees will develop actionable strategies to revitalize their faculty development initiatives and find Professor Nemo.","de":"¿Cómo lograr que los docentes pasen de \"desaparecidos\" a participantes activos? La presentación ayuda a diagnosticar problemas habituales de participación y analiza qué tienen los encuentros docentes exitosos. Con ejemplos reales y aportes colectivos, los asistentes desarrollan estrategias para revitalizar sus iniciativas de formación y \"encontrar al profesor Nemo\".","sm":""},{"id":398,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"Focus for the future: A reflection session to connect with each other and what matters most","te":"Foco en el futuro: una sesión de reflexión para conectar entre nosotros y con lo que más importa","sh":"Focus for the Future: Turning Conference Ideas into Next Steps","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"Mary Johannesen-Schmidt, Ph.D.","po":"Coordinator, Center for Teaching Innovation and Distinguished Professor of Psychology, Oakton College","d":"Are you energized (or overwhelmed?) by all the ideas and creative thoughts you have at a conference but struggle to implement change once you return to your campus? Come reflect on what you’ve learned so far, connect with colleagues doing the same, and distill your ideas into actionable next steps!","de":"¿Te sentís con energía (o abrumado) por todas las ideas de la conferencia, pero te cuesta implementar cambios al volver a tu institución? Una sesión para reflexionar sobre lo aprendido, conectar con colegas que están en lo mismo y convertir las ideas en próximos pasos concretos.","sm":""},{"id":399,"day":"Jue","s":600,"e":645,"b":"h-1000","t":"From Principles to Practice: A Four-Step AI Governance Workflow for Higher Education","te":"De los principios a la práctica: un flujo de cuatro pasos para la gobernanza de la IA en la educación superior","sh":"A Four-Step AI Governance Workflow","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Dr. JéVaughn Lancaster","po":"Director, Instructional Design and Technology, Lynn University","d":"Higher education institutions are adopting AI without the leadership readiness or governance infrastructure to do it responsibly. This session introduces a four-step governance workflow - Diagnose, Map, Assess, Monitor - that bridges readiness measurement, ethics-to-standards translation, evaluation, and continuous audit into a single framework aligned to NIST AI RMF and ISO 42001.","de":"Las instituciones de educación superior están adoptando IA sin la preparación de liderazgo ni la infraestructura de gobernanza para hacerlo de forma responsable. La sesión presenta un flujo de go
