rendizaje online accesible y atractivo","sh":"Turning Static Content into Accessible Online Learning","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 6","p":"Mickey Robinson, PhD","po":"Senior Instructional Designer, Purdue University","d":"Great online courses are more than content—they are intentionally designed learning experiences. Through a real-world case study, this session examines how PowerPoint presentations were reimagined as an accessible, learner-centered online course. Attendees will gain practical strategies for transforming existing content into engaging learning experiences that enhance accessibility, engagement, and quality.","de":"Los buenos cursos online son más que contenido: son experiencias de aprendizaje diseñadas con intención. A partir de un caso real, la sesión muestra cómo presentaciones de PowerPoint se reimaginaron como un curso online accesible y centrado en el estudiante, con estrategias prácticas para transformar contenido existente en experiencias que mejoran la accesibilidad, la participación y la calidad.","sm":""},{"id":167,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond the Slide Deck: Teaching for Access, Engagement, and Inclusion","te":"Más allá de las diapositivas: enseñar para el acceso, la participación y la inclusión","sh":"Teaching from Slides for Access and Inclusion","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Southern Hemisphere IV","p":"Analisa McMillan, PhD","po":"Director, Office of Teaching and Learning, University of Nebraska Medical Center","d":"Your slide design may get all the attention, but how you teach from your slides determines who can actually learn. This session explores accessibility gaps when using slide decks in live and recorded classrooms or presentations. Learn strategies to improve clarity, engagement, and inclusion, and to strengthen your presentation practices.","de":"El diseño de las diapositivas se lleva toda la atención, pero cómo enseñás con ellas determina quién puede aprender realmente. La sesión explora las brechas de accesibilidad al usar presentaciones en clases en vivo o grabadas, con estrategias para mejorar la claridad, la participación y la inclusión, y fortalecer la forma de presentar.","sm":""},{"id":168,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Beyond the Workshop: A Blueprint for a Faculty Learning Community Built Around Quality, AI Productivity, and Innovation","te":"Más allá del taller: un modelo de comunidad de aprendizaje docente centrada en la calidad, la productividad con IA y la innovación","sh":"A Faculty Learning Community on Quality and AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere A3/A4","p":"Dr Hilary R. Johnson-Lutz","po":"Instructional Designer, Florida A&M University","d":"This proposed Faculty Online Learning Community (FOLC) advances digital learning through a blended model combining in-person sessions, synchronous meetings, and asynchronous modules. By integrating a Human + AI framework, FOLC improves course quality and builds faculty confidence empowering educators to lead an inclusive, technology-forward future.","de":"Esta propuesta de Comunidad Online de Aprendizaje Docente (FOLC) impulsa el aprendizaje digital con un modelo híbrido que combina sesiones presenciales, encuentros sincrónicos y módulos asincrónicos. Al integrar un marco \"Humano + IA\", mejora la calidad de los cursos y fortalece la confianza docente para liderar un futuro inclusivo y tecnológicamente avanzado.","sm":""},{"id":169,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Bright Minds, Better Futures: Illuminating Work/Life Balance in Higher Ed","te":"Mentes brillantes, mejores futuros: el equilibrio entre trabajo y vida personal en la educación superior","sh":"Work/Life Balance in Higher Ed","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Americas Seminar","p":"Dr. Jacquelyn Cato","po":"Chief Strategy Officer, Instructional Connections","d":"Engaging students in online learning while protecting work/life balance remains a major challenge for educators. This interactive session shares practical strategies to reduce burnout, strengthen student engagement, and improve outcomes. Explore how intentional balance and strong faculty support systems can transform both teaching experience and student success.","de":"Involucrar a los estudiantes en el aprendizaje online y a la vez cuidar el equilibrio entre trabajo y vida personal sigue siendo un gran desafío para los docentes. Esta sesión interactiva comparte estrategias prácticas para reducir el agotamiento, fortalecer la participación de los estudiantes y mejorar los resultados, y muestra cómo el equilibrio intencional y sistemas sólidos de apoyo docente transforman la experiencia de enseñar y el éxito estudiantil.","sm":""},{"id":170,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Color, Create, Connect!","te":"¡Colorear, crear, conectar!","sh":"Color, Create, Connect!","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Asia 2 - The Sanctuary","p":"Shanda Hood","po":"Teaching Associate Professor, University of Arkansas","d":"This session uses a collaborative coloring challenge to help participants connect. Working in groups, participants engage in a hands-on task that encourages conversation and problem-solving, providing an opportunity to build relationships, and connect.","de":"Un desafío colaborativo de coloreado para conectar con otros participantes. En grupos, se realiza una tarea práctica que invita a conversar y resolver problemas juntos, como oportunidad para construir vínculos.","sm":""},{"id":171,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Consortium Collaboration: Accelerating Scalable Program Development for Market Impact","te":"Colaboración en consorcio: acelerar el desarrollo de programas escalables con impacto en el mercado","sh":"Consortium Program Development","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 7","p":"Dr. Ayelet Zur-Nayberg","po":"Director of Consortial Operations, Colorado Community College System","d":"The Colorado Community College System shares its innovative approach to developing scalable consortial online programs. By integrating stackable credentials and systemwide enrollment planning across 13 colleges, this collaborative model empowers faculty, accelerates time-to-market, and balances standardized course delivery with institutional expertise to meet workforce needs and ensure financial sustainability.","de":"El sistema de community colleges de Colorado comparte su enfoque innovador para desarrollar programas online escalables en consorcio. Integrando credenciales acumulables y una planificación conjunta de la inscripción entre 13 instituciones, este modelo colaborativo empodera a los docentes, acelera los tiempos de lanzamiento y equilibra una oferta estandarizada con la experiencia de cada institución para responder a las necesidades del mundo laboral y asegurar la sostenibilidad financiera.","sm":""},{"id":172,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Creating Connection in Online Programs Through Coaching and Community Strategies","te":"Generar conexión en programas online con estrategias de coaching y comunidad","sh":"Creating Connection Through Coaching and Community","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Asia 1","p":"Lydia Kite OTD, MOT,OTR/L,CAPS","po":"Director of Student Affairs and Assistant Clinical Professor, Bowling Green State University","d":"Online learners need more than discussion boards to feel connected. This session explores practical strategies for building belonging through academic coaching, wellness initiatives, virtual gatherings, Canvas community hubs, and intentional engagement practices that humanize online programs, strengthen learner connection, and support student persistence in digital graduate education.","de":"Los estudiantes online necesitan más que foros de discusión para sentirse conectados. La sesión explora estrategias prácticas para construir pertenencia: coaching académico, iniciativas de bienestar, encuentros virtuales, espacios de comunidad en Canvas y prácticas de participación intencionales que humanizan los programas online, fortalecen la conexión y apoyan la permanencia en posgrados digitales.","sm":""},{"id":173,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Creating Engaging Microlearning Opportunities for Faculty Development","te":"Microaprendizaje atractivo para la formación docente","sh":"Microlearning for Faculty Development","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 8","p":"Drew Santorello, MFA, MA","po":"Senior Multimedia Producer, George Washington University","d":"Struggling with faculty engagement? Join us to explore a one-minute/one-page microlearning framework designed for maximum impact. Discover how our template-driven approach and AI-assisted workflows allow you to \"crowdsource\" high-quality, short-form resources. Learn to build a scalable professional development library that respects your faculty’s time—and your own.","de":"¿Te cuesta lograr la participación de los docentes? Un marco de microaprendizaje de \"un minuto / una página\" pensado para el máximo impacto. Cómo un enfoque basado en plantillas y flujos de trabajo con apoyo de IA permite reunir colaborativamente recursos breves de calidad y construir una biblioteca de formación escalable que respete el tiempo de los docentes, y el tuyo.","sm":""},{"id":174,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Cyborg Leadership: Guiding Your Team When AI Assimilates","te":"Liderazgo cyborg: guiar a tu equipo cuando la IA se integra a todo","sh":"Cyborg Leadership: Guiding Teams Through AI","ty":"Gamified session","tye":"Sesión gamificada","to":"Gamified Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere III","p":"Jason Johnston, PhD","po":"Exec. Dir. of Online Learning & Course Production, The University of Tennessee-Knoxville","d":"Higher education is already full of cyborgs: faculty and staff integrating AI into daily work and extending beyond human limits. But are they following human leaders or chasing the next prompt? Join this gamified session exploring Cyborg Leadership and the Care-First Change Framework (Nash & Johnston, in press).","de":"La educación superior ya está llena de cyborgs: docentes y personal que integran la IA a su trabajo diario y amplían sus límites. Pero ¿siguen a líderes humanos o van detrás del próximo prompt? Una sesión gamificada sobre el liderazgo cyborg y el marco de cambio \"Care-First\" (Nash y Johnston, en prensa).","sm":""},{"id":175,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Design for Success in the Skilled Trades: An AI-Augmented Approach","te":"Diseñar para el éxito en oficios: un enfoque aumentado con IA","sh":"Design for Success in the Skilled Trades: An AI-Augmented Approach","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere C","p":"Ami Bhandari","po":"SVP, Education, Universal Technical Institute","d":"Students in the skilled trades must master concepts and practice in a safe environment as they prepare for intensive certification exams. This session shares practical frameworks behind one institution's AI-augmented approach to curriculum design for consistent learner success across campuses.","de":"Los estudiantes de oficios técnicos deben dominar conceptos y practicar en un entorno seguro mientras se preparan para exigentes exámenes de certificación. La sesión comparte los marcos prácticos detrás del enfoque de una institución que usa IA en el diseño curricular para lograr resultados consistentes en todas sus sedes.","sm":""},{"id":176,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Designing AI Agents to Support Faculty-Student Communications","te":"Diseñar agentes de IA para apoyar la comunicación entre docentes y estudiantes","sh":"Designing AI Agents to Support Communication with Students","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 9","p":"Paul Mueller, Ph.D","po":"Sr. Manager, Chamberlain University-Illinois","d":"Sustaining clear, supportive student–faculty communication online is challenging at scale. This hands‑on discovery session guides participants through designing academic AI agents that support faculty outreach by integrating approved resources and policy guidance, while modeling a reusable agent‑building process applicable across teaching and faculty‑support contexts.","de":"Sostener una comunicación clara y contenedora entre docentes y estudiantes online es difícil a escala. Esta sesión práctica de conversación guía a los participantes en el diseño de agentes de IA académicos que apoyan el contacto de los docentes con los estudiantes, integrando recursos aprobados y pautas institucionales, y modela un proceso reutilizable para construir agentes aplicable a la enseñanza y al apoyo docente.","sm":""},{"id":177,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Designing for Transfer, Judgment, and Real Learning","te":"Diseñar para la transferencia, el juicio y el aprendizaje real","sh":"Designing for Transfer, Judgment and Real Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 7","p":"Heather Tobin, EdD","po":"Instructional Designer, Southwestern Law School","d":"A practical design response for AI that is grounded in learning science (desirable difficulty, generative learning, situated cognition, etc.), Improvisational AI Learning (IAL) reframes learning as decision-making within human-AI systems. Participants will redesign their own assignments emphasizing non-delegable thinking, leaving with a revised task, checklist, and rubric for immediate use.","de":"Una respuesta de diseño práctica frente a la IA, basada en las ciencias del aprendizaje (dificultades deseables, aprendizaje generativo, cognición situada, etc.). El enfoque Improvisational AI Learning (IAL) replantea el aprendizaje como toma de decisiones dentro de sistemas humano-IA. Los participantes rediseñan sus propias consignas priorizando el pensamiento que no se puede delegar, y se llevan una tarea revisada, un checklist y una rúbrica para usar de inmediato.","sm":""},{"id":178,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Ditching the Deck: Intentional Media Choices for Online Learning","te":"Dejar las diapositivas: elecciones intencionales de medios para el aprendizaje online","sh":"Intentional Media Choices for Online Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 2","p":"Marianne Peacock","po":"Instructional Design Manager, Washington University in Saint Louis","d":"Faculty often default to standard lecture videos, overlooking media better suited to specific instructional goals. This session introduces a practical framework that shifts media planning from format-first thinking to purposeful instructional design, helping faculty and instructional design teams make intentional media choices that humanize instruction, spark inquiry, clarify concepts, model processes, and connect ideas.","de":"Los docentes suelen recurrir por defecto a videos de clase tradicionales y pasan por alto medios más adecuados para cada objetivo. La sesión presenta un marco práctico que pasa de pensar primero en el formato a un diseño instruccional con propósito, para elegir medios que humanicen la enseñanza, despierten la indagación, aclaren conceptos, modelen procesos y conecten ideas.","sm":""},{"id":179,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Doing It All: Exploring Roles and Responsibilities of and Support for Online Program Coordinators","te":"Hacer de todo: roles, responsabilidades y apoyo de los coordinadores de programas online","sh":"Roles and Support for Online Program Coordinators","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Northern Hemisphere A1/A2","p":"Yvonne Earnshaw, Ph.D.","po":"Assistant Professor, Kennesaw State University","d":"Academic program coordination represents one of the most common faculty administrative appointments in higher education. However, there is a lack of research, particularly in online programs. This session presents findings from a research study which explores the roles and responsibilities of online program coordinators and the support that they need.","de":"La coordinación de programas académicos es uno de los cargos de gestión docente más comunes en la educación superior, pero hay poca investigación al respecto, sobre todo en programas online. La sesión presenta hallazgos de un estudio sobre los roles y responsabilidades de los coordinadores de programas online y el apoyo que necesitan.","sm":""},{"id":180,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Enrolling in Uncertainty: Online Graduate Trends in a Volatile Economy","te":"Inscribirse en la incertidumbre: tendencias de los posgrados online en una economía volátil","sh":"Online Graduate Enrollment Trends","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 10","p":"Greg Weaver, PhD","po":"Director of Online Program Development, University of Virginia-Main Campus","d":"When consumer confidence drops, graduate enrollment rises and more students choose full-time study. Our Discovery Session explores eight years of IPEDS data (2016-2024) revealing how economic indicators predict enrollment patterns. Discover what national trends mean for your institution's strategy.","de":"Cuando cae la confianza del consumidor, aumenta la inscripción en posgrados y más estudiantes eligen estudiar a tiempo completo. Esta sesión de conversación analiza ocho años de datos de IPEDS (2016-2024) que muestran cómo los indicadores económicos anticipan los patrones de inscripción, y qué significan esas tendencias nacionales para la estrategia de cada institución.","sm":""},{"id":181,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Escape the Innovation Trap: A Gamified Challenge for Solving Educational Problems","te":"Escapar de la trampa de la innovación: un desafío gamificado para resolver problemas educativos","sh":"Escape the Innovation Trap: AI-Supported Problem Solving","ty":"Gamified session","tye":"Sesión gamificada","to":"Gamified Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 1","p":"Debby Marindin, EdD, PMP","po":"Instructional Designer/Assistant Professor and Adjunct Faculty, MUSC and College of Charleston","d":"Innovation does not require expensive technology. In this interactive gamified session, participants collaborate to solve educational challenges through play, creativity, and AI-supported problem solving while exploring free and low-cost strategies they can immediately adapt for teaching, faculty development, instructional design, and organizational innovation.","de":"Innovar no requiere tecnología cara. En esta sesión gamificada e interactiva, los participantes colaboran para resolver desafíos educativos a través del juego, la creatividad y la resolución de problemas con apoyo de IA, explorando estrategias gratuitas o de bajo costo que pueden adaptar de inmediato a la enseñanza, la formación docente, el diseño instruccional y la innovación organizacional.","sm":""},{"id":182,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"From Live Responses to Teaching Decisions","te":"De las respuestas en vivo a las decisiones de enseñanza","sh":"From Live Responses to Teaching Decisions","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 3","p":"Corentin Aussems","po":"Head of North America, Wooclap","d":"Live sessions produce data about what learners understood, and most of it evaporates when the session ends. This session will give you practices for using it in the moment and to design what comes next.","de":"Las sesiones en vivo generan datos sobre lo que entendieron los estudiantes, y la mayoría se pierde cuando termina la sesión. Esta sesión ofrece prácticas para usar esos datos en el momento y para diseñar lo que sigue.","sm":""},{"id":183,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"From monologue to dialogue: Transforming lecture videos to engage learners","te":"Del monólogo al diálogo: transformar los videos de clase para involucrar a los estudiantes","sh":"Transforming Lecture Videos","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 11","p":"Dr. Ellen Farr","po":"Director of Online Learning, Center for Excellence in Teaching and Learning, The College of New Jersey","d":"Transitioning in-person to fully online programs requires rethinking traditional pedagogy. This session shares how lengthy counseling course videos were redesigned into shorter, engaging learning assets using multimedia learning, cognitive load, and inclusive design principles. Participants will explore scalable strategies for chunking content, increasing engagement, improving accessibility, and preserving instructor presence.","de":"Pasar de programas presenciales a totalmente online exige repensar la pedagogía tradicional. La sesión muestra cómo videos extensos de un curso de consejería se rediseñaron en recursos más breves y atractivos aplicando principios de aprendizaje multimedia, carga cognitiva y diseño inclusivo. Estrategias escalables para dividir el contenido, aumentar la participación, mejorar la accesibilidad y preservar la presencia docente.","sm":""},{"id":184,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"From Pilot to Policy: Building Synchronous Learning Systems with Equity in Mind","te":"Del piloto a la política: sistemas de aprendizaje sincrónico pensados con equidad","sh":"Required Synchronous Learning and Equity","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 12","p":"Allison Rief, Ed.D.","po":"Associate Dean, Division of Education Professionals, University of Arizona Global Campus","d":"What happens when live sessions stop being optional? This discovery session invites attendees to explore how one online institution built a required synchronous learning model that cut drop rates, boosted retention, and closed equity gaps for at-risk students. Stop by, see the data, and share your own experience.","de":"¿Qué pasa cuando las sesiones en vivo dejan de ser opcionales? Esta sesión de conversación muestra cómo una institución online construyó un modelo de aprendizaje sincrónico obligatorio que redujo el abandono, aumentó la retención y cerró brechas de equidad en estudiantes en riesgo. Acercate, mirá los datos y compartí tu experiencia.","sm":""},{"id":185,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"From Subject Matter Expert to Online Educator: The Role of AI and Instructional Design in STEM Faculty Development","te":"De experto en la materia a educador online: el rol de la IA y el diseño instruccional en la formación de docentes de STEM","sh":"AI and Instructional Design in STEM Faculty Development","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 6","p":"Tina Calandrino, M.Ed.","po":"Associate Instructional Designer, University of Central Florida","d":"STEM faculty are brilliant researchers, yet often lack online instruction skills. This session explores how instructional designers leverage AI tools to coach subject matter experts through online course development, transforming deep content knowledge into engaging, pedagogically sound learning experiences that empower students and build lasting faculty teaching confidence.","de":"Los docentes de STEM son grandes investigadores, pero muchas veces les faltan habilidades para enseñar online. La sesión explora cómo los diseñadores instruccionales usan herramientas de IA para acompañar a expertos en contenido en el desarrollo de cursos online, convirtiendo su conocimiento profundo en experiencias de aprendizaje atractivas y pedagógicamente sólidas que generan confianza duradera en su enseñanza.","sm":""},{"id":186,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"How to Execute LMS-Wide Updates Once (And Prove Nothing Was Missed)","te":"Cómo hacer actualizaciones en todo el LMS de una sola vez (y demostrar que no se pasó nada por alto)","sh":"LMS-Wide Updates","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Demonstration","tr":"","tre":"","loc":"Europe 5","p":"Chris Johnson","po":"Regional Director, Atomic Jolt","d":"Learn to search across every course in Canvas or Brightspace, identify each instance needing an update, and execute changes in one controlled pass instead of course-by-course fixes. Walk away with a verification process that lets you confidently answer leadership's toughest question: 'Are you sure nothing was missed?'","de":"Aprendé a buscar en todos los cursos de Canvas o Brightspace, identificar cada lugar que necesita una actualización y aplicar los cambios en una sola pasada controlada en lugar de curso por curso. Incluye un proceso de verificación para responder con seguridad la pregunta más difícil de las autoridades: \"¿Estás seguro de que no se pasó nada por alto?\"","sm":""},{"id":187,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Illuminating the Future of Digital Learning in Competency-Based Education: An Interactive Panel Discussion","te":"El futuro del aprendizaje digital en la educación basada en competencias: panel interactivo","sh":"Digital Learning in Competency-Based Education","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Elizabeth A. Gazza PhD RN ANEF","po":"Professor, University of North Carolina Wilmington","d":"This panel of faculty and instructional designers examines how instructional design can shape digital learning in competency-based curricula. Panelists will share strategies for accelerated online programs focusing on competency mapping, authentic learning, assessment alignment, and reflective practice. Attendees will engage in interactive activities and leave with practical, transferable design approaches.","de":"Un panel de docentes y diseñadores instruccionales analiza cómo el diseño instruccional puede dar forma al aprendizaje digital en planes de estudio basados en competencias. Se comparten estrategias para programas online acelerados centradas en el mapeo de competencias, el aprendizaje auténtico, la alineación de la evaluación y la práctica reflexiva, con actividades interactivas y enfoques de diseño transferibles.","sm":""},{"id":188,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Lights Canva Action! Create Engaging Educational Videos in MINUTES!","te":"¡Luces, Canva, acción! Videos educativos atractivos en minutos","sh":"Educational Videos with Canva","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 13","p":"Erica Porter","po":"Independent Consultant, Independent Consultant","d":"Video content offers dynamic and versatile ways to convey information, engage students, and enhance learning experiences. This hands-on workshop will aim to equip educators and instructional designers with the skills and knowledge to create compelling educational videos effortlessly using the Canva design platform","de":"El video ofrece formas dinámicas y versátiles de transmitir información, involucrar a los estudiantes y enriquecer el aprendizaje. Este taller práctico busca darles a docentes y diseñadores instruccionales las habilidades para crear videos educativos atractivos de forma sencilla con la plataforma de diseño Canva.","sm":""},{"id":189,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Managing the Work Behind Online Learning: Coordinating Teams, Timelines, and Quality at Scale","te":"Gestionar el trabajo detrás del aprendizaje online: coordinar equipos, plazos y calidad a escala","sh":"Coordinating Teams, Timelines and Quality at Scale","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Southern Hemisphere II","p":"Christine Paige","po":"Executive Director of Empire Online, SUNY Empire State University","d":"Online learning depends on more than course design. This session shares practical approaches for coordinating people, projects, timelines, quality expectations, faculty needs, accessibility work, DLE support, multimedia production, and evolving priorities across a large online education support unit, with a focus on making complex work visible and manageable.","de":"El aprendizaje online depende de mucho más que el diseño de cursos. La sesión comparte enfoques prácticos para coordinar personas, proyectos, plazos, expectativas de calidad, necesidades docentes, trabajo de accesibilidad, soporte del entorno digital, producción multimedia y prioridades cambiantes en una gran unidad de apoyo a la educación online, con foco en hacer visible y manejable un trabajo complejo.","sm":""},{"id":190,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Neurodivergence: We Are All One! Understanding Learning, Recalling, and Thinking","te":"Neurodivergencia: ¡todos somos uno! Comprender cómo aprendemos, recordamos y pensamos","sh":"Neuroscience-Informed Instruction","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 8","p":"Dr. Manisha Sharan PhD","po":"Science Chair, Baker College","d":"This session explores neuroscience informed instruction by examining how memorization, conceptual understanding, and critical thinking activate distinct neural pathways. Participants will gain strategies to reduce cognitive overload, strengthen long-term retention, and leave with three brain-based instructional strategies, three assessment strategies, and a customizable curriculum-aligned template.","de":"La sesión explora una enseñanza informada por las neurociencias, analizando cómo la memorización, la comprensión conceptual y el pensamiento crítico activan distintas vías neuronales. Los participantes se llevan estrategias para reducir la sobrecarga cognitiva y fortalecer la retención a largo plazo: tres estrategias de enseñanza y tres de evaluación basadas en el funcionamiento del cerebro, y una plantilla adaptable alineada con el currículo.","sm":""},{"id":191,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Rethinking an Assignment for the Age of AI","te":"Repensar una consigna para la era de la IA","sh":"Rethinking an Assignment for the Age of AI","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"","tre":"","loc":"Europe 4","p":"Jaime Moquin","po":"Head of Customer Success, Nectir","d":"Faculty don’t have to choose between banning AI and giving up. In this hands-on session, participants will redesign one of their own assignments to use AI intentionally and equitably, then see how Azusa Pacific University Global configured Socratic AI Assistants campuswide and what its research found about student performance.","de":"Los docentes no tienen que elegir entre prohibir la IA o rendirse. En esta sesión práctica, los participantes rediseñan una de sus consignas para usar la IA de forma intencional y equitativa, y luego ven cómo Azusa Pacific University Global configuró asistentes de IA socráticos en toda la institución y qué encontró su investigación sobre el desempeño de los estudiantes.","sm":""},{"id":192,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Scaling AI Literacy: Student Perceptions After a High-Enrollment AI Learning Module","te":"Escalar la alfabetización en IA: percepciones de los estudiantes tras un módulo de IA masivo","sh":"Scaling AI Literacy: Student Perceptions After an AI Learning Module","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere E3/E4","p":"Dr. Charlotte Jones-Roberts","po":"Instructional Designer, University of Central Florida","d":"What happens when AI literacy instruction reaches students at scale? This session examines student perception shifts following completion of a high-enrollment AI learning module. Using pre- and post-survey data, the study explores changes in confidence, ethical awareness, and attitudes toward AI while offering practical strategies for scalable, student-centered AI literacy.","de":"¿Qué pasa cuando la formación en alfabetización en IA llega a los estudiantes a gran escala? La sesión analiza los cambios en las percepciones de los estudiantes después de completar un módulo de aprendizaje sobre IA de alta matrícula. Con datos de encuestas pre y post, el estudio explora cambios en la confianza, la conciencia ética y las actitudes hacia la IA, y ofrece estrategias prácticas para una alfabetización en IA escalable y centrada en el estudiante.","sm":""},{"id":193,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Streamline, Analyze, Secure: Transforming the Integrity Review Process","te":"Simplificar, analizar, asegurar: transformar el proceso de revisión de integridad académica","sh":"Transforming the Integrity Review Process","ty":"Vendor showcase","tye":"Presentación de empresa","to":"Solution Showcase Session - Presentation","tr":"","tre":"","loc":"Europe 1","p":"Jordan Adair","po":"VP of Product, Honorlock","d":"Explore how modern workflow enhancements and data insights simplify the review process and empower faculty. Join Honorlock experts as they discuss strategies for navigating sensitive student conversations with confidence, building a culture of integrity, and driving long-term institutional success.","de":"Cómo mejoras en los flujos de trabajo y el análisis de datos simplifican el proceso de revisión y empoderan a los docentes. Expertos de Honorlock comparten estrategias para manejar con seguridad conversaciones sensibles con estudiantes, construir una cultura de integridad e impulsar el éxito institucional a largo plazo.","sm":""},{"id":194,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"The Future of Digital Learning Quality: Building the Digital Learning Accreditation Agency (DLAA)","te":"El futuro de la calidad en el aprendizaje digital: la creación de la Digital Learning Accreditation Agency (DLAA)","sh":"Building the Digital Learning Accreditation Agency","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere E1/E2","p":"Madeline Shellgren","po":"Director of Global Outreach, Online Learning Consortium","d":"Digital learning continues to transform education, workforce development, and professional training. Join the team building the Digital Learning Accreditation Agency (DLAA) to explore the future of quality assurance, learn about opportunities to contribute, and help shape a national framework for recognizing excellence in digital learning.","de":"El aprendizaje digital sigue transformando la educación, el desarrollo de la fuerza laboral y la capacitación profesional. El equipo que está creando la Digital Learning Accreditation Agency (DLAA) invita a explorar el futuro del aseguramiento de la calidad, conocer oportunidades para participar y ayudar a dar forma a un marco nacional para reconocer la excelencia en el aprendizaje digital.","sm":""},{"id":195,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"The Process Is the Point: Taking Assessment Design From “Did a Student Use AI?” to “Did a Student Learn?”","te":"El proceso es lo que importa: pasar de \"¿el estudiante usó IA?\" a \"¿el estudiante aprendió?\" en el diseño de la evaluación","sh":"The Process Is the Point: From \"Did They Use AI?\" to \"Did They Learn?\"","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Lauren B. Schwartz","po":"Instructional Development Specialist, Salem Community College","d":"Every AI-in-education session ends with the same conclusion: assessment needs to be redesigned. Few show how. Using a real AI hallucination, a failed attempt to identify a childhood stuffed pig, and the practical framework they inspired, this conversation equips faculty to ask the question that matters: what did students learn?","de":"Toda sesión sobre IA en educación termina con la misma conclusión: hay que rediseñar la evaluación. Pocas muestran cómo. A partir de una \"alucinación\" real de la IA (un intento fallido de identificar un chanchito de peluche de la infancia) y del marco práctico que inspiró, esta conversación ayuda a los docentes a hacerse la pregunta que importa: ¿qué aprendieron los estudiantes?","sm":""},{"id":196,"day":"Mie","s":585,"e":630,"b":"w-0945","t":"Virtual Reality AI Mimics Real-Life for Practicing Counseling, Presentation, and Healthcare Skills","te":"Realidad virtual con IA que imita la vida real para practicar habilidades de consejería, presentación y atención en salud","sh":"AI Simulations to Practice Presentation and Communication Skills","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 14","p":"Dr. Kristin Berg","po":"Instructor / Graduate Program Director, University of North Florida","d":"This session explores the use of AI-powered virtual reality simulations to strengthen counseling, presentation, and clinical communication skills for future healthcare professional practice. Examples include the integration of Ovation VR across counseling, seminar, and healthcare practice courses.","de":"La sesión explora el uso de simulaciones de realidad virtual con IA para fortalecer habilidades de consejería, presentación oral y comunicación clínica en la formación de futuros profesionales de la salud. Incluye ejemplos de la integración de Ovation VR en cursos de consejería, seminarios y práctica en salud.","sm":""},{"id":197,"day":"Mie","s":630,"e":675,"b":"w-brk","t":"IELOL Meet-and-Greet","te":"Encuentro IELOL","sh":"IELOL Meet-and-Greet","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Asia 3","p":"Sherri Restauri","po":"Director of Professional Learning, Online Learning Consortium","d":"Calling all IELOL 2026 faculty and participants, as well as IELOL graduates and faculty from previous cohorts! Let's get together for some quick photos, to catch up and share out how our projects have gone, and make plans to keep in touch after this year. Thinking about joining a future IELOL cohort? Come join the fun! Grab a quick snack & beverage from the snack station in the Atlantic Exhibit Hall, then come join us for some fun networking in Asia 3. Can't wait to catch up with everyone! Questions? Email us at: ielol@onlinelearning-c.org","de":"Convocatoria a docentes y participantes de IELOL 2026, y a graduados y docentes de cohortes anteriores, para sacarse fotos, ponerse al día, contar cómo avanzaron sus proyectos y planear cómo seguir en contacto. Si estás pensando en sumarte a una futura cohorte, también estás invitado. Pasá a buscar un snack y una bebida en el Atlantic Exhibit Hall y sumate al networking en Asia 3. Consultas: ielol@onlinelearning-c.org","sm":""},{"id":198,"day":"Mie","s":630,"e":675,"b":"w-brk","t":"Networking Coffee Break","te":"Coffee break de networking","sh":"Networking Coffee Break","ty":"General","tye":"General","to":"Other","tr":"","tre":"","loc":"Atlantic Exhibit Hall","p":"","po":"","d":"Join us in the Exhibit Hall for our final networking coffee break of the conference. Not only is this an opportunity to recharge with a fresh cup of coffee or tea, but you will also have the opportunity to network with other attendees. Check out the activities in the Engagement Hub and AI Exploration Zone, or use this time to meet with our conference exhibitors and work on your exhibitor stamp card for a chance at some awesome prizes! Don't forget to complete your Totally Rad OLC 80's Human Bingo card by chatting with other attendees. You can stop by the Engagement Hub during this break to redeem your Bingo card to play Skeeball and win prizes, or just participate in our Lite Bright photo op!","de":"Pausa en el salón de exposiciones para conocer a otros asistentes y visitar el Engagement Hub, la AI Exploration Zone y a los expositores.","sm":""},{"id":199,"day":"Mie","s":630,"e":675,"b":"w-brk","t":"You’re on Mute: Creative Problem-Solving in Collaborative Learning Environments","te":"\"Estás en mute\": resolución creativa de problemas en entornos de aprendizaje colaborativo","sh":"You're on Mute","ty":"Engagement activity","tye":"Actividad de integración","to":"Engagement Activity","tr":"Community Engagement","tre":"Integración y comunidad","loc":"Atlantic Exhibit Hall - Engagement Hub","p":"Dr. Amy Johnson","po":"Program Chair, AAECE, University of Arizona Global Campus","d":"Can your team solve the “you’re on mute” epidemic, protect break-room snacks, or invent the world’s worst product? In this challenge, small groups tackle absurd workplace and conference dilemmas. Expect creativity, laughter, collaboration, and surprising lessons about innovation, communication, and teamwork.","de":"¿Puede tu equipo resolver la epidemia del \"estás en mute\", proteger los snacks de la sala de descanso o inventar el peor producto del mundo? En este desafío, grupos chicos enfrentan dilemas absurdos del trabajo y de las conferencias. Creatividad, risas, colaboración y aprendizajes sorprendentes sobre innovación, comunicación y trabajo en equipo.","sm":""},{"id":200,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"A Large Leaky Bucket of Learners: A Conversation About Sustainable Enrollment and Participation","te":"Un gran balde agujereado de estudiantes: conversación sobre inscripción y participación sostenibles","sh":"Sustainable Enrollment and Participation","ty":"Featured session","tye":"Sesión destacada","to":"Featured Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Asia 3","p":"Matthew Vick, Ph.D.","po":"Professor of Curriculum and Instruction, University of Wisconsin-Whitewater","d":"Whether your priority is growing enrollment or sustaining participation, are you chasing new prospects or relying too heavily on existing relationships? Bring your experience to this conversation as we explore how credit and non-credit programs balance new audiences, repeat learners, one-time participants, and partners.","de":"Ya sea que tu prioridad sea aumentar la inscripción o sostener la participación, ¿estás persiguiendo nuevos interesados o dependés demasiado de las relaciones existentes? Traé tu experiencia a esta conversación sobre cómo los programas con y sin créditos equilibran nuevos públicos, estudiantes que vuelven, participantes ocasionales y aliados.","sm":""},{"id":201,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Adding Online Sections to In-Person Programs: A Dual Development Design Framework (DDF) for Online Section Expansion","te":"Sumar comisiones online a programas presenciales: un marco de diseño de desarrollo dual (DDF)","sh":"Adding Online Sections to In-Person Programs","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Asia 4","p":"Dr. Kiran Budhrani","po":"Director, Teaching and Learning Innovation, University of North Carolina at Charlotte","d":"“Design Once. Develop Strategically. Deliver Everywhere.” This session introduces the Dual Development Design Framework, a collaborative, team-based model for simultaneously designing in-person and online course sections from a shared process and pedagogical architecture. Participants will leave with a practical, replicable approach for expanding online access, curricular alignment, and faculty ownership.","de":"\"Diseñar una vez. Desarrollar con estrategia. Ofrecer en todas partes.\" La sesión presenta el Dual Development Design Framework, un modelo colaborativo y en equipo para diseñar en simultáneo comisiones presenciales y online a partir de un proceso y una arquitectura pedagógica compartidos. Los participantes se llevan un enfoque práctico y replicable para ampliar el acceso online, la alineación curricular y la apropiación por parte de los docentes.","sm":""},{"id":202,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"AI Does Not Guarantee Quality: A Quality Assurance Model for Instructional Design","te":"La IA no garantiza calidad: un modelo de aseguramiento de la calidad para el diseño instruccional","sh":"AI Does Not Guarantee Quality: A QA Model for Learning Design","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Americas Seminar","p":"Paulina Carrasco","po":"Founder, WeLearn","d":"Artificial intelligence has accelerated online course development but also created new quality challenges. This presentation introduces Welearn’s Quality Assurance Model, integrating international standards, expert review, preventive QA, and AI to strengthen instructional design. Real-world implementation demonstrates how institutions can scale course development while maintaining pedagogical quality.","de":"La IA aceleró el desarrollo de cursos online, pero también trajo nuevos desafíos de calidad. La presentación muestra el modelo de aseguramiento de la calidad de WeLearn, que integra estándares internacionales, revisión experta, control preventivo e IA para fortalecer el diseño instruccional. Su implementación real muestra cómo escalar el desarrollo de cursos sin perder calidad pedagógica.","sm":""},{"id":203,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"AI Exploration Zone - Open Exploration","te":"AI Exploration Zone: exploración abierta","sh":"AI Exploration Zone","ty":"AI Exploration Zone","tye":"AI Exploration Zone","to":"AI Exploration Zone","tr":"","tre":"","loc":"Atlantic Exhibit Hall - AI Exploration Zone","p":"Dr. Sean Nufer","po":"Senior Director of Teaching and Learning, TCS Education System","d":"Stop watching AI from the sidelines. Open Exploration treats you as a lifelong learner with a question worth working on. Bring a teaching or learning challenge and use the space to work on it with support from experienced guides and access to a range of AI tools. There are no canned demos and no expectation that you arrive with AI expertise. Our emphasis is on curiosity and hands-on experimentation that leads you somewhere useful.","de":"Traé un desafío de enseñanza o aprendizaje y trabajalo con guías y distintas herramientas de IA. No hay demos armadas ni hace falta experiencia previa.","sm":""},{"id":204,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"AI, Technology, & the Online Community College Faculty","te":"IA, tecnología y docentes online de community colleges","sh":"AI and Online Community College Faculty","ty":"Discovery session","tye":"Discovery session","to":"Graduate Student Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 1","p":"Alex Suchon, Ph.D.","po":"Manager, Instructional Design, Lone Star College System","d":"For full-time online community college faculty, technology is simultaneously what makes effective teaching possible and one of its most persistent barriers. This session presents interpreted findings from a dissertation study examining how AI and technology shape the online teaching experience and how institutions can better support the faculty navigating it.","de":"Para los docentes online de tiempo completo de community colleges, la tecnología es a la vez lo que hace posible una enseñanza eficaz y una de sus barreras más persistentes. La sesión presenta hallazgos de una tesis doctoral sobre cómo la IA y la tecnología moldean la experiencia de enseñar online y cómo las instituciones pueden acompañar mejor a esos docentes.","sm":""},{"id":205,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Anticipating Student Needs: A Holistic, Coaching-Informed Approach to Supporting Online Learners","te":"Anticipar las necesidades de los estudiantes: un enfoque integral, inspirado en el coaching, para acompañar a estudiantes online","sh":"Anticipating Student Needs with a Coaching Approach","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Northern Hemisphere A1/A2","p":"Tricia Filer","po":"Student Success Specialist, Penn State University - World Campus","d":"Online learners face predictable moments of doubt and disconnection yet support often remains reactive. This session introduces the W-curve and Focus Wheel as complementary frameworks to anticipate challenges and provide holistic, proactive care. Participants will explore strategies to better align services and leave with practical tools to strengthen student engagement.","de":"Los estudiantes online atraviesan momentos previsibles de duda y desconexión, pero el apoyo suele ser reactivo. La sesión presenta la curva W y la \"rueda de foco\" como marcos complementarios para anticipar dificultades y brindar un acompañamiento integral y proactivo, con estrategias para alinear mejor los servicios y herramientas prácticas para fortalecer la participación.","sm":""},{"id":206,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Artificial Intelligence in Governance: Ethical Considerations for Effective Policy","te":"La IA en la gobernanza: consideraciones éticas para políticas eficaces","sh":"AI Governance: Ethics for Effective Policy","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 7","p":"Prof. Christian Moriarty JD MA","po":"Professor, St Petersburg College","d":"Higher education leaders are shaping the future of AI governance right now. The decisions they make will define how their institutions serve students, faculty, and communities for years to come. This session offers a principled, practical framework for building institutional AI governance that is transparent, accountable, and built to last.","de":"Las autoridades de la educación superior están definiendo hoy el futuro de la gobernanza de la IA, y sus decisiones marcarán durante años cómo sus instituciones sirven a estudiantes, docentes y comunidades. La sesión ofrece un marco práctico y basado en principios para construir una gobernanza institucional de la IA transparente, responsable y duradera.","sm":""},{"id":207,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Back to the Future: Designing Authentic Assessment Through Analog Learning in the Age of AI","te":"Volver al futuro: evaluación auténtica a través del aprendizaje analógico en la era de la IA","sh":"Authentic Assessment Through Analog Learning","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 2","p":"Renee Ford, Ph.D.","po":"Senior Instructional Designer, The Pennsylvania State University","d":"Generative AI is reshaping assessment in online and hybrid learning environments. This session explores how intentionally designed analog learning activities, including handwritten reflections, visual thinking exercises, annotation tasks, and metacognitive journals, can provide authentic evidence of learning, promote deeper cognitive engagement, and complement AI-enabled instruction while remaining scalable for instructors.","de":"La IA generativa está transformando la evaluación en entornos online e híbridos. La sesión explora cómo actividades analógicas diseñadas con intención (reflexiones manuscritas, ejercicios de pensamiento visual, tareas de anotación y diarios metacognitivos) pueden aportar evidencia auténtica de aprendizaje, promover un compromiso cognitivo más profundo y complementar la enseñanza con IA, siendo escalables para los docentes.","sm":""},{"id":208,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Balancing Experimentation and Enterprise Alignment: Evaluating Technologies that Shape the Student Experience","te":"Equilibrar la experimentación y la alineación institucional: evaluar las tecnologías que moldean la experiencia del estudiante","sh":"Evaluating Technologies That Shape the Student Experience","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Oceanic 6","p":"Kaitlin Dumont","po":"Director, Huron","d":"Colleges face a fast-growing edtech market, including AI tools promising gains across the student lifecycle. Many adopt faster than they can evaluate, creating fragmentation. Drawing on Huron’s RISE 40 research and client insights, this session explores how to balance innovation with enterprise alignment and make more coordinated, cross-functional technology decisions.","de":"Las instituciones enfrentan un mercado edtech que crece rápido, con herramientas de IA que prometen mejoras en todo el recorrido del estudiante. Muchas adoptan más rápido de lo que pueden evaluar y generan fragmentación. A partir de la investigación RISE 40 de Huron y la experiencia con clientes, la sesión explora cómo equilibrar la innovación con la alineación institucional y tomar decisiones tecnológicas más coordinadas entre áreas.","sm":""},{"id":209,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Beyond Attendance: Encouraging Instructional Application in Digital Learning Support","te":"Más allá de la asistencia: promover la aplicación en el aula en el apoyo al aprendizaje digital","sh":"Beyond Attendance: From Participation to Practice to Impact","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere D","p":"Sara Kacin, Ph.D.","po":"Assistant Vice Provost, Faculty Development & and Success, Director, Office for Teaching & Learning, Wayne State University","d":"This session explores practical strategies for moving beyond attendance-focused evaluation in faculty development by incorporating instructional application, reflection, and light weight follow-up practices in digital learning support efforts. Participants will engage with an emerging “Participation to Practice to Impact” approach designed to encourage faculty application and reflective practice.","de":"La sesión explora estrategias prácticas para ir más allá de medir la asistencia en la formación docente, incorporando la aplicación en la enseñanza, la reflexión y prácticas de seguimiento livianas. Los participantes trabajan con un enfoque emergente, \"de la participación a la práctica y al impacto\", pensado para fomentar que los docentes apliquen lo aprendido y reflexionen sobre su práctica.","sm":""},{"id":210,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Beyond the Prompt: Lessons from a Multi-Campus Initiative Designing AI-Infused Learning Experiences Across Disciplines","te":"Más allá del prompt: lecciones de una iniciativa en varias sedes para diseñar experiencias de aprendizaje con IA en distintas disciplinas","sh":"Beyond the Prompt: A Multi-Campus Initiative Designing AI-Infused Learning","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 1","p":"Dr. Audeliz Matias","po":"Professor, SUNY Empire State University","d":"What happens when faculty intentionally design learning experiences with AI? Explore examples, lessons learned, and emerging findings from a year-long, multi-campus initiative involving educators from diverse disciplines and institutional contexts. Discover practical approaches for creating AI-infused learning experiences that support student engagement, meaningful learning, and course outcomes.","de":"¿Qué pasa cuando los docentes diseñan con intención experiencias de aprendizaje con IA? Ejemplos, aprendizajes y hallazgos preliminares de una iniciativa de un año en varias sedes, con educadores de distintas disciplinas y contextos institucionales. Enfoques prácticos para crear experiencias con IA que apoyen la participación, el aprendizaje significativo y los resultados de los cursos.","sm":""},{"id":211,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Blind Connections: Collaboration Unfiltered","te":"Conexiones a ciegas: colaboración sin filtro","sh":"Blind Connections: Collaboration Unfiltered","ty":"Gamified session","tye":"Sesión gamificada","to":"Gamified Session (45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Oceanic 5","p":"Treya Lynch","po":"Student Success Coach, University of Tennessee-Knoxville","d":"This fast-paced, interactive Love Is Blind-inspired session takes participants from the pods to the match, wedding, and reunion. Through guided conversations, activities, and reflection, participants will explore how assumptions, roles, communication styles, and perspectives shape workplace relationships while gaining practical strategies to strengthen collaboration across departments and build connections.","de":"Una sesión dinámica e interactiva inspirada en el reality \"Love Is Blind\", que lleva a los participantes de las cabinas al \"match\", la boda y el reencuentro. Con conversaciones guiadas, actividades y reflexión, se explora cómo los supuestos, los roles, los estilos de comunicación y las perspectivas influyen en las relaciones laborales, con estrategias prácticas para fortalecer la colaboración entre áreas y construir vínculos.","sm":""},{"id":212,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Building Belonging Online: A Virtual Peer Mentorship Program for Graduate Nursing Students","te":"Pertenencia online: un programa virtual de mentoría entre pares para estudiantes de posgrado en enfermería","sh":"Virtual Peer Mentorship for Graduate Students","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 3","p":"Jenna Blumenauer","po":"Senior Academic Advisor, University of Michigan-Ann Arbor","d":"Discover how an online graduate peer mentorship program transformed connection, resilience, and professional growth across six nursing specialties. This session explores the development and evolution of a sustainable virtual mentorship model that empowers mentors and mentees. Attendees will gain practical strategies to create inclusive, student-driven mentorship programs within their institutions.","de":"Cómo un programa online de mentoría entre pares en posgrado transformó la conexión, la resiliencia y el crecimiento profesional en seis especialidades de enfermería. La sesión recorre el desarrollo y la evolución de un modelo virtual sostenible que empodera a mentores y mentoreados, con estrategias prácticas para crear programas de mentoría inclusivos e impulsados por los propios estudiantes.","sm":""},{"id":213,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Designing Online Courses with Care: Trauma‑Informed and UDL‑Aligned LMS Design in Practice","te":"Diseñar cursos online con cuidado: diseño en el LMS informado por el trauma y alineado con el DUA","sh":"Trauma-Informed and UDL-Aligned Course Design","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 4","p":"Heather Horowitz, EdD","po":"Assistant Professor, SUNY Empire State University","d":"Design online courses with care. This interactive session shares research on how trauma-informed and UDL-aligned LMS design fosters belonging, reduces cognitive load, and amplifies student voice. Participants will explore practical LMS strategies and leave with actionable approaches for creating inclusive, supportive, human-centered online learning environments.","de":"Diseñar cursos online con cuidado. Esta sesión interactiva comparte investigación sobre cómo un diseño en el LMS informado por el trauma y alineado con el Diseño Universal para el Aprendizaje fomenta la pertenencia, reduce la carga cognitiva y amplifica la voz de los estudiantes, con estrategias prácticas para crear entornos online inclusivos, contenedores y centrados en las personas.","sm":""},{"id":214,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Designing Online Spaces Where Multilingual Learners Thrive","te":"Diseñar espacios online donde los estudiantes multilingües prosperen","sh":"Designing Online Spaces Where Multilingual Learners Thrive","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Northern Hemisphere E3/E4","p":"Shannon Stephens Sandau, M.Ed.","po":"Bilingual Instructional Designer, Weber State University","d":"Enhance student success online by incorporating research-supported multilingual frameworks centered on asset-based pedagogy to remove learning barriers. You will leave equipped with a multilingual online course design matrix and a checklist to review course activities, identify language-related barriers, and adapt strategies across disciplines. We do this by integrating three complementary frameworks: Translanguaging, Content and Language Integrated Learning (CLIL), and Universal Design for Learning (UDL).","de":"Mejorar el éxito de los estudiantes online incorporando marcos multilingües respaldados por investigación y basados en una pedagogía que valora los recursos de cada estudiante, para eliminar barreras de aprendizaje. Los participantes se llevan una matriz de diseño de cursos online multilingües y un checklist para revisar actividades, identificar barreras lingüísticas y adaptar estrategias en distintas disciplinas. Integra tres marcos complementarios: translanguaging, aprendizaje integrado de contenidos y lenguas extranjeras (AICLE/CLIL) y Diseño Universal para el Aprendizaje (DUA).","sm":""},{"id":215,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Did They Learn It, or Did They Paste It? A Playbook for AI-Aware Asynchronous Assessment","te":"¿Lo aprendieron o lo pegaron? Un playbook para una evaluación asincrónica consciente de la IA","sh":"Did They Learn It or Paste It? AI-Aware Async Assessment","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 2","p":"Paul Dagnall","po":"Director of Online Learning, University of Dayton","d":"Async serves the students who need flexibility most: athletes, working professionals, caregivers, but it also creates a verification gap AI has widened. Get a practical playbook of AI-aware assessment approaches, a decision matrix for choosing among them, and strategies for designing async courses that produce eager learners rather than box-checkers.","de":"La modalidad asincrónica sirve a quienes más necesitan flexibilidad (deportistas, profesionales que trabajan, personas con tareas de cuidado), pero también genera una brecha para verificar el aprendizaje que la IA amplió. Un playbook práctico de enfoques de evaluación conscientes de la IA, una matriz para elegir entre ellos y estrategias para diseñar cursos asincrónicos que formen estudiantes motivados y no solo que \"tilden casilleros\".","sm":""},{"id":216,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Emotional Grading and AI: Designing for Consistency Without Losing Humanity","te":"Calificación emocional e IA: diseñar para la consistencia sin perder la humanidad","sh":"Emotional Grading and AI","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Oceanic 3","p":"Dr. Lisa Clark","po":"Associate Vice President, Academic Transformation, Blackboard","d":"What happens when the final output is no longer reliable evidence of learning? As AI reshapes how work is produced, grading becomes more complex and more human. Join this interactive session to explore emotional grading, rethink consistency, and design assessment practices that better reflect how learning actually happens.","de":"¿Qué pasa cuando el producto final ya no es evidencia confiable de aprendizaje? A medida que la IA cambia cómo se produce el trabajo, calificar se vuelve más complejo y más humano. Esta sesión interactiva explora la \"calificación emocional\", replantea la consistencia y propone prácticas de evaluación que reflejen mejor cómo ocurre realmente el aprendizaje.","sm":""},{"id":217,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Empowering Military-Connected Communities:Advancing DEI,Global Learning Continuity and AI-Enabled Wellness in Higher Ed.","te":"Empoderar a comunidades vinculadas a las fuerzas armadas: diversidad e inclusión, continuidad del aprendizaje y bienestar con IA en la educación superior","sh":"Military-Connected Learners","ty":"Discovery session","tye":"Discovery session","to":"Graduate Student Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Learner Success, Engagement, and Empowerment","tre":"Éxito, participación y empoderamiento de los estudiantes","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 5","p":"Michael Ellison Ph.D (Can)","po":"Doctoral Candidate, National University","d":"This presentation examines military-connected learners in higher education using intersectionality and trauma-informed perspectives. It explores how  situations in military affiliation shape academic outcomes. Key challenges include structural barriers, cultural mismatches, caregiving demands,  inequitable support. The presentation advocates for inclusive DEI frameworks and targeted support systems for online and hybrid learning.","de":"La presentación analiza a estudiantes vinculados a las fuerzas armadas en la educación superior desde una mirada interseccional e informada por el trauma, y explora cómo esas situaciones influyen en sus resultados académicos. Entre los desafíos: barreras estructurales, desajustes culturales, tareas de cuidado y apoyos desiguales. Propone marcos inclusivos y sistemas de apoyo específicos para el aprendizaje online e híbrido.","sm":""},{"id":218,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Enhancing Trust in Telehealth for Mental Services in Rural Areas: The Role of Online Learning","te":"Generar confianza en la telesalud para servicios de salud mental en zonas rurales: el papel del aprendizaje online","sh":"Telehealth and Online Learning in Rural Areas","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 6","p":"Dr. Amir Khalighi, DHA","po":"Assistant Professor, National University","d":"Telehealth can assist mental health in rural populations. COVID-19 pandemia accelerated the adoption of virtual healthcare services via online learning. However, disparities in technology, digital literacy, confidentiality, and interpersonal connections are still challenges. While online learning cannot replace face-to-face interactions, it remains valuable for improving healthcare equity and access.","de":"La telesalud puede apoyar la salud mental de poblaciones rurales, y la pandemia de COVID-19 aceleró la adopción de servicios virtuales a través del aprendizaje online. Sin embargo, las brechas tecnológicas, de alfabetización digital, de confidencialidad y de vínculo siguen siendo desafíos. Aunque no reemplaza la interacción presencial, el aprendizaje online sigue siendo valioso para mejorar la equidad y el acceso a la salud.","sm":""},{"id":219,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"Exploring Student Interactions with Multi-Agentic Generative AI: Individual Pathways for Developing Expertise","te":"Interacciones de estudiantes con IA generativa multiagente: trayectos individuales para desarrollar experticia","sh":"Student Interactions with Multi-Agent AI to Explore Professional Roles","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere I","p":"Andrew Wiss, PhD, EdM, FNAP","po":"Assistant Dean for Academic Innovation, George Washington University","d":"Presentation examines a multi-agent generative AI platform used as prework for a complex case-study experience. Students engaged with AI agents representing distinct professions to support self-directed learning about roles, responsibilities, and emerging professional identities. Result of a study focused on student/agent interactions and observed learning strategies will be shared.","de":"La presentación analiza una plataforma de IA generativa con varios agentes, usada como trabajo previo a un estudio de caso complejo. Los estudiantes interactuaron con agentes que representaban distintas profesiones para aprender de forma autónoma sobre roles, responsabilidades e identidades profesionales emergentes. Se comparten los resultados de un estudio sobre esas interacciones y las estrategias de aprendizaje observadas.","sm":""},{"id":220,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"From Blank Canvas to Blueprint: Scaling Course Design with Structured Documents and a Comprehensive Toolkit","te":"Del lienzo en blanco al plano: escalar el diseño de cursos con documentos estructurados y una caja de herramientas integral","sh":"Scaling Course Design with Structured Documents and a Toolkit","ty":"Session","tye":"Sesión","to":"Education Session (45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Southern Hemisphere II","p":"Kristin Hall, PhD","po":"Senior Instructional Designer, Stony Brook University","d":"Redesigning online courses can be overwhelming. Discover how our instructional design team streamlines online course creation using backward-design documents and a self-paced Toolkit. We will explore our scalable workflow, embedding accessibility and AI. Attendees will receive adaptable resources to implement at their institutions to empower faculty and enhance student learning.","de":"Rediseñar cursos online puede ser abrumador. Cómo un equipo de diseño instruccional agiliza la creación de cursos con documentos de diseño inverso y una caja de herramientas autoadministrada, con un flujo de trabajo escalable que integra accesibilidad e IA. Los asistentes reciben recursos adaptables para empoderar a sus docentes y mejorar el aprendizaje.","sm":""},{"id":221,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"From Compliance Gap to Quality Tool: Building an AI-Inspired Regular and Substantive Interaction (RSI) Review Process","te":"De brecha de cumplimiento a herramienta de calidad: un proceso de revisión de interacción regular y sustantiva (RSI) inspirado en IA","sh":"An AI-Inspired RSI Review Process","ty":"Gamified session","tye":"Sesión gamificada","to":"Gamified Session (45 min)","tr":"Professional Development, Quality Assurance, and Support","tre":"Desarrollo profesional, calidad y apoyo","loc":"Northern Hemisphere A3/A4","p":"Rachel Dellis, M.A.Ed","po":"Instructional Designer II, Clarkson University","d":"Regular and Substantive Interaction (RSI) is a federal requirement for distance education - and a compliance risk for many institutions. Join our gamified session to discover our full RSI audit process, including gap identification, AI-accelerated Quality Matters-aligned RSI rubric development, internal review, and translating findings into faculty guidance and institutional recommendations.","de":"La interacción regular y sustantiva (RSI) es un requisito federal de EE. UU. para la educación a distancia y un riesgo de incumplimiento para muchas instituciones. En esta sesión gamificada se presenta un proceso completo de auditoría: identificación de brechas, desarrollo acelerado con IA de una rúbrica alineada con Quality Matters, revisión interna y traducción de los hallazgos en orientaciones para docentes y recomendaciones institucionales.","sm":""},{"id":222,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"From Rubric to Agent: AI-Supported Dissertation Development in a Doctoral Clinical Nutrition Program","te":"De la rúbrica al agente: desarrollo de tesis con apoyo de IA en un doctorado en nutrición clínica","sh":"From Rubric to Agent: AI-Supported Dissertation Development","ty":"Discovery session","tye":"Discovery session","to":"Discovery Session (Short conversations with multiple attendees over 45 min)","tr":"Innovative and Effective Digital Learning Design","tre":"Diseño innovador y eficaz del aprendizaje digital","loc":"Atlantic Exhibit Hall - Atlantic B - Discovery Session Zone Position 7","p":"Jen Ross, DCN, RD, LD/N, FAND","po":"Associate Professor/Director, DCN, University of North Florida","d":"We transformed a dissertation proposal rubric into a structured, phase-based AI evaluation system within a Doctor of Clinical Nutrition program. Learn how we engineered a controlled, agent-like tool within a WORD document that scaffolds proposal development, strengthens alignment, and supports iterative revision while preserving faculty rigor, transparency, and academic integrity.","de":"Una rúbrica de proyecto de tesis transformada en un sistema de evaluación con IA, estructurado por fases, en un doctorado en nutrición clínica. Cómo se construyó, dentro de un documento de Word, una herramienta controlada similar a un agente que andamia el desarrollo del proyecto, fortalece la alineación y acompaña la revisión iterativa, preservando la exigencia docente, la transparencia y la integridad académica.","sm":""},{"id":223,"day":"Mie","s":675,"e":720,"b":"w-1115","t":"From Siloed AI Efforts to Shared Strategy: Coordinating AI Literacy Across Roles","te":"De esfuerzos aislados a una estrategia compartida: coordinar la alfabetización en IA entre roles","sh":"From Siloed AI Efforts to Shared Strategy: AI Literacy Across Roles","ty":"Conversation, not presentation","tye":"Conversación","to":"Conversation, Not Presentation (45 min)","tr":"Leadership, Partnerships, and Organizational Strategy","tre":"Liderazgo, alianzas y estrategia organizacional","loc":"Northern Hemisphere C","p":"Sarah Hazelton","po":"Competency-Based Education Curriculum Coordinator, Tennessee Board of Regents","d":"Explore how an integrated AI literacy framework can help institutions move from fragmented AI activity to coordinated digital learning strategy. Participants will discuss shared domains, role-specific competencies, implementation challenges, and practical next steps for aligning governance, professional learning, and support across campus roles.","de":"Cómo un marco integrado de alfabetización en IA puede ayudar a las instituciones a pasar de una actividad fragment
